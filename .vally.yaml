    description: Cosmos DB CRUD evaluation across four languages
    evals:
      - scenarios/cosmos-db-python-crud/eval.yaml
      - scenarios/cosmos-db-dotnet-crud/eval.yaml
      - scenarios/cosmos-db-java-crud/eval.yaml
      - scenarios/cosmos-db-typescript-crud/eval.yaml
  app-configuration-config-values:
    description: App Configuration values evaluation across four languages
    evals:
      - scenarios/app-configuration-python-config-values/eval.yaml
      - scenarios/app-configuration-dotnet-config-values/eval.yaml
      - scenarios/app-configuration-java-config-values/eval.yaml
      - scenarios/app-configuration-typescript-config-values/eval.yaml
  event-hubs-send-receive-events:
    description: Event Hubs send and receive evaluation across four languages
    evals:
      - scenarios/event-hubs-python-send-receive-events/eval.yaml
      - scenarios/event-hubs-dotnet-send-receive-events/eval.yaml
      - scenarios/event-hubs-java-send-receive-events/eval.yaml
      - scenarios/event-hubs-typescript-send-receive-events/eval.yaml
  identity-default-azure-credential:
    description: DefaultAzureCredential evaluation across four languages
    evals:
      - scenarios/identity-python-default-azure-credential/eval.yaml
      - scenarios/identity-dotnet-default-azure-credential/eval.yaml
