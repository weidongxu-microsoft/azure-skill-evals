name: Vally evaluations

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Select all evaluations, evaluations matching tags, or one named suite
        required: true
        type: choice
        default: suite
        options:
          - suite
          - tags
          - all
      suite:
        description: Suite from .vally.yaml; used when selection is suite
        required: false
        type: string
        default: cosmos-crud
      tags:
        description: Semicolon-separated filters, for example service=identity;language=python
        required: false
        type: string
      variant:
        description: Environment variant to run
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - azure-skill-mcp
          - azure-skill-mcp-microsoft-skill
          - all
      dry_run:
        description: Resolve and print the plans without running agents
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: vally-evaluations
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure public npm registry
        shell: bash
        run: |
          rm -f .npmrc
          npm config set registry https://registry.npmjs.org/ --location=user

      - name: Install pnpm
        run: npm install --global pnpm@10.26.0 --registry=https://registry.npmjs.org/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --public-hoist-pattern '@github/copilot-*'
          node --input-type=module -e "console.log(import.meta.resolve('@github/copilot-linux-x64'))"
          python -m pip install -r requirements-dev.txt

      - name: Bootstrap pinned skill repositories
        shell: pwsh
        run: pnpm bootstrap

      - name: Run selected evaluations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTION: ${{ inputs.selection }}
          SUITE: ${{ inputs.suite }}
          TAGS: ${{ inputs.tags }}
          VARIANT: ${{ inputs.variant }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--mode "$SELECTION" --variant "$VARIANT" --output-dir reports)
          if [[ "$SELECTION" == "suite" ]]; then
            args+=(--suite "$SUITE")
          elif [[ "$SELECTION" == "tags" ]]; then
            args+=(--tags "$TAGS")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          node scripts/run-evaluations.mjs "${args[@]}"

      - name: Upload evaluation reports
        if: ${{ always() && inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: vally-reports-${{ github.run_id }}
          path: reports
          if-no-files-found: warn
