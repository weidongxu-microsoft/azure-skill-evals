name: Vally evaluations

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Select all evaluations, evaluations matching tags, or one named suite
        required: true
        type: choice
        default: suite
        options:
          - suite
          - tags
          - all
      suite:
        description: Suite from .vally.yaml; used when selection is suite
        required: false
        type: string
        default: cosmos-crud
      tags:
        description: Semicolon-separated filters, for example service=identity;language=python
        required: false
        type: string
      variant:
        description: Environment variant to run
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - azure-skill-mcp
          - azure-skill-mcp-microsoft-skill
          - all
      dry_run:
        description: Resolve and print the plans without running agents
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: vally-evaluations
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configure public npm registry
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/ --location=user

      - name: Install pnpm
        run: npm install --global pnpm@10.26.0 --registry=https://registry.npmjs.org/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --public-hoist-pattern '@github/copilot-*'
          copilot_cli_path=$(node --input-type=module -e "import { fileURLToPath } from 'node:url'; console.log(fileURLToPath(new URL('./index.js', import.meta.resolve('@github/copilot-linux-x64'))))")
          echo "COPILOT_CLI_PATH=$copilot_cli_path" >> "$GITHUB_ENV"
          pnpm list @microsoft/vally @github/copilot-sdk @github/copilot --depth 10
          node "$copilot_cli_path" --version
          python -m pip install -r requirements-dev.txt

      - name: Bootstrap pinned skill repositories
        shell: pwsh
        run: pnpm bootstrap

      - name: Run selected evaluations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTION: ${{ inputs.selection }}
          SUITE: ${{ inputs.suite }}
          TAGS: ${{ inputs.tags }}
          VARIANT: ${{ inputs.variant }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--mode "$SELECTION" --variant "$VARIANT" --output-dir reports)
          if [[ "$SELECTION" == "suite" ]]; then
            args+=(--suite "$SUITE")
          elif [[ "$SELECTION" == "tags" ]]; then
            args+=(--tags "$TAGS")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          node scripts/run-evaluations.mjs "${args[@]}"

      - name: Publish evaluation summary
        if: ${{ always() && inputs.dry_run == false }}
        shell: bash
        run: |
          mapfile -t report_files < <(find reports -type f -name report.md -print 2>/dev/null | sort)
          if (( ${#report_files[@]} == 0 )); then
            echo "::warning::Vally did not generate a Markdown report."
            echo "## Vally evaluation report" >> "$GITHUB_STEP_SUMMARY"
            echo "No report was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for report_file in "${report_files[@]}"; do
            cat "$report_file" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload evaluation reports
        if: ${{ always() && inputs.dry_run == false }}
        uses: actions/upload-artifact@v7
        with:
          name: vally-reports-${{ github.run_id }}
          path: reports
          if-no-files-found: warn
