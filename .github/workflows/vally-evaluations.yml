name: Vally evaluations

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite from .vally.yaml; blank means no suite filter
        required: false
        type: string
      language:
        description: "Language tag; comma-separated values are OR"
        required: false
        type: string
      service:
        description: "Service tag; comma-separated values are OR"
        required: false
        type: string
      plane:
        description: "Plane tag; comma-separated values are OR"
        required: false
        type: string
      scope:
        description: "Scope tag; comma-separated values are OR"
        required: false
        type: string
        default: focused-task
      other_tags:
        description: key=value filters; commas are OR and semicolons are AND
        required: false
        type: string
      variant:
        description: Environment variant to run
        required: true
        type: choice
        default: all
        options:
          - baseline
          - azure-skill-mcp
          - azure-skill-mcp-microsoft-skill
          - all
      dry_run:
        description: Resolve and print the plans without running agents
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: vally-evaluations
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve evaluation shards
        id: matrix
        env:
          SUITE: ${{ inputs.suite }}
          LANGUAGE_FILTER: ${{ inputs.language }}
          SERVICE: ${{ inputs.service }}
          PLANE: ${{ inputs.plane }}
          SCOPE: ${{ inputs.scope }}
          OTHER_TAGS: ${{ inputs.other_tags }}
          VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          args=(--mode all --variant "$VARIANT" --matrix)
          if [[ -n "$SUITE" ]]; then
            args+=(--suite "$SUITE")
          fi
          [[ -z "$LANGUAGE_FILTER" ]] || args+=(--language "$LANGUAGE_FILTER")
          [[ -z "$SERVICE" ]] || args+=(--service "$SERVICE")
          [[ -z "$PLANE" ]] || args+=(--plane "$PLANE")
          [[ -z "$SCOPE" ]] || args+=(--scope "$SCOPE")
          if [[ -n "$OTHER_TAGS" ]]; then
            args+=(--tags "$OTHER_TAGS")
          fi
          matrix=$(node scripts/run-evaluations.mjs "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "\`$matrix\`" >> "$GITHUB_STEP_SUMMARY"

  evaluate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configure public npm registry
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/ --location=user

      - name: Install pnpm
        run: npm install --global pnpm@10.26.0 --registry=https://registry.npmjs.org/

      - uses: actions/setup-python@v7
        if: ${{ matrix.language == 'python' }}
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.language == 'dotnet' }}
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v6
        if: ${{ matrix.language == 'java' }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ matrix.language == 'java' }}

      - uses: actions/setup-go@v6
        if: ${{ matrix.language == 'go' }}
        with:
          go-version: "1.26.x"

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --public-hoist-pattern '@github/copilot-*'
          copilot_cli_path=$(node --input-type=module -e "import { fileURLToPath } from 'node:url'; console.log(fileURLToPath(new URL('./index.js', import.meta.resolve('@github/copilot-linux-x64'))))")
          echo "COPILOT_CLI_PATH=$copilot_cli_path" >> "$GITHUB_ENV"
          pnpm list @microsoft/vally @github/copilot-sdk @github/copilot --depth 10
          node "$copilot_cli_path" --version

      - name: Install Python dependencies
        if: ${{ matrix.language == 'python' }}
        run: python -m pip install -r requirements-dev.txt

      - name: Bootstrap pinned skill repositories
        shell: pwsh
        run: pnpm bootstrap

      - name: Use public npm for MCP child processes
        shell: bash
        run: |
          find experiments -name experiment.yaml -exec sed -i \
            's#https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-js/npm/registry/#https://registry.npmjs.org/#g' \
            {} +

      - name: Run selected evaluations
        id: evaluation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUITE: ${{ inputs.suite }}
          SERVICE: ${{ inputs.service }}
          PLANE: ${{ inputs.plane }}
          SCOPE: ${{ inputs.scope }}
          OTHER_TAGS: ${{ inputs.other_tags }}
          LANGUAGE: ${{ matrix.language }}
          VARIANT: ${{ matrix.variant }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--mode all --language "$LANGUAGE" --variant "$VARIANT" --output-dir reports)
          if [[ -n "$SUITE" ]]; then
            args+=(--suite "$SUITE")
          fi
          [[ -z "$SERVICE" ]] || args+=(--service "$SERVICE")
          [[ -z "$PLANE" ]] || args+=(--plane "$PLANE")
          [[ -z "$SCOPE" ]] || args+=(--scope "$SCOPE")
          if [[ -n "$OTHER_TAGS" ]]; then
            args+=(--tags "$OTHER_TAGS")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          node scripts/run-evaluations.mjs "${args[@]}"

      - name: Write shard manifest
        if: ${{ always() && inputs.dry_run == false }}
        env:
          LANGUAGE: ${{ matrix.language }}
          VARIANT: ${{ matrix.variant }}
          EXPECTED_EVALUATIONS: ${{ matrix.evaluations }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); fs.writeFileSync("evaluation-shard.json", JSON.stringify({ language: process.env.LANGUAGE, variant: process.env.VARIANT, expectedEvaluations: Number(process.env.EXPECTED_EVALUATIONS), evaluationOutcome: process.env.EVALUATION_OUTCOME }, null, 2));'

      - name: Upload evaluation shard
        if: ${{ always() && inputs.dry_run == false }}
        uses: actions/upload-artifact@v7
        with:
          name: vally-shard-${{ matrix.language }}-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            reports
            evaluation-shard.json
          if-no-files-found: error

  summarize:
    if: ${{ always() && inputs.dry_run == false }}
    needs:
      - plan
      - evaluate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare shard download directory
        run: mkdir downloaded-shards

      - name: Download evaluation shards
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: vally-shard-*-${{ github.run_id }}
          path: downloaded-shards

      - name: Aggregate evaluation results
        env:
          EXPECTED_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          node scripts/summarize-reports.mjs \
            --input-dir downloaded-shards \
            --expected-matrix "$EXPECTED_MATRIX" \
            --output evaluation-summary.md

      - name: Publish combined summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f evaluation-summary.md ]]; then
            cat evaluation-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Vally evaluation summary" >> "$GITHUB_STEP_SUMMARY"
            echo "The combined summary could not be generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload combined report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vally-summary-${{ github.run_id }}
          path: evaluation-summary.md
          if-no-files-found: warn
