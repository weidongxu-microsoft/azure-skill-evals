name: Reference application oracle validation

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Validate Foundry scenarios, one scenario, or every golden
        required: true
        type: choice
        default: foundry
        options:
          - foundry
          - scenario
          - all
      scenario:
        description: Scenario directory name; used when selection is scenario
        required: false
        type: string

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: golden-oracle
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      expected: ${{ steps.matrix.outputs.expected }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve oracle shards
        id: matrix
        env:
          SELECTION: ${{ inputs.selection }}
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          args=(--matrix)
          case "$SELECTION" in
            foundry)
              args+=(--service foundry)
              ;;
            scenario)
              if [[ -z "$SCENARIO" ]]; then
                echo "scenario is required when selection=scenario" >&2
                exit 1
              fi
              args+=(--scenario "$SCENARIO")
              ;;
            all)
              args+=(--all)
              ;;
          esac
          matrix=$(node scripts/validate-golden-oracles.mjs "${args[@]}")
          expected=$(node -e 'const matrix = JSON.parse(process.argv[1]); console.log(matrix.include.reduce((sum, shard) => sum + shard.evaluations, 0));' "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "\`$matrix\`" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        if: ${{ matrix.language == 'python' }}
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.language == 'dotnet' }}
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v6
        if: ${{ matrix.language == 'java' }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ matrix.language == 'java' }}

      - uses: actions/setup-go@v6
        if: ${{ matrix.language == 'go' }}
        with:
          go-version: "1.26.x"

      - name: Configure public npm registry
        run: npm config set registry https://registry.npmjs.org/ --location=user

      - name: Install pnpm
        run: npm install --global pnpm@10.26.0 --registry=https://registry.npmjs.org/

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile --public-hoist-pattern '@github/copilot-*'
          copilot_cli_path=$(node --input-type=module -e "import { fileURLToPath } from 'node:url'; console.log(fileURLToPath(new URL('./index.js', import.meta.resolve('@github/copilot-linux-x64'))))")
          echo "COPILOT_CLI_PATH=$copilot_cli_path" >> "$GITHUB_ENV"
          node "$copilot_cli_path" --version

      - name: Validate reference applications with live graders
        id: oracle
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANGUAGE: ${{ matrix.language }}
          SELECTION: ${{ inputs.selection }}
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -o pipefail
          args=(--language "$LANGUAGE" --output oracle-results.jsonl)
          case "$SELECTION" in
            foundry)
              args+=(--service foundry)
              ;;
            scenario)
              args+=(--scenario "$SCENARIO")
              ;;
            all)
              args+=(--all)
              ;;
          esac
          node scripts/validate-golden-oracles.mjs "${args[@]}" 2>&1 | tee golden-oracle.log

      - name: Write shard manifest
        if: ${{ always() }}
        env:
          EXPECTED: ${{ matrix.evaluations }}
          LANGUAGE: ${{ matrix.language }}
          OUTCOME: ${{ steps.oracle.outcome }}
        shell: pwsh
        run: |
          @{
            language = $env:LANGUAGE
            expected = [int]$env:EXPECTED
            outcome = $env:OUTCOME
          } | ConvertTo-Json | Set-Content oracle-shard.json

      - name: Upload oracle shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-oracle-shard-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            golden-oracle.log
            oracle-results.jsonl
            oracle-shard.json
          if-no-files-found: error

  summarize:
    if: ${{ always() }}
    needs:
      - plan
      - validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: golden-oracle-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: oracle-artifacts

      - name: Summarize oracle results
        run: |
          node scripts/summarize-golden-oracles.mjs \
            oracle-artifacts \
            "${{ needs.plan.outputs.expected }}" \
            golden-oracle-summary.md
          cat golden-oracle-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload oracle summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-oracle-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            golden-oracle-summary.md
            oracle-artifacts
          if-no-files-found: error
