name: PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          python -m pip install -r requirements-dev.txt

      - name: Bootstrap pinned skill repositories
        shell: pwsh
        run: pnpm bootstrap

      - name: Run deterministic validation
        run: |
          pnpm test
          pnpm exec vally lint --eval-spec scenarios --strict --verbose

      - name: Dry-run experiments
        run: |
          pnpm exec vally experiment run experiments/python/experiment.yaml --output-dir reports --dry-run
          pnpm exec vally experiment run experiments/dotnet/experiment.yaml --output-dir reports --dry-run
          pnpm exec vally experiment run experiments/java/experiment.yaml --output-dir reports --dry-run
          pnpm exec vally experiment run experiments/typescript/experiment.yaml --output-dir reports --dry-run
          pnpm exec vally experiment run experiments/go/experiment.yaml --output-dir reports --dry-run
