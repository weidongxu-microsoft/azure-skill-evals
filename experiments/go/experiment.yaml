name: go-two-way
evals:
  - ../../scenarios/app-configuration-go-config-values/eval.yaml
  - ../../scenarios/app-configuration-go-feature-flags/eval.yaml
  - ../../scenarios/cosmos-db-go-crud/eval.yaml
  - ../../scenarios/cosmos-db-go-error-handling/eval.yaml
  - ../../scenarios/cosmos-db-go-pagination-query-items/eval.yaml
  - ../../scenarios/cosmos-db-go-todo-repository/eval.yaml
  - ../../scenarios/event-hubs-go-send-receive-events/eval.yaml
  - ../../scenarios/identity-go-credential-chain/eval.yaml
  - ../../scenarios/key-vault-go-error-handling/eval.yaml
  - ../../scenarios/key-vault-go-pagination-list-secrets/eval.yaml
  - ../../scenarios/key-vault-go-polling-create-vault/eval.yaml
  - ../../scenarios/service-bus-go-order-processor/eval.yaml
  - ../../scenarios/service-bus-go-send-receive-messages/eval.yaml
  - ../../scenarios/storage-go-authentication/eval.yaml
