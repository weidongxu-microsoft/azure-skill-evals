name: ai-agents-java-file-search
description: "Can an agent ground an Azure AI Agents response in an uploaded document through file search?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-agents-dp-java-file-search
    prompt: |-
      Create a complete, runnable Java console application that uses
      `com.azure:azure-ai-agents-persistent` to answer a question grounded in an uploaded
      document.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `PROJECT_ENDPOINT` and `MODEL_DEPLOYMENT_NAME`.
      - Create a text document containing this exact fact:
        `The Contoso Trail Guide says the Cascade Loop is 42 kilometers long and hikers should bring a rain jacket.`
      - Upload the document for agents, create a vector store containing it, and wait until
        the vector store is ready. Fail if indexing doesn't complete successfully.
      - Create an agent named `hyoka-trail-guide-agent` with a file-search tool and tool
        resources that reference the created vector store.
      - Create a thread with the exact user message
        `According to the uploaded guide, how long is the Cascade Loop and what should hikers bring?`
      - Create and poll a run until terminal status, and require successful completion.
      - List messages in chronological order and print agent text.
      - Delete the thread, agent, vector store, and uploaded file in dependency order.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK clients throughout.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: agents
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/configures-the-synchronous-agents-client
              description: |-
                - Read `PROJECT_ENDPOINT` and use it to build a synchronous persistent Agents client.
                - Use current public Agents SDK operations for files, vector stores, agents, threads, messages, and runs.
              weight: 1
              pass_threshold: 1
            - name: prompt/uploads-the-exact-guide-document
              description: |-
                - Create a text document containing the exact supplied Cascade Loop fact.
                - Upload that document for agent use and retain the returned file ID.
              weight: 1
              pass_threshold: 1
            - name: prompt/prepares-the-vector-store
              description: |-
                - Create a vector store containing the returned uploaded-file ID.
                - Poll with a bounded retrieve-and-delay loop until indexing is terminal.
                - Require successful readiness before creating the run; fail on error or timeout.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-named-file-search-agent
              description: |-
                - Read `MODEL_DEPLOYMENT_NAME` and create `hyoka-trail-guide-agent` with it.
                - Configure a file-search tool on the agent.
                - Bind the created vector-store ID through the tool resources or equivalent current SDK shape.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-grounded-thread-and-run
              description: |-
                - Add the exact supplied guide question to a created thread.
                - Create the run with the returned thread ID and file-search agent ID.
              weight: 1
              pass_threshold: 1
            - name: prompt/polls-and-prints-the-grounded-answer
              description: |-
                - Refresh the run while nonterminal; bounded manual retrieval with sleep is valid.
                - Require successful completion without requiring observation of transient statuses.
                - Traverse messages chronologically and print returned agent text, not the locally known fact.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-file-search-resources-in-order
              description: |-
                - Delete the created thread before the created agent.
                - Delete the created vector store before the uploaded file.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
