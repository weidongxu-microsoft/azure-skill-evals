name: identity-dotnet-default-azure-credential
description: Compare Azure tooling for a .NET DefaultAzureCredential task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-dotnet-default-azure-credential
    prompt: |-
      Show me how to authenticate
      an Azure SDK client using DefaultAzureCredential in C#. Explain:
      1. What NuGet packages are needed
      2. How to create and use a DefaultAzureCredential instance
      3. The credential chain order (which credentials are tried and in what sequence)
      4. How it behaves differently in local development vs deployed Azure environments
      5. How to troubleshoot when authentication fails
      
      Provide a complete, runnable example that creates a BlobServiceClient using
      DefaultAzureCredential.
    tags:
      service: identity
      plane: data-plane
      language: dotnet
      category: auth
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - diff
          criteria:
            - name: prompt/azure-identity-nuget-package-installation
              description: |-
                `Azure.Identity` NuGet package installation
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/defaultazurecredential-constructor-and-options
              description: |-
                `DefaultAzureCredential` constructor and options
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/credential-chain-environment-workload-identity-managed-i
              description: |-
                Credential chain: Environment → Workload Identity → Managed Identity → Azure CLI → etc.
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/passing-credential-to-any-azure-sdk-client-constructor
              description: |-
                Passing credential to any Azure SDK client constructor
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/authenticationfailedexception-handling-and-diagnostics
              description: |-
                `AuthenticationFailedException` handling and diagnostics
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
