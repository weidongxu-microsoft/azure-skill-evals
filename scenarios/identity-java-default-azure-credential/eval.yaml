name: identity-java-default-azure-credential
description: Compare Azure tooling for DefaultAzureCredential authentication in Java
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-java-default-azure-credential
    prompt: |-
      Show me how to authenticate
      an Azure SDK client using DefaultAzureCredential in Java. Explain:
      1. What Maven dependencies are needed
      2. How to create and use a DefaultAzureCredential instance
      3. The credential chain order and which credentials are tried
      4. How it behaves differently in local development vs Azure environments
      5. How to troubleshoot authentication failures
      
      Provide a complete example that creates a SecretClient using DefaultAzureCredential.
    tags:
      service: identity
      plane: data-plane
      language: java
      category: authentication
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/identity-and-key-vault-dependencies
              description: |-
                - Declares current `com.azure:azure-identity` and Key Vault Secrets SDK dependencies.
                - Uses compatible direct versions or compatible Azure SDK BOM management.
              weight: 1
              pass_threshold: 1
            - name: prompt/default-credential-secret-client-flow
              description: |-
                - Builds a `DefaultAzureCredential`.
                - Key Vault URL plus that credential -> a real synchronous `SecretClient`.
                - No substitute credential, hardcoded secret, key, or connection string.
              weight: 1
              pass_threshold: 1
            - name: prompt/documented-ordered-credential-chain
              description: |-
                - Describes the documented credential order for the selected current `azure-identity` version.
                - Each credential is attempted in order until one succeeds; failures continue or terminate according to current SDK behavior.
                - Covers environment/workload or managed identity and applicable developer-tool credentials.
              weight: 1
              pass_threshold: 1
            - name: prompt/local-versus-azure-behavior
              description: |-
                - Local development uses available developer credentials such as Azure CLI or IDE sign-in.
                - Azure hosting uses workload or managed identity when configured.
                - Explains that the same `DefaultAzureCredential` call site selects the first usable source.
              weight: 1
              pass_threshold: 1
            - name: prompt/actionable-authentication-troubleshooting
              description: |-
                - Enables or documents actionable Azure Identity diagnostics.
                - Preserves `ClientAuthenticationException`, `CredentialUnavailableException`, or their causes.
                - Reports a useful failure reason without exposing tokens or secrets.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
