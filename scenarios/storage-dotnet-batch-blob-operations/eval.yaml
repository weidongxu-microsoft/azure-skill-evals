name: storage-dotnet-batch-blob-operations
description: Compare Azure tooling for Blob Storage batch operations in .NET
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-dotnet-batch
    prompt: |-
      Write a complete C# console application that performs Azure Blob Storage batch operations with Azure.Storage.Blobs.Batch.

      Write the code to files. Do not reply with code blocks.

      1. Target .NET 8 and pin Azure.Identity 1.21.0, Azure.Storage.Blobs 12.29.2, and Azure.Storage.Blobs.Batch 12.26.0 exactly.
      2. Read an absolute Blob service endpoint from AZURE_STORAGE_BLOB_ENDPOINT and a container name from AZURE_STORAGE_CONTAINER. Authenticate with DefaultAzureCredential and create a BlobBatchClient connected to that account.
      3. Prepare 500 blob URIs for deletion and 200 blob URIs for changing from Hot to Cool. Use DeleteBlobsAsync and SetBlobsAccessTierAsync.
      4. Respect the service limit of 256 subrequests and the 4 MiB batch-body limit. A 500-item delete cannot be one request, so partition it into requests of at most 256 operations. Keep every request within one storage account.
      5. Also show fine-grained batching with CreateBatch, DeleteBlob or SetBlobAccessTier, and SubmitBatchAsync. Inspect each suboperation Response only after its batch is submitted.
      6. Inspect successful Response status values. Handle partial suboperation failures from AggregateException by examining its RequestFailedException instances, including Status and ErrorCode. Separately handle a RequestFailedException that prevents the batch request itself from being submitted.
      7. Include concise run instructions and explain that BlobServiceClient requests the https://storage.azure.com/.default scope for DefaultAzureCredential; do not request or hard-code access tokens.

      The application may use well-factored helper methods and equivalent valid SDK forms.
    tags:
      service: storage
      plane: data-plane
      language: dotnet
      category: batch
    graders:
      - type: run-command
        name: prompt/storage-batch-manifest
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-batch-blob-operations/tools/check-storage-dotnet-batch.mjs, prompt/storage-batch-manifest] }
      - type: run-command
        name: prompt/authenticated-batch-client
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-batch-blob-operations/tools/check-storage-dotnet-batch.mjs, prompt/authenticated-batch-client] }
      - type: run-command
        name: prompt/delete-batches
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-batch-blob-operations/tools/check-storage-dotnet-batch.mjs, prompt/delete-batches] }
      - type: run-command
        name: prompt/tier-batch
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-batch-blob-operations/tools/check-storage-dotnet-batch.mjs, prompt/tier-batch] }
      - type: run-command
        name: prompt/custom-batch-responses
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-batch-blob-operations/tools/check-storage-dotnet-batch.mjs, prompt/custom-batch-responses] }
      - type: run-command
        name: prompt/partial-failure-handling
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-batch-blob-operations/tools/check-storage-dotnet-batch.mjs, prompt/partial-failure-handling] }
      - type: run-command
        name: prompt/batch-limits
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-batch-blob-operations/tools/check-storage-dotnet-batch.mjs, prompt/batch-limits] }
      - type: run-command
        name: language/project-manifest
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/project-manifest] }
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/current-azure-packages] }
      - type: run-command
        name: language/async-await
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/async-await] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/client-lifecycle] }
    environment:
      files:
        - src: tools/check-storage-dotnet-batch.mjs
          dest: .vally/scenarios/storage-dotnet-batch-blob-operations/tools/check-storage-dotnet-batch.mjs
        - src: tools/storage-dotnet-batch-rules.mjs
          dest: .vally/scenarios/storage-dotnet-batch-blob-operations/tools/storage-dotnet-batch-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
