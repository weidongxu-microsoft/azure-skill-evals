name: identity-typescript-service-principal-auth
description: Compare Azure tooling for TypeScript service principal authentication
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-typescript-service-principal
    prompt: |-
      Write a TypeScript program that
      authenticates to Azure using a Service Principal with client secret. The program should:
      1. Install and import @azure/identity with ClientSecretCredential
      2. Read tenant ID, client ID, and client secret from environment variables
      3. Create a ClientSecretCredential instance
      4. Use it to create an Azure SDK client (e.g., SecretClient from @azure/keyvault-secrets)
      5. Perform an operation to verify the credential works
      6. Handle AuthenticationError for invalid credentials
      
      Include a package.json with all dependencies, use dotenv for environment variable
      management, and use async/await throughout.
    tags:
      service: identity
      plane: data-plane
      language: typescript
      category: auth
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/azure-identity-package-with-clientsecretcredential-class
              description: |-
                `@azure/identity` package with `ClientSecretCredential` class
              weight: 1
              pass_threshold: 1
            - name: prompt/constructor-parameters-tenantid-clientid-clientsecret
              description: |-
                Constructor parameters: tenantId, clientId, clientSecret
              weight: 1
              pass_threshold: 1
            - name: prompt/passing-credential-to-azure-sdk-clients
              description: |-
                Passing credential to Azure SDK clients
              weight: 1
              pass_threshold: 1
            - name: prompt/dotenv-or-environment-variable-patterns
              description: |-
                dotenv or environment variable patterns
              weight: 1
              pass_threshold: 1
            - name: prompt/authenticationerror-handling
              description: |-
                `AuthenticationError` handling
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
