name: storage-java-crud-blobs
description: Compare Azure tooling for an Azure Blob Storage Java CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-java-crud
    prompt: |-
      Write a Java application that performs
      CRUD operations on Azure Blob Storage:
      1. Create a BlobServiceClient using DefaultAzureCredential
      2. Create a container named "my-container" if it doesn't exist
      3. Upload a local file "data.txt" as a blob named "uploads/data.txt"
      4. List all blobs in the container and print their names and sizes
      5. Download the blob back to a local file "data-downloaded.txt"
      6. Delete the blob and then delete the container
      
      Show required Maven dependencies and proper error handling with BlobStorageException.
    tags:
      service: storage
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/blob-project-and-auth
              description: |-
                - Declare compatible `azure-storage-blob` and `azure-identity` Maven dependencies.
                - Build the Blob service client with `DefaultAzureCredential`.
                - Obtain the storage endpoint from external configuration.
              weight: 1
              pass_threshold: 1
            - name: prompt/idempotent-container-create
              description: |-
                - Target the exact container name `my-container`.
                - Create it only when absent, using `createIfNotExists()` or an equivalent race-safe existence flow.
              weight: 1
              pass_threshold: 1
            - name: prompt/upload-required-blob
              description: |-
                - Read the local file `data.txt`.
                - Upload it as the exact blob name `uploads/data.txt`.
                - Preserve the local file's contents in the uploaded blob.
              weight: 1
              pass_threshold: 1
            - name: prompt/list-blob-details
              description: |-
                - Iterate all blobs returned for `my-container`.
                - Print each blob's name and size.
              weight: 1
              pass_threshold: 1
            - name: prompt/download-required-blob
              description: |-
                - Download `uploads/data.txt`.
                - Write the downloaded bytes to the exact local file `data-downloaded.txt`.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-cleanup
              description: |-
                - Delete `uploads/data.txt` after the download.
                - Delete `my-container` only after its blob cleanup.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-storage-error-handling
              description: |-
                - Handle `BlobStorageException` around storage operations.
                - Report the status code and actionable service error details.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Compatible BOM-covered GA Azure artifacts omit explicit versions.
                - Explicit versions are limited to preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` packages.
                - Do not import legacy `com.microsoft.azure.*` or Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Do not depend on deprecated, removed, or implementation-only Azure types.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
