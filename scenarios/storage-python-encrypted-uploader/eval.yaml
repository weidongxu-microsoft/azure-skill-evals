name: storage-python-encrypted-uploader
description: Compare Azure tooling for Python client-side envelope encryption with Blob Storage and Key Vault Keys
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-python-encrypted-uploader
    prompt: |-
      Create a Python project that uploads files to Azure Blob Storage with client-side encryption, where the encryption key material is managed in Azure Key Vault.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      The project needs:
      
      - A **key management module** (both sync and async versions) that interacts with Azure Key Vault's Keys service (not Secrets) to perform cryptographic operations. It should implement envelope encryption: generate a data encryption key locally, use Key Vault to protect (wrap) it, and store the protected key alongside the encrypted blob. For decryption, have Key Vault recover (unwrap) the data key, then decrypt locally. The raw data key should never be persisted anywhere, and the vault's key material should never leave Key Vault.
      
      - A **blob uploader/downloader module** (both sync and async versions) that handles the actual encryption and storage. For upload: generate a data key, encrypt the data locally using **AES-GCM** (authenticated encryption), protect the data key via Key Vault, then upload the ciphertext to Blob Storage with the protected key and any necessary cryptographic parameters (nonce/IV) stored as blob metadata. For download: read the blob and its metadata, recover the data key via Key Vault, and decrypt. Should handle errors from both services (e.g., the vault key may have been disabled, or the blob may not exist).
      
      - A **configuration module** that builds the necessary Azure connections for both Blob Storage and Key Vault. It should read endpoints from environment variables and authenticate with `DefaultAzureCredential`. All connections should share a single credential instance.
      
      - A **main script** that demos both implementations: runs the full encrypt-upload-download-decrypt round-trip using the sync implementation first, then repeats with the async implementation. Print the vault key ID used, the wrapped DEK (base64), and the decrypted output.
      
      Include a `requirements.txt` with the necessary Azure SDK dependencies.
    tags:
      service: storage
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - diff
          criteria:
            - name: prompt/uses-the-key-vault-keys-sdk-not-secrets-critical-distinc
              description: |-
                Uses the Key Vault Keys SDK (NOT Secrets) — critical distinction
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/uses-a-cryptography-library-for-local-aes-gcm-encryption
              description: |-
                Uses a cryptography library for local AES-GCM encryption ### Key Vault Integration
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/uses-key-vaults-cryptographic-client-for-key-wrap-and-un
              description: |-
                Uses Key Vault's cryptographic client for key wrap and unwrap operations (NOT a secrets client)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/specifies-an-rsa-key-wrap-algorithm-for-protecting-the-d
              description: |-
                Specifies an RSA key wrap algorithm for protecting the DEK
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/key-material-never-leaves-key-vault-wrap-unwrap-happens
              description: |-
                Key material never leaves Key Vault — wrap/unwrap happens server-side ### Envelope Encryption
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/generates-a-random-256-bit-data-encryption-key-dek-local
              description: |-
                Generates a random 256-bit data encryption key (DEK) locally
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/encrypts-data-locally-with-aes-gcm-using-the-dek
              description: |-
                Encrypts data locally with AES-GCM using the DEK
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/wraps-the-dek-via-key-vault-before-storing
              description: |-
                Wraps the DEK via Key Vault before storing
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/stores-the-wrapped-dek-nonce-iv-and-vault-key-identifier
              description: |-
                Stores the wrapped DEK, nonce/IV, and vault key identifier as blob metadata
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/decryption-retrieves-metadata-unwraps-the-dek-via-key-va
              description: |-
                Decryption retrieves metadata, unwraps the DEK via Key Vault, and decrypts locally
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/uses-aes-gcm-specifically-not-cbc-ecb-or-other-modes
              description: |-
                Uses AES-GCM specifically (not CBC, ECB, or other modes)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/generates-a-fresh-random-nonce-for-each-encryption-error
              description: |-
                Generates a fresh random nonce for each encryption ### Error Handling
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handles-key-vault-errors-key-disabled-key-not-found
              description: |-
                Handles Key Vault errors (key disabled, key not found)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handles-blob-not-found
              description: |-
                Handles blob not found
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/code-must-build-and-run-without-import-errors-or-runtime
              description: |-
                Code must build and run without import errors or runtime crashes ### Async Support
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/async-versions-use-the-async-variants-of-blob-storage-an
              description: |-
                Async versions use the async variants of Blob Storage and Key Vault clients ### Anti-Patterns
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/does-not-use-a-secrets-client-instead-of-a-keys-crypto-c
              description: |-
                Does NOT use a secrets client instead of a keys/crypto client
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/does-not-encrypt-data-directly-with-the-vault-key-must-b
              description: |-
                Does NOT encrypt data directly with the vault key (must be envelope encryption)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/does-not-store-the-raw-dek-in-plaintext
              description: |-
                Does NOT store the raw DEK in plaintext
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
