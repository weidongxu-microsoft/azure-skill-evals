name: storage-python-encrypted-uploader
description: Compare Azure tooling for Python client-side envelope encryption with Blob Storage and Key Vault Keys
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-python-encrypted-uploader
    prompt: |-
      Create a Python project that uploads files to Azure Blob Storage with client-side encryption, where the encryption key material is managed in Azure Key Vault.

      Write the code to files. Do not reply with code blocks.

      Include synchronous and asynchronous key-management and encrypted-blob modules. Generate a local random 32-byte data encryption key (DEK), encrypt locally with AES-GCM using a fresh nonce, wrap and unwrap the DEK with Key Vault Keys CryptographyClient using RSA-OAEP, and upload only ciphertext. Store base64 wrapped-DEK and nonce values plus the vault key ID in Blob metadata. Download must retrieve metadata, unwrap the DEK, and decrypt locally.

      Use DefaultAzureCredential and environment-provided Blob and Key Vault endpoints. Blob and Key Vault clients within each implementation must share its credential. Handle Key Vault and Blob errors. Demonstrate a synchronous round trip first and an asynchronous round trip second, printing the vault key ID, wrapped DEK, and decrypted output. Include runtime dependencies.
    tags:
      service: storage
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: run-command
        name: prompt/sdk-packages
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs, prompt/sdk-packages] }
      - type: run-command
        name: prompt/key-vault-envelope-operations
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs, prompt/key-vault-envelope-operations] }
      - type: run-command
        name: prompt/local-aes-gcm-encryption
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs, prompt/local-aes-gcm-encryption] }
      - type: run-command
        name: prompt/encrypted-blob-metadata-round-trip
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs, prompt/encrypted-blob-metadata-round-trip] }
      - type: run-command
        name: prompt/credential-and-client-configuration
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs, prompt/credential-and-client-configuration] }
      - type: run-command
        name: prompt/sync-and-async-implementations
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs, prompt/sync-and-async-implementations] }
      - type: run-command
        name: prompt/sdk-error-handling
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs, prompt/sdk-error-handling] }
      - type: run-command
        name: prompt/ordered-demo-workflow
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs, prompt/ordered-demo-workflow] }
      - type: run-command
        name: language/correct-imports
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/correct-imports] }
      - type: run-command
        name: language/default-azure-credential
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/default-azure-credential] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/client-lifecycle] }
      - type: run-command
        name: language/async-client
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/async-client] }
      - type: run-command
        name: language/exception-handling
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/exception-handling] }
    environment:
      files:
        - src: tools/check-encrypted-uploader-python.mjs
          dest: .vally/scenarios/storage-python-encrypted-uploader/tools/check-encrypted-uploader-python.mjs
        - src: tools/encrypted-uploader-rules.mjs
          dest: .vally/scenarios/storage-python-encrypted-uploader/tools/encrypted-uploader-rules.mjs
        - src: tools/encrypted_uploader_analyzer.py
          dest: .vally/scenarios/storage-python-encrypted-uploader/tools/encrypted_uploader_analyzer.py
        - src: ../../languages/python/check.mjs
          dest: .vally/languages/python/check.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
