name: app-configuration-java-config-values
description: Compare Azure tooling for an App Configuration Java CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-java-crud
    prompt: |-
      Write a Java program that manages
      configuration settings in Azure App Configuration:
      1. Create a ConfigurationClient using ConfigurationClientBuilder with a connection string
      2. Set a configuration setting with key "app:Settings:FontSize" and value "24"
      3. Set a setting with label "Production"
      4. Get the setting by key and print its value
      5. List settings with a key filter "app:Settings:*" using listConfigurationSettings
      6. Create a feature flag configuration setting for "BetaFeature"
      7. Delete the setting by key
      
      Show required Maven dependency (com.azure:azure-data-appconfiguration) and
      proper error handling with HttpResponseException.
    tags:
      service: app-configuration
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/azure-data-appconfiguration-maven-dependency
              description: |-
                - Manifest declares the App Configuration data SDK artifact.
                - Coordinates use the current `com.azure` Azure SDK group.
                - Versioning is compatible with direct or BOM-managed dependency policy.
              weight: 1
              pass_threshold: 1
            - name: prompt/configurationclientbuilder-and-configurationclient
              description: |-
                - Runtime connection string -> App Configuration client construction.
                - Build a synchronous configuration client for value operations.
                - Token credentials are not required for this connection-string prompt.
              weight: 1
              pass_threshold: 1
            - name: prompt/sets-default-and-production-values
              description: |-
                - Set key `app:Settings:FontSize` with value `24` and no label.
                - Set the same key with value `24` and label `Production`.
                - Any valid current `setConfigurationSetting` overload is accepted.
              weight: 1
              pass_threshold: 1
            - name: prompt/retrieves-and-prints-the-setting-value
              description: |-
                - Retrieve `app:Settings:FontSize` from App Configuration by key.
                - Print the service-returned value `24`.
              weight: 1
              pass_threshold: 1
            - name: prompt/lists-the-exact-key-filter-results
              description: |-
                - List settings with key filter `app:Settings:*`.
                - Consume the returned settings rather than issuing a disconnected list call.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-beta-feature-flag
              description: |-
                - Create a feature flag named `BetaFeature`.
                - A typed `FeatureFlagConfigurationSetting` or equivalent correctly formed App Configuration feature-flag setting is valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/deleteconfigurationsetting-and-exception-handling
              description: |-
                - Delete key `app:Settings:FontSize` through a current App Configuration delete operation.
                - Handle App Configuration HTTP/service failures around delete or value operations.
                - Report useful status or service error details.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - Delete key `app:Settings:FontSize` after the value operations.
                - Use the current App Configuration delete operation for that key.
                - The feature flag is not required to satisfy this setting-cleanup point.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
