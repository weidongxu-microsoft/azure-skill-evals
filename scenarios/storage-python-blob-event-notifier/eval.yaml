name: storage-python-blob-event-notifier
description: Compare Azure tooling for a Python Blob Storage Event Grid notifier
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-python-blob-event-notifier
    prompt: |-
      Create a Python project that processes Azure Blob Storage lifecycle events delivered via Event Grid.

      **Write the code to files (use file-write tools, do not reply with code blocks).**

      The project needs:

      - An **event receiver module** (both sync and async versions) that accepts an iterable of per-event JSON documents, or framework-decoded per-event mappings, from an Event Grid webhook request and converts each item into a structured event object with the SDK's `CloudEvent.from_json`/`from_dict` or `EventGridEvent.from_json`/`from_dict` helpers. Event Grid's native webhook body is a JSON array, but pass its individual event documents or decoded mappings to the receiver; do not manually parse or construct event objects. Support both Event Grid native schema and CloudEvents 1.0 schema (since Event Grid supports both and the configured schema may vary). Route events by type — blob-created events get processed one way, blob-deleted another, and unrecognized types are logged as warnings.

      - A **blob event handler module** that processes individual blob events. For blob-created events, it should parse the blob's container and name from the event subject, download the blob, and print a summary (name, size, content type, and the blob's access tier). For blob-deleted events, it should just log the deletion. It should handle race conditions gracefully — the blob may have already been deleted or moved to a different tier by the time we try to read it.

      - An **event publisher module** (both sync and async versions) that can publish custom events to an Event Grid topic. Given a topic endpoint and a list of custom event objects, it should send them to Event Grid using the SDK's publisher client. This would be used for downstream notifications (e.g., "document processed" events). It should support setting a subject hierarchy for event filtering (e.g., "/documents/invoices/processed"). Handle publishing errors gracefully with proper exception handling.

      - A **configuration module** that connects to Azure Blob Storage and Event Grid securely. Authentication should use `DefaultAzureCredential` — no access keys or SAS tokens.

      - A **main script** that demos both implementations: constructs a sample Event Grid JSON payload (with both CloudEvents and EventGrid-schema examples) containing mock blob-created and blob-deleted events with realistic structure, feeds them through the receiver and handler, and publishes a custom downstream event. Run the full demo with the sync implementation first, then repeat with the async implementation.

      Include a `requirements.txt` with the necessary Azure SDK dependencies.
    tags:
      service: storage
      plane: data-plane
      language: python
      category: streaming
    graders:
      - type: run-command
        name: prompt/sdk-packages
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/sdk-packages] }
      - type: run-command
        name: prompt/sdk-event-deserialization
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/sdk-event-deserialization] }
      - type: run-command
        name: prompt/event-routing
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/event-routing] }
      - type: run-command
        name: prompt/blob-subject-and-summary
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/blob-subject-and-summary] }
      - type: run-command
        name: prompt/race-condition-handling
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/race-condition-handling] }
      - type: run-command
        name: prompt/custom-event-publishing
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/custom-event-publishing] }
      - type: run-command
        name: prompt/async-implementations
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/async-implementations] }
      - type: run-command
        name: prompt/secure-client-configuration
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/secure-client-configuration] }
      - type: run-command
        name: prompt/ordered-demo-workflow
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs, prompt/ordered-demo-workflow] }
      - type: run-command
        name: language/correct-imports
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/correct-imports] }
      - type: run-command
        name: language/default-azure-credential
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/default-azure-credential] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/client-lifecycle] }
      - type: run-command
        name: language/async-client
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/async-client] }
      - type: run-command
        name: language/exception-handling
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/exception-handling] }
    environment:
      files:
        - src: tools/check-blob-event-notifier-python.mjs
          dest: .vally/scenarios/storage-python-blob-event-notifier/tools/check-blob-event-notifier-python.mjs
        - src: tools/blob-event-notifier-rules.mjs
          dest: .vally/scenarios/storage-python-blob-event-notifier/tools/blob-event-notifier-rules.mjs
        - src: tools/blob_event_notifier_analyzer.py
          dest: .vally/scenarios/storage-python-blob-event-notifier/tools/blob_event_notifier_analyzer.py
        - src: ../../languages/python/check.mjs
          dest: .vally/languages/python/check.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
