name: cosmos-db-python-todo-repository
description: Compare Azure tooling for a production-oriented Cosmos DB Python repository
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-python-todo-repository
    prompt: |-
      Create a Python project that implements a ToDo item CRUD repository backed by Azure Cosmos DB (NoSQL API).
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      The project needs:
      
      - A **model** (shared by both implementations) for a ToDo item with fields for id, title, description, completed status, created timestamp, and category (where category is the partition key). Use a dictionary or a dataclass.
      
      - A **synchronous repository module** that performs CRUD operations against Cosmos DB. It should support create, read, update, delete, and a query-by-category method. Each operation should log the request charge (RU cost consumed) from the response headers. The update operation should prevent lost updates — if another process modified the item since it was last read, the update should fail with a clear conflict error rather than silently overwriting the other process's changes. The query method should use safe, parameterized queries and must handle large result sets properly — paginate through results page by page rather than loading everything into memory at once, and log progress as each page is retrieved.
      
      - An **asynchronous repository module** that provides the same CRUD operations using the `azure.cosmos.aio` async client. The query method should iterate through pages asynchronously.
      
      - A **configuration/factory module** that connects to the Cosmos DB account using its endpoint from an environment variable. Authentication must use `DefaultAzureCredential` (no master keys). It should create the database and container if they don't already exist, setting a default TTL (time-to-live) of 90 days on the container and configuring the indexing policy to exclude the `description` field from indexing (since it's never queried on).
      
      - A **main script** that demos both implementations: runs the full CRUD cycle using the sync repository first (including paginated query output showing page-by-page results), then runs the same operations using the async repository. Print RU costs and results to the console.
      
      Include a `requirements.txt` with the necessary Azure SDK dependencies.
    tags:
      service: cosmos-db
      plane: data-plane
      language: python
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/correct-partition-key-usage-category-path-partition-key
              description: |-
                Correct partition key usage: `/category` path, `partition_key` in all point operations
              weight: 1
              pass_threshold: 1
            - name: prompt/etag-based-optimistic-concurrency-captures-etag-from-rea
              description: |-
                ETag-based optimistic concurrency: captures `_etag` from read response, passes `if_match` on replace
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-412-precondition-failed-as-a-specific-error-case
              description: |-
                Handles 412 Precondition Failed as a specific error case for conflicts
              weight: 1
              pass_threshold: 1
            - name: prompt/parameterized-queries-using-parameters-list-no-f-string
              description: |-
                Parameterized queries using `parameters` list (no f-string or format-string concatenation)
              weight: 1
              pass_threshold: 1
            - name: prompt/page-by-page-iteration-using-query-items-by-page-with-ma
              description: |-
                Page-by-page iteration using `query_items(...).by_page()` with `max_item_count`
              weight: 1
              pass_threshold: 1
            - name: prompt/logs-continuation-token-and-item-count-per-page
              description: |-
                Logs continuation token and item count per page
              weight: 1
              pass_threshold: 1
            - name: prompt/async-version-uses-azure-cosmos-aio-cosmosclient
              description: |-
                Async version uses `azure.cosmos.aio.CosmosClient`
              weight: 1
              pass_threshold: 1
            - name: prompt/ttl-configured-at-90-days-7776000-seconds-via-default-tt
              description: |-
                TTL configured at 90 days (7776000 seconds) via `default_ttl` in container properties
              weight: 1
              pass_threshold: 1
            - name: prompt/indexing-policy-excludes-description-path-using-excluded
              description: |-
                Indexing policy excludes `/description` path using `excludedPaths`
              weight: 1
              pass_threshold: 1
            - name: prompt/ru-cost-extracted-from-response-headers-via-x-ms-request
              description: |-
                RU cost extracted from response headers via `x-ms-request-charge` or `response_headers` ### Scenario-Specific Error Handling
              weight: 1
              pass_threshold: 1
            - name: prompt/catches-cosmoshttpresponseerror-with-status-code-checks
              description: |-
                Catches `CosmosHttpResponseError` with status code checks (404, 409, 412)
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-412-separately-for-etag-conflicts-anti-patterns
              description: |-
                Handles 412 separately for ETag conflicts ### Anti-Patterns (scenario-specific)
              weight: 1
              pass_threshold: 1
            - name: prompt/does-not-flatten-query-results-by-calling-list-without-p
              description: |-
                Does NOT flatten query results by calling `list()` without page iteration
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
