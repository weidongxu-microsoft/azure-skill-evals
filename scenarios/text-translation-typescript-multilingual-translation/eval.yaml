name: text-translation-typescript-multilingual-translation
description: "Can an application translate one supplied text into French and Japanese in one request and report the detected source language?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: text-translation-dp-typescript-multilingual-translation
    prompt: |-
      Create a complete, runnable TypeScript console application using
      `@azure-rest/ai-translation-text` 2.0.0. Target Node.js 22. Accept one
      command-line argument containing the text to translate and read
      `AZURE_TEXT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Send the supplied text in one SDK translation request whose targets are French
        (`fr`) and Japanese (`ja`).
      - Omit the source language so the service detects it.
      - Print the detected source language returned by the service.
      - Traverse the returned translations and print each returned target-language code
        and translated text.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: translation
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/creates-one-v2-translateinputitem-containing-the-supplie
              description: |-
                Creates one v2 `TranslateInputItem` containing the supplied text and two target
                objects for `fr` and `ja`, without setting its `language`.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-client-path-translate-post-exactly-once-with-body
              description: |-
                Uses the `@azure-rest/ai-translation-text` 2.0.0 v2 client and calls
                `client.path("/translate").post` exactly once with `body: { inputs: [input] }`,
                then checks `isUnexpected`.
              weight: 1
              pass_threshold: 1
            - name: prompt/reads-the-returned-item-s-detectedlanguage-language-and
              description: |-
                Prints the returned item's `detectedLanguage.language` and traverses every item
                in its `translations` array.
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-each-translation-s-returned-language-and-text-val
              description: |-
                Prints each translation's returned `language` and `text` values.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
