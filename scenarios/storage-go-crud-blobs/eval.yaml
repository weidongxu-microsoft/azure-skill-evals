name: storage-go-crud-blobs
description: Compare Azure tooling for an Azure Blob Storage Go CRUD task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-go-crud
    prompt: |-
      Write a Go program that performs
      CRUD operations on Azure Blob Storage:
      1. Create a service client using DefaultAzureCredential from azidentity
      2. Create a container named "my-container"
      3. Upload a byte slice with content "Hello from Go" as a blob named "hello.txt"
      4. List all blobs in the container using a pager
      5. Download the blob and print its content
      6. Delete the blob and then delete the container

      Show required Go modules and proper error handling using ResponseError.
    tags:
      service: storage
      plane: data-plane
      language: go
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/storage-and-identity-modules
              description: |-
                `go get` for `github.com/Azure/azure-sdk-for-go/sdk/storage/azblob` and `azidentity`
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-client-with-default-credential
              description: |-
                `azblob.NewClient()` with `azidentity.NewDefaultAzureCredential()`
              weight: 1
              pass_threshold: 1
            - name: prompt/create-container
              description: |-
                `Client.CreateContainer()` and container operations
              weight: 1
              pass_threshold: 1
            - name: prompt/upload-blob
              description: |-
                `Client.UploadBuffer()` or `UploadStream()`
              weight: 1
              pass_threshold: 1
            - name: prompt/list-blobs-pager
              description: |-
                `Client.NewListBlobsFlatPager()` with pager iteration pattern
              weight: 1
              pass_threshold: 1
            - name: prompt/download-blob
              description: |-
                `Client.DownloadStream()` and reading the response body
              weight: 1
              pass_threshold: 1
            - name: prompt/delete-blob-and-container
              description: |-
                `Client.DeleteBlob()` and `Client.DeleteContainer()`
              weight: 1
              pass_threshold: 1
            - name: prompt/response-error
              description: |-
                `*azcore.ResponseError` type assertion for error details
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/go-project-tests
        config:
          command: go
          args:
            - test
            - -mod=readonly
            - ./...
          timeout: 3m
artifacts:
  include:
    - "**/*.go"
    - "**/go.mod"
    - "**/go.sum"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/vendor/**"
    - "**/.cache/**"
    - "**/*.test"
    - "**/coverage.out"
