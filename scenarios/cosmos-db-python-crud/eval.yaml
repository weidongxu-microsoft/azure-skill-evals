name: cosmos-db-python-crud-items
description: Compare Azure tooling for a Cosmos DB Python CRUD task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-python-crud
    prompt: |-
      Write a Python script that performs CRUD operations on items in an Azure Cosmos DB NoSQL container.

      Write the code to files. Do not reply with code blocks.

      1. Create a CosmosClient.
      2. Create a database "TestDB" and container "Items" with partition key "/category".
      3. Upsert an item dict with keys: id, category, name, quantity.
      4. Read the item back using read_item() with id and partition key.
      5. Query items where category equals "electronics" using a parameterized query.
      6. Replace the item with an updated quantity.
      7. Delete the item.

      Show required pip packages and handle exceptions from azure.cosmos.exceptions.
    tags:
      service: cosmos-db
      plane: data-plane
      language: python
      category: crud
      scenario: cosmos-db-python-crud-items
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the final generated repository as a complete implementation of the task.
            Score each rubric item independently as pass or fail. Accept equivalent valid
            implementations and do not require the golden application's file names or code
            structure. Judge only application correctness and SDK usage; do not score tool,
            MCP, or skill activity.
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - diff
          criteria:
            - name: prompt/azure-cosmos-package
              description: Declares the azure-cosmos package required to run the generated application.
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/cosmos-client
              description: Creates a real Azure Cosmos DB CosmosClient using runtime configuration rather than hard-coded credentials.
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/create-database
              description: Creates the TestDB database if it does not exist.
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/create-container
              description: Creates the Items container if it does not exist with partition key path /category.
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/cross-partition-query
              description: Queries for the electronics category with a parameterized query and enables cross-partition querying.
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/cosmos-exception
              description: Handles relevant exceptions from azure.cosmos.exceptions with useful diagnostics without swallowing unrelated failures.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-imports
              description: Uses valid imports from the real Azure Cosmos DB Python SDK rather than local stand-ins.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/client-lifecycle
              description: Cleans up the CosmosClient with a context manager or an explicit close call.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client
              description: If an asynchronous Azure SDK client is used, awaits its operations and closes it asynchronously.
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/item-crud
              description: Implements the requested upsert, point read, replace, and delete workflow with the same item identity and partition key.
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
