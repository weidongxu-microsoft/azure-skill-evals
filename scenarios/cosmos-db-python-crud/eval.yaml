name: cosmos-db-python-crud-items
description: Compare Azure tooling for a Cosmos DB Python CRUD task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-python-crud
    prompt: |-
      Write a Python script that performs CRUD operations on items in an Azure Cosmos DB NoSQL container.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      1. Create a CosmosClient
      2. Create a database "TestDB" and container "Items" with partition key "/category"
      3. Upsert an item dict with keys: id, category, name, quantity
      4. Read the item back using read_item() with id and partition key
      5. Query items where category equals "electronics" using parameterized query
      6. Replace the item with updated quantity
      7. Delete the item
      
      Show required pip packages and handle exceptions from azure.cosmos.exceptions.
    tags:
      service: cosmos-db
      plane: data-plane
      language: python
      category: crud
      scenario: cosmos-db-python-crud-items
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-cosmos-pip-package
              description: |-
                `azure-cosmos` pip package
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/cosmosclient-creation
              description: |-
                `CosmosClient` creation
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/database-client-create-database-if-not-exists
              description: |-
                `database_client.create_database_if_not_exists()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/database-create-container-if-not-exists-with-partitionke
              description: |-
                `database.create_container_if_not_exists()` with `PartitionKey`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/container-query-items-with-enable-cross-partition-query
              description: |-
                `container.query_items()` with `enable_cross_partition_query`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/cosmoshttpresponseerror-exception-handling
              description: |-
                `CosmosHttpResponseError` exception handling
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
              required: true
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - -m
            - compileall
            - -q
            - .
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
