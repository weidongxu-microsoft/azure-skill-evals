name: foundry-java-support-assistant
description: "Can an agent design a complete grounded product-support assistant with Microsoft Foundry without prescribed SDK symbols?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
    - src: materials/contoso-aero-300.md
      dest: materials/contoso-aero-300.md
    - src: materials/contoso-aero-300-warranty.md
      dest: materials/contoso-aero-300-warranty.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: foundry-dp-java-support-assistant
    prompt: |-
      Contoso needs an internal product-support assistant built with Microsoft
      Foundry. Employees should be able to ask questions about product
      documentation and receive answers grounded in that documentation.

      Create a complete, runnable backend-only Java 17 application built with
      Maven. Implement it as a long-running HTTP JSON API that listens on a
      configurable port. Select appropriate current Microsoft Foundry
      capabilities, Azure services, SDK packages, and application structure.

      **Write the application to files in the workspace. Do not reply with code blocks.**

      The application must:

      - Expose employee question, follow-up, and feedback operations plus
        administrator ingestion, unresolved-question review, evaluation, and
        cleanup operations through HTTP JSON endpoints.
      - Ingest the supplied product documentation files directly from
        `materials/`.
      - Ingest the product documentation for grounded retrieval and verify that
        asynchronous ingestion has completed successfully before answering
        questions.
      - Use the Microsoft Foundry project directly in each grounded answer
        request, with the selected retrieval capability supplying its grounding
        context.
      - Register the support assistant as a managed prompt agent in the supplied
        Microsoft Foundry project. Create it during administrator
        initialization, persist its returned identity, use it for every
        grounded answer and evaluation, and delete only prompt agent resources
        created by the application.
      - Support isolated multi-turn conversations so a follow-up question can
        use prior conversation context. Key durable conversation mappings by
        authenticated employee identity and client conversation ID so they
        survive application restarts.
      - Return references identifying the source files that support an answer.
        Derive each reference from identifiers returned by the retrieval or
        answer service.
      - Return a clearly identified unsupported response when the documentation
        does not support an answer, and durably record the question for human
        follow-up.
      - Durably record positive or negative feedback for a specific response
        and reject feedback that does not identify a known response.
      - Store application state in a durable shared service that remains
        available across application restarts.
      - Include a small evaluation dataset with multiple cases and a runnable
        evaluation workflow that submits generated answers to Microsoft
        Foundry groundedness and relevance evaluators, waits for terminal
        status, traverses all returned output items, and reports every metric.
        Structure the evaluation code so more evaluators can be added later.
      - Use an authenticated employee identity to isolate user conversations
        and restrict ingestion, unresolved-question review, evaluation, and
        cleanup operations to administrators.
      - Read project endpoints, model deployment names, identity settings, and
        other environment-specific settings from configuration. Authenticate
        to Azure services with Microsoft Entra credentials.
      - Handle unsuccessful terminal states, bounded polling, service errors,
        actionable diagnostics, and cleanup of created cloud resources.
      - Include meaningful automated tests for application behavior and failure
        paths using mocks or fakes so the tests run offline.
      - Include a Maven project manifest and concise compile, test, run, and
        cleanup commands.

      Treat the required Azure resources as pre-existing. The deliverable covers
      application code and runtime configuration; resource provisioning,
      infrastructure as code, and deployment automation are outside scope.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: solution
      scope: end-to-end-solution
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax. Trace
            concrete imports, client construction, SDK or REST calls, returned
            service identifiers, persistence operations, and
            route-to-orchestration call paths. Examples of methods and
            endpoints in the criteria are nonexclusive evidence, not mandatory
            spellings. Fail interfaces, configuration objects, mocks, comments,
            or disconnected snippets that are not exercised by the runnable
            application.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/implements-a-complete-runnable-support-application
              description: |-
                - Start a long-running Java 17 HTTP JSON API on a configurable port.
                - Route question, follow-up, feedback, ingestion, unresolved review, evaluation, and cleanup requests to production orchestration.
                - Provide a buildable Maven manifest and executable tests.
                - Document compile, test, run, and cleanup commands.
              weight: 1
              pass_threshold: 1
            - name: prompt/selects-coherent-current-foundry-and-azure-sdks
              description: |-
                - Connect a current supported Java client or project-scoped REST client to the configured Foundry project.
                - Generate answers through that project or its `/openai/v1` endpoint.
                - Run evaluations through a supported Foundry client or API.
                - Use documented request fields and invoke every declared Azure service client.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-a-foundry-managed-prompt-agent
              description: |-
                - Create a Foundry project prompt agent with the configured model and support instructions.
                - Bind its retrieval tool to the created retrieval resource.
                - Persist the service-returned agent identity with application-owned resource IDs.
                - Verify retrieval readiness before using that agent for grounded answers or evaluation cases.
                - Delete only the application-created agent, after its conversations and before referenced retrieval resources.
              weight: 1
              pass_threshold: 1
            - name: prompt/ingests-product-documentation-and-waits-for-retrieval-readiness
              description: |-
                - Ingest both supplied files from `materials/` into Foundry file search, Azure AI Search, or an equivalent grounded retrieval service.
                - Bind every uploaded document to the selected searchable resource.
                - Verify service-reported successful indexing before accepting questions.
                - Bound delayed readiness polling and fail on unsuccessful terminal state or timeout.
              weight: 1
              pass_threshold: 1
            - name: prompt/returns-grounded-answers-with-service-citations
              description: |-
                - Supply retrieved context through the managed agent's configured retrieval tool.
                - Parse source identifiers or citation annotations returned by retrieval or answer services.
                - Return references identifying supporting source files; do not hardcode filenames.
              weight: 1
              pass_threshold: 1
            - name: prompt/preserves-isolated-multi-turn-conversations
              description: |-
                - Key conversation state by authenticated `employeeId + conversationId`.
                - Persist and reuse a service conversation/thread ID, or persist turns and replay prior context.
                - Keep different employees and client conversation IDs isolated across restarts.
              weight: 1
              pass_threshold: 1
            - name: prompt/records-unsupported-questions-for-follow-up
              description: |-
                - Detect when retrieved documentation does not support an answer.
                - Return a clearly identified unsupported response.
                - Durably record the question, response ID, timestamp, and employee-scoped conversation key.
              weight: 1
              pass_threshold: 1
            - name: prompt/records-validated-response-specific-feedback
              description: |-
                - Load the persisted response identified by `responseId`.
                - Verify authenticated employee ownership and any supplied conversation scope.
                - Reject an unknown response or ownership/scope mismatch.
                - Durably persist the positive or negative rating linked to `responseId`.
              weight: 1
              pass_threshold: 1
            - name: prompt/runs-extensible-groundedness-and-relevance-evaluation
              description: |-
                - Submit a multi-case dataset to groundedness and relevance evaluators held in an extensible collection.
                - Configure evaluators and model deployment with the selected API's documented schema.
                - Generate each answer with the created managed agent and use retrieval-service results as evaluator context.
                - Wait for a successful terminal run state with bounded polling.
                - Traverse all output pages and report every returned metric.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-entra-identity-and-external-configuration
              description: |-
                - Read endpoints, deployment, identity, and environment-specific settings from configuration.
                - Use a `TokenCredential` to authenticate every Azure SDK or REST service call.
                - Derive `employeeId` from a validated Entra token or trusted platform principal.
                - Require an admin role or allowlist for ingestion, review, evaluation, and cleanup routes.
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-lifecycle-errors-and-bounded-waits
              description: |-
                - Use deadlines and delayed polling rather than tight or unbounded loops.
                - Handle failed, canceled, and timed-out ingestion or evaluation states.
                - Preserve selected SDK or structured REST status and service error details.
                - Return actionable diagnostics from service failures.
              weight: 1
              pass_threshold: 1
            - name: prompt/cleans-up-created-cloud-resources-safely
              description: |-
                - Delete only application-owned agent, conversation, and retrieval resources in dependency-safe order.
                - Preserve persisted ownership until each remote deletion succeeds.
                - Failed cleanup or replacement retains enough ownership state for retry.
              weight: 1
              pass_threshold: 1
            - name: prompt/includes-meaningful-offline-automated-tests
              description: |-
                - Executable `mvn test` tests exercise HTTP handlers and orchestration with mocked or fake Azure clients.
                - Test employee conversation isolation and follow-up context.
                - Test unknown or mismatched feedback rejection.
                - Test evaluator context derived from retrieval results.
                - Test atomic durable multi-record writes or failure recovery/compensation.
              weight: 1
              pass_threshold: 1
            - name: prompt/excludes-provisioning-and-deployment
              description: |-
                - Treat required Azure resources as pre-existing runtime configuration.
                - Do not add Bicep, ARM, Terraform, `az`/`azd` provisioning, or deployment workflows.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/*.json"
        - "**/*.jsonl"
        - "**/.env.example"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
        - "**/.data/**"
