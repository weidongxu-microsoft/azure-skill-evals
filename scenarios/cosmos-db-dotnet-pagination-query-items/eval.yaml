name: cosmos-db-dotnet-pagination-query-items
description: Compare Azure tooling for a Cosmos DB .NET pagination task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-dotnet-pagination
    prompt: |-
      Write a C# program that queries
      items in a Cosmos DB container with proper pagination:
      1. Execute a SQL query "SELECT * FROM c WHERE c.category = 'electronics'" against a container
      2. Process results page-by-page using FeedIterator, limiting each page to 50 items
      3. Print the continuation token after each page
      4. Implement a "resume from token" pattern where the query can restart from a saved token
      5. Track total RU consumption across all pages
      
      Use the Microsoft.Azure.Cosmos SDK v3. Show how to configure MaxItemCount
      and explain the difference between FeedIterator and LINQ-based queries.
    tags:
      service: cosmos-db
      plane: data-plane
      language: dotnet
      category: pagination
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/container-getitemqueryiterator-t-with-querydefinition
              description: |-
                `Container.GetItemQueryIterator<T>()` with `QueryDefinition`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/queryrequestoptions-maxitemcount-for-page-size-control
              description: |-
                `QueryRequestOptions.MaxItemCount` for page size control
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/feediterator-t-hasmoreresults-and-readnextasync-loop-pat
              description: |-
                `FeedIterator<T>.HasMoreResults` and `ReadNextAsync()` loop pattern
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/feedresponse-t-continuationtoken-for-resumable-paginatio
              description: |-
                `FeedResponse<T>.ContinuationToken` for resumable pagination
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/passing-continuation-token-to-resume-a-query
              description: |-
                Passing continuation token to resume a query
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/feedresponse-t-requestcharge-for-ru-tracking
              description: |-
                `FeedResponse<T>.RequestCharge` for RU tracking
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/cross-partition-query-considerations
              description: |-
                Cross-partition query considerations
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/linq-alternative-via-getitemlinqqueryable-t
              description: |-
                LINQ alternative via `GetItemLinqQueryable<T>()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
