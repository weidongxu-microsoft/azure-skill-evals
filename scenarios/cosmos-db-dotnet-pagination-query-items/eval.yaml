name: cosmos-db-dotnet-pagination-query-items
description: Compare Azure tooling for a Cosmos DB .NET pagination task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-dotnet-pagination
    prompt: |-
      Write a runnable C# console application that queries items in an Azure Cosmos DB NoSQL container with proper pagination.

      Write the code to files. Do not reply with code blocks.

      1. Query items whose category is "electronics" using `SELECT * FROM c WHERE c.category = ...`. A parameterized `QueryDefinition` is preferred.
      2. Process results page by page with `FeedIterator<T>` and `ReadNextAsync()`.
      3. Set `QueryRequestOptions.MaxItemCount` to 50 for the iterator.
      4. Print the continuation token returned by every page.
      5. Accept a previously saved continuation token and pass it to `GetItemQueryIterator<T>` so the query can resume.
      6. Accumulate and print the total request charge across all pages.
      7. Briefly explain when direct `FeedIterator<T>` pagination is preferable to starting from `GetItemLinqQueryable<T>()`.

      Target net8.0 and use Microsoft.Azure.Cosmos version 3.62.1 and
      Newtonsoft.Json version 13.0.4 exactly.
    tags:
      service: cosmos-db
      plane: data-plane
      language: dotnet
      category: pagination
    graders:
      - type: run-command
        name: prompt/cosmos-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-pagination-query-items/tools/check-cosmos-dotnet-pagination.mjs
            - prompt/cosmos-manifest
      - type: run-command
        name: prompt/category-query
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-pagination-query-items/tools/check-cosmos-dotnet-pagination.mjs
            - prompt/category-query
      - type: run-command
        name: prompt/page-size
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-pagination-query-items/tools/check-cosmos-dotnet-pagination.mjs
            - prompt/page-size
      - type: run-command
        name: prompt/feed-pagination
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-pagination-query-items/tools/check-cosmos-dotnet-pagination.mjs
            - prompt/feed-pagination
      - type: run-command
        name: prompt/continuation-resume
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-pagination-query-items/tools/check-cosmos-dotnet-pagination.mjs
            - prompt/continuation-resume
      - type: run-command
        name: prompt/request-charge-total
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-pagination-query-items/tools/check-cosmos-dotnet-pagination.mjs
            - prompt/request-charge-total
      - type: run-command
        name: language/project-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/project-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/async-await
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/client-lifecycle
    environment:
      files:
        - src: tools/check-cosmos-dotnet-pagination.mjs
          dest: .vally/scenarios/cosmos-db-dotnet-pagination-query-items/tools/check-cosmos-dotnet-pagination.mjs
        - src: tools/cosmos-dotnet-pagination-rules.mjs
          dest: .vally/scenarios/cosmos-db-dotnet-pagination-query-items/tools/cosmos-dotnet-pagination-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
