name: identity-go-managed-identity-auth
description: Compare Azure tooling for managed identity authentication in Go
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-go-managed-identity
    prompt: |-
      Show me how to use
      Managed Identity to authenticate Azure SDK clients in Go. Cover:
      1. System-assigned vs user-assigned managed identity
      2. How to create a ManagedIdentityCredential for each type
      3. Using it with Azure SDK clients
      4. Local development fallback strategies
      5. Error handling and troubleshooting

      Provide Go examples for both identity types.
    tags:
      service: identity
      plane: data-plane
      language: go
      category: auth
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/managed-identity-credential
              description: |-
                `azidentity.NewManagedIdentityCredential()` function
              weight: 1
              pass_threshold: 1
            - name: prompt/system-assigned-options
              description: |-
                System-assigned: nil options
              weight: 1
              pass_threshold: 1
            - name: prompt/user-assigned-client-id
              description: |-
                User-assigned: `ManagedIdentityCredentialOptions{ID: azidentity.ClientID("...")}`
              weight: 1
              pass_threshold: 1
            - name: prompt/default-azure-credential-chain
              description: |-
                Integration with `DefaultAzureCredential` chain
              weight: 1
              pass_threshold: 1
            - name: prompt/non-azure-error-handling
              description: |-
                Error handling when not running in Azure
              weight: 1
              pass_threshold: 1
            - name: prompt/chained-token-credential
              description: |-
                `azidentity.NewChainedTokenCredential()` for fallback
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/go-project-tests
        config:
          command: go
          args:
            - test
            - -mod=readonly
            - ./...
          timeout: 3m
artifacts:
  include:
    - "**/*.go"
    - "**/go.mod"
    - "**/go.sum"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/vendor/**"
    - "**/.cache/**"
    - "**/*.test"
    - "**/coverage.out"
