name: identity-java-credential-chain
description: Compare Azure tooling for environment-specific Java credential chains
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-java-credential-chain
    prompt: |-
      Create a small Java 17 Maven project that demonstrates how to correctly build Azure credential chains tailored to different deployment environments — local development, CI/CD pipelines, and production.
      
      The project needs:
      
      - A **credential factory class** that builds the appropriate Azure credential for each environment. For local development, it should chain together credentials that work from developer tools (CLI, IDE plugins, etc.). For CI pipelines, it should support credentials sourced from pipeline environment variables or Azure Pipelines service connections. For production, it should prefer managed identity (supporting both system-assigned and user-assigned, where the user-assigned identity's client ID comes from an environment variable), with workload identity as a fallback for Kubernetes scenarios. The factory should also support enabling Continuous Access Evaluation (CAE) on the credentials, which lets Azure revoke tokens mid-session for security events.
      
      - An **environment detector class** that auto-detects which environment the app is running in by probing for well-known environment variables (e.g., CI pipeline workspace variables, managed identity endpoint availability). It should classify the environment as dev, CI, or production.
      
      - A **connectivity tester class** (both sync and async versions) that verifies a credential works by requesting a token for a given Azure scope. It should print success/failure, the token's expiry time, and whether the token is CAE-enabled. It should handle and report the specific failure reason if authentication fails (expired cert, wrong tenant, no identity available, etc.) rather than just printing a generic error.
      
      - A **Main class** that detects the current environment, builds the right credential, and runs the connectivity test against Azure Resource Manager using the sync tester first, then repeats with the async tester. Print the detected environment, the selected credential strategy, and the test results from both.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: identity
      plane: data-plane
      language: java
      category: authentication
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/uses-chainedtokencredentialbuilder-to-compose-multiple-c
              description: |-
                Uses `ChainedTokenCredentialBuilder` to compose multiple credentials
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/credentials-added-via-addlast-order-matters-environment
              description: |-
                Credentials added via `.addLast()` — order matters ### Environment-Specific Chains
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/dev-chain-includes-azureclicredential-may-include-intell
              description: |-
                **Dev chain**: includes `AzureCliCredential`; may include `IntelliJCredential`, `VisualStudioCodeCredential`, `AzurePowerShellCredential`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/ci-chain-uses-environmentcredential-or-azurepipelinescre
              description: |-
                **CI chain**: uses `EnvironmentCredential` or `AzurePipelinesCredential` (not just `DefaultAzureCredential`)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/production-chain-managedidentitycredential-first-support
              description: |-
                **Production chain**: `ManagedIdentityCredential` first (supports user-assigned via `clientId()`), `WorkloadIdentityCredential` as fallback ### CAE Support
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/enables-cae-via-tokenrequestcontext-setcaeenabled-true-o
              description: |-
                Enables CAE via `TokenRequestContext.setCaeEnabled(true)` or `enableCae()` on credential builders ### Environment Detection
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/detects-ci-checks-ci-tf-build-azure-pipeline-workspace-o
              description: |-
                Detects CI (checks `CI`, `TF_BUILD`, `AZURE_PIPELINE_WORKSPACE`, or similar)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/detects-production-managed-identity-checks-identity-endp
              description: |-
                Detects production/managed identity (checks `IDENTITY_ENDPOINT`, `MSI_ENDPOINT`, or similar)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/falls-back-to-dev-if-neither-detected-token-request-test
              description: |-
                Falls back to dev if neither detected ### Token Request & Testing
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/creates-tokenrequestcontext-with-correct-scope-https-man
              description: |-
                Creates `TokenRequestContext` with correct scope (`https://management.azure.com/.default`)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/calls-gettoken-and-prints-token-expiry-from-accesstoken
              description: |-
                Calls `getToken()` and prints token expiry from `AccessToken.getExpiresAt()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handles-failure-with-specific-exception-info-scenario-sp
              description: |-
                Handles failure with specific exception info ### Scenario-Specific Async
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/async-tester-uses-reactive-gettoken-returning-mono-acces
              description: |-
                Async tester uses reactive `getToken()` returning `Mono<AccessToken>` ### Anti-Patterns (scenario-specific)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/not-using-defaultazurecredential-as-the-ci-credential-to
              description: |-
                NOT using `DefaultAzureCredential` as the CI credential (too broad)
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-dependencies-com-azure-not-com-microsoft-azure
              description: |-
                Uses com.azure group ID for all Azure SDK packages. No com.microsoft.azure (legacy SDK) dependencies. Includes azure-identity for authentication.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-sdk-bom-for-version-management
              description: |-
                Uses azure-sdk-bom in dependencyManagement to manage Azure SDK versions instead of hardcoding individual artifact versions. Dependencies should omit <version> tags when managed by the BOM.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-imports-no-legacy-no-internal-packages
              description: |-
                All imports use com.azure.* packages. No com.microsoft.azure.* (legacy) or com.azure.*.implementation.* (internal API) imports.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-authentication
              description: |-
                Uses DefaultAzureCredential or another com.azure.identity credential. No hardcoded connection strings, account keys, SAS tokens, or secrets.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/client-builder-pattern
              description: |-
                SDK clients constructed using *ClientBuilder classes with .endpoint() or .vaultUrl() and .credential(). No legacy constructors (CloudStorageAccount, DocumentClient, KeyVaultClient).
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/no-deprecated-legacy-classes
              description: |-
                No deprecated classes from the old SDK (CloudStorageAccount, CloudBlobClient, DocumentClient, QueueClient, ApplicationTokenCredentials, MSICredentials, ConnectionStringBuilder).
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/pagination-pagediterable-pagedflux
              description: |-
                List/query operations return PagedIterable (sync) or PagedFlux (async). Does not flatten all pages into a raw List or Stream in memory.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/lro-pattern-syncpoller-pollerflux
              description: |-
                Long-running operations use SyncPoller (sync) or PollerFlux (async) with begin* method prefix. No Thread.sleep() polling loops.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-uses-project-reactor-mono-flux
              description: |-
                Async code uses Project Reactor types (Mono, Flux). Not CompletableFuture (wrong), not RxJava (wrong), not sync wrapped in ExecutorService. No .block() inside async service implementations.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/service-specific-exception-handling
              description: |-
                Catches service-specific exceptions (BlobStorageException, CosmosException, ServiceBusException, HttpResponseException) with status code inspection. Not just generic Exception catches.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/code-compiles-mvn-compile-gradle-compilejava
              description: |-
                The generated code compiles without errors. Attempt build verification if build tools are available.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/try-with-resources-for-clients
              description: |-
                All Azure SDK client instances that implement AutoCloseable are used within try-with-resources blocks or explicitly closed in a finally block.
              weight: 1
              pass_threshold: 1
              required: true
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
