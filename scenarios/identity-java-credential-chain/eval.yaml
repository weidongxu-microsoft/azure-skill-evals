name: identity-java-credential-chain
description: Compare Azure tooling for environment-specific Java credential chains
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-java-credential-chain
    prompt: |-
      Create a small Java 17 Maven project that demonstrates how to correctly build Azure credential chains tailored to different deployment environments — local development, CI/CD pipelines, and production.
      
      The project needs:
      
      - A **credential factory class** that builds the appropriate Azure credential for each environment. For local development, it should chain together credentials that work from developer tools (CLI, IDE plugins, etc.). For CI pipelines, it should support credentials sourced from pipeline environment variables or Azure Pipelines service connections. For production, it should prefer managed identity (supporting both system-assigned and user-assigned, where the user-assigned identity's client ID comes from an environment variable), with workload identity as a fallback for Kubernetes scenarios. The factory should also support enabling Continuous Access Evaluation (CAE) on the credentials, which lets Azure revoke tokens mid-session for security events.
      
      - An **environment detector class** that auto-detects which environment the app is running in by probing for well-known environment variables (e.g., CI pipeline workspace variables, managed identity endpoint availability). It should classify the environment as dev, CI, or production.
      
      - A **connectivity tester class** (both sync and async versions) that verifies a credential works by requesting a token for a given Azure scope. It should print success/failure, the token's expiry time, and whether the token is CAE-enabled. It should handle and report the specific failure reason if authentication fails (expired cert, wrong tenant, no identity available, etc.) rather than just printing a generic error.
      
      - A **Main class** that detects the current environment, builds the right credential, and runs the connectivity test against Azure Resource Manager using the sync tester first, then repeats with the async tester. Print the detected environment, the selected credential strategy, and the test results from both.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: identity
      plane: data-plane
      language: java
      category: authentication
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/uses-chainedtokencredentialbuilder-to-compose-multiple-c
              description: |-
                - Compose a credential chain from multiple credential sources.
                - The selected environment chooses the appropriate chain strategy.
                - Equivalent current Java identity APIs may implement the chain.
              weight: 1
              pass_threshold: 1
            - name: prompt/credentials-added-via-addlast-order-matters-environment
              description: |-
                - Credential attempts follow a deliberate documented order.
                - The chain stops at the first credential that successfully returns a token.
                - Reordering must not change the intended environment strategy.
              weight: 1
              pass_threshold: 1
            - name: prompt/dev-chain-includes-azureclicredential-may-include-intell
              description: |-
                - Local development strategy includes Azure CLI or another developer-tool credential.
                - Additional IDE or PowerShell credentials may participate in a documented order.
                - Local credentials are not used for production when hosted identity is detected.
              weight: 1
              pass_threshold: 1
            - name: prompt/ci-chain-uses-environmentcredential-or-azurepipelinescre
              description: |-
                - CI strategy uses pipeline-provided credentials or environment credentials.
                - Azure Pipelines inputs flow into `AzurePipelinesCredential` when that path is selected.
                - Do not use broad `DefaultAzureCredential` as the only CI-specific strategy.
              weight: 1
              pass_threshold: 1
            - name: prompt/production-chain-managedidentitycredential-first-support
              description: |-
                - Production strategy attempts managed identity before workload identity.
                - System-assigned managed identity is supported.
                - User-assigned managed identity client ID can come from configuration.
              weight: 1
              pass_threshold: 1
            - name: prompt/cae-request-and-output
              description: |-
                - The token request enables CAE through a supported current API such as `TokenRequestContext.setCaeEnabled(true)`.
                - CAE can be enabled or disabled by the factory/test configuration.
                - Prints whether CAE was requested for the acquired token.
              weight: 1
              pass_threshold: 1
            - name: prompt/detects-ci-checks-ci-tf-build-azure-pipeline-workspace-o
              description: |-
                - Detect CI from environment indicators such as `CI`, `TF_BUILD`, or pipeline workspace values.
                - CI detection selects the CI credential strategy.
                - Print or expose the detected CI environment.
              weight: 1
              pass_threshold: 1
            - name: prompt/detects-production-managed-identity-checks-identity-endp
              description: |-
                - Detect hosted production from managed-identity or workload-identity indicators.
                - Production detection selects the hosted credential strategy.
                - Print or expose the detected production environment.
              weight: 1
              pass_threshold: 1
            - name: prompt/falls-back-to-dev-if-neither-detected-token-request-test
              description: |-
                - If CI and hosted indicators are absent, select local development.
                - Local selection uses the developer credential strategy.
                - Print or expose the local-development selection.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-tokenrequestcontext-with-correct-scope-https-man
              description: |-
                - Token request uses scope `https://management.azure.com/.default`.
                - The same scope is used for sync and async connectivity tests.
                - CAE settings are applied when enabled by configuration.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-gettoken-and-prints-token-expiry-from-accesstoken
              description: |-
                - Synchronous token acquisition is executed with the selected credential.
                - Successful token result -> print success and token expiry.
                - Do not print token secret material.
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-failure-with-specific-exception-info-scenario-sp
              description: |-
                - Authentication failures preserve identity-specific exception details or causes.
                - Unavailable credentials are distinguishable from rejected credentials.
                - Diagnostics do not expose tokens or secrets.
              weight: 1
              pass_threshold: 1
            - name: prompt/async-connectivity-test
              description: |-
                - Requests the same Resource Manager scope through the asynchronous token API.
                - Consumes the supported reactive result to completion and prints success plus expiry.
                - Reports specific asynchronous authentication failures without wrapping a synchronous tester in an executor.
              weight: 1
              pass_threshold: 1
            - name: prompt/not-using-defaultazurecredential-as-the-ci-credential-to
              description: |-
                - CI mode has an explicit CI credential strategy.
                - `DefaultAzureCredential` alone is not the CI-specific implementation.
                - Alternative CI credentials remain valid when configured from pipeline inputs.
              weight: 1
              pass_threshold: 1
            - name: prompt/detected-strategy-demo
              description: |-
                - Detected environment -> matching credential strategy.
                - Prints the selected strategy.
                - Runs and prints the synchronous test before the asynchronous test.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/reactive-async-service-flow
              description: |-
                - Prompt-required async Azure operations originate from async SDK clients or documented async adapters.
                - Compose reusable async flows with Reactor `Mono`/`Flux` or equivalent nonblocking composition.
                - Do not wrap synchronous clients in an executor or block inside reusable async service methods.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
