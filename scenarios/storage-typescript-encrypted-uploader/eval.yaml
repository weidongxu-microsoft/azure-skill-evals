name: storage-typescript-encrypted-uploader
description: Compare Azure tooling for a TypeScript encrypted Blob uploader task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-js-ts-encrypted-uploader
    prompt: |-
      Create a TypeScript Node.js project that uploads files to Azure Blob Storage with client-side encryption, where the encryption key material is managed in Azure Key Vault.

      The project needs:

      - A **key management class** that interacts with Azure Key Vault's Keys service (not Secrets) to perform cryptographic operations. It should implement envelope encryption: generate a data encryption key locally, use Key Vault to protect (wrap) it, and store the protected key alongside the encrypted blob. For decryption, have Key Vault recover (unwrap) the data key, then decrypt locally. The raw data key should never be persisted anywhere, and the vault's key material should never leave Key Vault.

      - A **blob uploader/downloader class** that handles the actual encryption and storage. For upload: generate a data key, encrypt the data locally using AES-GCM, protect the data key via Key Vault, then upload the ciphertext to Blob Storage with the protected key and any necessary cryptographic parameters stored as blob metadata (including the initialization vector and the authentication tag, which in Node.js is separate from the ciphertext). For download: read the blob and its metadata, recover the data key via Key Vault, and decrypt. Should handle errors from both services (e.g., the vault key may have been disabled, or the blob may not exist).

      - A **configuration module** that builds the necessary Azure connections for both Blob Storage and Key Vault. It should read endpoints from environment variables and authenticate with managed identity. All connections should share a single credential instance.

      - A **main script** that demos the full encrypt-upload-download-decrypt round-trip: encrypts and uploads a sample string, then downloads and decrypts it back. Print the vault key ID used, the wrapped DEK (base64), and the decrypted output to verify the round-trip.

      Include a complete `package.json` with the necessary Azure SDK dependencies and a `tsconfig.json`.

      Write the code to files. Do not reply with code blocks.
    tags:
      service: storage
      plane: data-plane
      language: typescript
      category: crud
    graders:
      - type: run-command
        name: prompt/packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-encrypted-uploader/tools/check-encrypted-uploader-typescript.mjs
            - prompt/packages
      - type: run-command
        name: prompt/key-vault-envelope-encryption
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-encrypted-uploader/tools/check-encrypted-uploader-typescript.mjs
            - prompt/key-vault-envelope-encryption
      - type: run-command
        name: prompt/encrypted-blob-metadata
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-encrypted-uploader/tools/check-encrypted-uploader-typescript.mjs
            - prompt/encrypted-blob-metadata
      - type: run-command
        name: prompt/decrypt-path
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-encrypted-uploader/tools/check-encrypted-uploader-typescript.mjs
            - prompt/decrypt-path
      - type: run-command
        name: prompt/managed-identity-configuration
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-encrypted-uploader/tools/check-encrypted-uploader-typescript.mjs
            - prompt/managed-identity-configuration
      - type: run-command
        name: prompt/rest-error-handling
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-encrypted-uploader/tools/check-encrypted-uploader-typescript.mjs
            - prompt/rest-error-handling
      - type: run-command
        name: prompt/connected-round-trip
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-encrypted-uploader/tools/check-encrypted-uploader-typescript.mjs
            - prompt/connected-round-trip
      - type: run-command
        name: language/package-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/package-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/async-await
      - type: run-command
        name: language/typescript-config
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/typescript-config
    environment:
      files:
        - src: tools/check-encrypted-uploader-typescript.mjs
          dest: .vally/scenarios/storage-typescript-encrypted-uploader/tools/check-encrypted-uploader-typescript.mjs
        - src: tools/source-manifest.mjs
          dest: .vally/scenarios/storage-typescript-encrypted-uploader/tools/source-manifest.mjs
        - src: tools/encrypted-uploader-typescript-rules.mjs
          dest: .vally/scenarios/storage-typescript-encrypted-uploader/tools/encrypted-uploader-typescript-rules.mjs
        - src: ../../languages/typescript/check.mjs
          dest: .vally/languages/typescript/check.mjs
        - src: ../../languages/typescript/checks.mjs
          dest: .vally/languages/typescript/checks.mjs
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
