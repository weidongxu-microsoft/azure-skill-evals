name: storage-typescript-encrypted-uploader
description: Compare Azure tooling for a TypeScript encrypted Blob uploader task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-js-ts-encrypted-uploader
    prompt: |-
      Create a TypeScript Node.js project that uploads files to Azure Blob Storage with client-side encryption, where the encryption key material is managed in Azure Key Vault.
      
      The project needs:
      
      - A **key management class** that interacts with Azure Key Vault's Keys service (not Secrets) to perform cryptographic operations. It should implement envelope encryption: generate a data encryption key locally, use Key Vault to protect (wrap) it, and store the protected key alongside the encrypted blob. For decryption, have Key Vault recover (unwrap) the data key, then decrypt locally. The raw data key should never be persisted anywhere, and the vault's key material should never leave Key Vault.
      
      - A **blob uploader/downloader class** that handles the actual encryption and storage. For upload: generate a data key, encrypt the data locally using AES-GCM, protect the data key via Key Vault, then upload the ciphertext to Blob Storage with the protected key and any necessary cryptographic parameters stored as blob metadata (including the initialization vector and the authentication tag, which in Node.js is separate from the ciphertext). For download: read the blob and its metadata, recover the data key via Key Vault, and decrypt. Should handle errors from both services (e.g., the vault key may have been disabled, or the blob may not exist).
      
      - A **configuration module** that builds the necessary Azure connections for both Blob Storage and Key Vault. It should read endpoints from environment variables and authenticate with managed identity. All connections should share a single credential instance.
      
      - A **main script** that demos the full encrypt-upload-download-decrypt round-trip: encrypts and uploads a sample string, then downloads and decrypts it back. Print the vault key ID used, the wrapped DEK (base64), and the decrypted output to verify the round-trip.
      
      Include a complete `package.json` with the necessary Azure SDK dependencies and a `tsconfig.json`.
    tags:
      service: storage
      plane: data-plane
      language: typescript
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/uses-azure-keyvault-keys-keys-not-secrets-critical-disti
              description: |-
                Uses `@azure/keyvault-keys` (Keys, NOT Secrets) — critical distinction
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-node-js-built-in-crypto-module-for-local-aes-gcm-en
              description: |-
                Uses Node.js built-in `crypto` module for local AES-GCM encryption ### Client Construction (scenario-specific)
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-keyclient-for-key-management-and-cryptographyclient
              description: |-
                Uses `KeyClient` for key management and `CryptographyClient` for wrap/unwrap operations (NOT `SecretClient`)
              weight: 1
              pass_threshold: 1
            - name: prompt/constructs-cryptographyclient-with-the-key-id-or-key-nam
              description: |-
                Constructs `CryptographyClient` with the key ID or key name ### Key Vault Keys Patterns (critical)
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-cryptographyclient-for-wrapkey-and-unwrapkey-operat
              description: |-
                Uses `CryptographyClient` for `wrapKey()` and `unwrapKey()` operations
              weight: 1
              pass_threshold: 1
            - name: prompt/specifies-rsa-key-wrap-algorithm-e-g-rsa-oaep-or-rsa-oae
              description: |-
                Specifies RSA key wrap algorithm (e.g., `"RSA-OAEP"` or `"RSA-OAEP-256"`)
              weight: 1
              pass_threshold: 1
            - name: prompt/key-material-never-leaves-key-vault-wrap-unwrap-is-serve
              description: |-
                Key material never leaves Key Vault (wrap/unwrap is server-side) ### Envelope Encryption Patterns (critical)
              weight: 1
              pass_threshold: 1
            - name: prompt/generates-a-random-aes-256-dek-locally-32-bytes-via-cryp
              description: |-
                Generates a random AES-256 DEK locally (32 bytes via `crypto.randomBytes`)
              weight: 1
              pass_threshold: 1
            - name: prompt/encrypts-data-with-aes-gcm-locally-using-the-dek-crypto
              description: |-
                Encrypts data with AES-GCM locally using the DEK (`crypto.createCipheriv("aes-256-gcm", ...)`)
              weight: 1
              pass_threshold: 1
            - name: prompt/wraps-the-dek-via-key-vault-wrapkey
              description: |-
                Wraps the DEK via Key Vault `wrapKey()`
              weight: 1
              pass_threshold: 1
            - name: prompt/stores-wrapped-dek-as-blob-metadata-base64-encoded
              description: |-
                Stores wrapped DEK as blob metadata (base64-encoded)
              weight: 1
              pass_threshold: 1
            - name: prompt/stores-iv-initialization-vector-in-blob-metadata-base64
              description: |-
                Stores IV (initialization vector) in blob metadata (base64-encoded)
              weight: 1
              pass_threshold: 1
            - name: prompt/stores-gcm-auth-tag-in-blob-metadata-base64-encoded-in-n
              description: |-
                Stores GCM auth tag in blob metadata (base64-encoded) — in Node.js the auth tag is separate from ciphertext
              weight: 1
              pass_threshold: 1
            - name: prompt/stores-vault-key-identifier-in-blob-metadata
              description: |-
                Stores vault key identifier in blob metadata
              weight: 1
              pass_threshold: 1
            - name: prompt/for-decryption-retrieves-wrapped-dek-from-metadata-unwra
              description: |-
                For decryption: retrieves wrapped DEK from metadata, unwraps via Key Vault, sets auth tag via `decipher.setAuthTag()`, decrypts locally ### AES-GCM (Node.js specific)
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-aes-gcm-not-aes-cbc-aes-ecb-or-other-modes
              description: |-
                Uses AES-GCM (not AES-CBC, AES-ECB, or other modes)
              weight: 1
              pass_threshold: 1
            - name: prompt/generates-random-iv-for-each-encryption-typically-12-byt
              description: |-
                Generates random IV for each encryption (typically 12 bytes for GCM)
              weight: 1
              pass_threshold: 1
            - name: prompt/retrieves-auth-tag-via-cipher-getauthtag-after-encryptio
              description: |-
                Retrieves auth tag via `cipher.getAuthTag()` after encryption finalize
              weight: 1
              pass_threshold: 1
            - name: prompt/sets-auth-tag-via-decipher-setauthtag-before-decryption
              description: |-
                Sets auth tag via `decipher.setAuthTag()` before decryption finalize ### Scenario-Specific Error Handling
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-key-vault-errors-key-disabled-key-not-found-via
              description: |-
                Handles Key Vault errors (key disabled, key not found) via RestError
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-storage-errors-blob-not-found-via-resterror-with
              description: |-
                Handles Storage errors (blob not found) via RestError with statusCode ### Anti-Patterns (scenario-specific)
              weight: 1
              pass_threshold: 1
            - name: prompt/not-using-secretclient-instead-of-keyclient-cryptography
              description: |-
                NOT using `SecretClient` instead of `KeyClient`/`CryptographyClient`
              weight: 1
              pass_threshold: 1
            - name: prompt/not-encrypting-data-directly-with-the-vault-key-should-b
              description: |-
                NOT encrypting data directly with the vault key (should be envelope encryption)
              weight: 1
              pass_threshold: 1
            - name: prompt/not-storing-raw-dek-in-plaintext
              description: |-
                NOT storing raw DEK in plaintext
              weight: 1
              pass_threshold: 1
            - name: prompt/not-omitting-the-gcm-auth-tag-from-blob-metadata-decrypt
              description: |-
                NOT omitting the GCM auth tag from blob metadata (decryption will fail)
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
