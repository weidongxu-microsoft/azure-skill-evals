name: identity-dotnet-service-principal-auth
description: Compare Azure tooling for service principal authentication in .NET
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-dotnet-service-principal
    prompt: |-
      Show me how to authenticate
      to Azure using a Service Principal with client secret in C#. I need:
      1. Required NuGet packages
      2. How to create a ClientSecretCredential with tenant ID, client ID, and client secret
      3. How to use it with an Azure SDK client (e.g., BlobServiceClient)
      4. Best practices for storing the secret (environment variables vs configuration)
      5. Error handling when credentials are invalid
      
      Provide a complete example with proper error handling.
    tags:
      service: identity
      plane: data-plane
      language: dotnet
      category: auth
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - diff
          criteria:
            - name: prompt/azure-identity-package-with-clientsecretcredential-class
              description: |-
                `Azure.Identity` package with `ClientSecretCredential` class
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/constructor-parameters-tenantid-clientid-clientsecret
              description: |-
                Constructor parameters: tenantId, clientId, clientSecret
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/passing-credential-to-azure-sdk-clients
              description: |-
                Passing credential to Azure SDK clients
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/environment-variable-patterns-for-secret-storage
              description: |-
                Environment variable patterns for secret storage
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/authenticationfailedexception-for-invalid-credentials
              description: |-
                `AuthenticationFailedException` for invalid credentials
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
