name: identity-java-service-principal-auth
description: Compare Azure tooling for service principal authentication in Java
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-java-service-principal
    prompt: |-
      Show me how to authenticate
      to Azure using a Service Principal with client secret in Java. I need:
      1. Required Maven dependencies
      2. How to create a ClientSecretCredential with ClientSecretCredentialBuilder
      3. Using it with an Azure SDK client
      4. Best practices for secret management
      5. Error handling for invalid credentials
      
      Provide a complete example with proper exception handling.
    tags:
      service: identity
      plane: data-plane
      language: java
      category: authentication
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/service-principal-dependency
              description: |-
                - Declares a current `com.azure:azure-identity` dependency.
                - Uses a compatible direct version or compatible Azure SDK BOM.
              weight: 1
              pass_threshold: 1
            - name: prompt/client-secret-credential-value-flow
              description: |-
                - Tenant ID, client ID, and client secret come from injected runtime configuration or an external secret store.
                - Those exact values flow into `ClientSecretCredentialBuilder`.
                - The resulting `ClientSecretCredential` is built without embedding or logging the secret.
              weight: 1
              pass_threshold: 1
            - name: prompt/service-principal-client-integration
              description: |-
                - The constructed `ClientSecretCredential` is passed to a real public Azure SDK client.
                - The client receives its required endpoint or resource value from runtime configuration.
              weight: 1
              pass_threshold: 1
            - name: prompt/client-secret-management
              description: |-
                - Keeps the client secret out of source control and console output.
                - Documents secret injection or retrieval from a managed secret store.
                - Recommends rotation and least-privilege access.
              weight: 1
              pass_threshold: 1
            - name: prompt/service-principal-authentication-errors
              description: |-
                - Handles `ClientAuthenticationException` for rejected credentials.
                - Allows `CredentialUnavailableException` when required credential inputs are unavailable.
                - Reports actionable failure details while preserving causes and redacting secrets.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
