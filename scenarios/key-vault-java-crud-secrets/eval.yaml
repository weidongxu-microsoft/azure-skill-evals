name: key-vault-java-crud-secrets
description: Compare Azure tooling for a Key Vault Java secrets CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-java-crud
    prompt: |-
      Write a Java application that performs
      all four CRUD operations on Azure Key Vault secrets:
      1. Create a new secret called "my-secret" with value "my-secret-value"
      2. Read the secret back and print its value
      3. Update the secret to a new value "updated-value"
      4. Delete the secret and purge it (soft-delete enabled vault)
      
      Use DefaultAzureCredential for authentication. Show the Maven dependency
      for azure-security-keyvault-secrets and azure-identity. Include proper exception handling.
    tags:
      service: key-vault
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/key-vault-project-and-client
              description: |-
                - Declare `azure-security-keyvault-secrets` and `azure-identity` Maven dependencies.
                - Read the vault URL from external configuration.
                - Build the secrets client with `DefaultAzureCredential`.
              weight: 1
              pass_threshold: 1
            - name: prompt/create-and-read-secret
              description: |-
                - Create `my-secret` with value `my-secret-value`.
                - Read `my-secret` back from Key Vault.
                - Print the retrieved value.
              weight: 1
              pass_threshold: 1
            - name: prompt/update-secret
              description: |-
                - Update `my-secret` to `updated-value`.
                - Preserve the exact secret name while creating the new version.
              weight: 1
              pass_threshold: 1
            - name: prompt/delete-and-purge-secret
              description: |-
                - Start deletion of `my-secret` and wait for deletion to complete.
                - Purge the deleted secret only after it reaches the deleted state.
                - Ensure the purge request completes successfully.
              weight: 1
              pass_threshold: 1
            - name: prompt/key-vault-error-handling
              description: |-
                - Handle Key Vault or HTTP service failures around CRUD operations.
                - Report actionable status or service error details when available.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Compatible BOM-covered GA Azure artifacts omit explicit versions.
                - Explicit versions are limited to preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` packages.
                - Do not import legacy `com.microsoft.azure.*` or Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Do not depend on deprecated, removed, or implementation-only Azure types.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
