name: key-vault-java-crud-secrets
description: Compare Azure tooling for a Key Vault Java secrets CRUD task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-java-crud
    prompt: |-
      Write a Java 17 application that performs all four CRUD operations on Azure Key Vault secrets.

      Write the code to files. Do not reply with code blocks.

      1. Create a SecretClient with SecretClientBuilder and DefaultAzureCredential.
      2. Create a secret named "my-secret" with value "my-secret-value".
      3. Get that secret and print the retrieved value.
      4. Update that secret to "updated-value".
      5. Begin deleting that secret, use the returned SyncPoller to wait for completion, and only then purge the same deleted secret.

      Include a Maven manifest using azure-identity 1.18.5 and
      azure-security-keyvault-secrets 4.11.2. Handle HttpResponseException
      meaningfully without swallowing failures.
    tags:
      service: key-vault
      plane: data-plane
      language: java
      category: crud
    graders:
      - type: run-command
        name: prompt/sdk-dependencies
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
            - prompt/sdk-dependencies
      - type: run-command
        name: prompt/client-authentication
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
            - prompt/client-authentication
      - type: run-command
        name: prompt/create-secret
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
            - prompt/create-secret
      - type: run-command
        name: prompt/read-and-print
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
            - prompt/read-and-print
      - type: run-command
        name: prompt/update-secret
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
            - prompt/update-secret
      - type: run-command
        name: prompt/delete-secret
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
            - prompt/delete-secret
      - type: run-command
        name: prompt/wait-and-purge
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
            - prompt/wait-and-purge
      - type: run-command
        name: prompt/http-response-exception
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
            - prompt/http-response-exception
    environment:
      files:
        - src: tools/check-key-vault-java.mjs
          dest: .vally/scenarios/key-vault-java-crud-secrets/tools/check-key-vault-java.mjs
        - src: tools/key-vault-java-rules.mjs
          dest: .vally/scenarios/key-vault-java-crud-secrets/tools/key-vault-java-rules.mjs
        - src: ../../languages/java/checks.mjs
          dest: .vally/languages/java/checks.mjs
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
