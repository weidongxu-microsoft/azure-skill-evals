name: service-bus-java-send-receive-messages
description: Compare Azure tooling for a Service Bus Java send and receive task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: service-bus-dp-java-send-receive
    prompt: |-
      Write a Java program that demonstrates
      messaging with Azure Service Bus:
      1. Create a ServiceBusSenderClient using ServiceBusClientBuilder for a queue
      2. Send a single message with ServiceBusMessage
      3. Send a batch of 5 messages using ServiceBusMessageBatch
      4. Create a ServiceBusReceiverClient and receive messages using receiveMessages()
      5. Complete a message with complete() after processing
      6. Create a ServiceBusProcessorClient for continuous processing with handlers
      7. Demonstrate sending to a topic and receiving from a subscription
      
      Show required Maven dependency (com.azure:azure-messaging-servicebus) and
      proper resource cleanup with close().
    tags:
      service: service-bus
      plane: data-plane
      language: java
      category: batch
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/service-bus-project
              description: |-
                - Declare the `com.azure:azure-messaging-servicebus` Maven dependency.
                - Use current public `com.azure.messaging.servicebus` APIs.
              weight: 1
              pass_threshold: 1
            - name: prompt/service-bus-authentication
              description: |-
                - Configure `ServiceBusClientBuilder` with a connection string, or with a fully qualified namespace and Azure credential.
                - Obtain authentication values from external configuration rather than embedding secrets.
              weight: 1
              pass_threshold: 1
            - name: prompt/queue-sending
              description: |-
                - Build a queue sender and send one `ServiceBusMessage`.
                - Build a message batch containing exactly five additional messages.
                - Check every batch addition and handle a message that does not fit before sending the accepted batch.
              weight: 1
              pass_threshold: 1
            - name: prompt/queue-receive-and-settlement
              description: |-
                - Receive queue messages with `receiveMessages(...)`.
                - Process each received message and explicitly complete it.
              weight: 1
              pass_threshold: 1
            - name: prompt/processor-lifecycle
              description: |-
                - Configure continuous message and error handlers on a `ServiceBusProcessorClient`.
                - Start the processor before processing.
                - Stop or close the processor after the demonstration.
              weight: 1
              pass_threshold: 1
            - name: prompt/topic-subscription-flow
              description: |-
                - Send a message through a topic sender.
                - Receive and settle it through a receiver configured for that topic's subscription.
              weight: 1
              pass_threshold: 1
            - name: prompt/service-bus-failure-handling
              description: |-
                - Handle `ServiceBusException` or equivalent Service Bus failures.
                - Report the failure reason and whether it is transient when that information is available.
                - Close all senders, receivers, and processors on success and failure paths.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Compatible BOM-covered GA Azure artifacts omit explicit versions.
                - Explicit versions are limited to preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` packages.
                - Do not import legacy `com.microsoft.azure.*` or Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
