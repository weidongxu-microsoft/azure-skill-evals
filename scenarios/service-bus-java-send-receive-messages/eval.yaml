name: service-bus-java-send-receive-messages
description: Compare Azure tooling for a Service Bus Java send and receive task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: service-bus-dp-java-send-receive
    prompt: |-
      Write a Java 17 program that sends and receives messages with Azure Service Bus.

      Write the code to files. Do not reply with code blocks.

      1. Create a Maven project that uses com.azure:azure-messaging-servicebus:7.17.20.
      2. Read the Service Bus connection string, queue name, topic name, and subscription name from environment variables.
      3. Build current synchronous Service Bus clients with ServiceBusClientBuilder.
      4. Send one message to the queue with sendMessage.
      5. Create one ServiceBusMessageBatch from the queue sender. Add exactly five messages with tryAddMessage, fail explicitly if any message cannot be added, and send that same batch.
      6. Receive queue messages in PEEK_LOCK mode, print each received message body, and complete that same message.
      7. Build a queue ServiceBusProcessorClient. Register processMessage and processError handlers, start it, keep it alive with a bounded wait that a message handler can signal, then stop and close it. The message handler must print the body and explicitly complete the message.
      8. Send a separate message to the topic. Receive it through the named subscription, print its body, and complete that same subscription message.
      9. Reliably close every sender and receiver with try-with-resources or finally.

      Use SERVICE_BUS_CONNECTION_STRING, SERVICE_BUS_QUEUE_NAME,
      SERVICE_BUS_TOPIC_NAME, and SERVICE_BUS_SUBSCRIPTION_NAME.
    tags:
      service: service-bus
      plane: data-plane
      language: java
      category: batch
    graders:
      - type: run-command
        name: prompt/sdk-package
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/sdk-package
      - type: run-command
        name: prompt/environment-configuration
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/environment-configuration
      - type: run-command
        name: prompt/single-message-send
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/single-message-send
      - type: run-command
        name: prompt/five-message-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/five-message-batch
      - type: run-command
        name: prompt/receive-body
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/receive-body
      - type: run-command
        name: prompt/same-message-settlement
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/same-message-settlement
      - type: run-command
        name: prompt/processor-handlers
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/processor-handlers
      - type: run-command
        name: prompt/topic-subscription
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/topic-subscription
      - type: run-command
        name: prompt/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
            - prompt/client-lifecycle
      - type: run-command
        name: language/build-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/build-manifest
      - type: run-command
        name: language/current-azure-dependencies
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/current-azure-dependencies
      - type: run-command
        name: language/current-imports
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/current-imports
      - type: run-command
        name: language/client-builder
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/client-builder
    environment:
      files:
        - src: tools/check-service-bus-java.mjs
          dest: .vally/scenarios/service-bus-java-send-receive-messages/tools/check-service-bus-java.mjs
        - src: tools/service-bus-java-rules.mjs
          dest: .vally/scenarios/service-bus-java-send-receive-messages/tools/service-bus-java-rules.mjs
        - src: ../../languages/java/check.mjs
          dest: .vally/languages/java/check.mjs
        - src: ../../languages/java/checks.mjs
          dest: .vally/languages/java/checks.mjs
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
