[project]
name = "contoso-foundry-support-assistant"
version = "1.0.0"
description = "Grounded Microsoft Foundry product-support HTTP API"
requires-python = ">=3.12"
dependencies = [
  "azure-identity==1.25.3",
  "azure-storage-blob==12.30.1",
  "httpx==0.28.1",
]

[project.scripts]
contoso-support = "support_assistant.main:main"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
