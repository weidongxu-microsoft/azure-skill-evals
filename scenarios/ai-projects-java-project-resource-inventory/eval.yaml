name: ai-projects-java-project-resource-inventory
description: "Can an application enumerate and retrieve typed Azure AI project connections and deployments?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-java-project-resource-inventory
    prompt: |-
      Create a complete, runnable Java console application that uses
      `com.azure:azure-ai-projects` to inspect connections and model deployments in a
      Microsoft Foundry project.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`, `CONNECTION_NAME`, and `DEPLOYMENT_NAME`.
      - Enumerate every project connection through the SDK's pageable API and print each
        connection's name, type, target, and default status.
      - Retrieve `CONNECTION_NAME` without requesting credentials and print the same typed
        metadata.
      - Enumerate every project deployment through the SDK's pageable API. For each model
        deployment, print its name, model publisher, model name, and model version.
      - Retrieve `DEPLOYMENT_NAME`, require it to be a model deployment, and print the same
        typed model metadata.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK clients throughout.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: projects
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/configures-the-project-inventory-clients
              description: |-
                - Read `FOUNDRY_PROJECT_ENDPOINT`.
                - Use it with `AIProjectClientBuilder` to create synchronous connections and deployments clients.
              weight: 1
              pass_threshold: 1
            - name: prompt/enumerates-every-project-connection
              description: |-
                - Traverse every page returned by the project connections API.
                - Print each connection's SDK-returned name, type, target, and default status.
                - Any equivalent current pageable traversal is valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/retrieves-the-named-connection-without-credentials
              description: |-
                - Read `CONNECTION_NAME` and retrieve that exact connection.
                - Explicitly request no credentials.
                - Print its name, type, target, and default status without credential material.
              weight: 1
              pass_threshold: 1
            - name: prompt/iterates-every-deployment-from-deploymentsclient-listdep
              description: |-
                - Invoke the project deployments list operation.
                - Traverse every returned page or continuation.
                - Visit each returned deployment resource before filtering or printing.
              weight: 1
              pass_threshold: 1
            - name: prompt/narrows-deployments-to-modeldeployment-before-reading-pu
              description: |-
                - Identify which deployment resources are model deployments.
                - Read publisher, model name, and model version only from model deployments.
                - Handle non-model deployment variants without model-field access failures.
              weight: 1
              pass_threshold: 1
            - name: prompt/retrieves-and-validates-the-named-deployment
              description: |-
                - Read `DEPLOYMENT_NAME` and retrieve that exact deployment.
                - Reject a returned resource that is not a model deployment.
                - Print its name, publisher, model name, and model version.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
