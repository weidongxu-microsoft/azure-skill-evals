name: app-configuration-python-config-values
description: Compare Azure tooling for an App Configuration Python CRUD task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-python-crud
    prompt: |-
      Write a Python script that manages configuration settings in Azure App Configuration.

      Write the code to files. Do not reply with code blocks.

      1. Create an AzureAppConfigurationClient.
      2. Set a configuration setting with key "app:Settings:FontSize" and value "24".
      3. Set a setting with label "Production".
      4. Get the setting by key and print its value.
      5. List all settings matching the key filter "app:Settings:*".
      6. Create an enabled FeatureFlagConfigurationSetting for "BetaFeature".
      7. Delete the setting by key.

      Show required pip packages and proper error handling with HttpResponseError.
    tags:
      service: app-configuration
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: run-command
        name: prompt/app-configuration-package
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-python-config-values/tools/check-app-configuration-python.mjs
            - prompt/app-configuration-package
      - type: run-command
        name: prompt/configuration-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-python-config-values/tools/check-app-configuration-python.mjs
            - prompt/configuration-client
      - type: run-command
        name: prompt/set-settings
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-python-config-values/tools/check-app-configuration-python.mjs
            - prompt/set-settings
      - type: run-command
        name: prompt/production-label
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-python-config-values/tools/check-app-configuration-python.mjs
            - prompt/production-label
      - type: run-command
        name: prompt/get-list-settings
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-python-config-values/tools/check-app-configuration-python.mjs
            - prompt/get-list-settings
      - type: run-command
        name: prompt/enabled-feature-flag
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-python-config-values/tools/check-app-configuration-python.mjs
            - prompt/enabled-feature-flag
      - type: run-command
        name: prompt/delete-error
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-python-config-values/tools/check-app-configuration-python.mjs
            - prompt/delete-error
      - type: run-command
        name: language/correct-imports
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/correct-imports
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/client-lifecycle
      - type: run-command
        name: language/async-client
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/async-client
      - type: run-command
        name: language/exception-handling
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/exception-handling
    environment:
      files:
        - src: tools/check-app-configuration-python.mjs
          dest: .vally/scenarios/app-configuration-python-config-values/tools/check-app-configuration-python.mjs
        - src: tools/app-configuration-python-rules.mjs
          dest: .vally/scenarios/app-configuration-python-config-values/tools/app-configuration-python-rules.mjs
        - src: tools/app_configuration_analyzer.py
          dest: .vally/scenarios/app-configuration-python-config-values/tools/app_configuration_analyzer.py
        - src: ../../languages/python/check.mjs
          dest: .vally/languages/python/check.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
