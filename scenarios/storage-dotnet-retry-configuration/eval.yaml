name: storage-dotnet-retry-configuration
description: Compare Azure tooling for Blob Storage retry configuration in .NET
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-dotnet-retries
    prompt: |-
      How do I configure custom retry policies for Azure Blob Storage operations in .NET?
      My application needs to:
      1. Set a custom retry policy with 5 max retries and exponential backoff
      2. Configure per-operation timeouts so a single upload doesn't hang forever
      3. Handle network errors (transient) differently from auth errors (non-transient)
      4. Use a custom retry policy for specific high-value operations
      5. Implement circuit-breaker patterns for sustained failures
      
      Show me how to configure BlobClientOptions with custom RetryOptions,
      and explain which HTTP status codes the SDK considers retryable by default.
      Use the Azure.Storage.Blobs SDK.
    tags:
      service: storage
      plane: data-plane
      language: dotnet
      category: retries
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - diff
          criteria:
            - name: prompt/blobclientoptions-retry-configuration-with-retryoptions
              description: |-
                `BlobClientOptions.Retry` configuration with `RetryOptions`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/maxretries-delay-maxdelay-mode-exponential-vs-fixed
              description: |-
                `MaxRetries`, `Delay`, `MaxDelay`, `Mode` (Exponential vs Fixed)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/networktimeout-for-per-request-timeouts
              description: |-
                `NetworkTimeout` for per-request timeouts
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/default-retryable-status-codes-408-429-500-502-503-504
              description: |-
                Default retryable status codes (408, 429, 500, 502, 503, 504)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/non-retryable-errors-400-401-403-404-409
              description: |-
                Non-retryable errors (400, 401, 403, 404, 409)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/per-operation-cancellationtoken-for-timeout-control
              description: |-
                Per-operation `CancellationToken` for timeout control
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/geo-redundant-retry-with-georedundantsecondaryuri
              description: |-
                Geo-redundant retry with `GeoRedundantSecondaryUri`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/interaction-with-polly-or-other-resilience-libraries
              description: |-
                Interaction with Polly or other resilience libraries
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
