name: storage-dotnet-retry-configuration
description: Compare Azure tooling for Blob Storage retry configuration in .NET
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-dotnet-retries
    prompt: |-
      Write a runnable C# console application that demonstrates production retry configuration for an Azure Blob Storage upload.

      Write the code to files. Do not reply with code blocks.

      1. Target net8.0 and pin Azure.Identity 1.21.0 and Azure.Storage.Blobs 12.29.2 exactly.
      2. Read an absolute Blob service endpoint from AZURE_STORAGE_BLOB_ENDPOINT, plus the container and blob names from AZURE_STORAGE_CONTAINER and AZURE_STORAGE_BLOB. Authenticate with DefaultAzureCredential.
      3. Configure BlobClientOptions.Retry with RetryMode.Exponential, MaxRetries 5, Delay 1 second, MaxDelay 16 seconds, and NetworkTimeout 30 seconds.
      4. Pass those exact options to the BlobServiceClient, derive the BlobContainerClient and BlobClient from that service client, and perform an awaited upload with that exact blob client.
      5. Give the upload an independent two-minute operation timeout with CancellationTokenSource and pass its token to UploadAsync.
      6. Distinguish the SDK's default transient retry statuses 408, 429, 500, 502, 503, and 504 from non-transient request or authentication statuses 400, 401, 403, 404, and 409 when handling RequestFailedException around the upload.
      7. Guard that same upload path with a small circuit breaker that opens after 3 failed transient operations for 30 seconds. Non-transient failures must not open the circuit. Do not add another retry loop around the SDK retries.

      Equivalent well-factored helper methods and SDK forms are acceptable. Do not hard-code credentials.
    tags:
      service: storage
      plane: data-plane
      language: dotnet
      category: retries
    graders:
      - type: run-command
        name: prompt/storage-retry-manifest
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-retry-configuration/tools/check-storage-dotnet-retry.mjs, prompt/storage-retry-manifest] }
      - type: run-command
        name: prompt/configured-upload-client
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-retry-configuration/tools/check-storage-dotnet-retry.mjs, prompt/configured-upload-client] }
      - type: run-command
        name: prompt/operation-timeout
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-retry-configuration/tools/check-storage-dotnet-retry.mjs, prompt/operation-timeout] }
      - type: run-command
        name: prompt/failure-classification
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-retry-configuration/tools/check-storage-dotnet-retry.mjs, prompt/failure-classification] }
      - type: run-command
        name: prompt/circuit-breaker
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-retry-configuration/tools/check-storage-dotnet-retry.mjs, prompt/circuit-breaker] }
      - type: run-command
        name: language/project-manifest
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/project-manifest] }
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/current-azure-packages] }
      - type: run-command
        name: language/async-await
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/async-await] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/client-lifecycle] }
    environment:
      files:
        - src: tools/check-storage-dotnet-retry.mjs
          dest: .vally/scenarios/storage-dotnet-retry-configuration/tools/check-storage-dotnet-retry.mjs
        - src: tools/storage-dotnet-retry-rules.mjs
          dest: .vally/scenarios/storage-dotnet-retry-configuration/tools/storage-dotnet-retry-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
