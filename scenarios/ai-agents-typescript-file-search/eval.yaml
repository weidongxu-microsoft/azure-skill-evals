name: ai-agents-typescript-file-search
description: "Can an agent ground an Azure AI Agents response in an uploaded document through file search?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-agents-dp-typescript-file-search
    prompt: |-
      Create a complete, runnable TypeScript console application that uses
      `@azure/ai-agents` to answer a question grounded in an uploaded document.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `PROJECT_ENDPOINT` and `MODEL_DEPLOYMENT_NAME`.
      - Create a text document containing this exact fact:
        `The Contoso Trail Guide says the Cascade Loop is 42 kilometers long and hikers should bring a rain jacket.`
      - Upload the document for agents, create a vector store containing it, and wait until
        the file is ready in the vector store. Fail if indexing doesn't complete
        successfully.
      - Create an agent named `hyoka-trail-guide-agent` with a file-search tool and tool
        resources that reference the created vector store.
      - Create a thread with the exact user message
        `According to the uploaded guide, how long is the Cascade Loop and what should hikers bring?`
      - Create and poll a run until terminal status, and require successful completion.
      - List messages in chronological order and print assistant text.
      - Delete the thread, agent, vector store, and uploaded file in dependency order.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: agents
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/uploads-a-readable-document-stream-with-the-assistants-p
              description: |-
                Creates a document containing the exact required fact and uploads it as a readable
                stream with the `assistants` purpose and a filename.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-a-vector-store-adds-the-uploaded-file-with-the-s
              description: |-
                Creates a vector store, adds the uploaded file with the SDK poller, and requires a
                completed vector-store file status before creating the run. Fails if indexing ends
                unsuccessfully.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-toolutility-createfilesearchtool-with-the-vector-st
              description: |-
                Uses `ToolUtility.createFileSearchTool` with the vector-store ID and passes both
                its definition and resources when creating the agent.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-thread-exact-grounded-question-and-run-with
              description: |-
                Creates the thread with the exact grounded question unchanged, without adding a
                local path or uploaded file ID, and creates the run with the file-search-configured
                agent.
              weight: 1
              pass_threshold: 1
            - name: prompt/polls-the-run-with-createandpoll-requires-completed-stat
              description: |-
                Polls the run with `createAndPoll`, requires completed status, and prints text read
                from returned ascending assistant messages. Printing the known document fact
                directly from local code does not satisfy this criterion.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-thread-before-the-agent-then-deletes-the-vec
              description: |-
                Deletes the thread before the agent, then deletes the vector store before the
                uploaded file.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/long-running-operation-completion
              description: |-
                - Use the selected SDK's poller, wait helper, or status-retrieval mechanism.
                - Continue until a successful or unsuccessful terminal state.
                - Distinguish successful completion from unsuccessful terminal states.
                - Bound explicit polling and avoid tight polling loops.
                - Do not replace an available SDK polling abstraction with ad hoc delays.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
