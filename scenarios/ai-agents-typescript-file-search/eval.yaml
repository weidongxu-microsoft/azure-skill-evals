name: ai-agents-typescript-file-search
description: "Can an agent ground an Azure AI Agents response in an uploaded document through file search?"
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-agents-dp-typescript-file-search
    prompt: |-
      Create a complete, runnable TypeScript console application that uses
      `@azure/ai-agents` to answer a question grounded in an uploaded document.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `PROJECT_ENDPOINT` and `MODEL_DEPLOYMENT_NAME`.
      - Create a text document containing this exact fact:
        `The Contoso Trail Guide says the Cascade Loop is 42 kilometers long and hikers should bring a rain jacket.`
      - Upload the document for agents, create a vector store containing it, and wait until
        the file is ready in the vector store. Fail if indexing doesn't complete
        successfully.
      - Create an agent named `hyoka-trail-guide-agent` with a file-search tool and tool
        resources that reference the created vector store.
      - Create a thread with the exact user message
        `According to the uploaded guide, how long is the Cascade Loop and what should hikers bring?`
      - Create and poll a run until terminal status, and require successful completion.
      - List messages in chronological order and print assistant text.
      - Delete the thread, agent, vector store, and uploaded file in dependency order.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: agents
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/uploads-a-readable-document-stream-with-the-assistants-p
              description: |-
                Uploads a readable document stream with the `assistants` purpose and a filename.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-a-vector-store-adds-the-uploaded-file-with-the-s
              description: |-
                Creates a vector store, adds the uploaded file with the SDK poller, and requires a
                completed vector-store file status.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-toolutility-createfilesearchtool-with-the-vector-st
              description: |-
                Uses `ToolUtility.createFileSearchTool` with the vector-store ID and passes both
                its definition and resources when creating the agent.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-thread-exact-grounded-question-and-run-with
              description: |-
                Creates the thread, exact grounded question, and run with the created IDs.
              weight: 1
              pass_threshold: 1
            - name: prompt/polls-the-run-with-createandpoll-requires-completed-stat
              description: |-
                Polls the run with `createAndPoll`, requires completed status, and retrieves
                ascending assistant text messages.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-thread-before-the-agent-then-deletes-the-vec
              description: |-
                Deletes the thread before the agent, then deletes the vector store before the
                uploaded file.
              weight: 1
              pass_threshold: 1
            - name: prompt/does-not-put-a-local-file-path-or-uploaded-file-id-direc
              description: |-
                Does not put a local file path or uploaded file ID directly in the user message as
                a substitute for file-search tool resources.
              weight: 1
              pass_threshold: 1
            - name: prompt/does-not-start-the-run-before-vector-store-file-indexing
              description: |-
                Does not start the run before vector-store file indexing completes.
              weight: 1
              pass_threshold: 1
            - name: prompt/does-not-print-the-known-document-fact-directly-as-thoug
              description: |-
                Does not print the known document fact directly as though it were the agent's
                grounded response.
              weight: 1
              pass_threshold: 1
            - name: language/correct-azure-scoped-packages
              description: |-
                All Azure SDK dependencies use @azure/ scoped packages (e.g., @azure/storage-blob, @azure/keyvault-secrets, @azure/identity). No deprecated unscoped packages (azure-storage, azure-arm-*, ms-rest-azure, @azure/ms-rest-*).
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-for-authentication
              description: |-
                Includes @azure/identity as a dependency. For local development, DefaultAzureCredential is acceptable. For production code, uses a specific Entra token credential (e.g., ManagedIdentityCredential, ClientSecretCredential, WorkloadIdentityCredential) or configures DefaultAzureCredential with the AZURE_TOKEN_CREDENTIALS environment variable set to "prod" or a specific token credential. No hardcoded connection strings, account keys, SAS tokens, or secrets in code.
              weight: 1
              pass_threshold: 1
            - name: language/client-constructor-with-endpoint-and-credential
              description: |-
                SDK clients constructed with endpoint URL and credential object, e.g. new BlobServiceClient(url, credential) or new SecretClient(vaultUrl, credential). No legacy constructor patterns or connection string-based construction when identity-based auth is available.
              weight: 1
              pass_threshold: 1
            - name: language/async-await-pattern
              description: |-
                Uses async/await for all asynchronous operations. No raw .then()/.catch() chains when await is cleaner. No callback-based patterns. Top-level async function or IIFE for entry point.
              weight: 1
              pass_threshold: 1
            - name: language/pagination-with-for-await-of
              description: |-
                List/query operations use for-await-of iteration over the PagedAsyncIterableIterator returned by SDK methods. Does not collect all pages into an array in memory (e.g., no Array.from() or manual page accumulation). Uses byPage() when per-page control is needed.
              weight: 1
              pass_threshold: 1
            - name: language/lro-pattern-beginxxx-polluntildone
              description: |-
                Long-running operations use the begin* method prefix (e.g., beginDeleteSecret, beginCreateOrUpdate) and await poller.pollUntilDone(). No manual setTimeout/setInterval polling loops.
              weight: 1
              pass_threshold: 1
            - name: language/resterror-exception-handling
              description: |-
                Catches RestError (from @azure/core-rest-pipeline or the service package) with statusCode inspection for error-specific handling. Not just generic Error or try/catch without type checking.
              weight: 1
              pass_threshold: 1
            - name: language/no-deprecated-packages
              description: |-
                No deprecated or legacy Azure packages in package.json: azure-storage, azure-arm-*, ms-rest-azure, @azure/ms-rest-js, @azure/ms-rest-nodeauth, @azure/ms-rest-azure-js. All dependencies use the current @azure/* track.
              weight: 1
              pass_threshold: 1
            - name: language/logging-via-azure-logger
              description: |-
                Uses @azure/logger with setLogLevel() or the AZURE_LOG_LEVEL environment variable for SDK diagnostic logging. No custom logging wrappers around SDK internals.
              weight: 1
              pass_threshold: 1
            - name: language/package-json-with-correct-dependencies
              description: |-
                Includes a valid package.json with all required @azure/* dependencies listed. TypeScript projects include tsconfig.json and appropriate @types/* packages or use a recent TypeScript version with built-in types.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
