name: document-translation-typescript-batch-container
description: "Can an application start a container translation, wait for completion, and enumerate every document status and failure?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: document-translation-dp-typescript-batch-container
    prompt: |-
      Create a complete, runnable TypeScript console application using
      `@azure/ai-translation-document` 1.0.0. Target Node.js 22. Accept exactly three
      command-line arguments: source-container URI, target-container URI, and
      target-language code. Read `AZURE_DOCUMENT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Start one batch document translation from the supplied source container to the
        supplied target container and language.
      - Use the SDK long-running operation and wait for it to finish.
      - Print the returned overall translation status.
      - Page through every document status in that operation and print each document
        ID and status.
      - For every document whose returned failure information is present, print its
        returned error code and message.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: batch
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/imports-and-constructs-documenttranslationclient-from-th
              description: |-
                Imports and constructs `DocumentTranslationClient` from the released non-REST
                `@azure/ai-translation-document` package, not
                `SingleDocumentTranslationClient`.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-starttranslation-with-one-input-whose-source-sourc
              description: |-
                Calls `startTranslation` with one input whose `source.sourceUrl`,
                `targets[0].targetUrl`, and `targets[0].language` come from the supplied
                arguments.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-polluntildone-on-the-returned-poller-and-prints-it
              description: |-
                Calls `pollUntilDone()` on the returned poller and prints its returned status.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-for-await-of-over-client-listdocumentstatuses-resul
              description: |-
                Uses `for await...of` over
                `client.listDocumentStatuses(result.id)`, traversing every page.
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-each-document-s-id-and-status-and-prints-error-co
              description: |-
                Prints each document's `id` and `status`, and prints `error.code` and
                `error.message` whenever error details are present.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/long-running-operation-completion
              description: |-
                - Use the selected SDK's poller, wait helper, or status-retrieval mechanism.
                - Continue until a successful or unsuccessful terminal state.
                - Distinguish successful completion from unsuccessful terminal states.
                - Bound explicit polling and avoid tight polling loops.
                - Do not replace an available SDK polling abstraction with ad hoc delays.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
