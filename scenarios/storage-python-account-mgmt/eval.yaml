name: storage-python-account-mgmt
description: Compare Azure tooling for a Python storage account lifecycle
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-mp-python-account-mgmt
    prompt: |-
      Write a Python script that manages
      Azure Storage Accounts using the management plane SDK:
      1. Authenticate using DefaultAzureCredential
      2. Create a new Storage Account with Standard_LRS SKU in "eastus"
      3. List all Storage Accounts in a resource group
      4. Get the properties of the created Storage Account
      5. Update the account to enable blob versioning
      6. Delete the Storage Account
      
      Show required pip packages and include proper error handling.
    tags:
      service: storage
      plane: management-plane
      language: python
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/includes-the-required-azure-management-and-identity-sdk
              description: |-
                Includes the required Azure management and identity SDK packages
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-a-management-client-authenticated-with-credentia
              description: |-
                Creates a management client authenticated with credential and subscription ID
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-a-storage-account-as-a-long-running-operation-wi
              description: |-
                Creates a storage account as a long-running operation with the correct SKU and kind
              weight: 1
              pass_threshold: 1
            - name: prompt/lists-all-storage-accounts-in-the-resource-group
              description: |-
                Lists all storage accounts in the resource group
              weight: 1
              pass_threshold: 1
            - name: prompt/retrieves-detailed-properties-of-a-specific-storage-acco
              description: |-
                Retrieves detailed properties of a specific storage account
              weight: 1
              pass_threshold: 1
            - name: prompt/enables-blob-versioning-on-the-account-via-account-updat
              description: |-
                Enables blob versioning on the account (via account update or blob service properties)
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-storage-account
              description: |-
                Deletes the storage account
              weight: 1
              pass_threshold: 1
            - name: prompt/code-builds-and-runs-without-import-errors-or-api-misuse
              description: |-
                Code builds and runs without import errors or API misuse
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
    artifacts:
      include:
        - "**/*.py"
        - "**/requirements*.txt"
        - "**/pyproject.toml"
        - "**/setup.py"
      exclude:
        - "**/.vally/**"
        - "**/.venv/**"
        - "**/__pycache__/**"
