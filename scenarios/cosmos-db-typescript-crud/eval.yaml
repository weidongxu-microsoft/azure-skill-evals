name: cosmos-db-typescript-crud-items
description: Compare Azure tooling for a Cosmos DB TypeScript CRUD task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-typescript-crud
    prompt: |-
      Write a TypeScript program that performs CRUD operations on items in an Azure Cosmos DB NoSQL container.

      Write the code to files. Do not reply with code blocks.

      1. Create a CosmosClient using endpoint and key.
      2. Create a database "TestDB" and container "Items" with partition key "/category".
      3. Create an item with properties: id, category, name, and quantity.
      4. Read the item back using item().read().
      5. Query items where category equals "electronics" using a parameterized query.
      6. Replace the item with an updated quantity using item().replace().
      7. Delete the item using item().delete().

      Show the required npm package and handle errors with appropriate status-code checks.
    tags:
      service: cosmos-db
      plane: data-plane
      language: typescript
      category: crud
    graders:
      - type: run-command
        name: prompt/cosmos-package
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-typescript-crud/tools/check-cosmos-typescript.mjs
            - prompt/cosmos-package
      - type: run-command
        name: prompt/cosmos-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-typescript-crud/tools/check-cosmos-typescript.mjs
            - prompt/cosmos-client
      - type: run-command
        name: prompt/database-container
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-typescript-crud/tools/check-cosmos-typescript.mjs
            - prompt/database-container
      - type: run-command
        name: prompt/create-read
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-typescript-crud/tools/check-cosmos-typescript.mjs
            - prompt/create-read
      - type: run-command
        name: prompt/parameterized-query
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-typescript-crud/tools/check-cosmos-typescript.mjs
            - prompt/parameterized-query
      - type: run-command
        name: prompt/replace-delete
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-typescript-crud/tools/check-cosmos-typescript.mjs
            - prompt/replace-delete
      - type: run-command
        name: prompt/status-error
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-typescript-crud/tools/check-cosmos-typescript.mjs
            - prompt/status-error
      - type: run-command
        name: language/package-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/package-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/async-await
      - type: run-command
        name: language/typescript-config
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/typescript-config
    environment:
      files:
        - src: tools/check-cosmos-typescript.mjs
          dest: .vally/scenarios/cosmos-db-typescript-crud/tools/check-cosmos-typescript.mjs
        - src: tools/cosmos-typescript-rules.mjs
          dest: .vally/scenarios/cosmos-db-typescript-crud/tools/cosmos-typescript-rules.mjs
        - src: ../../languages/typescript/check.mjs
          dest: .vally/languages/typescript/check.mjs
        - src: ../../languages/typescript/checks.mjs
          dest: .vally/languages/typescript/checks.mjs
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
