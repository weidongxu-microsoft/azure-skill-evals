name: cosmos-db-typescript-crud-items
description: Compare Azure tooling for a Cosmos DB TypeScript CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-typescript-crud
    prompt: |-
      Write a TypeScript program
      that performs CRUD operations on items in an Azure Cosmos DB NoSQL container:
      1. Create a CosmosClient using endpoint and key
      2. Create a database "TestDB" and container "Items" with partition key "/category"
      3. Create an item with properties: id, category, name, quantity
      4. Read the item back using item().read()
      5. Query items where category equals "electronics" using parameterized query
      6. Replace the item with updated quantity using item().replace()
      7. Delete the item using item().delete()
      
      Show required npm package and handle errors with appropriate status code checks.
    tags:
      service: cosmos-db
      plane: data-plane
      language: typescript
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/azure-cosmos-npm-package
              description: |-
                `@azure/cosmos` npm package
              weight: 1
              pass_threshold: 1
            - name: prompt/cosmosclient-constructor-with-endpoint-and-key
              description: |-
                `CosmosClient` constructor with endpoint and key
              weight: 1
              pass_threshold: 1
            - name: prompt/client-databases-createifnotexists-and-database-containe
              description: |-
                `client.databases.createIfNotExists()` and `database.containers.createIfNotExists()`
              weight: 1
              pass_threshold: 1
            - name: prompt/container-items-create-container-item-id-partitionkey-re
              description: |-
                `container.items.create()`, `container.item(id, partitionKey).read()`
              weight: 1
              pass_threshold: 1
            - name: prompt/container-items-query-with-sqlqueryspec
              description: |-
                `container.items.query()` with `SqlQuerySpec`
              weight: 1
              pass_threshold: 1
            - name: prompt/container-item-id-partitionkey-replace-and-delete
              description: |-
                `container.item(id, partitionKey).replace()` and `.delete()`
              weight: 1
              pass_threshold: 1
            - name: prompt/feedresponse-iteration-and-error-status-codes
              description: |-
                `FeedResponse` iteration and error status codes
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
