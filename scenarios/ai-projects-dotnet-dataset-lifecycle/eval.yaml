name: ai-projects-dotnet-dataset-lifecycle
description: "Can an application upload, retrieve, download, verify, and delete one exact Azure AI project dataset version?"
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-dotnet-dataset-lifecycle
    prompt: |-
      Create a complete, runnable .NET console application using
      `Azure.AI.Projects` 3.0.0-beta.1 and `Azure.Storage.Blobs` 12.29.2.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`, `DATASET_NAME`, `DATASET_VERSION`,
        `DATA_FILE_PATH`, and `DOWNLOAD_FILE_PATH`.
      - Upload the local file at `DATA_FILE_PATH` as the exact project dataset name and
        version supplied by the user, using the project's default Azure Storage
        connection.
      - Retrieve that exact dataset version and print its SDK-defined name, version, ID,
        type, and data URI.
      - Request the dataset's SDK credential and blob reference. Use them with the Azure
        Storage Blob SDK to download the referenced blob to `DOWNLOAD_FILE_PATH` without
        displaying the SAS URI.
      - Compare the downloaded bytes with the original file and fail if they differ.
        Print the verified byte count only after the comparison succeeds.
      - Delete the exact dataset name and version even when retrieval or download fails
        after upload.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use asynchronous SDK operations throughout.
    tags:
      service: foundry
      plane: data-plane
      language: dotnet
      category: projects
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/creates-aiprojectclient-and-calls-datasets-uploadfileasy
              description: |-
                Creates `AIProjectClient` and calls `Datasets.UploadFileAsync` with the supplied
                name, version, and file path, using the project dataset API rather than a direct
                HTTP upload.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-datasets-getdatasetasync-with-the-same-name-and-ve
              description: |-
                Calls `Datasets.GetDatasetAsync` with the same name and version and prints typed
                `AIProjectDataset` name, version, ID, concrete type, and `DataUri`.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-datasets-getcredentialsasync-for-that-exact-versio
              description: |-
                Calls `Datasets.GetCredentialsAsync` for that exact version, uses
                `DatasetCredential.BlobReference.BlobUri` plus its SAS credential to address the
                correct blob, and downloads it through `BlobContainerClient`/`BlobClient`, not an
                invented dataset download API or direct HTTP call, without displaying the SAS URI.
              weight: 1
              pass_threshold: 1
            - name: prompt/persists-the-blob-at-download-file-path-compares-its-byt
              description: |-
                Persists the Blob SDK's downloaded bytes at `DOWNLOAD_FILE_PATH`, compares them
                with the original file, fails on a mismatch, and prints their byte count only after
                verification succeeds.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-datasets-deleteasync-with-the-exact-name-and-versi
              description: |-
                After any successful upload, calls `Datasets.DeleteAsync` with the exact name and
                version, including when later retrieval or download fails.
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
