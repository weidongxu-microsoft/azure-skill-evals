name: identity-typescript-default-azure-credential
description: Compare Azure tooling for a TypeScript DefaultAzureCredential task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-typescript-default-credential
    prompt: |-
      Write a TypeScript program that authenticates an Azure SDK client using DefaultAzureCredential.

      Write the code to files. Do not reply with code blocks.

      1. Show the required @azure/identity, @azure/keyvault-secrets, and @azure/logger npm packages.
      2. Create a DefaultAzureCredential, with valid options if options are needed.
      3. Pass that credential to a SecretClient.
      4. Retrieve a secret from the vault and print its value using async Azure SDK APIs.
      5. Identify and log AuthenticationError credential failures without hiding other errors.
      6. Enable Azure SDK identity diagnostics with a supported @azure/logger log level.
    tags:
      service: identity
      plane: data-plane
      language: typescript
      category: auth
    graders:
      - type: run-command
        name: prompt/identity-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-default-azure-credential/tools/check-identity-typescript.mjs
            - prompt/identity-packages
      - type: run-command
        name: prompt/default-azure-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-default-azure-credential/tools/check-identity-typescript.mjs
            - prompt/default-azure-credential
      - type: run-command
        name: prompt/credential-client-association
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-default-azure-credential/tools/check-identity-typescript.mjs
            - prompt/credential-client-association
      - type: run-command
        name: prompt/authenticated-operation
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-default-azure-credential/tools/check-identity-typescript.mjs
            - prompt/authenticated-operation
      - type: run-command
        name: prompt/authentication-errors
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-default-azure-credential/tools/check-identity-typescript.mjs
            - prompt/authentication-errors
      - type: run-command
        name: prompt/identity-diagnostics
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-default-azure-credential/tools/check-identity-typescript.mjs
            - prompt/identity-diagnostics
      - type: run-command
        name: language/package-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/package-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/async-await
      - type: run-command
        name: language/typescript-config
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/typescript-config
    environment:
      files:
        - src: tools/check-identity-typescript.mjs
          dest: .vally/scenarios/identity-typescript-default-azure-credential/tools/check-identity-typescript.mjs
        - src: tools/identity-typescript-rules.mjs
          dest: .vally/scenarios/identity-typescript-default-azure-credential/tools/identity-typescript-rules.mjs
        - src: ../../languages/typescript/check.mjs
          dest: .vally/languages/typescript/check.mjs
        - src: ../../languages/typescript/checks.mjs
          dest: .vally/languages/typescript/checks.mjs
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
