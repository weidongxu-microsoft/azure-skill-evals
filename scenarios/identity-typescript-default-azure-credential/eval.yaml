name: identity-typescript-default-azure-credential
description: Compare Azure tooling for a TypeScript DefaultAzureCredential task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-typescript-default-credential
    prompt: |-
      Write a TypeScript program that
      authenticates an Azure SDK client using DefaultAzureCredential. The program should:
      1. Install and import the required npm packages
      2. Create a DefaultAzureCredential instance
      3. Use it to create a SecretClient from @azure/keyvault-secrets
      4. Retrieve a secret from the vault and print its value
      5. Handle AuthenticationError for credential failures
      
      Include a package.json with all dependencies and use async/await throughout.
    tags:
      service: identity
      plane: data-plane
      language: typescript
      category: auth
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - diff
          criteria:
            - name: prompt/azure-identity-npm-package-installation
              description: |-
                `@azure/identity` npm package installation
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/defaultazurecredential-constructor-and-options
              description: |-
                `DefaultAzureCredential` constructor and options
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/credential-chain-environment-workload-identity-managed-i
              description: |-
                Credential chain: Environment → Workload Identity → Managed Identity → Azure CLI → etc.
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/passing-credential-to-azure-sdk-clients
              description: |-
                Passing credential to Azure SDK clients
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/authenticationerror-handling-and-logging
              description: |-
                `AuthenticationError` handling and logging
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-azure-scoped-packages
              description: |-
                All Azure SDK dependencies use @azure/ scoped packages (e.g., @azure/storage-blob, @azure/keyvault-secrets, @azure/identity). No deprecated unscoped packages (azure-storage, azure-arm-*, ms-rest-azure, @azure/ms-rest-*).
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-for-authentication
              description: |-
                Includes @azure/identity as a dependency. For local development, DefaultAzureCredential is acceptable. For production code, uses a specific Entra token credential (e.g., ManagedIdentityCredential, ClientSecretCredential, WorkloadIdentityCredential) or configures DefaultAzureCredential with the AZURE_TOKEN_CREDENTIALS environment variable set to "prod" or a specific token credential. No hardcoded connection strings, account keys, SAS tokens, or secrets in code.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/client-constructor-with-endpoint-and-credential
              description: |-
                SDK clients constructed with endpoint URL and credential object, e.g. new BlobServiceClient(url, credential) or new SecretClient(vaultUrl, credential). No legacy constructor patterns or connection string-based construction when identity-based auth is available.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-await-pattern
              description: |-
                Uses async/await for all asynchronous operations. No raw .then()/.catch() chains when await is cleaner. No callback-based patterns. Top-level async function or IIFE for entry point.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/pagination-with-for-await-of
              description: |-
                List/query operations use for-await-of iteration over the PagedAsyncIterableIterator returned by SDK methods. Does not collect all pages into an array in memory (e.g., no Array.from() or manual page accumulation). Uses byPage() when per-page control is needed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/lro-pattern-beginxxx-polluntildone
              description: |-
                Long-running operations use the begin* method prefix (e.g., beginDeleteSecret, beginCreateOrUpdate) and await poller.pollUntilDone(). No manual setTimeout/setInterval polling loops.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/resterror-exception-handling
              description: |-
                Catches RestError (from @azure/core-rest-pipeline or the service package) with statusCode inspection for error-specific handling. Not just generic Error or try/catch without type checking.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/no-deprecated-packages
              description: |-
                No deprecated or legacy Azure packages in package.json: azure-storage, azure-arm-*, ms-rest-azure, @azure/ms-rest-js, @azure/ms-rest-nodeauth, @azure/ms-rest-azure-js. All dependencies use the current @azure/* track.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/logging-via-azure-logger
              description: |-
                Uses @azure/logger with setLogLevel() or the AZURE_LOG_LEVEL environment variable for SDK diagnostic logging. No custom logging wrappers around SDK internals.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/package-json-with-correct-dependencies
              description: |-
                Includes a valid package.json with all required @azure/* dependencies listed. TypeScript projects include tsconfig.json and appropriate @types/* packages or use a recent TypeScript version with built-in types.
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
