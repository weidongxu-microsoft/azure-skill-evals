name: text-translation-java-transliteration
description: "Can an application transliterate supplied text between supplied scripts and report the returned script metadata?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: text-translation-dp-java-transliteration
    prompt: |-
      Create a complete, runnable Java console application using
      `com.azure:azure-ai-translation-text` 2.0.2. Accept exactly four command-line
      arguments: language code, source-script code, target-script code, and text. Read
      `AZURE_TEXT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Invoke the SDK's transliteration operation with the supplied language,
        source-script, target-script, and text values in that order.
      - Print the transliterated text returned by the service.
      - Print the actual script metadata returned with that text.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK client.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: translation
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/exact-transliteration-arguments
              description: |-
                - Accepts exactly four arguments: language, source script, target script, and text.
                - Any other count -> usage guidance and no service request.
                - Preserves that argument order when assigning request values.
              weight: 1
              pass_threshold: 1
            - name: prompt/transliteration-client-authentication
              description: |-
                - Declares `com.azure:azure-ai-translation-text` version 2.0.2.
                - `AZURE_TEXT_TRANSLATION_ENDPOINT` flows into a synchronous text translation client.
                - A supported non-hardcoded key or token credential flows into that client.
              weight: 1
              pass_threshold: 1
            - name: prompt/immediate-transliteration-request
              description: |-
                - Supplied language, source script, target script, and text flow into one transliteration operation.
                - Uses any supported scalar-text or singleton-list overload without swapping script codes.
                - Consumes the immediate synchronous transliteration response.
              weight: 1
              pass_threshold: 1
            - name: prompt/print-returned-transliteration
              description: |-
                - Reads transliterated text from the service-returned result.
                - Prints the returned text and returned script metadata.
                - Does not echo the input text or configured target script as response data.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
