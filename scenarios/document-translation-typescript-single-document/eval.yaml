name: document-translation-typescript-single-document
description: "Can an application translate one local document with the synchronous document API and preserve the returned bytes?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: document-translation-dp-typescript-single-document
    prompt: |-
      Create a complete, runnable TypeScript console application using
      `@azure/ai-translation-document` 1.0.0. Target Node.js 22. Accept exactly three
      command-line arguments: local document path, target-language code, and output
      path. Read `AZURE_DOCUMENT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Open the local document as binary data and infer its media type from the file
        extension, rejecting unsupported extensions.
      - Use the current single-document translation client and API, supplying the
        original filename, media type, file content, and target language.
      - Persist the exact returned document bytes to the requested output path without
        decoding, parsing, or transforming them.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: translation
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/imports-and-constructs-singledocumenttranslationclient-f
              description: |-
                Imports and constructs `SingleDocumentTranslationClient` from the released
                non-REST `@azure/ai-translation-document` package.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-translate-targetlanguage-document-contents-filenam
              description: |-
                Calls
                `translate(targetLanguage, { document: { contents, filename, contentType } })`
                with binary input and a media type derived from a supported extension; rejects
                unsupported extensions.
              weight: 1
              pass_threshold: 1
            - name: prompt/requires-readablestreambody-and-pipes-that-response-stre
              description: |-
                Requires the service-returned `readableStreamBody` and pipes it directly to the
                output file with backpressure-aware handling, without decoding or transforming it.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
