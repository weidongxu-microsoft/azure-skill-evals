name: identity-java-managed-identity-auth
description: Compare Azure tooling for managed identity authentication in Java
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-java-managed-identity
    prompt: |-
      Show me how to use
      Managed Identity to authenticate Azure SDK clients in Java. Cover:
      1. System-assigned vs user-assigned managed identity
      2. How to create a ManagedIdentityCredential for each type
      3. Using it with Azure SDK clients
      4. Local development fallback strategies
      5. Error handling and troubleshooting
      
      Provide examples for both system-assigned and user-assigned identity.
    tags:
      service: identity
      plane: data-plane
      language: java
      category: authentication
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/managed-identity-dependency
              description: |-
                - Declares a current `com.azure:azure-identity` dependency.
                - Uses a compatible direct version or compatible Azure SDK BOM.
              weight: 1
              pass_threshold: 1
            - name: prompt/system-assigned-managed-identity
              description: |-
                - Builds `ManagedIdentityCredential` without a user-assigned selector.
                - Identifies that flow as system-assigned managed identity.
              weight: 1
              pass_threshold: 1
            - name: prompt/user-assigned-managed-identity
              description: |-
                - Builds a user-assigned `ManagedIdentityCredential`.
                - Selects it by client ID, resource ID, or object ID using a supported current builder API.
                - The selected identifier flows from configuration rather than a secret embedded in code.
              weight: 1
              pass_threshold: 1
            - name: prompt/integration-with-defaultazurecredential-chain
              description: |-
                - Demonstrate managed identity as part of a usable credential strategy.
                - Local fallback may use `DefaultAzureCredential`, a chain, or environment-selected credentials.
                - Production still selects managed identity when hosted identity is available.
              weight: 1
              pass_threshold: 1
            - name: prompt/managed-identity-errors-and-diagnostics
              description: |-
                - Handles `CredentialUnavailableException`, `ClientAuthenticationException`, or equivalent preserved causes.
                - Distinguishes unavailable identity from rejected authentication.
                - Reports actionable diagnostics without exposing tokens or secrets.
              weight: 1
              pass_threshold: 1
            - name: prompt/chainedtokencredentialbuilder-for-local-fallback
              description: |-
                - Provide a local fallback for environments without managed identity.
                - Fallback uses developer or environment credentials in a documented order.
                - The fallback is not selected in production when managed identity is configured.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
