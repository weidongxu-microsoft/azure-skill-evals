name: identity-java-managed-identity-auth
description: Compare Azure tooling for managed identity authentication in Java
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-java-managed-identity
    prompt: |-
      Show me how to use
      Managed Identity to authenticate Azure SDK clients in Java. Cover:
      1. System-assigned vs user-assigned managed identity
      2. How to create a ManagedIdentityCredential for each type
      3. Using it with Azure SDK clients
      4. Local development fallback strategies
      5. Error handling and troubleshooting
      
      Provide examples for both system-assigned and user-assigned identity.
    tags:
      service: identity
      plane: data-plane
      language: java
      category: authentication
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/managed-identity-dependency
              description: |-
                - Declares a current `com.azure:azure-identity` dependency.
                - Uses a compatible direct version or compatible Azure SDK BOM.
              weight: 1
              pass_threshold: 1
            - name: prompt/system-assigned-managed-identity
              description: |-
                - Builds `ManagedIdentityCredential` without a user-assigned selector.
                - Identifies that flow as system-assigned managed identity.
              weight: 1
              pass_threshold: 1
            - name: prompt/user-assigned-managed-identity
              description: |-
                - Builds a user-assigned `ManagedIdentityCredential`.
                - Selects it by client ID, resource ID, or object ID using a supported current builder API.
                - The selected identifier flows from configuration rather than a secret embedded in code.
              weight: 1
              pass_threshold: 1
            - name: prompt/managed-identity-client-integration
              description: |-
                - A demonstrated system- or user-assigned managed identity credential is passed to a real public Azure SDK client.
                - The client receives its required endpoint or resource value from runtime configuration.
              weight: 1
              pass_threshold: 1
            - name: prompt/practical-local-development-fallback
              description: |-
                - Explains that managed identity is unavailable on an ordinary developer machine.
                - Provides a usable local fallback through developer credentials, `DefaultAzureCredential`, or an equivalent environment-selected strategy.
                - Production still uses managed identity rather than a local credential.
              weight: 1
              pass_threshold: 1
            - name: prompt/managed-identity-errors-and-diagnostics
              description: |-
                - Handles `CredentialUnavailableException`, `ClientAuthenticationException`, or equivalent preserved causes.
                - Distinguishes unavailable identity from rejected authentication.
                - Reports actionable diagnostics without exposing tokens or secrets.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
