name: service-bus-typescript-send-receive-messages
description: Compare Azure tooling for a Service Bus TypeScript send and receive task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: service-bus-dp-typescript-send-receive
    prompt: |-
      Write a TypeScript Node.js program that sends and receives messages with Azure Service Bus.

      Write the code to files. Do not reply with code blocks.

      1. Read a fully qualified Service Bus namespace, queue name, topic name, and subscription name from environment variables. Authenticate with DefaultAzureCredential and create a ServiceBusClient.
      2. Create one sender and one receiver for the queue. Send one message to the queue.
      3. Create a message batch, add exactly five newly constructed ServiceBusMessage values, handle tryAddMessage returning false, and send that same batch.
      4. Receive a bounded number of queue messages with a bounded wait. Print each received body and complete that same message.
      5. Create a dedicated receiver for processing the queue and subscribe with both message and error handlers. Print and complete messages in the message handler, report errors in the error handler, keep the subscription active for a bounded wait, then close the subscription before closing that receiver.
      6. Create a distinct sender for the topic and a distinct receiver for the topic subscription. Send a message to the topic, receive with a bounded wait, print its body, and complete that same message.
      7. Use try/finally cleanup. Close every sender and receiver before closing the ServiceBusClient.

      Show the required npm packages.
    tags:
      service: service-bus
      plane: data-plane
      language: typescript
      category: streaming
    graders:
      - type: run-command
        name: prompt/packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/packages
      - type: run-command
        name: prompt/environment-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/environment-client
      - type: run-command
        name: prompt/queue-single
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/queue-single
      - type: run-command
        name: prompt/queue-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/queue-batch
      - type: run-command
        name: prompt/queue-receive
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/queue-receive
      - type: run-command
        name: prompt/processor-handlers
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/processor-handlers
      - type: run-command
        name: prompt/topic-send
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/topic-send
      - type: run-command
        name: prompt/subscription-receive
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/subscription-receive
      - type: run-command
        name: prompt/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
            - prompt/client-lifecycle
      - type: run-command
        name: language/package-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/package-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/async-await
      - type: run-command
        name: language/typescript-config
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/typescript-config
    environment:
      files:
        - src: tools/check-service-bus-typescript.mjs
          dest: .vally/scenarios/service-bus-typescript-send-receive-messages/tools/check-service-bus-typescript.mjs
        - src: tools/service-bus-typescript-rules.mjs
          dest: .vally/scenarios/service-bus-typescript-send-receive-messages/tools/service-bus-typescript-rules.mjs
        - src: tools/source-manifest.mjs
          dest: .vally/scenarios/service-bus-typescript-send-receive-messages/tools/source-manifest.mjs
        - src: ../../languages/typescript/check.mjs
          dest: .vally/languages/typescript/check.mjs
        - src: ../../languages/typescript/checks.mjs
          dest: .vally/languages/typescript/checks.mjs
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
