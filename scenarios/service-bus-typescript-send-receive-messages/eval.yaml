name: service-bus-typescript-send-receive-messages
description: Compare Azure tooling for a Service Bus TypeScript send and receive task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: service-bus-dp-typescript-send-receive
    prompt: |-
      Write a TypeScript program
      that demonstrates messaging with Azure Service Bus:
      1. Create a ServiceBusClient using a connection string
      2. Create a sender for a queue and send a single message
      3. Send a batch of 5 messages using createMessageBatch() and tryAddMessage()
      4. Create a receiver and receive messages using receiveMessages()
      5. Complete a message with completeMessage() after processing
      6. Subscribe to messages using subscribe() with processMessage and processError handlers
      7. Demonstrate sending to a topic and receiving from a subscription
      
      Show required npm package (@azure/service-bus) and proper close() cleanup.
    tags:
      service: service-bus
      plane: data-plane
      language: typescript
      category: streaming
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/azure-service-bus-npm-package
              description: |-
                `@azure/service-bus` npm package
              weight: 1
              pass_threshold: 1
            - name: prompt/servicebusclient-constructor-with-connection-string
              description: |-
                `ServiceBusClient` constructor with connection string
              weight: 1
              pass_threshold: 1
            - name: prompt/createsender-for-queue-or-topic
              description: |-
                `createSender()` for queue or topic
              weight: 1
              pass_threshold: 1
            - name: prompt/servicebusmessagebatch-with-tryaddmessage
              description: |-
                `ServiceBusMessageBatch` with `tryAddMessage()`
              weight: 1
              pass_threshold: 1
            - name: prompt/createreceiver-for-queue-or-subscription
              description: |-
                `createReceiver()` for queue or subscription
              weight: 1
              pass_threshold: 1
            - name: prompt/receivemessages-for-batch-receive-and-subscribe-for-stre
              description: |-
                `receiveMessages()` for batch receive and `subscribe()` for streaming
              weight: 1
              pass_threshold: 1
            - name: prompt/completemessage-abandonmessage-deadlettermessage
              description: |-
                `completeMessage()`, `abandonMessage()`, `deadLetterMessage()`
              weight: 1
              pass_threshold: 1
            - name: prompt/close-on-sender-receiver-and-client-for-cleanup
              description: |-
                `close()` on sender, receiver, and client for cleanup
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
