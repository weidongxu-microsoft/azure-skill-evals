name: storage-java-blob-event-notifier
description: Compare Azure tooling for a Java Blob Storage Event Grid notifier task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-java-blob-event-notifier
    prompt: |-
      Create a small Java 17 Maven project that processes Azure Blob Storage lifecycle events delivered via Event Grid.
      
      The project needs:
      
      - An **event receiver class** (both sync and async versions) that accepts a JSON payload (as if received from an Event Grid webhook endpoint) and deserializes it into structured event objects. It should support both Event Grid schema and CloudEvents 1.0 schema (since Event Grid supports both and the configured schema may vary). It should route events by type — blob-created events get processed one way, blob-deleted another, and unrecognized types are logged as warnings.
      
      - A **blob event handler class** that processes individual blob events. For blob-created events, it should parse the blob's container and name from the event subject, download the blob, and print a summary (name, size, content type, and the blob's access tier). For blob-deleted events, it should just log the deletion. It should handle race conditions gracefully — the blob may have already been deleted or moved to a different tier by the time we try to read it.
      
      - An **event publisher class** (both sync and async versions) that can publish custom events to an Event Grid topic. Given a topic endpoint and a list of custom event objects, it should send them to Event Grid. This would be used for downstream notifications (e.g., "document processed" events). It should support setting a subject hierarchy for event filtering (e.g., "/documents/invoices/processed").
      
      - A **configuration class** that connects to Azure Blob Storage and Event Grid securely. Authentication should use managed identity — no access keys or SAS tokens.
      
      - A **Main class** that demos both implementations: constructs a sample Event Grid JSON payload (with both CloudEvents and EventGrid-schema examples) containing mock blob-created and blob-deleted events with realistic structure, feeds them through the receiver and handler, and publishes a custom downstream event. Run the full demo with the sync implementation first, then repeat with the async implementation.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: storage
      plane: data-plane
      language: java
      category: streaming
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/handles-event-grid-native-schema-via-eventgridevent-from
              description: |-
                - Decode Event Grid schema events into structured event objects.
                - Preserve event type, subject, and data fields needed by handlers.
                - SDK deserializers, Jackson, or equivalent schema-conformant parsing are valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-cloudevents-1-0-schema-via-cloudevent-fromstring
              description: |-
                - Decode CloudEvents 1.0 payloads into structured event objects.
                - Preserve type, subject/source, and data fields needed by handlers.
                - SDK deserializers, Jackson, or equivalent schema-conformant parsing are valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/routes-events-based-on-event-type-string-microsoft-stora
              description: |-
                - Blob-created events route to the created-blob handler.
                - Blob-deleted events route to the deleted-blob handler.
                - Routing works for both Event Grid and CloudEvents envelopes.
              weight: 1
              pass_threshold: 1
            - name: prompt/logs-a-warning-for-unrecognized-event-types
              description: |-
                - Unknown event types are detected during routing.
                - Log an explicit warning that includes the unrecognized type.
                - Unknown events do not crash valid event processing.
              weight: 1
              pass_threshold: 1
            - name: prompt/parses-container-name-and-blob-name-from-event-subject-b
              description: |-
                - Extract container name from event subject or data.
                - Extract the complete blob name, including nested path segments.
                - Extracted values flow into Blob client lookup for created events.
              weight: 1
              pass_threshold: 1
            - name: prompt/custom-event-publishing
              description: |-
                - Sync and async publishers accept a topic endpoint and a list of custom events.
                - Publish each event with a subject hierarchy such as `/documents/invoices/processed`.
                - Preserve custom event type and data through the published payload.
              weight: 1
              pass_threshold: 1
            - name: prompt/retrieves-and-prints-blob-access-tier-from-blob-properti
              description: |-
                - Created-event handler downloads or locates the referenced blob.
                - Retrieve blob properties from Blob Storage.
                - Print the blob access tier with other metadata.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-race-handling
              description: |-
                - Handle a blob deleted before created-event processing without crashing the receiver.
                - Handle tier-transition or temporarily unavailable reads gracefully.
                - Report useful Blob Storage status or service details when available.
              weight: 1
              pass_threshold: 1
            - name: prompt/publishing-failure-handling
              description: |-
                - Handle `HttpResponseException` or an equivalent SDK or transport publishing failure.
                - Report actionable status or service details.
                - Propagate or signal failure rather than reporting a false success.
              weight: 1
              pass_threshold: 1
            - name: prompt/event-project-and-auth
              description: |-
                - Declare compatible Blob Storage, Event Grid, Identity, JSON, and Reactor dependencies as needed.
                - Read Blob Storage and Event Grid endpoints from external configuration.
                - Authenticate both services with managed identity and no keys or SAS tokens.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-deleted-handling
              description: |-
                - Recognize a blob-deleted event from either schema.
                - Log the deletion without attempting to download the deleted blob.
              weight: 1
              pass_threshold: 1
            - name: prompt/sync-event-flow
              description: |-
                - The sync receiver decodes, routes, and handles created and deleted events.
                - The sync publisher sends the downstream custom event.
                - Complete the flow without relying on async wrappers for service work.
              weight: 1
              pass_threshold: 1
            - name: prompt/async-event-flow
              description: |-
                - The async receiver, handler, and publisher compose non-blocking Reactor operations.
                - Created-event download and metadata lookup remain in the async chain.
                - Wait only at the outer application boundary when needed.
              weight: 1
              pass_threshold: 1
            - name: prompt/event-notifier-demo
              description: |-
                - Build realistic Event Grid and CloudEvents samples containing created and deleted events.
                - Run the complete sync flow first, including downstream publication.
                - Then repeat the complete flow asynchronously.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/reactive-async-service-flow
              description: |-
                - Prompt-required async Azure operations originate from async SDK clients or documented async adapters.
                - Compose reusable async flows with Reactor `Mono`/`Flux` or equivalent nonblocking composition.
                - Do not wrap synchronous clients in an executor or block inside reusable async service methods.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
