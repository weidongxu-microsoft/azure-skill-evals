name: ai-projects-typescript-dataset-lifecycle
description: "Can an application upload, retrieve, download, verify, and delete one exact Azure AI project dataset version?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-typescript-dataset-lifecycle
    prompt: |-
      Create a complete, runnable TypeScript console application using
      `@azure/ai-projects` 2.5.0 and `@azure/storage-blob` 12.33.0. Target Node.js 22.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`, `DATASET_NAME`, `DATASET_VERSION`,
        `DATA_FILE_PATH`, and `DOWNLOAD_FILE_PATH`.
      - Upload the local file at `DATA_FILE_PATH` as the exact project dataset name and
        version supplied by the user, using the project's default Azure Storage
        connection.
      - Retrieve that exact dataset version and print its SDK-defined name, version, ID,
        type, and data URI.
      - Request the dataset's SDK credential and blob reference. Use them with the Azure
        Storage Blob SDK to download the referenced blob to `DOWNLOAD_FILE_PATH` without
        displaying the SAS URI.
      - Compare the downloaded bytes with the original file and fail if they differ.
        Print the verified byte count only after the comparison succeeds.
      - Delete the exact dataset name and version even when retrieval or download fails
        after upload.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: projects
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/creates-aiprojectclient-and-calls-client-datasets-upload
              description: |-
                Creates `AIProjectClient` and calls `client.datasets.uploadFile` with the supplied
                name, version, and file path, using the project dataset API rather than `fetch` or
                another direct HTTP upload.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-client-datasets-get-with-the-same-name-and-version
              description: |-
                Calls `client.datasets.get` with the same name and version and prints typed
                dataset-version name, version, ID, `type`, and `dataUri`.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-client-datasets-getcredentials-for-that-exact-vers
              description: |-
                Calls `client.datasets.getCredentials` for that exact version, uses both
                `credential.blobReference.blobUri` and its `credential.sasUri`, and downloads the
                correct blob through `BlobClient` from `@azure/storage-blob`, not an invented
                dataset download API or direct HTTP call, without displaying the SAS URI.
              weight: 1
              pass_threshold: 1
            - name: prompt/persists-the-blob-at-download-file-path-compares-its-byt
              description: |-
                Persists the Blob SDK's downloaded bytes at `DOWNLOAD_FILE_PATH`, compares them
                with the original file, fails on a mismatch, and prints their byte count only after
                verification succeeds.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-client-datasets-delete-with-the-exact-name-and-ver
              description: |-
                After any successful upload, calls `client.datasets.delete` with the exact name
                and version, including when later retrieval or download fails.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
