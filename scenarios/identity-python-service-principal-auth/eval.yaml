name: identity-python-service-principal-auth
description: Compare Azure tooling for Python service principal authentication
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-python-service-principal
    prompt: |-
      Write a runnable Python project that authenticates to Azure using a Service Principal with a client secret.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      1. Required pip packages
      2. How to create a ClientSecretCredential with tenant_id, client_id, and client_secret
      3. Using it with an Azure SDK client
      4. Best practices for secret management (environment variables, .env files)
      5. Error handling for authentication failures
      
      Provide a complete example with proper exception handling.
    tags:
      service: identity
      plane: data-plane
      language: python
      category: authentication
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-identity-package-with-clientsecretcredential-class
              description: |-
                `azure-identity` package with `ClientSecretCredential` class
              weight: 1
              pass_threshold: 1
            - name: prompt/constructor-keyword-arguments-tenant-id-client-id-client
              description: |-
                Constructor keyword arguments: tenant_id, client_id, client_secret
              weight: 1
              pass_threshold: 1
            - name: prompt/passing-credential-to-azure-sdk-clients
              description: |-
                Passing credential to Azure SDK clients
              weight: 1
              pass_threshold: 1
            - name: prompt/os-environ-or-python-dotenv-patterns
              description: |-
                `os.environ` or python-dotenv patterns
              weight: 1
              pass_threshold: 1
            - name: prompt/clientauthenticationerror-exception-handling
              description: |-
                `ClientAuthenticationError` exception handling
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
