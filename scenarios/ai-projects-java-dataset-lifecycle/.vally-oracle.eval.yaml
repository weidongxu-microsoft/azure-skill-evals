name: ai-projects-java-dataset-lifecycle
description: "Can an application upload, retrieve, download, verify, and delete one exact Azure AI project dataset version?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-java-dataset-lifecycle
    golden_patch:
      path: .vally-oracle-golden.patch
    prompt: |-
      Create a complete, runnable Java console application using
      `com.azure:azure-ai-projects` 2.4.0 and `com.azure:azure-storage-blob` 12.35.1.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`, `DATASET_NAME`, `DATASET_VERSION`,
        `DATA_FILE_PATH`, and `DOWNLOAD_FILE_PATH`.
      - Upload the local file at `DATA_FILE_PATH` as the exact project dataset name and
        version supplied by the user, using the project's default Azure Storage
        connection.
      - Retrieve that exact dataset version and print its SDK-defined name, version, ID,
        type, and data URL.
      - Request the dataset's SDK credential and blob reference. Use them with the Azure
        Storage Blob SDK to download the referenced blob to `DOWNLOAD_FILE_PATH` without
        displaying the SAS URL.
      - Compare the downloaded bytes with the original file and fail if they differ.
        Print the verified byte count only after the comparison succeeds.
      - Delete the exact dataset name and version even when retrieval or download fails
        after upload.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK clients throughout.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: projects
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
            - golden_patch
          criteria:
            - name: prompt/declares-compatible-project-and-blob-sdks
              description: |-
                - Include `azure-ai-projects` 2.4.0 and `azure-storage-blob` 12.35.1.
                - Direct dependency versions or a BOM that resolves those versions are valid.
                - Use current public Azure SDK imports; standard Java and other required imports are valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/uploads-the-exact-dataset-version
              description: |-
                - Read the project endpoint, dataset name/version, and source path from the environment.
                - Build a synchronous project datasets client for `FOUNDRY_PROJECT_ENDPOINT`.
                - Upload `DATA_FILE_PATH` as exactly `DATASET_NAME` and `DATASET_VERSION` using the project's default storage.
                - Direct file upload or the supported pending-upload, Blob upload, and registration flow is valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/retrieves-and-prints-dataset-metadata
              description: |-
                - `getDatasetVersion(DATASET_NAME, DATASET_VERSION)` or equivalent -> returned dataset version.
                - Print that result's name, version, ID, type, and data URL getters.
              weight: 1
              pass_threshold: 1
            - name: prompt/downloads-with-the-returned-blob-credential
              description: |-
                - `getCredentials(DATASET_NAME, DATASET_VERSION)` -> returned `BlobReference` and its SAS credential.
                - Returned SAS URL, or returned blob URL plus SAS, -> authorized `BlobClientBuilder`.
                - Download the referenced blob to `DOWNLOAD_FILE_PATH`.
                - Do not print or log the SAS URL.
              weight: 1
              pass_threshold: 1
            - name: prompt/verifies-downloaded-bytes
              description: |-
                - Compare the downloaded bytes with the original file bytes.
                - Fail when they differ.
                - Print the verified byte count only after equality succeeds.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-uploaded-dataset-version
              description: |-
                - After upload, delete exactly `DATASET_NAME` and `DATASET_VERSION`.
                - Ensure deletion also runs when later retrieval, download, or verification fails.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Compatible BOM-covered GA Azure artifacts omit explicit versions.
                - Explicit versions are limited to preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` packages.
                - Do not import legacy `com.microsoft.azure.*` or Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
