name: key-vault-dotnet-crud-secrets
description: Compare Azure tooling for a .NET Key Vault secret CRUD task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-dotnet-crud
    prompt: |-
      Write a C# console application that performs
      all four CRUD operations on Azure Key Vault secrets:
      1. Create a new secret called "my-secret" with value "my-secret-value"
      2. Read the secret back and print its value
      3. Update the secret to a new value "updated-value"
      4. Delete the secret and purge it (soft-delete enabled vault)
      
      Use DefaultAzureCredential for authentication. Include proper error handling
      and show required NuGet packages.
    tags:
      service: key-vault
      plane: data-plane
      language: dotnet
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - diff
          criteria:
            - name: prompt/installing-azure-security-keyvault-secrets-and-azure-ide
              description: |-
                Installing `Azure.Security.KeyVault.Secrets` and `Azure.Identity` NuGet packages
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/creating-a-secretclient-with-vault-uri-and-credential
              description: |-
                Creating a `SecretClient` with vault URI and credential
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/setsecret-getsecret-startdeletesecret-purgedeletedsecret
              description: |-
                `SetSecret()`, `GetSecret()`, `StartDeleteSecret()`, `PurgeDeletedSecret()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handling-soft-delete-polling-deletesecretoperation-to-co
              description: |-
                Handling soft-delete (polling `DeleteSecretOperation` to completion before purge)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/exception-handling-for-requestfailedexception
              description: |-
                Exception handling for `RequestFailedException`
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
