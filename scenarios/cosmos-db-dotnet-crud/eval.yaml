name: cosmos-db-dotnet-crud-items
description: Compare Azure tooling for a Cosmos DB .NET CRUD task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-dotnet-crud
    prompt: |-
      Write a C# program that performs
      CRUD operations on items in an Azure Cosmos DB NoSQL container:
      1. Create a CosmosClient using a connection string
      2. Create a database named "TestDB" and a container named "Items" with partition key "/category"
      3. Insert a JSON item with properties: id, category, name, and quantity
      4. Read the item back by id and partition key
      5. Query items where category equals "electronics" using SQL-like syntax
      6. Replace the item with updated quantity
      7. Delete the item
      
      Show required NuGet packages and proper error handling with CosmosException.
    tags:
      service: cosmos-db
      plane: data-plane
      language: dotnet
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/microsoft-azure-cosmos-nuget-package
              description: |-
                `Microsoft.Azure.Cosmos` NuGet package
              weight: 1
              pass_threshold: 1
            - name: prompt/cosmosclient-creation-and-configuration
              description: |-
                `CosmosClient` creation and configuration
              weight: 1
              pass_threshold: 1
            - name: prompt/database-createdatabaseifnotexistsasync
              description: |-
                `Database.CreateDatabaseIfNotExistsAsync()`
              weight: 1
              pass_threshold: 1
            - name: prompt/container-createcontainerifnotexistsasync-with-partition
              description: |-
                `Container.CreateContainerIfNotExistsAsync()` with partition key
              weight: 1
              pass_threshold: 1
            - name: prompt/container-createitemasync-t-readitemasync-t-replaceitema
              description: |-
                `Container.CreateItemAsync<T>()`, `ReadItemAsync<T>()`, `ReplaceItemAsync<T>()`, `DeleteItemAsync<T>()`
              weight: 1
              pass_threshold: 1
            - name: prompt/container-getitemqueryiterator-t-with-querydefinition
              description: |-
                `Container.GetItemQueryIterator<T>()` with `QueryDefinition`
              weight: 1
              pass_threshold: 1
            - name: prompt/cosmosexception-handling-with-status-codes
              description: |-
                `CosmosException` handling with status codes
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
