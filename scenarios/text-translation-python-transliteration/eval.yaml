name: text-translation-python-transliteration
description: "Can an application transliterate supplied text between supplied scripts and report the returned script metadata?"
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: text-translation-dp-python-transliteration
    prompt: |-
      Create a complete, runnable Python console application using
      `azure-ai-translation-text` 2.0.0. Accept exactly four command-line arguments:
      language code, source-script code, target-script code, and text. Read
      `AZURE_TEXT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Invoke the SDK's transliteration operation with the supplied language,
        source-script, target-script, and text values in that order.
      - Print the transliterated text returned by the service.
      - Print the actual script metadata returned with that text.
      - Include the dependency manifest and concise install and run commands.
      
      Use the synchronous SDK client.
    tags:
      service: foundry
      plane: data-plane
      language: python
      category: translation
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/calls-texttranslationclient-transliterate-with-the-suppl
              description: |-
                Uses `TextTranslationClient` from `azure-ai-translation-text` 2.0.0 and calls
                `transliterate` with the supplied text in `body` and supplied `language`,
                `from_script`, and `to_script` keyword arguments without swapping the script
                codes.
              weight: 1
              pass_threshold: 1
            - name: prompt/reads-a-returned-transliteration-result-rather-than-a-tr
              description: |-
                Reads a returned transliteration result rather than a translation result.
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-both-the-returned-item-s-text-and-script
              description: |-
                Prints both `text` and `script` read from the service-returned item rather than
                echoing the input text or target-script code.
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
