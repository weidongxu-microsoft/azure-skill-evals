name: storage-python-blob-storage-manager
description: Compare Azure tooling for an advanced Azure Blob Storage Python manager
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-python-blob-manager
    prompt: |-
      Create a Python project that provides a reusable Azure Blob Storage management utility.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      The project needs:
      
      - A **service module** (both sync and async versions) that wraps blob operations: upload (with optional metadata and blob index tags for later querying), download, list blobs in a container, and delete. The upload method should handle large files efficiently so that uploading a multi-gigabyte file doesn't load the entire thing into memory or fail on slow connections. The service should also prevent concurrent writers from overwriting each other's changes when updating the same blob.
      
      - A **configuration module** that connects to Azure securely using the storage account endpoint (from an environment variable). No connection strings or account keys should be used — the app will run in Azure with `DefaultAzureCredential`. The configuration should set up a custom retry policy (exponential backoff, configurable max retries and delay), so the app behaves predictably under transient failures. It should also enable HTTP request/response logging at a configurable level for debugging.
      
      - The service should **handle errors gracefully** — if a storage operation fails (e.g., blob not found, permission denied, or a lease is already held by another client), the error should be caught and handled with a clear message rather than crashing. Each operation should also accept an **optional timeout**, so callers can control how long they're willing to wait for a response.
      
      - A **main script** that wires everything together and demos each operation using the sync implementation first, then repeats the same operations using the async implementation: uploads a sample file with some index tags, lists blobs, downloads the file back, acquires a lease and overwrites it, and finally deletes it. Print status at each step.
      
      Include a `requirements.txt` with the necessary Azure SDK dependencies.
    tags:
      service: storage
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - diff
          criteria:
            - name: prompt/configures-a-custom-retry-policy-with-exponential-backof
              description: |-
                Configures a custom retry policy with exponential backoff
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/enables-http-request-response-logging-for-debugging
              description: |-
                Enables HTTP request/response logging for debugging
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/does-not-use-connection-strings-or-account-keys-blob-ope
              description: |-
                Does NOT use connection strings or account keys ### Blob Operations
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handles-large-file-upload-efficiently-without-loading-th
              description: |-
                Handles large file upload efficiently without loading the entire file into memory
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/supports-blob-index-tags-on-upload-distinct-from-metadat
              description: |-
                Supports blob index tags on upload (distinct from metadata)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/implements-blob-lease-acquisition-to-prevent-concurrent
              description: |-
                Implements blob lease acquisition to prevent concurrent overwrites
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/provides-both-sync-and-async-implementations-error-handl
              description: |-
                Provides both sync and async implementations ### Error Handling
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/catches-and-handles-storage-specific-errors-from-the-azu
              description: |-
                Catches and handles storage-specific errors from the Azure SDK
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handles-lease-conflicts-when-another-client-holds-a-leas
              description: |-
                Handles lease conflicts when another client holds a lease
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/includes-per-operation-timeout-configuration
              description: |-
                Includes per-operation timeout configuration
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
