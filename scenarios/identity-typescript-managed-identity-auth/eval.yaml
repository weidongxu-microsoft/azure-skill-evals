name: identity-typescript-managed-identity-auth
description: Compare Azure tooling for TypeScript managed identity authentication
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-typescript-managed-identity
    prompt: |-
      Write a TypeScript program that uses managed identity to authenticate an Azure Key Vault client.

      Write the code to files. Do not reply with code blocks.

      1. Show the required @azure/identity and @azure/keyvault-secrets npm packages.
      2. Create a ManagedIdentityCredential for a system-assigned identity.
      3. Read AZURE_CLIENT_ID and create a ManagedIdentityCredential for that user-assigned identity.
      4. Configure DefaultAzureCredential to use the managed identity client ID.
      5. Create a ChainedTokenCredential that tries managed identity before AzureCliCredential for local development.
      6. Pass an appropriate credential to SecretClient using AZURE_KEY_VAULT_URL.
      7. Await getSecret with AZURE_KEY_VAULT_SECRET_NAME and print the returned secret value.
      8. Meaningfully handle CredentialUnavailableError without swallowing other errors.
    tags:
      service: identity
      plane: data-plane
      language: typescript
      category: auth
    graders:
      - type: run-command
        name: prompt/identity-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
            - prompt/identity-packages
      - type: run-command
        name: prompt/system-assigned-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
            - prompt/system-assigned-credential
      - type: run-command
        name: prompt/user-assigned-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
            - prompt/user-assigned-credential
      - type: run-command
        name: prompt/default-azure-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
            - prompt/default-azure-credential
      - type: run-command
        name: prompt/local-fallback-chain
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
            - prompt/local-fallback-chain
      - type: run-command
        name: prompt/credential-client-association
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
            - prompt/credential-client-association
      - type: run-command
        name: prompt/authenticated-operation
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
            - prompt/authenticated-operation
      - type: run-command
        name: prompt/credential-unavailable-error
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
            - prompt/credential-unavailable-error
    environment:
      files:
        - src: tools/check-managed-identity-typescript.mjs
          dest: .vally/scenarios/identity-typescript-managed-identity-auth/tools/check-managed-identity-typescript.mjs
        - src: tools/managed-identity-typescript-rules.mjs
          dest: .vally/scenarios/identity-typescript-managed-identity-auth/tools/managed-identity-typescript-rules.mjs
        - src: ../../languages/typescript/checks.mjs
          dest: .vally/languages/typescript/checks.mjs
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
