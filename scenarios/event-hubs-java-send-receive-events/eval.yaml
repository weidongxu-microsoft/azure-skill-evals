name: event-hubs-java-send-receive-events
description: Compare Azure tooling for an Event Hubs Java send and receive task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: event-hubs-dp-java-send-receive
    prompt: |-
      Write a Java program that demonstrates
      sending and receiving events with Azure Event Hubs:
      1. Create an EventHubProducerClient using EventHubClientBuilder with a connection string
      2. Create an EventDataBatch and add 10 events with custom properties
      3. Send the batch to the event hub
      4. Create an EventProcessorClient with BlobCheckpointStore for checkpointing
      5. Register processEvent and processError consumer functions
      6. Start the processor, wait for events, and print received event bodies
      7. Implement checkpointing with EventContext.updateCheckpoint()
      
      Show required Maven dependencies (azure-messaging-eventhubs and
      azure-messaging-eventhubs-checkpointstore-blob) and proper resource cleanup.
    tags:
      service: event-hubs
      plane: data-plane
      language: java
      category: streaming
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-messaging-eventhubs-and-azure-messaging-eventhubs
              description: |-
                `azure-messaging-eventhubs` and `azure-messaging-eventhubs-checkpointstore-blob` Maven deps
              weight: 1
              pass_threshold: 1
            - name: prompt/eventhubclientbuilder-and-eventhubproducerclient
              description: |-
                `EventHubClientBuilder` and `EventHubProducerClient`
              weight: 1
              pass_threshold: 1
            - name: prompt/createbatch-and-eventdatabatch-tryadd
              description: |-
                `createBatch()` and `EventDataBatch.tryAdd()`
              weight: 1
              pass_threshold: 1
            - name: prompt/send-for-publishing-events
              description: |-
                `send()` for publishing events
              weight: 1
              pass_threshold: 1
            - name: prompt/eventprocessorclientbuilder-with-blobcheckpointstore
              description: |-
                `EventProcessorClientBuilder` with `BlobCheckpointStore`
              weight: 1
              pass_threshold: 1
            - name: prompt/processevent-and-processerror-consumer-functions
              description: |-
                `processEvent` and `processError` consumer functions
              weight: 1
              pass_threshold: 1
            - name: prompt/eventcontext-updatecheckpoint-for-reliable-processing
              description: |-
                `EventContext.updateCheckpoint()` for reliable processing
              weight: 1
              pass_threshold: 1
            - name: language/correct-dependencies-com-azure-not-com-microsoft-azure
              description: |-
                Uses com.azure group ID for all Azure SDK packages. No com.microsoft.azure (legacy SDK) dependencies. Includes azure-identity for authentication.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-for-version-management
              description: |-
                Uses azure-sdk-bom in dependencyManagement to manage Azure SDK versions instead of hardcoding individual artifact versions. Dependencies should omit <version> tags when managed by the BOM.
              weight: 1
              pass_threshold: 1
            - name: language/correct-imports-no-legacy-no-internal-packages
              description: |-
                All imports use com.azure.* packages. No com.microsoft.azure.* (legacy) or com.azure.*.implementation.* (internal API) imports.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-authentication
              description: |-
                Uses DefaultAzureCredential or another com.azure.identity credential. No hardcoded connection strings, account keys, SAS tokens, or secrets.
              weight: 1
              pass_threshold: 1
            - name: language/client-builder-pattern
              description: |-
                SDK clients constructed using *ClientBuilder classes with .endpoint() or .vaultUrl() and .credential(). No legacy constructors (CloudStorageAccount, DocumentClient, KeyVaultClient).
              weight: 1
              pass_threshold: 1
            - name: language/no-deprecated-legacy-classes
              description: |-
                No deprecated classes from the old SDK (CloudStorageAccount, CloudBlobClient, DocumentClient, QueueClient, ApplicationTokenCredentials, MSICredentials, ConnectionStringBuilder).
              weight: 1
              pass_threshold: 1
            - name: language/pagination-pagediterable-pagedflux
              description: |-
                List/query operations return PagedIterable (sync) or PagedFlux (async). Does not flatten all pages into a raw List or Stream in memory.
              weight: 1
              pass_threshold: 1
            - name: language/lro-pattern-syncpoller-pollerflux
              description: |-
                Long-running operations use SyncPoller (sync) or PollerFlux (async) with begin* method prefix. No Thread.sleep() polling loops.
              weight: 1
              pass_threshold: 1
            - name: language/async-uses-project-reactor-mono-flux
              description: |-
                Async code uses Project Reactor types (Mono, Flux). Not CompletableFuture (wrong), not RxJava (wrong), not sync wrapped in ExecutorService. No .block() inside async service implementations.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-exception-handling
              description: |-
                Catches service-specific exceptions (BlobStorageException, CosmosException, ServiceBusException, HttpResponseException) with status code inspection. Not just generic Exception catches.
              weight: 1
              pass_threshold: 1
            - name: language/try-with-resources-for-clients
              description: |-
                All Azure SDK client instances that implement AutoCloseable are used within try-with-resources blocks or explicitly closed in a finally block.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
