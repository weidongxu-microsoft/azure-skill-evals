name: event-hubs-java-send-receive-events
description: Compare Azure tooling for an Event Hubs Java send and receive task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: event-hubs-dp-java-send-receive
    prompt: |-
      Write a Java program that sends and receives events with Azure Event Hubs.

      Write the code to files. Do not reply with code blocks.

      1. Show the Maven dependencies for Azure Event Hubs and its Blob Storage checkpoint store.
      2. Create a synchronous EventHubProducerClient from an Event Hubs connection string.
      3. Create an EventDataBatch and add 10 EventData instances. Give every event a custom application property.
      4. Send the completed batch.
      5. Create a BlobCheckpointStore and an EventProcessorClient for the default consumer group.
      6. Register event and error handlers. Print each received event body and each processing error.
      7. Update the checkpoint after processing received events.
      8. Start the processor, wait long enough to receive events, then stop the processor and close the producer.

      Use environment variables for the Event Hubs connection string, Event Hub name, Storage connection string, and checkpoint container name.
    tags:
      service: event-hubs
      plane: data-plane
      language: java
      category: streaming
    graders:
      - type: run-command
        name: prompt/event-hubs-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
            - prompt/event-hubs-packages
      - type: run-command
        name: prompt/producer-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
            - prompt/producer-client
      - type: run-command
        name: prompt/event-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
            - prompt/event-batch
      - type: run-command
        name: prompt/send-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
            - prompt/send-batch
      - type: run-command
        name: prompt/checkpointed-consumer
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
            - prompt/checkpointed-consumer
      - type: run-command
        name: prompt/receive-handlers
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
            - prompt/receive-handlers
      - type: run-command
        name: prompt/update-checkpoint
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
            - prompt/update-checkpoint
      - type: run-command
        name: prompt/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
            - prompt/client-lifecycle
      - type: run-command
        name: language/build-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/build-manifest
      - type: run-command
        name: language/current-azure-dependencies
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/current-azure-dependencies
      - type: run-command
        name: language/current-imports
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/current-imports
      - type: run-command
        name: language/client-builder
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/client-builder
    environment:
      files:
        - src: tools/check-event-hubs-java.mjs
          dest: .vally/scenarios/event-hubs-java-send-receive-events/tools/check-event-hubs-java.mjs
        - src: tools/event-hubs-java-rules.mjs
          dest: .vally/scenarios/event-hubs-java-send-receive-events/tools/event-hubs-java-rules.mjs
        - src: ../../languages/java/check.mjs
          dest: .vally/languages/java/check.mjs
        - src: ../../languages/java/checks.mjs
          dest: .vally/languages/java/checks.mjs
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
