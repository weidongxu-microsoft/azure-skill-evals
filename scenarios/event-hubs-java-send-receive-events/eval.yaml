name: event-hubs-java-send-receive-events
description: Compare Azure tooling for an Event Hubs Java send and receive task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: event-hubs-dp-java-send-receive
    prompt: |-
      Write a Java program that demonstrates
      sending and receiving events with Azure Event Hubs:
      1. Create an EventHubProducerClient using EventHubClientBuilder with a connection string
      2. Create an EventDataBatch and add 10 events with custom properties
      3. Send the batch to the event hub
      4. Create an EventProcessorClient with BlobCheckpointStore for checkpointing
      5. Register processEvent and processError consumer functions
      6. Start the processor, wait for events, and print received event bodies
      7. Implement checkpointing with EventContext.updateCheckpoint()
      
      Show required Maven dependencies (azure-messaging-eventhubs and
      azure-messaging-eventhubs-checkpointstore-blob) and proper resource cleanup.
    tags:
      service: event-hubs
      plane: data-plane
      language: java
      category: streaming
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/declares-event-hubs-checkpointing-dependencies
              description: |-
                - Include `com.azure:azure-messaging-eventhubs`.
                - Include `com.azure:azure-messaging-eventhubs-checkpointstore-blob`.
                - Include any Blob SDK dependency needed to construct the checkpoint container client.
              weight: 1
              pass_threshold: 1
            - name: prompt/builds-the-connection-string-producer
              description: |-
                - Build `EventHubProducerClient` with `EventHubClientBuilder`.
                - Supply the required Event Hubs connection string and event hub name when needed.
                - Token-credential authentication is not required.
              weight: 1
              pass_threshold: 1
            - name: prompt/builds-exactly-ten-event-records
              description: |-
                - Create one `EventDataBatch`.
                - Add exactly 10 distinct events to the batch.
                - Attach custom properties to every event.
                - Detect and fail a `tryAdd` rejection instead of silently sending fewer events.
              weight: 1
              pass_threshold: 1
            - name: prompt/sends-the-populated-event-batch
              description: |-
                - Pass the populated 10-event batch to the producer's send operation.
                - The send uses the same configured event hub consumed by the processor.
              weight: 1
              pass_threshold: 1
            - name: prompt/configures-the-checkpointing-processor
              description: |-
                - Build `EventProcessorClient` for the configured event hub and consumer group.
                - Configure `BlobCheckpointStore` from a real Blob container client.
                - Register both process-event and process-error callbacks.
              weight: 1
              pass_threshold: 1
            - name: prompt/processes-prints-and-checkpoints-events
              description: |-
                - Process events supplied to the event callback.
                - Decode and print each received event body.
                - Call `EventContext.updateCheckpoint()` after processing.
              weight: 1
              pass_threshold: 1
            - name: prompt/reports-processor-errors
              description: |-
                - Consume errors supplied to the process-error callback.
                - Print actionable partition or exception diagnostics.
              weight: 1
              pass_threshold: 1
            - name: prompt/runs-and-cleans-up-the-processor
              description: |-
                - Start the processor and wait long enough for callbacks to receive events.
                - Stop the processor after the receive window.
                - Close the processor and producer on success or failure.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
