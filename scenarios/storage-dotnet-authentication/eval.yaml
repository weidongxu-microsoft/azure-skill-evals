name: storage-dotnet-authentication
description: Compare Azure tooling for Blob Storage authentication in .NET
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-dotnet-auth
    prompt: |-
      Write a complete C# console application that authenticates to Azure Blob Storage with DefaultAzureCredential.

      Write the code to files. Do not reply with code blocks.

      1. Target .NET 8 and pin Azure.Identity 1.21.0 and Azure.Storage.Blobs 12.29.2.
      2. Read the Blob service account endpoint from AZURE_STORAGE_BLOB_ENDPOINT and validate it as an absolute URI.
      3. Construct DefaultAzureCredential so the application can use managed identity in Azure and developer credentials such as Azure CLI locally.
      4. Pass that credential and the account endpoint to BlobServiceClient.
      5. Await an authenticated Blob service operation and print information returned by the service.
      6. Handle CredentialUnavailableException and AuthenticationFailedException with useful error details.
      7. Include concise run instructions and explain the production and local-development credential behavior.

      Do not hard-code credentials.
    tags:
      service: storage
      plane: data-plane
      language: dotnet
      category: authentication
    graders:
      - type: run-command
        name: prompt/storage-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-dotnet-authentication/tools/check-storage-dotnet-auth.mjs
            - prompt/storage-packages
      - type: run-command
        name: prompt/account-endpoint
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-dotnet-authentication/tools/check-storage-dotnet-auth.mjs
            - prompt/account-endpoint
      - type: run-command
        name: prompt/default-azure-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-dotnet-authentication/tools/check-storage-dotnet-auth.mjs
            - prompt/default-azure-credential
      - type: run-command
        name: prompt/credential-client-association
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-dotnet-authentication/tools/check-storage-dotnet-auth.mjs
            - prompt/credential-client-association
      - type: run-command
        name: prompt/authenticated-operation
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-dotnet-authentication/tools/check-storage-dotnet-auth.mjs
            - prompt/authenticated-operation
      - type: run-command
        name: prompt/auth-errors
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-dotnet-authentication/tools/check-storage-dotnet-auth.mjs
            - prompt/auth-errors
      - type: run-command
        name: language/project-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/project-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/async-await
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/client-lifecycle
    environment:
      files:
        - src: tools/check-storage-dotnet-auth.mjs
          dest: .vally/scenarios/storage-dotnet-authentication/tools/check-storage-dotnet-auth.mjs
        - src: tools/storage-dotnet-auth-rules.mjs
          dest: .vally/scenarios/storage-dotnet-authentication/tools/storage-dotnet-auth-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
