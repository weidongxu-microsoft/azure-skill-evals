name: event-hubs-python-send-receive-events
description: Compare Azure tooling for an Event Hubs Python send and receive task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: event-hubs-dp-python-send-receive-events
    prompt: |-
      Write a Python script that demonstrates sending and receiving events with Azure Event Hubs.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      3. Send the batch to the event hub
      4. Create an EventHubConsumerClient for receiving
      5. Create a BlobCheckpointStore for checkpointing
      6. Define an on_event callback that prints event body and updates checkpoint
      7. Start receiving with receive() or receive_batch() using the callback
      8. Handle errors with an on_error callback
      
      Show required pip packages (azure-eventhub and
      azure-eventhub-checkpointstoreblob-aio) and async patterns.
    tags:
      service: event-hubs
      plane: data-plane
      language: python
      category: streaming
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - diff
          criteria:
            - name: prompt/azure-eventhub-and-azure-eventhub-checkpointstoreblob-ai
              description: |-
                `azure-eventhub` and `azure-eventhub-checkpointstoreblob-aio` pip packages
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/create-batch-and-eventdatabatch-add
              description: |-
                `create_batch()` and `EventDataBatch.add()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/send-batch-for-publishing
              description: |-
                `send_batch()` for publishing
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/eventhubconsumerclient-with-blobcheckpointstore
              description: |-
                `EventHubConsumerClient` with `BlobCheckpointStore`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/receive-with-on-event-and-on-error-callbacks
              description: |-
                `receive()` with `on_event` and `on_error` callbacks
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/async-variants-with-aio-module
              description: |-
                Async variants with `aio` module
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/context-manager-async-with-patterns
              description: |-
                Context manager (async with) patterns
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
