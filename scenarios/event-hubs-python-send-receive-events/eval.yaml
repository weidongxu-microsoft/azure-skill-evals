name: event-hubs-python-send-receive-events
description: Compare Azure tooling for an Event Hubs Python send and receive task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: event-hubs-dp-python-send-receive-events
    prompt: |-
      Write a complete, runnable Python application that sends and receives events with Azure Event Hubs.

      Write the code to files. Do not reply with code blocks.

      1. Show the required pip packages for Event Hubs and the asynchronous Blob Storage checkpoint store.
      2. Create an EventHubProducerClient.
      3. Create an event batch, add exactly ten EventData events with a custom application property on every event, and send the batch.
      4. Create a BlobCheckpointStore and an EventHubConsumerClient that uses it.
      5. Define an event handler that prints each event body and an error handler that reports receive errors.
      6. Update the partition checkpoint after an event is processed.
      7. Start receiving events with a supported receive API, then close both producer and consumer clients cleanly.

      Read connection details from environment variables and include practical error handling.
    tags:
      service: event-hubs
      plane: data-plane
      language: python
      category: streaming
    graders:
      - type: run-command
        name: prompt/event-hubs-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
            - prompt/event-hubs-packages
      - type: run-command
        name: prompt/producer-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
            - prompt/producer-client
      - type: run-command
        name: prompt/event-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
            - prompt/event-batch
      - type: run-command
        name: prompt/send-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
            - prompt/send-batch
      - type: run-command
        name: prompt/checkpointed-consumer
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
            - prompt/checkpointed-consumer
      - type: run-command
        name: prompt/receive-handlers
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
            - prompt/receive-handlers
      - type: run-command
        name: prompt/update-checkpoint
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
            - prompt/update-checkpoint
      - type: run-command
        name: prompt/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
            - prompt/client-lifecycle
      - type: run-command
        name: language/correct-imports
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/correct-imports
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/client-lifecycle
      - type: run-command
        name: language/async-client
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/async-client
    environment:
      files:
        - src: tools/check-event-hubs-python.mjs
          dest: .vally/scenarios/event-hubs-python-send-receive-events/tools/check-event-hubs-python.mjs
        - src: tools/event-hubs-python-rules.mjs
          dest: .vally/scenarios/event-hubs-python-send-receive-events/tools/event-hubs-python-rules.mjs
        - src: tools/event_hubs_analyzer.py
          dest: .vally/scenarios/event-hubs-python-send-receive-events/tools/event_hubs_analyzer.py
        - src: ../../languages/python/check.mjs
          dest: .vally/languages/python/check.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
