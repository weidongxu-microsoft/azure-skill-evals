name: event-hubs-typescript-send-receive-events
description: Compare Azure tooling for an Event Hubs TypeScript send and receive task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: event-hubs-dp-typescript-send-receive
    prompt: |-
      Write a TypeScript program
      that demonstrates sending and receiving events with Azure Event Hubs:
      1. Create an EventHubProducerClient using a connection string
      2. Create a batch with createBatch() and add 10 events with custom properties
      3. Send the batch using sendBatch()
      4. Create an EventHubConsumerClient with a BlobCheckpointStore
      5. Subscribe to events using subscribe() with processEvents and processError handlers
      6. Print received event bodies and update checkpoints
      7. Implement graceful shutdown with close()
      
      Show required npm packages (@azure/event-hubs and
      @azure/eventhubs-checkpointstore-blob) and proper async/await patterns.
    tags:
      service: event-hubs
      plane: data-plane
      language: typescript
      category: streaming
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/azure-event-hubs-and-azure-eventhubs-checkpointstore-blo
              description: |-
                `@azure/event-hubs` and `@azure/eventhubs-checkpointstore-blob` npm packages
              weight: 1
              pass_threshold: 1
            - name: prompt/eventhubproducerclient-constructor
              description: |-
                `EventHubProducerClient` constructor
              weight: 1
              pass_threshold: 1
            - name: prompt/createbatch-and-eventdatabatch-tryadd
              description: |-
                `createBatch()` and `EventDataBatch.tryAdd()`
              weight: 1
              pass_threshold: 1
            - name: prompt/sendbatch-for-publishing
              description: |-
                `sendBatch()` for publishing
              weight: 1
              pass_threshold: 1
            - name: prompt/eventhubconsumerclient-with-blobcheckpointstore
              description: |-
                `EventHubConsumerClient` with `BlobCheckpointStore`
              weight: 1
              pass_threshold: 1
            - name: prompt/subscribe-with-subscriptioneventhandlers-processevents-p
              description: |-
                `subscribe()` with `SubscriptionEventHandlers` (processEvents, processError)
              weight: 1
              pass_threshold: 1
            - name: prompt/updatecheckpoint-in-the-processevents-handler
              description: |-
                `updateCheckpoint()` in the processEvents handler
              weight: 1
              pass_threshold: 1
            - name: prompt/close-for-cleanup
              description: |-
                `close()` for cleanup
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
