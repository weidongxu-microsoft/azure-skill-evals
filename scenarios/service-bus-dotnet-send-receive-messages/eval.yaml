name: service-bus-dotnet-send-receive-messages
description: Compare Azure tooling for a .NET Service Bus messaging lifecycle
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: service-bus-dp-dotnet-send-receive
    prompt: |-
      Write a complete C# console application that sends and receives messages with Azure Service Bus.

      Write the code to files. Do not reply with code blocks.

      Read the fully qualified namespace, queue name, topic name, and subscription name from environment variables. Authenticate to the namespace with DefaultAzureCredential.

      Perform one reachable messaging lifecycle:
      1. Create one queue sender, send one message, then create a message batch and add exactly five messages. Handle TryAddMessage returning false and send that same batch.
      2. Create a queue receiver, receive a message, print its body after receipt, and explicitly complete that same message after processing it.
      3. Create a processor, register both message and error handlers, start it, keep it alive for a bounded wait or cancellation signal, and always stop it before disposal. The message handler must process and complete its received message.
      4. Create a sender for the topic and a receiver for its subscription, and demonstrate sending and receiving a topic message.

      Always asynchronously dispose the ServiceBusClient and every sender, receiver, and processor created from it. Dispose every message batch. Target net8.0 and pin Azure.Messaging.ServiceBus 7.20.2.
    tags:
      service: service-bus
      plane: data-plane
      language: dotnet
      category: send-receive
    graders:
      - type: run-command
        name: prompt/source-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/source-manifest
      - type: run-command
        name: prompt/client-configuration
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/client-configuration
      - type: run-command
        name: prompt/queue-single-message
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/queue-single-message
      - type: run-command
        name: prompt/queue-five-message-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/queue-five-message-batch
      - type: run-command
        name: prompt/queue-receive-body
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/queue-receive-body
      - type: run-command
        name: prompt/complete-same-message
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/complete-same-message
      - type: run-command
        name: prompt/processor-handlers
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/processor-handlers
      - type: run-command
        name: prompt/topic-subscription
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/topic-subscription
      - type: run-command
        name: prompt/resource-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
            - prompt/resource-lifecycle
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/client-lifecycle
    environment:
      files:
        - src: tools/check-service-bus-dotnet.mjs
          dest: .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/check-service-bus-dotnet.mjs
        - src: tools/service-bus-dotnet-rules.mjs
          dest: .vally/scenarios/service-bus-dotnet-send-receive-messages/tools/service-bus-dotnet-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
