name: service-bus-dotnet-send-receive-messages
description: Compare Azure tooling for a .NET Service Bus messaging lifecycle
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: service-bus-dp-dotnet-send-receive
    prompt: |-
      Write a C# program that demonstrates
      messaging with Azure Service Bus:
      1. Create a ServiceBusClient using a connection string
      2. Create a ServiceBusSender for a queue and send a single message
      3. Send a batch of 5 messages using ServiceBusMessageBatch
      4. Create a ServiceBusReceiver and receive messages using ReceiveMessagesAsync
      5. Complete a message after processing with CompleteMessageAsync
      6. Create a ServiceBusProcessor for continuous processing with handlers
      7. Demonstrate sending to a topic and receiving from a subscription
      
      Show required NuGet packages and proper disposal with await using.
    tags:
      service: service-bus
      plane: data-plane
      language: dotnet
      category: send-receive
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-messaging-servicebus-nuget-package
              description: |-
                `Azure.Messaging.ServiceBus` NuGet package
              weight: 1
              pass_threshold: 1
            - name: prompt/servicebusclient-creation-with-connection-string-or-defa
              description: |-
                `ServiceBusClient` creation with connection string or `DefaultAzureCredential`
              weight: 1
              pass_threshold: 1
            - name: prompt/servicebussender-and-servicebusmessage-for-sending
              description: |-
                `ServiceBusSender` and `ServiceBusMessage` for sending
              weight: 1
              pass_threshold: 1
            - name: prompt/servicebusmessagebatch-and-tryaddmessage
              description: |-
                `ServiceBusMessageBatch` and `TryAddMessage()`
              weight: 1
              pass_threshold: 1
            - name: prompt/servicebusreceiver-and-receivemessagesasync
              description: |-
                `ServiceBusReceiver` and `ReceiveMessagesAsync()`
              weight: 1
              pass_threshold: 1
            - name: prompt/completemessageasync-abandonmessageasync-deadlettermessa
              description: |-
                `CompleteMessageAsync()`, `AbandonMessageAsync()`, `DeadLetterMessageAsync()`
              weight: 1
              pass_threshold: 1
            - name: prompt/servicebusprocessor-with-processmessageasync-and-process
              description: |-
                `ServiceBusProcessor` with `ProcessMessageAsync` and `ProcessErrorAsync`
              weight: 1
              pass_threshold: 1
            - name: prompt/topic-subscription-with-createsender-topicname-and-creat
              description: |-
                Topic/subscription with `CreateSender(topicName)` and `CreateReceiver(topicName, subscriptionName)`
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
