name: key-vault-dotnet-pagination-list-secrets
description: Compare Azure tooling for a .NET Key Vault secret pagination task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-dotnet-pagination
    prompt: |-
      Write a C# program that lists all
      secrets in an Azure Key Vault that contains hundreds of secrets. The program should:
      1. Use SecretClient with DefaultAzureCredential
      2. Iterate through secrets page-by-page using AsyncPageable
      3. Print the name, content type, and enabled status of each secret
      4. Handle the case where some secrets are disabled
      5. Show both sync and async iteration patterns
      
      I want to understand how Azure.Page<T> and AsyncPageable<T> work
      for large result sets. Show required NuGet packages.
    tags:
      service: key-vault
      plane: data-plane
      language: dotnet
      category: pagination
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - diff
          criteria:
            - name: prompt/secretclient-getpropertiesofsecretsasync-returning-async
              description: |-
                `SecretClient.GetPropertiesOfSecretsAsync()` returning `AsyncPageable<SecretProperties>`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/await-foreach-pattern-for-async-iteration
              description: |-
                `await foreach` pattern for async iteration
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/aspages-for-explicit-page-by-page-control
              description: |-
                `AsPages()` for explicit page-by-page control
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/page-size-hints-via-getpropertiesofsecretsasync-cancella
              description: |-
                Page size hints via `GetPropertiesOfSecretsAsync(cancellationToken)`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/accessing-secretproperties-fields-name-contenttype-enabl
              description: |-
                Accessing `SecretProperties` fields (Name, ContentType, Enabled, CreatedOn)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/sync-alternative-using-pageable-secretproperties
              description: |-
                Sync alternative using `Pageable<SecretProperties>`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/error-handling-during-pagination
              description: |-
                Error handling during pagination
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
