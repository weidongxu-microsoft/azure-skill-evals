name: key-vault-dotnet-pagination-list-secrets
description: Compare Azure tooling for a .NET Key Vault secret pagination task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-dotnet-pagination
    prompt: |-
      Write a runnable C# console application that lists all secrets in an Azure Key Vault containing hundreds of secrets.

      Write the code to files. Do not reply with code blocks.

      1. Use SecretClient with DefaultAzureCredential.
      2. Demonstrate asynchronous item-by-item iteration over GetPropertiesOfSecretsAsync() with await foreach.
      3. Demonstrate explicit asynchronous page iteration with AsyncPageable<SecretProperties>.AsPages() and a positive page-size hint.
      4. Demonstrate the synchronous Pageable<SecretProperties> alternative, iterating every returned secret.
      5. For every demonstrated iteration path, print each secret's Name, ContentType, Enabled value, and CreatedOn timestamp, and clearly handle disabled secrets.
      6. Catch RequestFailedException around the pagination paths and report useful failure details.

      Target net8.0 and pin Azure.Identity 1.21.0 and Azure.Security.KeyVault.Secrets 4.11.0 exactly.
    tags:
      service: key-vault
      plane: data-plane
      language: dotnet
      category: pagination
    graders:
      - type: run-command
        name: prompt/key-vault-manifest
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs, prompt/key-vault-manifest] }
      - type: run-command
        name: prompt/configured-secret-client
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs, prompt/configured-secret-client] }
      - type: run-command
        name: prompt/async-item-iteration
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs, prompt/async-item-iteration] }
      - type: run-command
        name: prompt/async-page-iteration
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs, prompt/async-page-iteration] }
      - type: run-command
        name: prompt/sync-iteration
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs, prompt/sync-iteration] }
      - type: run-command
        name: prompt/secret-properties-output
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs, prompt/secret-properties-output] }
      - type: run-command
        name: prompt/disabled-secret-handling
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs, prompt/disabled-secret-handling] }
      - type: run-command
        name: prompt/pagination-error-handling
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs, prompt/pagination-error-handling] }
      - type: run-command
        name: language/project-manifest
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/project-manifest] }
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/current-azure-packages] }
      - type: run-command
        name: language/async-await
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/async-await] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/client-lifecycle] }
    environment:
      files:
        - src: tools/check-key-vault-dotnet-pagination.mjs
          dest: .vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/check-key-vault-dotnet-pagination.mjs
        - src: tools/key-vault-dotnet-pagination-rules.mjs
          dest: .vally/scenarios/key-vault-dotnet-pagination-list-secrets/tools/key-vault-dotnet-pagination-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
