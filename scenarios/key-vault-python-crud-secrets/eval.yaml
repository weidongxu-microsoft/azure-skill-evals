name: key-vault-python-crud-secrets
description: Compare Azure tooling for a Key Vault Python secret lifecycle
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-python-crud
    prompt: |-
      Write a Python script that performs all four CRUD operations on Azure Key Vault secrets.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      3. Update the secret to a new value "updated-value"
      4. Delete the secret and purge it (soft-delete enabled vault)
      
      Use DefaultAzureCredential for authentication. Include proper error handling
      and show required pip packages.
    tags:
      service: key-vault
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/installing-azure-keyvault-secrets-and-azure-identity-pac
              description: |-
                Installing `azure-keyvault-secrets` and `azure-identity` packages
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/creating-a-secretclient-with-vault-url-and-credential
              description: |-
                Creating a `SecretClient` with vault URL and credential
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/set-secret-get-secret-begin-delete-secret-purge-deleted
              description: |-
                `set_secret()`, `get_secret()`, `begin_delete_secret()`, `purge_deleted_secret()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handling-soft-delete-waiting-for-delete-to-complete-befo
              description: |-
                Handling soft-delete (waiting for delete to complete before purge)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/exception-handling-for-resourcenotfounderror
              description: |-
                Exception handling for `ResourceNotFoundError`
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
              required: true
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - -m
            - compileall
            - -q
            - .
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
