name: identity-python-managed-identity-auth
description: Compare Azure tooling for a Python managed identity authentication task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-python-managed-identity
    prompt: |-
      Write a complete, runnable Python application that authenticates an Azure Key Vault client with managed identity and retrieves a secret.

      Write the code to files. Do not reply with code blocks.

      1. Show the required pip packages for Azure Identity and Key Vault secrets.
      2. Demonstrate distinct ManagedIdentityCredential examples for system-assigned identity (no client ID) and user-assigned identity (client ID).
      3. Configure a DefaultAzureCredential to use the user-assigned managed identity.
      4. Show a local development ChainedTokenCredential ordered with managed identity first and Azure CLI second.
      5. Pass an appropriate credential to SecretClient, call get_secret, and print the retrieved secret value.
      6. Handle CredentialUnavailableError usefully when managed identity is unavailable without swallowing unrelated exceptions.

      Read the vault URL, secret name, and user-assigned identity client ID from AZURE_KEY_VAULT_URL, AZURE_KEY_VAULT_SECRET_NAME, and AZURE_CLIENT_ID. Do not hard-code credentials.
    tags:
      service: identity
      plane: data-plane
      language: python
      category: authentication
    graders:
      - type: run-command
        name: prompt/identity-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
            - prompt/identity-packages
      - type: run-command
        name: prompt/system-assigned-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
            - prompt/system-assigned-credential
      - type: run-command
        name: prompt/user-assigned-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
            - prompt/user-assigned-credential
      - type: run-command
        name: prompt/default-azure-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
            - prompt/default-azure-credential
      - type: run-command
        name: prompt/local-fallback-chain
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
            - prompt/local-fallback-chain
      - type: run-command
        name: prompt/credential-client-association
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
            - prompt/credential-client-association
      - type: run-command
        name: prompt/authenticated-operation
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
            - prompt/authenticated-operation
      - type: run-command
        name: prompt/credential-unavailable-error
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
            - prompt/credential-unavailable-error
    environment:
      files:
        - src: tools/check-managed-identity-python.mjs
          dest: .vally/scenarios/identity-python-managed-identity-auth/tools/check-managed-identity-python.mjs
        - src: tools/managed-identity-python-rules.mjs
          dest: .vally/scenarios/identity-python-managed-identity-auth/tools/managed-identity-python-rules.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
