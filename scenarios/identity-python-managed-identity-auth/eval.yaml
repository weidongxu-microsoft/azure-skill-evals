name: identity-python-managed-identity-auth
description: Compare Azure tooling for a Python managed identity authentication task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-python-managed-identity
    prompt: |-
      Write a runnable Python project that authenticates Azure SDK clients using Managed Identity.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      1. System-assigned vs user-assigned managed identity differences
      2. How to create a ManagedIdentityCredential for each type
      3. Using it with Azure SDK clients
      4. Local development fallback strategies
      5. Error handling and troubleshooting
      
      Provide examples for both system-assigned and user-assigned identity.
    tags:
      service: identity
      plane: data-plane
      language: python
      category: authentication
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/managedidentitycredential-class-from-azure-identity
              description: |-
                `ManagedIdentityCredential` class from `azure.identity`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/system-assigned-no-parameters-needed
              description: |-
                System-assigned: no parameters needed
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/user-assigned-passing-client-id-keyword-argument
              description: |-
                User-assigned: passing `client_id` keyword argument
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/integration-with-defaultazurecredential-chain
              description: |-
                Integration with `DefaultAzureCredential` chain
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/credentialunavailableerror-when-not-running-in-azure
              description: |-
                `CredentialUnavailableError` when not running in Azure
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/chainedtokencredential-for-local-development-fallback
              description: |-
                `ChainedTokenCredential` for local development fallback
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
