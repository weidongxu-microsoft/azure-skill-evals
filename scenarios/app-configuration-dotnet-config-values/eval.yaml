name: app-configuration-dotnet-config-values
description: Compare Azure tooling for an App Configuration .NET CRUD task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-dotnet-crud
    prompt: |-
      Write a C# program that manages
      configuration settings in Azure App Configuration:
      1. Create a ConfigurationClient using a connection string
      2. Set a configuration setting with key "app:Settings:FontSize" and value "24"
      3. Set a configuration setting with a label "Production"
      4. Get the setting by key and print its value
      5. List all settings with the prefix "app:Settings:" using GetConfigurationSettings
      6. Create a feature flag setting for "BetaFeature" that is enabled
      7. Delete the setting
      
      Show required NuGet packages and proper error handling with RequestFailedException.
    tags:
      service: app-configuration
      plane: data-plane
      language: dotnet
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-data-appconfiguration-nuget-package
              description: |-
                `Azure.Data.AppConfiguration` NuGet package
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/configurationclient-creation-with-connection-string-or-d
              description: |-
                `ConfigurationClient` creation with connection string or `DefaultAzureCredential`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/setconfigurationsetting-with-key-value-and-optional-labe
              description: |-
                `SetConfigurationSetting()` with key, value, and optional label
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/getconfigurationsetting-by-key-and-label
              description: |-
                `GetConfigurationSetting()` by key and label
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/getconfigurationsettings-with-settingselector-for-filter
              description: |-
                `GetConfigurationSettings()` with `SettingSelector` for filtering
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/feature-flag-configuration-settings-with-featureflagconf
              description: |-
                Feature flag configuration settings with `FeatureFlagConfigurationSetting`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/deleteconfigurationsetting-and-requestfailedexception-ha
              description: |-
                `DeleteConfigurationSetting()` and `RequestFailedException` handling
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
