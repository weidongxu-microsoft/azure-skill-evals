name: app-configuration-dotnet-config-values
description: Compare Azure tooling for an App Configuration .NET CRUD task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-dotnet-crud
    prompt: |-
      Write a C# program that manages configuration settings in Azure App Configuration.

      Write the code to files. Do not reply with code blocks.

      1. Create a ConfigurationClient using a connection string.
      2. Set a configuration setting with key "app:Settings:FontSize" and value "24".
      3. Set a configuration setting with label "Production".
      4. Get the setting by key and print its value.
      5. List settings with key filter "app:Settings:*" using GetConfigurationSettings.
      6. Create an enabled feature flag setting for "BetaFeature".
      7. Delete the setting.

      Show required NuGet packages and proper error handling with RequestFailedException and status inspection.
    tags:
      service: app-configuration
      plane: data-plane
      language: dotnet
      category: crud
    graders:
      - type: run-command
        name: prompt/app-configuration-package
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-dotnet-config-values/tools/check-app-configuration-dotnet.mjs
            - prompt/app-configuration-package
      - type: run-command
        name: prompt/configuration-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-dotnet-config-values/tools/check-app-configuration-dotnet.mjs
            - prompt/configuration-client
      - type: run-command
        name: prompt/set-settings
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-dotnet-config-values/tools/check-app-configuration-dotnet.mjs
            - prompt/set-settings
      - type: run-command
        name: prompt/production-label
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-dotnet-config-values/tools/check-app-configuration-dotnet.mjs
            - prompt/production-label
      - type: run-command
        name: prompt/get-list-settings
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-dotnet-config-values/tools/check-app-configuration-dotnet.mjs
            - prompt/get-list-settings
      - type: run-command
        name: prompt/enabled-feature-flag
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-dotnet-config-values/tools/check-app-configuration-dotnet.mjs
            - prompt/enabled-feature-flag
      - type: run-command
        name: prompt/delete-error
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-dotnet-config-values/tools/check-app-configuration-dotnet.mjs
            - prompt/delete-error
      - type: run-command
        name: language/project-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/project-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/async-await
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/client-lifecycle
    environment:
      files:
        - src: tools/check-app-configuration-dotnet.mjs
          dest: .vally/scenarios/app-configuration-dotnet-config-values/tools/check-app-configuration-dotnet.mjs
        - src: tools/app-configuration-dotnet-rules.mjs
          dest: .vally/scenarios/app-configuration-dotnet-config-values/tools/app-configuration-dotnet-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
