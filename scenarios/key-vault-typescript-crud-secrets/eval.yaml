name: key-vault-typescript-crud-secrets
description: Compare Azure tooling for a Key Vault TypeScript secret lifecycle task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-typescript-crud
    prompt: |-
      Write a Node.js script
      (TypeScript preferred) that performs all four CRUD operations on Azure Key Vault secrets:
      1. Create a new secret called "my-secret" with value "my-secret-value"
      2. Read the secret back and print its value
      3. Update the secret to a new value "updated-value"
      4. Delete the secret and purge it (soft-delete enabled vault)
      
      Use DefaultAzureCredential for authentication. Show required npm packages
      and include proper error handling with try/catch.
    tags:
      service: key-vault
      plane: data-plane
      language: typescript
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/installing-azure-keyvault-secrets-and-azure-identity-npm
              description: |-
                Installing `@azure/keyvault-secrets` and `@azure/identity` npm packages
              weight: 1
              pass_threshold: 1
            - name: prompt/creating-a-secretclient-with-vault-url-and-credential
              description: |-
                Creating a `SecretClient` with vault URL and credential
              weight: 1
              pass_threshold: 1
            - name: prompt/setsecret-getsecret-begindeletesecret-purgedeletedsecret
              description: |-
                `setSecret()`, `getSecret()`, `beginDeleteSecret()`, `purgeDeletedSecret()`
              weight: 1
              pass_threshold: 1
            - name: prompt/awaiting-the-deletesecretpoller-before-purging
              description: |-
                Awaiting the `DeleteSecretPoller` before purging
              weight: 1
              pass_threshold: 1
            - name: prompt/error-handling-for-resterror
              description: |-
                Error handling for `RestError`
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/long-running-operation-completion
              description: |-
                - Use the selected SDK's poller, wait helper, or status-retrieval mechanism.
                - Continue until a successful or unsuccessful terminal state.
                - Distinguish successful completion from unsuccessful terminal states.
                - Bound explicit polling and avoid tight polling loops.
                - Do not replace an available SDK polling abstraction with ad hoc delays.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
