name: storage-java-blob-storage-manager
description: Compare Azure tooling for a Java Blob Storage manager task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-java-blob-manager
    prompt: |-
      Create a small Java 17 Maven project that provides a reusable Azure Blob Storage management utility.
      
      The project needs:
      
      - A **service class** (both sync and async versions) that wraps blob operations: upload (with optional metadata and blob index tags for later querying), download, list blobs in a container, and delete. The upload method should handle large files efficiently so that uploading a multi-gigabyte file doesn't load the entire thing into memory or fail on slow connections. The service should also prevent concurrent writers from overwriting each other's changes when updating the same blob.
      
      - A **configuration class** that connects to Azure securely using the storage account endpoint (from an environment variable). No connection strings or account keys should be used — the app will run in Azure with managed identity. The configuration should set up a custom retry policy (exponential backoff, configurable max retries and delay) and a per-request timeout, so the app behaves predictably under transient failures. It should also enable HTTP request/response logging at a configurable level for debugging.
      
      - A **Main class** that wires everything together and demos each operation using the sync implementation first, then repeats the same operations using the async implementation: uploads a sample file with some index tags, lists blobs, downloads the file back, acquires a lease and overwrites it, and finally deletes it. Print status at each step.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: storage
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/configurable-retry-policy
              description: |-
                - Configure exponential backoff for transient Blob Storage failures.
                - Make the maximum retries and retry delay configurable.
                - Apply the policy to both sync and async clients.
              weight: 1
              pass_threshold: 1
            - name: prompt/per-request-timeout
              description: |-
                - Configure a true timeout for each individual HTTP request, such as retry `tryTimeout`.
                - Apply the per-request timeout to sync and async clients.
                - An overall operation timeout alone does not satisfy this criterion.
              weight: 1
              pass_threshold: 1
            - name: prompt/configurable-http-logging
              description: |-
                - Enable Azure HTTP request and response logging on the clients.
                - Select the logging detail from external configuration.
              weight: 1
              pass_threshold: 1
            - name: prompt/lease-protected-overwrite
              description: |-
                - Acquire a lease before overwriting an existing blob.
                - Supply the lease condition to the overwrite request.
                - Release the lease after the update or failure.
              weight: 1
              pass_threshold: 1
            - name: prompt/bounded-memory-upload
              description: |-
                - Upload multi-gigabyte files without loading the entire file into memory.
                - Use bounded streaming, staged blocks, transfer options, or an equivalent bounded-memory strategy.
                - Configure transfer or request behavior so slow connections can make progress.
              weight: 1
              pass_threshold: 1
            - name: prompt/upload-metadata-and-tags
              description: |-
                - Provide sync and async upload operations.
                - Accept optional blob metadata and optional blob index tags.
                - Persist both metadata and index tags with the uploaded blob.
                - Keep metadata and tags distinct in the SDK request.
              weight: 1
              pass_threshold: 1
            - name: prompt/async-blob-manager
              description: |-
                - Compose async upload, list, download, lease/overwrite, and delete with Reactor.
                - Do not block inside reusable async service methods.
                - Blocking once at the console application's outer boundary is acceptable.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-manager-project-and-auth
              description: |-
                - Declare compatible Blob Storage, Identity, and Reactor dependencies.
                - Read the Blob service endpoint from `AZURE_STORAGE_ACCOUNT_URL` or equivalent runtime configuration.
                - Build sync and async clients with a managed-identity `TokenCredential`, such as `ManagedIdentityCredentialBuilder`.
                - Do not use shared keys, SAS tokens, or connection strings for Blob authentication.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-download
              description: |-
                - Provide sync and async download operations.
                - Stream or write downloaded content to the caller's destination without unnecessary whole-file buffering.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-listing
              description: |-
                - Provide sync and async container listing operations.
                - Preserve iteration or backpressure rather than requiring all results in memory.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-deletion
              description: |-
                - Provide sync and async deletion operations.
                - Expose unsuccessful deletion instead of reporting false success.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-manager-demo
              description: |-
                - Synchronous demo completes upload with tags, list, download, lease overwrite, blob delete, and container delete in order.
                - Asynchronous demo repeats the same operations and waits for terminal completion.
                - Print progress or completion status for each operation as it executes.
              weight: 1
              pass_threshold: 1
            - name: prompt/blob-manager-failures
              description: |-
                - Handle Blob Storage failures for sync and async operations.
                - Report actionable status or service details.
                - Preserve transient errors for the configured retry policy.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
            - name: language/reactive-async-service-flow
              description: |-
                - Prompt-required async Azure operations originate from async SDK clients or documented async adapters.
                - Compose reusable async flows with Reactor `Mono`/`Flux` or equivalent nonblocking composition.
                - Do not wrap synchronous clients in an executor or block inside reusable async service methods.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - Release blob leases after overwrite success or failure.
                - Delete demo blobs after download and overwrite operations.
                - Delete demo containers after their blobs are removed in sync and async flows.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
