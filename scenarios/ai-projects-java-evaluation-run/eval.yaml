name: ai-projects-java-evaluation-run
description: "Can an application use the project OpenAI Evals client to run a built-in evaluator and traverse metric results?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-java-evaluation-run
    prompt: |-
      Create a complete, runnable Java console application using
      `com.azure:azure-ai-projects` 2.4.0 to run an OpenAI-compatible evaluation in a
      Microsoft Foundry project.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`.
      - Obtain the project OpenAI client from `AIProjectClientBuilder`.
      - Create an evaluation named `hyoka-f1-evaluation` with a custom item schema for
        string fields `query`, `response`, and `ground_truth`.
      - Configure the Azure built-in evaluator `builtin.f1_score`, mapping `response` and
        `ground_truth` to the corresponding item fields.
      - Create a run named `hyoka-f1-run` against an inline JSONL data source containing
        this exact item: query `What is the capital of France?`, response `Paris`, and
        ground truth `Paris`.
      - Retrieve the run repeatedly until it reaches `completed` or `failed`, and fail the
        application unless it completes successfully.
      - Traverse every page of output items. Print each output item ID and status, then
        print every returned metric's name, score, and passed value.
      - Delete the created evaluation after the run.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK clients throughout.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: projects
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/obtains-the-project-openai-evals-client
              description: |-
                - Read `FOUNDRY_PROJECT_ENDPOINT`.
                - Use that endpoint with `AIProjectClientBuilder` to obtain the project OpenAI client.
                - Invoke the service Evals API rather than chat completion or a local F1 calculation.
              weight: 1
              pass_threshold: 1
            - name: prompt/builds-evalcreateparams-with-a-custom-schema-and-adapts
              description: |-
                - Evaluation definition contains string fields `query`, `response`, and `ground_truth`.
                - Configure the Azure `builtin.f1_score` evaluator.
                - Map response and ground-truth evaluator inputs to the matching item fields.
                - Typed helpers or equivalent service-model construction are valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-exact-inline-evaluation-run
              description: |-
                - Create `hyoka-f1-run` for the returned evaluation ID.
                - Supply inline JSONL containing query `What is the capital of France?`.
                - Supply response `Paris` and ground truth `Paris` in that item.
              weight: 1
              pass_threshold: 1
            - name: prompt/polls-the-evaluation-run-to-success
              description: |-
                - Repeatedly retrieve the run with bounded delayed polling; a manual loop is valid.
                - Stop at `completed` or `failed`.
                - Fail unless the terminal state is successful completion.
              weight: 1
              pass_threshold: 1
            - name: prompt/traverses-and-prints-all-output-results
              description: |-
                - Traverse every output-item page using an auto-pager or explicit page continuation.
                - Print each returned output-item ID and status.
                - Print every returned metric's name, score, and passed value.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-created-evaluation
              description: |-
                - Retain the service-returned evaluation ID.
                - Delete that exact evaluation after the run.
              weight: 1
              pass_threshold: 1
            - name: prompt/declares-the-compatible-project-sdk
              description: |-
                - Include `com.azure:azure-ai-projects` 2.4.0.
                - A direct version or a BOM resolving 2.4.0 is valid.
                - Official `com.openai.*`, current Azure SDK, and standard Java imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
            - name: language/supported-terminal-state-polling
              description: |-
                - Repeatedly retrieve the evaluation run by its service-returned ID.
                - Stop only at a completed or failed terminal state.
                - Failed terminal state or timeout -> clear failure.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - Retain the service-returned evaluation ID.
                - Delete that exact evaluation after the run completes or fails.
                - Do not delete unrelated project evaluations.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
