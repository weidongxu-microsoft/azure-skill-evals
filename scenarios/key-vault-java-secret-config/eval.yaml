name: key-vault-java-secret-config
description: Compare Azure tooling for a Java Key Vault-backed configuration provider
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-java-secret-config
    prompt: |-
      Create a small Java 17 Maven project that implements an application configuration provider backed by Azure Key Vault.
      
      The project needs:
      
      - A **secret provider class** (both sync and async versions) that retrieves secrets from Key Vault by name, with graceful handling when a secret doesn't exist (return a default value instead of crashing). It should also be able to retrieve a specific version of a secret (not just the latest), and inspect a secret's expiry date so the caller can tell if a secret is about to expire.
      
      - A **caching layer** on top of the provider that stores secret values in memory after first retrieval. It should support bulk-loading a predefined set of required config keys at startup, on-demand refresh of individual keys, and automatic re-fetch of any secret whose expiry date is within a configurable warning window (e.g., 7 days out).
      
      - A **configuration/factory class** that connects securely to the Key Vault using the vault URL from an environment variable. The application runs in Azure and should authenticate using managed identity — no client secrets or certificates in code.
      
      - A **secret rotation helper** that safely rotates a secret: delete the old secret, ensure the deletion is fully complete, then create the new secret with an updated value and expiry date. The rotation must be safe — don't assume deletion is instantaneous, since Key Vault's soft-delete feature means the secret may not be immediately gone.
      
      - A **Main class** that demos both implementations: loading several config keys at startup, reading them from cache, refreshing one, printing a warning if any secret is near expiry, and performing a secret rotation (delete old, wait for completion, create new). Run the full demo with the sync implementation first, then repeat with the async implementation.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: key-vault
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/key-vault-configuration
              description: |-
                - Read the vault URL from an environment variable.
                - Authenticate with managed identity and no client secret or certificate.
                - Build the required sync and async Key Vault clients.
              weight: 1
              pass_threshold: 1
            - name: prompt/sync-secret-provider
              description: |-
                - Retrieve the latest secret by name and a requested secret version.
                - Expose the secret value and expiry to callers.
                - Return a supplied default when the secret is not found.
              weight: 1
              pass_threshold: 1
            - name: prompt/async-secret-provider
              description: |-
                - Provide non-blocking latest-version and specific-version retrieval.
                - Expose value and expiry through Reactor types.
                - Recover a not-found response with the supplied default value.
              weight: 1
              pass_threshold: 1
            - name: prompt/config-cache-loading
              description: |-
                - Keep retrieved secret values in an in-memory cache.
                - Bulk-load the predefined required keys at startup.
                - Refresh an individual key on demand and replace its cached value.
              weight: 1
              pass_threshold: 1
            - name: prompt/near-expiry-cache-refresh
              description: |-
                - Compare secret expiry with a configurable warning window.
                - Automatically re-fetch a near-expiry secret from Key Vault.
                - Replace the cached value and expose the near-expiry warning.
              weight: 1
              pass_threshold: 1
            - name: prompt/sync-secret-rotation
              description: |-
                - Delete the old secret and wait for deletion to complete.
                - Wait, purge, or otherwise ensure the same name is reusable.
                - Recreate that name only afterward with the updated value and expiry.
              weight: 1
              pass_threshold: 1
            - name: prompt/async-secret-rotation
              description: |-
                - Compose and await asynchronous deletion completion.
                - Asynchronously ensure the same name is reusable without racing soft delete.
                - Recreate that name with the updated value and expiry.
              weight: 1
              pass_threshold: 1
            - name: prompt/secret-config-demo
              description: |-
                - Demonstrate startup loading, cached reads, one refresh, expiry warnings, and rotation.
                - Run the complete sync demonstration first.
                - Then run the complete async demonstration and wait for its terminal result.
              weight: 1
              pass_threshold: 1
            - name: prompt/key-vault-project
              description: |-
                - Provide a complete Java 17 Maven project.
                - Declare compatible Key Vault Secrets, Azure Identity, and Reactor dependencies as needed.
              weight: 1
              pass_threshold: 1
            - name: prompt/key-vault-failure-reporting
              description: |-
                - Distinguish expected not-found fallback from other Key Vault failures.
                - Report actionable service details for unexpected retrieval or rotation failures.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
