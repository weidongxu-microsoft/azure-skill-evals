name: key-vault-java-secret-config
description: Compare Azure tooling for a Java Key Vault-backed configuration provider
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-java-secret-config
    prompt: |-
      Create a small Java 17 Maven project that implements an application configuration provider backed by Azure Key Vault.
      
      The project needs:
      
      - A **secret provider class** (both sync and async versions) that retrieves secrets from Key Vault by name, with graceful handling when a secret doesn't exist (return a default value instead of crashing). It should also be able to retrieve a specific version of a secret (not just the latest), and inspect a secret's expiry date so the caller can tell if a secret is about to expire.
      
      - A **caching layer** on top of the provider that stores secret values in memory after first retrieval. It should support bulk-loading a predefined set of required config keys at startup, on-demand refresh of individual keys, and automatic re-fetch of any secret whose expiry date is within a configurable warning window (e.g., 7 days out).
      
      - A **configuration/factory class** that connects securely to the Key Vault using the vault URL from an environment variable. The application runs in Azure and should authenticate using managed identity — no client secrets or certificates in code.
      
      - A **secret rotation helper** that safely rotates a secret: delete the old secret, ensure the deletion is fully complete, then create the new secret with an updated value and expiry date. The rotation must be safe — don't assume deletion is instantaneous, since Key Vault's soft-delete feature means the secret may not be immediately gone.
      
      - A **Main class** that demos both implementations: loading several config keys at startup, reading them from cache, refreshing one, printing a warning if any secret is near expiry, and performing a secret rotation (delete old, wait for completion, create new). Run the full demo with the sync implementation first, then repeat with the async implementation.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: key-vault
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/secret-versioning-retrieves-specific-version-via-getsecr
              description: |-
                - Provider can retrieve the latest secret by name.
                - Provider can retrieve a specific requested secret version.
                - Returned value and version-specific metadata are exposed to callers.
              weight: 1
              pass_threshold: 1
            - name: prompt/secret-expiry-accesses-properties-getexpireson-on-secret
              description: |-
                - Read secret expiry from returned secret properties.
                - Expose expiry with the secret value.
                - Missing expiry is handled explicitly rather than treated as expired.
              weight: 1
              pass_threshold: 1
            - name: prompt/configurable-warning-window-for-near-expiry-detection
              description: |-
                - Warning window is configurable.
                - Compare each secret expiry with the current time plus that window.
                - Near-expiry secrets trigger warning or refresh behavior.
              weight: 1
              pass_threshold: 1
            - name: prompt/config-cache-loading
              description: |-
                - Keep retrieved secret values in an in-memory cache.
                - Bulk-load the predefined required keys at startup.
                - Refresh an individual key on demand and replace its cached value.
              weight: 1
              pass_threshold: 1
            - name: prompt/secret-rotation-uses-begindeletesecret-as-a-long-running
              description: |-
                - Rotation starts deletion of the old secret version/name.
                - Treat deletion as an asynchronous service lifecycle.
                - Continue rotation only after deletion is terminal or name reuse is otherwise safe.
              weight: 1
              pass_threshold: 1
            - name: prompt/sync-uses-syncpoller-to-wait-for-delete-completion
              description: |-
                - Synchronous rotation waits for Key Vault deletion completion.
                - A `SyncPoller` or equivalent supported terminal wait is valid.
                - Purge or recreate happens only after the wait succeeds.
              weight: 1
              pass_threshold: 1
            - name: prompt/async-secret-rotation
              description: |-
                - Compose and await asynchronous deletion completion.
                - Asynchronously ensure the same name is reusable without racing soft delete.
                - Recreate that name with the updated value and expiry.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-new-secret-only-after-delete-completes-not-concu
              description: |-
                - New secret with the rotated value is created after old-name deletion is complete.
                - Do not recreate concurrently with soft-delete in progress.
                - Expiry metadata for the new secret is applied.
              weight: 1
              pass_threshold: 1
            - name: prompt/returns-a-default-value-when-secret-is-not-found-does-no
              description: |-
                - Not-found during retrieval returns the caller-supplied default value.
                - Expected not-found fallback is distinct from other Key Vault failures.
                - Unexpected failures preserve actionable service details.
              weight: 1
              pass_threshold: 1
            - name: prompt/key-vault-configuration
              description: |-
                - Read the vault URL from an environment variable.
                - Authenticate with managed identity and no client secret or certificate.
                - Build the required sync and async Key Vault clients.
              weight: 1
              pass_threshold: 1
            - name: prompt/secret-config-demo
              description: |-
                - Demonstrate startup loading, cached reads, one refresh, expiry warnings, and rotation.
                - Run the complete sync demonstration first.
                - Then run the complete async demonstration and wait for its terminal result.
              weight: 1
              pass_threshold: 1
            - name: prompt/key-vault-project
              description: |-
                - Provide a complete Java 17 Maven project.
                - Declare compatible Key Vault Secrets, Azure Identity, and Reactor dependencies as needed.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/supported-terminal-state-polling
              description: |-
                - Sync rotation waits for Key Vault deletion completion before recreate.
                - Async rotation composes the deletion poller or terminal result before recreate.
                - Fire-and-forget deletion before same-name recreation does not pass.
              weight: 1
              pass_threshold: 1
            - name: language/reactive-async-service-flow
              description: |-
                - Prompt-required async Azure operations originate from async SDK clients or documented async adapters.
                - Compose reusable async flows with Reactor `Mono`/`Flux` or equivalent nonblocking composition.
                - Do not wrap synchronous clients in an executor or block inside reusable async service methods.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - During rotation, delete the old secret and wait until the name is reusable.
                - Recreate the same secret name only after deletion or purge sequencing is safe.
                - Apply the same lifecycle ordering in sync and async rotation paths.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
