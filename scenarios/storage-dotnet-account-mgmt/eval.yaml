name: storage-dotnet-account-mgmt
description: Compare Azure tooling for a .NET storage account management task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-mp-dotnet-account-mgmt
    prompt: |-
      Write a C# program that manages
      Azure Storage Accounts using the management plane SDK:
      1. Authenticate using DefaultAzureCredential
      2. Create a new Storage Account with Standard_LRS SKU in "eastus"
      3. List all Storage Accounts in a resource group
      4. Get the properties of the created Storage Account
      5. Update the account to enable blob versioning
      6. Delete the Storage Account
      
      Show required NuGet packages and proper error handling.
      Use the Azure.ResourceManager.Storage SDK.
    tags:
      service: storage
      plane: management-plane
      language: dotnet
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-resourcemanager-storage-nuget-package
              description: |-
                `Azure.ResourceManager.Storage` NuGet package
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/armclient-and-subscription-resource-group-navigation
              description: |-
                `ArmClient` and subscription/resource group navigation
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/storageaccountcollection-createorupdate-with-storageacco
              description: |-
                `StorageAccountCollection.CreateOrUpdate()` with `StorageAccountCreateOrUpdateContent`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/sku-and-kind-configuration-storagesku-storagekind
              description: |-
                SKU and kind configuration (`StorageSku`, `StorageKind`)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/listing-and-getting-storage-accounts
              description: |-
                Listing and getting storage accounts
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/updating-properties-via-storageaccountpatch
              description: |-
                Updating properties via `StorageAccountPatch`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/delete-operation
              description: |-
                Delete operation
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
