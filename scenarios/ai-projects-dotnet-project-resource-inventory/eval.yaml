name: ai-projects-dotnet-project-resource-inventory
description: "Can an application enumerate and retrieve typed Azure AI project connections and deployments?"
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-dotnet-project-resource-inventory
    prompt: |-
      Create a complete, runnable .NET console application that uses `Azure.AI.Projects`
      to inspect connections and model deployments in a Microsoft Foundry project.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`, `CONNECTION_NAME`, and `DEPLOYMENT_NAME`.
      - Enumerate every project connection through the SDK's pageable API and print each
        connection's name, type, target, and default status.
      - Retrieve `CONNECTION_NAME` without requesting credentials and print the same typed
        metadata.
      - Enumerate every project deployment through the SDK's pageable API. For each model
        deployment, print its name, model publisher, model name, and model version.
      - Retrieve `DEPLOYMENT_NAME`, require it to be a model deployment, and print the same
        typed model metadata.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use asynchronous SDK operations throughout.
    tags:
      service: foundry
      plane: data-plane
      language: dotnet
      category: projects
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/creates-aiprojectclient-for-foundry-project-endpoint
              description: |-
                Creates `AIProjectClient` for `FOUNDRY_PROJECT_ENDPOINT`.
              weight: 1
              pass_threshold: 1
            - name: prompt/enumerates-connections-getconnectionsasync-with-await-fo
              description: |-
                Enumerates `Connections.GetConnectionsAsync` with `await foreach` and uses
                `AIProjectConnection` properties rather than raw JSON.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-connections-getconnectionasync-for-connection-name
              description: |-
                Calls `Connections.GetConnectionAsync` for `CONNECTION_NAME` with
                `includeCredentials: false` and doesn't print credentials.
              weight: 1
              pass_threshold: 1
            - name: prompt/enumerates-deployments-getdeploymentsasync-with-await-fo
              description: |-
                Enumerates `Deployments.GetDeploymentsAsync` with `await foreach`.
              weight: 1
              pass_threshold: 1
            - name: prompt/narrows-aiprojectdeployment-values-to-modeldeployment-be
              description: |-
                Narrows `AIProjectDeployment` values to `ModelDeployment` before reading
                `ModelPublisher`, `ModelName`, and `ModelVersion`.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-deployments-getdeploymentasync-for-deployment-name
              description: |-
                Calls `Deployments.GetDeploymentAsync` for `DEPLOYMENT_NAME` and rejects a result
                that isn't a `ModelDeployment`.
              weight: 1
              pass_threshold: 1
            - name: prompt/does-not-replace-pageable-iteration-with-a-single-assume
              description: |-
                Does not replace pageable iteration with a single assumed page.
              weight: 1
              pass_threshold: 1
            - name: prompt/does-not-select-resources-only-from-the-locally-enumerat
              description: |-
                Does not select resources only from the locally enumerated results instead of
                exercising the SDK's name-based get operations.
              weight: 1
              pass_threshold: 1
            - name: prompt/does-not-request-or-display-connection-credentials
              description: |-
                Does not request or display connection credentials.
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
