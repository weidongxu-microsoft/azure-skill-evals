name: storage-go-polling-create-account
description: Compare Azure tooling for a Go Storage management-plane polling task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-mp-go-polling
    prompt: |-
      Write a Go program that creates an Azure Storage account using the management-plane SDK and demonstrates long-running operation handling.

      Authenticate with DefaultAzureCredential and read subscription, resource group, and account name from environment variables. Start a Standard_LRS StorageV2 account creation in eastus using `BeginCreate`. Apply a context timeout. Demonstrate simple completion with `PollUntilDone` and a selectable manual mode that calls `Poll`, checks `Done`, logs intermediate HTTP status, and obtains the final result with `Result`. Handle timeout cancellation and typed ARM errors.

      Use the current first-party `armstorage` module and context-aware APIs. Include root `go.mod` and `go.sum`.
    tags:
      service: storage
      plane: management-plane
      language: go
      category: polling
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/current-armstorage-default-credential
              description: Uses current `armstorage`, DefaultAzureCredential, and environment-based ARM coordinates.
              weight: 1
              pass_threshold: 1
            - name: prompt/begin-create-parameters
              description: Calls `BeginCreate` for an eastus StorageV2 account with Standard_LRS SKU.
              weight: 1
              pass_threshold: 1
            - name: prompt/poll-until-done
              description: Demonstrates simple LRO completion using `PollUntilDone` and consumes the returned account.
              weight: 1
              pass_threshold: 1
            - name: prompt/manual-polling
              description: Demonstrates manual `Poll`, `Done`, and `Result` handling and logs intermediate response status.
              weight: 1
              pass_threshold: 1
            - name: prompt/timeout-and-typed-errors
              description: Uses `context.WithTimeout`, identifies deadline/cancellation, and handles `*azcore.ResponseError` structurally.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/go-project-tests
        config:
          command: go
          args:
            - test
            - -mod=readonly
            - ./...
          timeout: 3m
    artifacts:
      include: ["**/*.go", "**/go.mod", "**/go.sum", "**/README.md"]
      exclude: ["**/.vally/**", "**/vendor/**", "**/*.test"]
