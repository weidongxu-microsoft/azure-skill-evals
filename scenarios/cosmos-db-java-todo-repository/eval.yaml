name: cosmos-db-java-todo-repository
description: Compare Azure tooling for a production-oriented Cosmos DB Java repository
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-java-todo-repository
    prompt: |-
      Create a small Java 17 Maven project that implements a ToDo item CRUD repository backed by Azure Cosmos DB (NoSQL API).
      
      The project needs:
      
      - A **model class** (shared by both implementations) for a ToDo item with fields for id, title, description, completed status, created timestamp, and category (where category is the partition key).
      
      - A **synchronous repository class** that performs CRUD operations against Cosmos DB. It should support create, read, update, delete, and a query-by-category method. Each operation should log the request charge (RU cost consumed). The update operation should prevent lost updates — if another process modified the item since it was last read, the update should fail with a clear conflict error rather than silently overwriting the other process's changes. The query method should use safe, parameterized queries and must handle large result sets properly — paginate through results rather than loading everything into memory at once, and log progress as each page is retrieved.
      
      - An **asynchronous repository class** that provides the same CRUD operations. The query method should return results as a stream of pages, and the caller should be able to process each page as it arrives.
      
      - A **configuration/factory class** that connects to the Cosmos DB account using its endpoint from an environment variable. Authentication must use managed identity (no master keys). It should create the database and container if they don't already exist, setting a default TTL (time-to-live) of 90 days on the container and configuring the indexing policy to exclude the `description` field from indexing (since it's never queried on).
      
      - A **Main class** that demos both implementations: runs the full CRUD cycle using the sync repository first (including paginated query output showing page-by-page results), then runs the same operations using the async repository. Print RU costs and results to the console.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: cosmos-db
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/correct-partition-key-usage-category-path-partitionkey-i
              description: |-
                - Container definition uses partition-key path `/category`.
                - Todo category value is supplied as the partition key for point reads, updates, and deletes.
                - Repository methods preserve ID + category value flow.
              weight: 1
              pass_threshold: 1
            - name: prompt/etag-based-optimistic-concurrency-captures-etag-from-rea
              description: |-
                - Read response exposes the current ETag.
                - Update passes that ETag as a conditional replacement precondition.
                - Missing or stale ETag does not become an unconditional overwrite.
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-412-precondition-failed-as-a-specific-error-case
              description: |-
                - HTTP 412 from conditional replacement is detected separately.
                - Return or raise a clear lost-update conflict result.
                - Do not silently retry the stale write as unconditional.
              weight: 1
              pass_threshold: 1
            - name: prompt/parameterized-queries-using-sqlqueryspec-with-sqlparamet
              description: |-
                - Category query uses a parameterized SQL predicate.
                - Requested category value is bound through `SqlParameter` or an equivalent current API.
                - Do not concatenate the category value into SQL text.
              weight: 1
              pass_threshold: 1
            - name: prompt/page-by-page-iteration-using-iterablebypage-or-cosmospag
              description: |-
                - Synchronous category query is consumed page by page.
                - `iterableByPage(...)` or an equivalent current paging API is valid.
                - Per-page handling occurs before aggregating all items.
              weight: 1
              pass_threshold: 1
            - name: prompt/configurable-page-size-via-queryrequestoptions-setmaxite
              description: |-
                - Page size comes from repository or caller configuration.
                - The configured size flows into the Cosmos query request.
                - `setMaxItemCount` or equivalent current page-size control is valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/logs-continuation-token-and-item-count-per-page
              description: |-
                - For each query page, log or expose the item count.
                - For each query page, log continuation progress or token state.
                - Logging happens per page, not only after all results are consumed.
              weight: 1
              pass_threshold: 1
            - name: prompt/async-query-uses-cosmospagedflux-returning-pages-as-a-st
              description: |-
                - Async category query uses the Cosmos async query surface.
                - Results are exposed or processed as pages in a reactive stream.
                - Each page can be handled without flattening the whole result set first.
              weight: 1
              pass_threshold: 1
            - name: prompt/ttl-configured-at-90-days-7776000-seconds-via-containerp
              description: |-
                - Container creation sets default TTL to 7,776,000 seconds.
                - The TTL is applied to the configured todo container.
                - Equivalent current container-properties APIs are valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/indexing-policy-excludes-description-path
              description: |-
                - Container indexing policy excludes the description field path.
                - The exclusion is applied when creating or configuring the todo container.
                - Other required indexed fields remain usable for repository queries.
              weight: 1
              pass_threshold: 1
            - name: prompt/ru-cost-extracted-from-response-via-getrequestcharge-and
              description: |-
                - CRUD and query responses expose their request charge.
                - Log or return RU cost for each repository operation.
                - Per-page query charges are reported with their corresponding page.
              weight: 1
              pass_threshold: 1
            - name: prompt/catches-cosmosexception-with-status-code-checks-404-409
              description: |-
                - Handle `CosmosException` from repository service operations.
                - Inspect status codes for not found, conflict, and precondition failure cases.
                - Preserve actionable Cosmos diagnostics for unexpected failures.
              weight: 1
              pass_threshold: 1
            - name: prompt/managed-identity-client-factory
              description: |-
                - Cosmos endpoint comes from environment configuration.
                - Managed identity or `DefaultAzureCredential` flows into sync and async Cosmos clients.
                - No account key, connection string, or embedded credential is used.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
            - name: language/reactive-async-service-flow
              description: |-
                - Prompt-required async Azure operations originate from async SDK clients or documented async adapters.
                - Compose reusable async flows with Reactor `Mono`/`Flux` or equivalent nonblocking composition.
                - Do not wrap synchronous clients in an executor or block inside reusable async service methods.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
