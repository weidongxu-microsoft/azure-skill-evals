name: cosmos-db-java-todo-repository
description: Compare Azure tooling for a production-oriented Cosmos DB Java repository
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-java-todo-repository
    prompt: |-
      Create a small Java 17 Maven project that implements a ToDo item CRUD repository backed by Azure Cosmos DB (NoSQL API).

      **Write the code to files (use file-write tools, do not reply with code blocks).**

      The project needs:

      - A **model class** (shared by both implementations) for a ToDo item with fields for id, title, description, completed status, created timestamp, and category (where category is the partition key).

      - A **synchronous repository class** that performs CRUD operations against Cosmos DB. It should support create, read, update, delete, and a query-by-category method. Each operation should log the request charge (RU cost consumed). The update operation should prevent lost updates — if another process modified the item since it was last read, the update should fail with a clear conflict error rather than silently overwriting the other process's changes. The query method should use safe, parameterized queries and must handle large result sets properly — paginate through results rather than loading everything into memory at once, and log progress as each page is retrieved.

      - An **asynchronous repository class** that provides the same CRUD operations. The query method should return results as a stream of pages, and the caller should be able to process each page as it arrives.

      - A **configuration/factory class** that connects to the Cosmos DB account using its endpoint from an environment variable. Authentication must use managed identity (no master keys). It should create the database and container if they don't already exist, setting a default TTL (time-to-live) of 90 days on the container and configuring the indexing policy to exclude the `description` field from indexing (since it's never queried on).

      - A **Main class** that demos both implementations: runs the full CRUD cycle using the sync repository first (including paginated query output showing page-by-page results), then runs the same operations using the async repository.

      Include a complete `pom.xml` that targets Java 17 and pins `com.azure:azure-cosmos` to `4.82.0` and `com.azure:azure-identity` to `1.18.5`.
    tags:
      service: cosmos-db
      plane: data-plane
      language: java
      category: crud
    graders:
      - type: run-command
        name: prompt/source-manifest
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/source-manifest] }
      - type: run-command
        name: prompt/todo-model
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/todo-model] }
      - type: run-command
        name: prompt/secure-container-factory
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/secure-container-factory] }
      - type: run-command
        name: prompt/sync-crud-request-charges
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/sync-crud-request-charges] }
      - type: run-command
        name: prompt/async-crud-request-charges
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/async-crud-request-charges] }
      - type: run-command
        name: prompt/etag-conflict-handling
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/etag-conflict-handling] }
      - type: run-command
        name: prompt/sync-parameterized-pagination
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/sync-parameterized-pagination] }
      - type: run-command
        name: prompt/async-parameterized-pagination
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/async-parameterized-pagination] }
      - type: run-command
        name: prompt/connected-sync-then-async-demo
        weight: 1
        config: { command: node, args: [.vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs, prompt/connected-sync-then-async-demo] }
      - type: run-command
        name: language/build-manifest
        weight: 1
        config: { command: node, args: [.vally/languages/java/check.mjs, language/build-manifest] }
      - type: run-command
        name: language/current-azure-dependencies
        weight: 1
        config: { command: node, args: [.vally/languages/java/check.mjs, language/current-azure-dependencies] }
      - type: run-command
        name: language/current-imports
        weight: 1
        config: { command: node, args: [.vally/languages/java/check.mjs, language/current-imports] }
      - type: run-command
        name: language/client-builder
        weight: 1
        config: { command: node, args: [.vally/languages/java/check.mjs, language/client-builder] }
    environment:
      files:
        - src: tools/check-todo-repository-java.mjs
          dest: .vally/scenarios/cosmos-db-java-todo-repository/tools/check-todo-repository-java.mjs
        - src: tools/todo-repository-java-rules.mjs
          dest: .vally/scenarios/cosmos-db-java-todo-repository/tools/todo-repository-java-rules.mjs
        - src: ../../languages/java/check.mjs
          dest: .vally/languages/java/check.mjs
        - src: ../../languages/java/checks.mjs
          dest: .vally/languages/java/checks.mjs
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
