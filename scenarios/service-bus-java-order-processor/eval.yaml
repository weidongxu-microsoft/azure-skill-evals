name: service-bus-java-order-processor
description: Compare Azure tooling for a production-style Service Bus Java order processor
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: service-bus-dp-java-order-processor
    prompt: |-
      Create a small Java 17 Maven project that implements an order processing system using Azure Service Bus.
      
      The project needs:
      
      - A **model class** for an Order with fields for order ID, customer name, product, quantity, total price, and status (pending/processing/completed/failed). It should be serializable to and from JSON.
      
      - A **sender class** (both sync and async versions) that publishes order messages to a Service Bus queue. It should support sending individual orders and sending a batch of orders efficiently (respecting the maximum batch size so messages aren't rejected). Each message should carry the order ID as a correlation property, and orders above a certain dollar threshold should be sent as high-priority with a scheduled delivery delay of 30 seconds (to allow for fraud review before processing).
      
      - A **processor class** (both sync and async versions) that receives and processes orders from the queue. It should handle messages as they arrive, deserialize them, and log the results. If processing fails (e.g., a deserialization error), the message should be sent to the dead-letter queue with a reason string rather than being silently abandoned. The processor should also be able to read from the dead-letter queue so failed messages can be inspected and reprocessed. It should guarantee that orders from the same customer are processed in sequence, not interleaved with other customers' orders.
      
      - A **Main class** that demos both implementations: connects to the Service Bus namespace (from an environment variable) with managed identity, runs the full send/receive/dead-letter cycle using the sync implementation first, then repeats with the async implementation.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: service-bus
      plane: data-plane
      language: java
      category: streaming
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/sender-uses-sender-queuename-buildclient-chain-or-async
              description: |-
                - Build a queue sender for the configured queue.
                - Sync and async sender variants are valid where the flow requires both.
                - Sender publishes JSON order messages through Service Bus.
              weight: 1
              pass_threshold: 1
            - name: prompt/receives-orders-with-session-aware-processor-or-receiver
              description: |-
                - Receive orders with a session-aware processor or session receiver.
                - Preserve the accepted session lock while processing messages.
                - Maintain per-customer ordering within each session.
              weight: 1
              pass_threshold: 1
            - name: prompt/batch-sending-creates-servicebusmessagebatch-checks-trya
              description: |-
                - Create Service Bus message batches for order publishing.
                - Check whether each order message is accepted into the batch.
                - Send only populated accepted batches.
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-the-case-where-a-message-doesnt-fit-in-the-curre
              description: |-
                - Rejected message from a non-empty batch starts or retries in a new batch.
                - Message too large for an empty batch is surfaced as an error.
                - The sender does not silently drop rejected orders.
              weight: 1
              pass_threshold: 1
            - name: prompt/high-priority-scheduling
              description: |-
                - Compare total price with a configurable priority threshold.
                - Mark qualifying orders as high priority.
                - Schedule qualifying messages for delivery about 30 seconds later.
              weight: 1
              pass_threshold: 1
            - name: prompt/correlation-sets-order-id-as-correlation-property-via-se
              description: |-
                - Order ID flows into message correlation ID or an equivalent correlation property.
                - Correlation is set for sync and async published orders.
                - Received logs preserve order context.
              weight: 1
              pass_threshold: 1
            - name: prompt/order-processing-and-settlement
              description: |-
                - Deserialize each received order and perform the processing transition.
                - Log the processing result with order context.
                - Complete successful messages; dead-letter failed messages with a reason.
              weight: 1
              pass_threshold: 1
            - name: prompt/dead-letter-reprocessing
              description: |-
                - Read failed messages from the dead-letter subqueue.
                - Log them for inspection and provide a path to process and settle them again.
              weight: 1
              pass_threshold: 1
            - name: prompt/session-aware-processing-uses-sessionprocessor-or-sessio
              description: |-
                - Configure session-aware receiving for customer-ordered messages.
                - Session processor or session receiver APIs are valid.
                - Non-session receiver alone does not satisfy ordered processing.
              weight: 1
              pass_threshold: 1
            - name: prompt/session-id-keyed-by-customer-name-for-ordered-processing
              description: |-
                - Derive a stable session ID from customer identity.
                - Messages for the same customer use the same session ID.
                - Different customers can be processed in separate sessions.
              weight: 1
              pass_threshold: 1
            - name: prompt/processing-error-reporting
              description: |-
                - Report deserialization and processing failures with available message or processor context.
                - Do not silently abandon failed messages.
              weight: 1
              pass_threshold: 1
            - name: prompt/service-bus-project-and-auth
              description: |-
                - Declare the Service Bus and identity dependencies in a Java 17 Maven project.
                - Read the fully qualified Service Bus namespace from an environment variable.
                - Authenticate sync and async clients with managed identity.
              weight: 1
              pass_threshold: 1
            - name: prompt/order-json-model
              description: |-
                - Model order ID, customer name, product, quantity, total price, and status.
                - Restrict status to pending, processing, completed, or failed.
                - Support JSON serialization and deserialization with a valid Java JSON approach.
              weight: 1
              pass_threshold: 1
            - name: prompt/ordered-main-demo
              description: |-
                - Run the full sync send/receive/dead-letter cycle first.
                - Then run the corresponding async cycle.
                - Keep the application alive only as needed for active processing and finish cleanly.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/reactive-async-service-flow
              description: |-
                - Prompt-required async Azure operations originate from async SDK clients or documented async adapters.
                - Compose reusable async flows with Reactor `Mono`/`Flux` or equivalent nonblocking composition.
                - Do not wrap synchronous clients in an executor or block inside reusable async service methods.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - Stop or close processor-style clients after each processing cycle.
                - Close senders, receivers, and session clients that own a lifecycle.
                - Finish sync and async demos cleanly after settlement/dead-letter work.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
