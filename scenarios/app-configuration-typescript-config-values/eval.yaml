name: app-configuration-typescript-config-values
description: Compare Azure tooling for an App Configuration TypeScript CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-typescript-crud
    prompt: |-
      Write a TypeScript program
      that manages configuration settings in Azure App Configuration:
      1. Create an AppConfigurationClient using a connection string
      2. Set a configuration setting with key "app:Settings:FontSize" and value "24"
      3. Set a setting with label "Production"
      4. Get the setting by key and print its value
      5. List all settings matching the key filter "app:Settings:*" using listConfigurationSettings
      6. Create a feature flag configuration setting for "BetaFeature"
      7. Delete the setting by key
      
      Show required npm package (@azure/app-configuration) and
      proper error handling with RestError.
    tags:
      service: app-configuration
      plane: data-plane
      language: typescript
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/azure-app-configuration-npm-package
              description: |-
                `@azure/app-configuration` npm package
              weight: 1
              pass_threshold: 1
            - name: prompt/appconfigurationclient-constructor-with-connection-strin
              description: |-
                `AppConfigurationClient` constructor with connection string
              weight: 1
              pass_threshold: 1
            - name: prompt/setconfigurationsetting-with-key-value-label
              description: |-
                `setConfigurationSetting()` with key, value, label
              weight: 1
              pass_threshold: 1
            - name: prompt/getconfigurationsetting-by-key-and-label
              description: |-
                `getConfigurationSetting()` by key and label
              weight: 1
              pass_threshold: 1
            - name: prompt/listconfigurationsettings-with-listconfigurationsettingo
              description: |-
                `listConfigurationSettings()` with `ListConfigurationSettingOptions`
              weight: 1
              pass_threshold: 1
            - name: prompt/feature-flag-settings-with-featureflagcontenttype
              description: |-
                Feature flag settings with `featureFlagContentType`
              weight: 1
              pass_threshold: 1
            - name: prompt/deleteconfigurationsetting-and-resterror-handling
              description: |-
                `deleteConfigurationSetting()` and `RestError` handling
              weight: 1
              pass_threshold: 1
            - name: prompt/async-iteration-with-for-await-of-pattern
              description: |-
                Async iteration with `for await...of` pattern
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
