name: app-configuration-typescript-config-values
description: Compare Azure tooling for an App Configuration TypeScript CRUD task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-typescript-crud
    prompt: |-
      Write a TypeScript program that manages configuration settings in Azure App Configuration.

      Write the code to files. Do not reply with code blocks.

      1. Create an AppConfigurationClient using a connection string.
      2. Set a configuration setting with key "app:Settings:FontSize" and value "24".
      3. Set a setting with label "Production".
      4. Get the setting by key and print its value.
      5. List settings with key filter "app:Settings:*" using listConfigurationSettings and async iteration.
      6. Create an enabled feature flag setting for "BetaFeature".
      7. Delete the setting by key.

      Show the @azure/app-configuration npm package and handle errors with status-code inspection.
    tags:
      service: app-configuration
      plane: data-plane
      language: typescript
      category: crud
    graders:
      - type: run-command
        name: prompt/app-configuration-package
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-typescript-config-values/tools/check-app-configuration-typescript.mjs
            - prompt/app-configuration-package
      - type: run-command
        name: prompt/configuration-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-typescript-config-values/tools/check-app-configuration-typescript.mjs
            - prompt/configuration-client
      - type: run-command
        name: prompt/set-settings
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-typescript-config-values/tools/check-app-configuration-typescript.mjs
            - prompt/set-settings
      - type: run-command
        name: prompt/production-label
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-typescript-config-values/tools/check-app-configuration-typescript.mjs
            - prompt/production-label
      - type: run-command
        name: prompt/get-list-settings
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-typescript-config-values/tools/check-app-configuration-typescript.mjs
            - prompt/get-list-settings
      - type: run-command
        name: prompt/enabled-feature-flag
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-typescript-config-values/tools/check-app-configuration-typescript.mjs
            - prompt/enabled-feature-flag
      - type: run-command
        name: prompt/delete-error
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/app-configuration-typescript-config-values/tools/check-app-configuration-typescript.mjs
            - prompt/delete-error
      - type: run-command
        name: language/package-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/package-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/async-await
      - type: run-command
        name: language/typescript-config
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/typescript-config
    environment:
      files:
        - src: tools/check-app-configuration-typescript.mjs
          dest: .vally/scenarios/app-configuration-typescript-config-values/tools/check-app-configuration-typescript.mjs
        - src: tools/app-configuration-typescript-rules.mjs
          dest: .vally/scenarios/app-configuration-typescript-config-values/tools/app-configuration-typescript-rules.mjs
        - src: ../../languages/typescript/check.mjs
          dest: .vally/languages/typescript/check.mjs
        - src: ../../languages/typescript/checks.mjs
          dest: .vally/languages/typescript/checks.mjs
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
