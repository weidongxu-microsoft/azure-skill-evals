name: app-configuration-python-feature-flags
description: Compare Azure tooling for an App Configuration Python feature flag task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-python-feature-flags
    prompt: |-
      Create a Python project that implements a feature flag and configuration management system backed by Azure App Configuration.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      The project needs:
      
      - A **configuration service module** (both sync and async versions) that retrieves settings from App Configuration. It should support fetching a single setting by key, fetching a setting with a specific label (to distinguish between environments like "production" vs "staging"), and listing all settings that match a key prefix (returned as a dictionary). It should also avoid re-downloading values that haven't changed since the last read — minimize unnecessary network traffic when polling for config changes.
      
      - A **feature flag evaluator module** that reads feature flags from App Configuration. Feature flags in App Configuration use the `.appconfig.featureflag/` key prefix and store their state as a JSON payload. The evaluator should be able to check if a flag is enabled, and also support percentage-based rollout — if a flag is configured for a percentage rollout (e.g., 30% of users), the evaluator should deterministically decide whether a given user ID falls within the rollout percentage using a consistent hash, so the same user always gets the same result.
      
      - A **configuration watcher module** that periodically polls for configuration changes. It should accept a list of "sentinel" keys to watch and a polling interval. When a sentinel key's value changes, the watcher should trigger a full refresh of all cached configuration. This is the recommended pattern for coordinating config updates in App Configuration.
      
      - A **main script** that demos both implementations: connecting to App Configuration (endpoint from environment variable, authenticated with `DefaultAzureCredential`), reading some config values with labels, evaluating feature flags for a few sample user IDs with percentage rollout, and starting the config watcher to detect a change. Run the full demo with the sync implementation first, then repeat with the async implementation.
      
      Include a `requirements.txt` with the necessary Azure SDK dependencies.
    tags:
      service: app-configuration
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/lists-settings-filtered-by-key-prefix-using-key-filter
              description: |-
                Lists settings filtered by key prefix using `key_filter`
              weight: 1
              pass_threshold: 1
            - name: prompt/implements-conditional-reads-using-match-condition-with
              description: |-
                Implements conditional reads using `match_condition` with `MatchConditions.IfModified` and the setting's `etag`
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-304-not-modified-setting-unchanged-since-last-re
              description: |-
                Handles 304 Not Modified (setting unchanged since last read)
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-appconfig-featureflag-prefix-for-feature-flag-keys
              description: |-
                Uses `.appconfig.featureflag/` prefix for feature flag keys
              weight: 1
              pass_threshold: 1
            - name: prompt/parses-the-json-payload-in-feature-flag-setting-values
              description: |-
                Parses the JSON payload in feature flag setting values
              weight: 1
              pass_threshold: 1
            - name: prompt/implements-deterministic-percentage-rollout-consistent-h
              description: |-
                Implements deterministic percentage rollout (consistent hash via `hashlib`, not `random`)
              weight: 1
              pass_threshold: 1
            - name: prompt/implements-sentinel-key-watching-with-configurable-polli
              description: |-
                Implements sentinel key watching with configurable polling interval
              weight: 1
              pass_threshold: 1
            - name: prompt/detects-sentinel-value-change-via-etag-or-value-comparis
              description: |-
                Detects sentinel value change via ETag or value comparison and triggers full refresh
              weight: 1
              pass_threshold: 1
            - name: prompt/async-version-uses-azure-appconfiguration-aio-azureappco
              description: |-
                Async version uses `azure.appconfiguration.aio.AzureAppConfigurationClient`
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
