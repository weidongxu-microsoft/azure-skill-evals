name: storage-typescript-crud-blobs
description: Compare Azure tooling for a Blob Storage TypeScript CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-typescript-crud-blobs
    prompt: |-
      Write a TypeScript program that
      performs CRUD operations on Azure Blob Storage:
      1. Create a BlobServiceClient using DefaultAzureCredential
      2. Create a container named "my-container" if it doesn't exist
      3. Upload a string "Hello Azure!" as a block blob named "greeting.txt"
      4. List all blobs in the container and log their names
      5. Download the blob and print its content as a string
      6. Delete the blob and then delete the container
      
      Show required npm packages and proper error handling with RestError.
      Use async/await throughout.
    tags:
      service: storage
      plane: data-plane
      language: typescript
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/installing-azure-storage-blob-and-azure-identity-package
              description: |-
                Installing `@azure/storage-blob` and `@azure/identity` packages
              weight: 1
              pass_threshold: 1
            - name: prompt/blobserviceclient-construction-with-defaultazurecredenti
              description: |-
                `BlobServiceClient` construction with `DefaultAzureCredential`
              weight: 1
              pass_threshold: 1
            - name: prompt/containerclient-createifnotexists
              description: |-
                `ContainerClient.createIfNotExists()`
              weight: 1
              pass_threshold: 1
            - name: prompt/blockblobclient-upload-or-uploaddata-for-string-content
              description: |-
                `BlockBlobClient.upload()` or `uploadData()` for string content
              weight: 1
              pass_threshold: 1
            - name: prompt/containerclient-listblobsflat-async-iteration
              description: |-
                `ContainerClient.listBlobsFlat()` async iteration
              weight: 1
              pass_threshold: 1
            - name: prompt/blobclient-download-and-reading-the-response-stream
              description: |-
                `BlobClient.download()` and reading the response stream
              weight: 1
              pass_threshold: 1
            - name: prompt/blobclient-delete-and-containerclient-delete
              description: |-
                `BlobClient.delete()` and `ContainerClient.delete()`
              weight: 1
              pass_threshold: 1
            - name: prompt/resterror-handling-with-statuscode
              description: |-
                `RestError` handling with `statusCode`
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
