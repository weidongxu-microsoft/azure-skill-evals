name: key-vault-python-secret-config
description: Compare Azure tooling for a Python Key Vault-backed configuration provider
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-python-secret-config
    prompt: |-
      Create a Python project that implements an application configuration provider backed by Azure Key Vault.

      Write the code to files. Do not reply with code blocks.

      Implement synchronous and asynchronous providers using the Azure Key Vault Secrets clients. Each provider must get the latest secret or a requested version, return a caller-provided default for ResourceNotFoundError, and expose the secret expiry time. Add an in-memory cache that bulk-loads required keys, reads cached values, refreshes one key on demand, and automatically refreshes secrets whose expiry is inside a configurable warning window.

      Build clients from an environment-provided vault URL with DefaultAzureCredential and no embedded credentials. Add sync and async rotation helpers that begin deletion, wait for the returned long-running-operation poller, purge the completed deletion so the soft-deleted name can be reused, and only then create the replacement value with an expiry date.

      Demonstrate the complete sync flow first and the complete async flow second: bulk load, cached reads, one-key refresh, near-expiry warning/refresh, and rotation.

      Include active runtime pins azure-identity==1.25.3 and
      azure-keyvault-secrets==4.11.2.
    tags:
      service: key-vault
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: run-command
        name: prompt/sdk-packages
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs, prompt/sdk-packages] }
      - type: run-command
        name: prompt/managed-identity-configuration
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs, prompt/managed-identity-configuration] }
      - type: run-command
        name: prompt/sync-provider
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs, prompt/sync-provider] }
      - type: run-command
        name: prompt/async-provider
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs, prompt/async-provider] }
      - type: run-command
        name: prompt/expiry-aware-cache
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs, prompt/expiry-aware-cache] }
      - type: run-command
        name: prompt/sync-safe-rotation
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs, prompt/sync-safe-rotation] }
      - type: run-command
        name: prompt/async-safe-rotation
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs, prompt/async-safe-rotation] }
      - type: run-command
        name: prompt/connected-demo
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs, prompt/connected-demo] }
      - type: run-command
        name: language/correct-imports
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/correct-imports] }
      - type: run-command
        name: language/default-azure-credential
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/default-azure-credential] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/client-lifecycle] }
      - type: run-command
        name: language/async-client
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/async-client] }
      - type: run-command
        name: language/exception-handling
        weight: 1
        config: { command: node, args: [.vally/languages/python/check.mjs, language/exception-handling] }
    environment:
      files:
        - src: tools/check-secret-config-python.mjs
          dest: .vally/scenarios/key-vault-python-secret-config/tools/check-secret-config-python.mjs
        - src: tools/secret-config-rules.mjs
          dest: .vally/scenarios/key-vault-python-secret-config/tools/secret-config-rules.mjs
        - src: tools/secret_config_analyzer.py
          dest: .vally/scenarios/key-vault-python-secret-config/tools/secret_config_analyzer.py
        - src: ../../languages/python/check.mjs
          dest: .vally/languages/python/check.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
