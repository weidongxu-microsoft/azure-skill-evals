name: key-vault-python-secret-config
description: Compare Azure tooling for a Python Key Vault-backed configuration provider
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-python-secret-config
    prompt: |-
      Create a Python project that implements an application configuration provider backed by Azure Key Vault.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      The project needs:
      
      - A **secret provider module** (both sync and async versions) that retrieves secrets from Key Vault by name, with graceful handling when a secret doesn't exist (return a default value instead of crashing). It should also be able to retrieve a specific version of a secret (not just the latest), and inspect a secret's expiry date so the caller can tell if a secret is about to expire.
      
      - A **caching layer** on top of the provider that stores secret values in memory after first retrieval. It should support bulk-loading a predefined set of required config keys at startup, on-demand refresh of individual keys, and automatic re-fetch of any secret whose expiry date is within a configurable warning window (e.g., 7 days out).
      
      - A **configuration/factory module** that connects securely to the Key Vault using the vault URL from an environment variable. The application runs in Azure and should authenticate using `DefaultAzureCredential` — no client secrets or certificates in code.
      
      - A **secret rotation helper** that safely rotates a secret: delete the old secret, ensure the deletion is fully complete, then create the new secret with an updated value and expiry date. The rotation must be safe — don't assume deletion is instantaneous, since Key Vault's soft-delete feature means the secret may not be immediately gone. Use the long-running operation poller returned by `begin_delete_secret()`.
      
      - A **main script** that demos both implementations: loading several config keys at startup, reading them from cache, refreshing one, printing a warning if any secret is near expiry, and performing a secret rotation (delete old, wait for completion, create new). Run the full demo with the sync implementation first, then repeat with the async implementation.
      
      Include a `requirements.txt` with the necessary Azure SDK dependencies.
    tags:
      service: key-vault
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. Do not add list
            numbers, prefixes, suffixes, or other formatting to criterion names.
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - diff
          criteria:
            - name: prompt/secret-versioning-retrieves-specific-version-via-get-sec
              description: |-
                Secret versioning: retrieves specific version via `get_secret(name, version=version)`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/secret-expiry-accesses-secret-properties-expires-on
              description: |-
                Secret expiry: accesses `secret.properties.expires_on`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/configurable-warning-window-for-near-expiry-detection
              description: |-
                Configurable warning window for near-expiry detection
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/in-memory-caching-e-g-dict-with-bulk-load-and-single-key
              description: |-
                In-memory caching (e.g., `dict`) with bulk-load and single-key refresh
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/secret-rotation-uses-begin-delete-secret-as-a-long-runni
              description: |-
                Secret rotation uses `begin_delete_secret()` as a long-running operation
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/sync-uses-lropoller-calls-wait-or-result-to-wait-for-del
              description: |-
                Sync uses `LROPoller` — calls `.wait()` or `.result()` to wait for delete completion
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/async-uses-the-async-poller-await-poller-wait-for-delete
              description: |-
                Async uses the async poller — `await poller.wait()` for delete completion
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/creates-new-secret-only-after-delete-completes-not-concu
              description: |-
                Creates new secret only after delete completes (not concurrently)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/async-version-uses-azure-keyvault-secrets-aio-secretclie
              description: |-
                Async version uses `azure.keyvault.secrets.aio.SecretClient` ### Scenario-Specific Error Handling
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/returns-a-default-value-when-secret-is-not-found-resourc
              description: |-
                Returns a default value when secret is not found (`ResourceNotFoundError`) ### Anti-Patterns (scenario-specific)
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/not-using-fire-and-forget-delete-secret-without-the-long
              description: |-
                NOT using fire-and-forget `delete_secret()` without the long-running operation
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/not-ignoring-the-poller-and-creating-the-new-secret-imme
              description: |-
                NOT ignoring the poller and creating the new secret immediately
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
