name: storage-dotnet-polling-create-account
description: Compare Azure tooling for a .NET Storage management-plane polling task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-mp-dotnet-polling
    prompt: |-
      Write a C# program that creates
      an Azure Storage Account using the management plane SDK and properly handles the
      long-running operation (LRO):
      1. Start the create operation using CreateOrUpdateAsync
      2. Poll for completion using WaitForCompletionAsync
      3. Show how to check the operation status while it's in progress
      4. Handle timeout scenarios where the operation takes too long
      5. Demonstrate the difference between WaitForCompletion and manual polling
      
      Use Azure.ResourceManager.Storage with DefaultAzureCredential. Show required
      NuGet packages and explain the ArmOperation<T> pattern.
    tags:
      service: storage
      plane: management-plane
      language: dotnet
      category: polling
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - diff
          criteria:
            - name: prompt/storageaccountcollection-createorupdateasync-returning-a
              description: |-
                `StorageAccountCollection.CreateOrUpdateAsync()` returning `ArmOperation<StorageAccountResource>`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/armoperation-t-waitforcompletionasync-for-simple-complet
              description: |-
                `ArmOperation<T>.WaitForCompletionAsync()` for simple completion
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/armoperation-t-hascompleted-and-updatestatusasync-for-ma
              description: |-
                `ArmOperation<T>.HasCompleted` and `UpdateStatusAsync()` for manual polling
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/armoperation-t-value-to-get-the-result-after-completion
              description: |-
                `ArmOperation<T>.Value` to get the result after completion
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/timeout-handling-with-cancellationtoken
              description: |-
                Timeout handling with `CancellationToken`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/waituntil-completed-vs-waituntil-started-parameter
              description: |-
                `WaitUntil.Completed` vs `WaitUntil.Started` parameter
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/error-handling-when-the-lro-fails
              description: |-
                Error handling when the LRO fails
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
