name: storage-dotnet-polling-create-account
description: Compare Azure tooling for a .NET Storage management-plane polling task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-mp-dotnet-polling
    prompt: |-
      Write a complete C# console application that creates an Azure storage account with the current Azure.ResourceManager.Storage SDK and explicitly handles the long-running operation.

      Write the code to files. Do not reply with code blocks.

      Read the subscription ID, existing resource group name, and storage account name from AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP_NAME, and AZURE_STORAGE_ACCOUNT_NAME. Read AZURE_LOCATION with "eastus" as its default. Authenticate with DefaultAzureCredential, construct ArmClient with the subscription ID, get its default subscription, get the existing resource group, and use that resource group's storage account collection.

      Build StorageAccountCreateOrUpdateContent for Standard_LRS, StorageV2, and the configured location. Start CreateOrUpdateAsync with WaitUntil.Started and retain its ArmOperation<StorageAccountResource>.

      Configure a finite timeout with CancellationTokenSource. Manually poll that exact create operation by checking HasCompleted and awaiting UpdateStatusAsync with the timeout token. Then await the same operation's WaitForCompletionAsync with the timeout token before using its returned StorageAccountResource. Print the created account's returned name and one returned property.

      Handle timeout cancellation and RequestFailedException meaningfully. Target net8.0 and pin Azure.ResourceManager.Storage 1.7.0 and Azure.Identity 1.21.0 exactly.
    tags:
      service: storage
      plane: management-plane
      language: dotnet
      category: polling
    graders:
      - type: run-command
        name: prompt/storage-manifest
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs, prompt/storage-manifest] }
      - type: run-command
        name: prompt/credential-resource-path
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs, prompt/credential-resource-path] }
      - type: run-command
        name: prompt/storage-account-content
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs, prompt/storage-account-content] }
      - type: run-command
        name: prompt/create-started-operation
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs, prompt/create-started-operation] }
      - type: run-command
        name: prompt/connected-manual-polling
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs, prompt/connected-manual-polling] }
      - type: run-command
        name: prompt/exact-operation-completion
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs, prompt/exact-operation-completion] }
      - type: run-command
        name: prompt/created-account-output
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs, prompt/created-account-output] }
      - type: run-command
        name: prompt/timeout-request-errors
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs, prompt/timeout-request-errors] }
      - type: run-command
        name: language/project-manifest
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/project-manifest] }
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/current-azure-packages] }
      - type: run-command
        name: language/async-await
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/async-await] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/client-lifecycle] }
    environment:
      files:
        - src: tools/check-storage-dotnet-polling.mjs
          dest: .vally/scenarios/storage-dotnet-polling-create-account/tools/check-storage-dotnet-polling.mjs
        - src: tools/storage-dotnet-polling-rules.mjs
          dest: .vally/scenarios/storage-dotnet-polling-create-account/tools/storage-dotnet-polling-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
