name: cosmos-db-dotnet-error-handling
description: Compare Azure tooling for a Cosmos DB .NET error-handling task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-dotnet-error-handling
    prompt: |-
      How do I properly handle errors when working with Azure Cosmos DB in .NET?
      I'm particularly concerned about throttling — when my application exceeds
      the provisioned Request Units (RU/s), I get 429 errors. Show me how to
      catch CosmosException, extract the status code and retry-after header,
      and implement proper retry logic. Also cover handling 404 (item not found)
      and 409 (conflict) responses. Use the Microsoft.Azure.Cosmos SDK v3.
    tags:
      service: cosmos-db
      plane: data-plane
      language: dotnet
      category: error-handling
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/cosmosexception-as-the-primary-exception-type
              description: |-
                `CosmosException` as the primary exception type
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/extracting-statuscode-substatuscode-and-retryafter-prope
              description: |-
                Extracting `StatusCode`, `SubStatusCode`, and `RetryAfter` properties
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handling-429-toomanyrequests-with-retry-after-backoff
              description: |-
                Handling 429 (TooManyRequests) with retry-after backoff
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handling-404-notfound-for-missing-items-or-containers
              description: |-
                Handling 404 (NotFound) for missing items or containers
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/handling-409-conflict-for-duplicate-items
              description: |-
                Handling 409 (Conflict) for duplicate items
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/cosmosclientoptions-maxretryattemptsonratelimitedrequest
              description: |-
                `CosmosClientOptions.MaxRetryAttemptsOnRateLimitedRequests` configuration
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/ru-consumption-tracking-via-requestcharge-on-responses
              description: |-
                RU consumption tracking via `RequestCharge` on responses
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/diagnostics-string-for-troubleshooting
              description: |-
                Diagnostics string for troubleshooting
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
