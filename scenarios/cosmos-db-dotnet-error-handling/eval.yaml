name: cosmos-db-dotnet-error-handling
description: Compare Azure tooling for a Cosmos DB .NET error-handling task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-dotnet-error-handling
    prompt: |-
      Write a runnable C# console application that demonstrates proper error handling with the Microsoft.Azure.Cosmos v3 SDK.

      Write the code to files. Do not reply with code blocks.

      Perform a real asynchronous Cosmos DB item or query operation and:

      1. Catch CosmosException as the primary service exception.
      2. Extract StatusCode, SubStatusCode, RetryAfter, and Diagnostics.
      3. Handle 429 TooManyRequests with bounded retry logic that awaits the exception's RetryAfter delay before retrying the operation.
      4. Handle 404 NotFound and 409 Conflict explicitly.
      5. Configure CosmosClientOptions.MaxRetryAttemptsOnRateLimitedRequests.
      6. Track RequestCharge from the successful operation response.

      Target net8.0 and show the required, exact NuGet package version.
    tags:
      service: cosmos-db
      plane: data-plane
      language: dotnet
      category: error-handling
    graders:
      - type: run-command
        name: prompt/cosmos-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-error-handling/tools/check-cosmos-dotnet-error-handling.mjs
            - prompt/cosmos-manifest
      - type: run-command
        name: prompt/client-retry-options
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-error-handling/tools/check-cosmos-dotnet-error-handling.mjs
            - prompt/client-retry-options
      - type: run-command
        name: prompt/cosmos-operation
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-error-handling/tools/check-cosmos-dotnet-error-handling.mjs
            - prompt/cosmos-operation
      - type: run-command
        name: prompt/exception-details
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-error-handling/tools/check-cosmos-dotnet-error-handling.mjs
            - prompt/exception-details
      - type: run-command
        name: prompt/throttling-retry
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-error-handling/tools/check-cosmos-dotnet-error-handling.mjs
            - prompt/throttling-retry
      - type: run-command
        name: prompt/not-found-conflict
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-error-handling/tools/check-cosmos-dotnet-error-handling.mjs
            - prompt/not-found-conflict
      - type: run-command
        name: prompt/request-charge
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-dotnet-error-handling/tools/check-cosmos-dotnet-error-handling.mjs
            - prompt/request-charge
      - type: run-command
        name: language/project-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/project-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/async-await
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/client-lifecycle
    environment:
      files:
        - src: tools/check-cosmos-dotnet-error-handling.mjs
          dest: .vally/scenarios/cosmos-db-dotnet-error-handling/tools/check-cosmos-dotnet-error-handling.mjs
        - src: tools/cosmos-dotnet-error-handling-rules.mjs
          dest: .vally/scenarios/cosmos-db-dotnet-error-handling/tools/cosmos-dotnet-error-handling-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
