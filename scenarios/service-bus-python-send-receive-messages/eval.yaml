name: service-bus-python-send-receive-messages
description: Compare Azure tooling for a Service Bus Python send and receive task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: service-bus-dp-python-send-receive-messages
    prompt: |-
      Write a Python script that demonstrates messaging with Azure Service Bus.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      3. Send a batch of 5 messages using a ServiceBusMessageBatch
      4. Get a receiver for the queue and receive messages
      5. Complete a message with receiver.complete_message() after processing
      6. Demonstrate the async pattern using aio module for higher throughput
      7. Send to a topic and receive from a subscription
      
      Show required pip packages and proper context manager patterns (with statements).
    tags:
      service: service-bus
      plane: data-plane
      language: python
      category: messaging
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - diff
          criteria:
            - name: prompt/azure-servicebus-pip-package
              description: |-
                `azure-servicebus` pip package
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/servicebussender-via-get-queue-sender-or-get-topic-sende
              description: |-
                `ServiceBusSender` via `get_queue_sender()` or `get_topic_sender()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/servicebusmessage-and-servicebusmessagebatch
              description: |-
                `ServiceBusMessage` and `ServiceBusMessageBatch`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/servicebusreceiver-via-get-queue-receiver-or-get-subscri
              description: |-
                `ServiceBusReceiver` via `get_queue_receiver()` or `get_subscription_receiver()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/complete-message-abandon-message-dead-letter-message
              description: |-
                `complete_message()`, `abandon_message()`, `dead_letter_message()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/context-manager-pattern-with-statements-for-resource-cle
              description: |-
                Context manager pattern (`with` statements) for resource cleanup
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/async-variants-in-azure-servicebus-aio
              description: |-
                Async variants in `azure.servicebus.aio`
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
