name: key-vault-dotnet-polling-create-vault
description: Compare Azure tooling for a .NET Key Vault management-plane polling task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-mp-dotnet-polling
    prompt: |-
      Write a complete C# console application that creates an Azure Key Vault with the current Azure.ResourceManager.KeyVault SDK and explicitly handles the long-running operation.

      Write the code to files. Do not reply with code blocks.

      Read the subscription ID, existing resource group name, vault name, and tenant ID from AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP_NAME, AZURE_KEY_VAULT_NAME, and AZURE_TENANT_ID. Read AZURE_LOCATION with "eastus" as its default. Authenticate with DefaultAzureCredential, construct ArmClient with the subscription ID, get its default subscription, get the existing resource group, and use that resource group's Key Vault collection.

      Build KeyVaultCreateOrUpdateContent with KeyVaultProperties for the tenant and a Standard Key Vault SKU. Enable RBAC authorization, soft delete, and purge protection. Start CreateOrUpdateAsync with WaitUntil.Started, retain its ArmOperation<KeyVaultResource>, and explicitly await that exact operation's completion before using its value.

      After completion, create a SecretClient for the created vault's returned VaultUri using the same DefaultAzureCredential instance, and print the created vault name and endpoint. Do not derive the endpoint independently from an unrelated name or URL.

      Include meaningful RequestFailedException handling. Any other catch path must preserve or report the causal exception. Target net8.0 and pin Azure.ResourceManager.KeyVault 1.4.0, Azure.Identity 1.21.0, and Azure.Security.KeyVault.Secrets 4.11.0 exactly.
    tags:
      service: key-vault
      plane: management-plane
      language: dotnet
      category: polling
    graders:
      - type: run-command
        name: prompt/key-vault-manifest
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs, prompt/key-vault-manifest] }
      - type: run-command
        name: prompt/credential-resource-path
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs, prompt/credential-resource-path] }
      - type: run-command
        name: prompt/vault-security-content
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs, prompt/vault-security-content] }
      - type: run-command
        name: prompt/create-started-operation
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs, prompt/create-started-operation] }
      - type: run-command
        name: prompt/exact-operation-completion
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs, prompt/exact-operation-completion] }
      - type: run-command
        name: prompt/connected-secret-client
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs, prompt/connected-secret-client] }
      - type: run-command
        name: prompt/created-vault-output
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs, prompt/created-vault-output] }
      - type: run-command
        name: prompt/request-failed-error
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs, prompt/request-failed-error] }
      - type: run-command
        name: language/project-manifest
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/project-manifest] }
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/current-azure-packages] }
      - type: run-command
        name: language/async-await
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/async-await] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/client-lifecycle] }
    environment:
      files:
        - src: tools/check-key-vault-dotnet-polling.mjs
          dest: .vally/scenarios/key-vault-dotnet-polling-create-vault/tools/check-key-vault-dotnet-polling.mjs
        - src: tools/key-vault-dotnet-polling-rules.mjs
          dest: .vally/scenarios/key-vault-dotnet-polling-create-vault/tools/key-vault-dotnet-polling-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
