name: key-vault-dotnet-polling-create-vault
description: Compare Azure tooling for a .NET Key Vault management-plane polling task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-mp-dotnet-polling
    prompt: |-
      Write a C# program that creates
      an Azure Key Vault using the management plane SDK and handles the long-running
      operation:
      1. Authenticate using DefaultAzureCredential
      2. Create a Key Vault with RBAC authorization enabled in "eastus"
      3. Configure soft-delete and purge protection
      4. Wait for the vault creation to complete using the ArmOperation pattern
      5. Verify the vault is accessible by creating a SecretClient pointing to it
      
      Use Azure.ResourceManager.KeyVault. Show required NuGet packages and how
      to set access policies or RBAC roles during creation.
    tags:
      service: key-vault
      plane: management-plane
      language: dotnet
      category: polling
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/keyvaultcollection-createorupdateasync-returning-armoper
              description: |-
                `KeyVaultCollection.CreateOrUpdateAsync()` returning `ArmOperation<KeyVaultResource>`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/keyvaultcreateorupdatecontent-with-keyvaultproperties
              description: |-
                `KeyVaultCreateOrUpdateContent` with `KeyVaultProperties`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/configuring-enablerbacauthorization-enablesoftdelete-ena
              description: |-
                Configuring `EnableRbacAuthorization`, `EnableSoftDelete`, `EnablePurgeProtection`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/vaultaccesspolicy-vs-rbac-authorization-model
              description: |-
                `VaultAccessPolicy` vs RBAC authorization model
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/armoperation-t-waitforcompletionasync-for-completion
              description: |-
                `ArmOperation<T>.WaitForCompletionAsync()` for completion
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/waituntil-completed-vs-waituntil-started
              description: |-
                `WaitUntil.Completed` vs `WaitUntil.Started`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/tenant-id-and-object-id-configuration
              description: |-
                Tenant ID and object ID configuration
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/error-handling-for-existing-vaults-and-soft-deleted-vaul
              description: |-
                Error handling for existing vaults and soft-deleted vaults
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
