name: storage-java-account-mgmt
description: Compare Azure tooling for an Azure Storage Java account management task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-mp-java-account-mgmt
    prompt: |-
      Write a Java program that manages
      Azure Storage Accounts using the management plane SDK:
      1. Authenticate using DefaultAzureCredential
      2. Create a StorageManager instance with the credential and subscription
      3. Create a new Storage Account with Standard_LRS SKU in "eastus"
      4. List all Storage Accounts in a resource group
      5. Get the properties of the created Storage Account
      6. Update the account to enable blob versioning
      7. Delete the Storage Account
      
      Show required Maven dependency (com.azure.resourcemanager:azure-resourcemanager-storage)
      and proper error handling.
    tags:
      service: storage
      plane: management-plane
      language: java
      category: account-management
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/storage-management-project
              description: |-
                - Declare `com.azure.resourcemanager:azure-resourcemanager-storage`.
                - Declare Azure Identity when it is not already supplied transitively.
                - Use compatible direct versions or an Azure SDK BOM.
              weight: 1
              pass_threshold: 1
            - name: prompt/storage-manager-authentication
              description: |-
                - Create a `DefaultAzureCredential`.
                - Authenticate `StorageManager` with that credential and an Azure profile.
                - Select the configured subscription.
              weight: 1
              pass_threshold: 1
            - name: prompt/storageaccounts-define-withregion-withexistingresourcegr
              description: |-
                - Resource group and account name flow into storage-account creation.
                - Region is exactly `eastus`.
                - SKU is exactly `Standard_LRS`.
                - Use the current public management creation flow.
              weight: 1
              pass_threshold: 1
            - name: prompt/list-storage-accounts
              description: |-
                - List storage accounts in the specified resource group.
                - Iterate the returned management collection and expose each account.
              weight: 1
              pass_threshold: 1
            - name: prompt/get-storage-account
              description: |-
                - Retrieve the created account from its resource group and account name.
                - Read and expose its management properties.
              weight: 1
              pass_threshold: 1
            - name: prompt/enable-blob-versioning
              description: |-
                - Retrieve the account's Blob service properties through the management SDK.
                - Use the public update flow to enable blob versioning.
                - Apply the update and expose the resulting enabled state.
                - Changing an access tier alone does not satisfy this criterion.
              weight: 1
              pass_threshold: 1
            - name: prompt/delete-storage-account
              description: |-
                - Delete the created account by resource group and account name.
                - Treat the management SDK's synchronous `void` deletion as complete; no poller is required.
              weight: 1
              pass_threshold: 1
            - name: prompt/storage-management-failures
              description: |-
                - Handle Azure management or HTTP failures around account operations.
                - Report actionable status or service error details when available.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Resource Manager fluent interfaces, model update stages, and public async accessors awaited at the console boundary are valid.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - Delete the storage account created by the demo.
                - Use the configured resource group and account name for deletion.
                - Do not require a poller when the selected management SDK deletion is synchronous.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
