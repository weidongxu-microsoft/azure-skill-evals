name: storage-java-account-mgmt
description: Compare Azure tooling for an Azure Storage Java account management task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-mp-java-account-mgmt
    prompt: |-
      Write a Java program that manages
      Azure Storage Accounts using the management plane SDK:
      1. Authenticate using DefaultAzureCredential
      2. Create a StorageManager instance with the credential and subscription
      3. Create a new Storage Account with Standard_LRS SKU in "eastus"
      4. List all Storage Accounts in a resource group
      5. Get the properties of the created Storage Account
      6. Update the account to enable blob versioning
      7. Delete the Storage Account
      
      Show required Maven dependency (com.azure.resourcemanager:azure-resourcemanager-storage)
      and proper error handling.
    tags:
      service: storage
      plane: management-plane
      language: java
      category: account-management
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/storage-management-project
              description: |-
                - Declare `com.azure.resourcemanager:azure-resourcemanager-storage`.
                - Declare Azure Identity when it is not already supplied transitively.
                - Use compatible direct versions or an Azure SDK BOM.
              weight: 1
              pass_threshold: 1
            - name: prompt/storage-manager-authentication
              description: |-
                - Create a `DefaultAzureCredential`.
                - Authenticate `StorageManager` with that credential and an Azure profile.
                - Select the configured subscription.
              weight: 1
              pass_threshold: 1
            - name: prompt/storage-account-creation
              description: |-
                - Create a storage account in the target resource group.
                - Use exactly the `eastus` region.
                - Use exactly the `Standard_LRS` SKU.
              weight: 1
              pass_threshold: 1
            - name: prompt/list-storage-accounts
              description: |-
                - List storage accounts in the specified resource group.
                - Iterate the returned management collection and expose each account.
              weight: 1
              pass_threshold: 1
            - name: prompt/get-storage-account
              description: |-
                - Retrieve the created account from its resource group and account name.
                - Read and expose its management properties.
              weight: 1
              pass_threshold: 1
            - name: prompt/enable-blob-versioning
              description: |-
                - Update the account's Blob Service Properties.
                - Enable blob versioning and apply the service-properties update.
                - Changing an access tier alone does not satisfy this criterion.
              weight: 1
              pass_threshold: 1
            - name: prompt/delete-storage-account
              description: |-
                - Delete the created account by resource group and account name.
                - Treat the management SDK's synchronous `void` deletion as complete; no poller is required.
              weight: 1
              pass_threshold: 1
            - name: prompt/storage-management-failures
              description: |-
                - Handle Azure management or HTTP failures around account operations.
                - Report actionable status or service error details when available.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
