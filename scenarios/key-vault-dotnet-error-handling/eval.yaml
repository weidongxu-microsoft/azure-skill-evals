name: key-vault-dotnet-error-handling
description: Compare Azure tooling for a .NET Key Vault error-handling task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-dotnet-error-handling
    prompt: |-
      How do I properly handle errors when working with Azure Key Vault secrets in .NET?
      I need to handle common failures: access denied when RBAC or access policies
      aren't configured correctly (403), secret not found (404), secret version
      conflicts, and throttling when hitting Key Vault rate limits (429).
      Show me try/catch patterns with Azure.Security.KeyVault.Secrets including
      how to extract the error code and HTTP status from RequestFailedException.
    tags:
      service: key-vault
      plane: data-plane
      language: dotnet
      category: error-handling
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - diff
          criteria:
            - name: prompt/requestfailedexception-for-all-key-vault-errors
              description: |-
                `RequestFailedException` for all Key Vault errors
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/extracting-status-and-errorcode-properties
              description: |-
                Extracting `Status` and `ErrorCode` properties
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/403-handling-diagnosing-rbac-vs-access-policy-misconfigu
              description: |-
                403 handling: diagnosing RBAC vs. access policy misconfiguration
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/404-handling-secret-not-found-vs-deleted-secret
              description: |-
                404 handling: secret not found vs. deleted secret
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/429-throttling-key-vault-rate-limits-and-retry-behavior
              description: |-
                429 throttling: Key Vault rate limits and retry behavior
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/soft-delete-and-purge-protection-error-scenarios
              description: |-
                Soft-delete and purge protection error scenarios
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/secretclientoptions-retry-configuration
              description: |-
                `SecretClientOptions` retry configuration
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
