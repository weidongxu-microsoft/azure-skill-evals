name: key-vault-dotnet-error-handling
description: Compare Azure tooling for a .NET Key Vault error-handling task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: key-vault-dp-dotnet-error-handling
    prompt: |-
      Write a runnable C# console application that demonstrates proper error handling with Azure.Security.KeyVault.Secrets.

      Write the code to files. Do not reply with code blocks.

      Use SecretClient with DefaultAzureCredential, perform real asynchronous secret operations, and:

      1. Catch RequestFailedException and use both Status and ErrorCode.
      2. Diagnose 403 access failures by distinguishing Key Vault RBAC role assignments from legacy access policies.
      3. Handle 404 by checking the deleted-secrets collection so the application distinguishes a missing secret from a soft-deleted, recoverable secret.
      4. Handle 409 version or concurrent-update conflicts and the conflict caused by a soft-deleted recoverable name.
      5. Handle 429 throttling and explain the configured Azure SDK retry behavior.
      6. Demonstrate purge-protection handling around a real purge operation.
      7. Configure SecretClientOptions.Retry with bounded exponential retries.

      Target net8.0 and pin Azure.Identity 1.21.0 and Azure.Security.KeyVault.Secrets 4.11.0 exactly.
    tags:
      service: key-vault
      plane: data-plane
      language: dotnet
      category: error-handling
    graders:
      - type: run-command
        name: prompt/key-vault-manifest
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/key-vault-manifest] }
      - type: run-command
        name: prompt/configured-secret-client
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/configured-secret-client] }
      - type: run-command
        name: prompt/key-vault-operation
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/key-vault-operation] }
      - type: run-command
        name: prompt/exception-details
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/exception-details] }
      - type: run-command
        name: prompt/access-denied-diagnosis
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/access-denied-diagnosis] }
      - type: run-command
        name: prompt/not-found-vs-deleted
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/not-found-vs-deleted] }
      - type: run-command
        name: prompt/version-conflict
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/version-conflict] }
      - type: run-command
        name: prompt/throttling-retry
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/throttling-retry] }
      - type: run-command
        name: prompt/soft-delete-purge-protection
        weight: 1
        config: { command: node, args: [.vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs, prompt/soft-delete-purge-protection] }
      - type: run-command
        name: language/project-manifest
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/project-manifest] }
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/current-azure-packages] }
      - type: run-command
        name: language/async-await
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/async-await] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/client-lifecycle] }
    environment:
      files:
        - src: tools/check-key-vault-dotnet-error-handling.mjs
          dest: .vally/scenarios/key-vault-dotnet-error-handling/tools/check-key-vault-dotnet-error-handling.mjs
        - src: tools/key-vault-dotnet-error-handling-rules.mjs
          dest: .vally/scenarios/key-vault-dotnet-error-handling/tools/key-vault-dotnet-error-handling-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
