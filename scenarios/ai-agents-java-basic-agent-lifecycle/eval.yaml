name: ai-agents-java-basic-agent-lifecycle
description: "Can an agent build a complete Azure AI Agents application that creates an agent conversation, runs it to completion, and reads the assistant response?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-agents-dp-java-basic-agent-lifecycle
    prompt: |-
      Create a complete, runnable Java console application that uses the
      `com.azure:azure-ai-agents-persistent` package to run a basic Azure AI Agent
      conversation.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read the Azure AI project endpoint from `PROJECT_ENDPOINT` and the model deployment
        name from `MODEL_DEPLOYMENT_NAME`.
      - Create the Azure AI Agents client using the project endpoint and
        `DefaultAzureCredential`.
      - Create an agent named `hyoka-basic-agent` with the instructions
        `Answer the user's question clearly and concisely.`
      - Create a thread and add this exact user message:
        `What is the capital of France?`
      - Create a run for that thread and agent, then use the SDK to refresh the run until it
        reaches a terminal status.
      - After a successful run, list the thread messages in chronological order and print
        the text content of every assistant message.
      - Delete the thread and agent after the conversation finishes.
      - Include the project manifest and concise commands for restoring, building, and
        running the application.
      
      Use the synchronous Azure AI Agents client throughout the agent workflow.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: agents
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/configures-the-synchronous-agents-client
              description: |-
                - Read `PROJECT_ENDPOINT` from the environment.
                - Build the synchronous persistent Agents client with that endpoint and `DefaultAzureCredential`.
                - Use the Agents administration, thread, message, and run operations.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-named-deployed-agent
              description: |-
                - Read `MODEL_DEPLOYMENT_NAME` from the environment.
                - Create `hyoka-basic-agent` with that deployment.
                - Set instructions to `Answer the user's question clearly and concisely.`
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-a-thread-with-threadsclient-createthread
              description: |-
                - Create a new Agents thread through the current public thread API.
                - Retain the service-returned thread ID for later message and run operations.
              weight: 1
              pass_threshold: 1
            - name: prompt/adds-the-exact-user-message-with-messagesclient-createme
              description: |-
                - Created thread ID -> user message creation.
                - Message text is exactly `What is the capital of France?`.
                - Use the SDK user role or equivalent user-message field.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-run-with-createrunoptions-containing-the-cre
              description: |-
                - Created thread ID and created agent ID -> public Agents run creation API.
                - Options object or equivalent public overload is valid.
                - Retain the service-returned run ID for status retrieval.
                - Do not run an unrelated chat-completion request.
              weight: 1
              pass_threshold: 1
            - name: prompt/polls-the-agent-run-to-success
              description: |-
                - Retrieve the run with the returned thread ID and run ID.
                - Continue polling while status is `QUEUED`, `IN_PROGRESS`, or `CANCELLING`.
                - Return only when status is `COMPLETED`.
                - `REQUIRES_ACTION`, `FAILED`, `CANCELLED`, `EXPIRED`, or timeout -> clear failure.
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-returned-assistant-messages
              description: |-
                - After run success, traverse all returned thread messages in chronological order.
                - Print text content from every assistant/agent message.
                - Do not substitute a locally hardcoded answer.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-created-conversation-resources
              description: |-
                - Delete the created thread through the Agents SDK.
                - Delete the created agent through the Agents SDK.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
            - name: language/supported-terminal-state-polling
              description: |-
                - Use the public run-retrieval API with the service-returned thread and run IDs.
                - Bound repeated retrieval by a deadline and delay between requests.
                - Continue retrieval through every nonterminal status exposed by the selected SDK version.
                - Terminal non-success or timeout -> clear failure.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - Delete the service-created thread after the run workflow.
                - Delete the service-created agent after thread cleanup.
                - Cleanup uses the returned thread and agent IDs.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
