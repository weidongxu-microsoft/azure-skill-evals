name: text-translation-java-multilingual-translation
description: "Can an application translate one supplied text into French and Japanese in one request and report the detected source language?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: text-translation-dp-java-multilingual-translation
    prompt: |-
      Create a complete, runnable Java console application using
      `com.azure:azure-ai-translation-text` 2.0.2. Accept one command-line argument
      containing the text to translate and read `AZURE_TEXT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Send the supplied text in one SDK translation request whose targets are French
        (`fr`) and Japanese (`ja`).
      - Omit the source language so the service detects it.
      - Print the detected source language returned by the service.
      - Traverse the returned translations and print each returned target-language code
        and translated text.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK client.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: translation
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/creates-one-translateinputitem-containing-the-supplied-t
              description: |-
                - Exactly one command-line text argument flows into the translation input.
                - The request targets both French `fr` and Japanese `ja`.
                - Source language is omitted so the service can detect it.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-texttranslationclient-translate-exactly-once-with
              description: |-
                - Build a synchronous Text Translation client for API version 2.0.2.
                - Send one immediate translation request for the supplied text.
                - Use any supported current translate overload or request model.
              weight: 1
              pass_threshold: 1
            - name: prompt/reads-translatedtextitem-getdetectedlanguage-getlanguage
              description: |-
                - Read detected-language metadata from the service response.
                - Traverse every translation returned for the input item.
                - Do not substitute configured language values for returned metadata.
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-each-translation-s-returned-getlanguage-and-gette
              description: |-
                - Print each returned target-language code.
                - Print each returned translated text value.
                - Output comes from service response objects, not hardcoded translations.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
