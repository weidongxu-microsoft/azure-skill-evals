name: text-translation-java-multilingual-translation
description: "Can an application translate one supplied text into French and Japanese in one request and report the detected source language?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: text-translation-dp-java-multilingual-translation
    prompt: |-
      Create a complete, runnable Java console application using
      `com.azure:azure-ai-translation-text` 2.0.2. Accept one command-line argument
      containing the text to translate and read `AZURE_TEXT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Send the supplied text in one SDK translation request whose targets are French
        (`fr`) and Japanese (`ja`).
      - Omit the source language so the service detects it.
      - Print the detected source language returned by the service.
      - Traverse the returned translations and print each returned target-language code
        and translated text.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK client.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: translation
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/exact-text-argument
              description: |-
                - Accepts exactly one command-line argument containing the text.
                - Any other count -> usage guidance and no service request.
                - The supplied text flows unchanged into the translation input.
              weight: 1
              pass_threshold: 1
            - name: prompt/text-client-authentication
              description: |-
                - Declares `com.azure:azure-ai-translation-text` version 2.0.2.
                - `AZURE_TEXT_TRANSLATION_ENDPOINT` flows into a synchronous text translation client.
                - A supported non-hardcoded key or token credential flows into that client.
              weight: 1
              pass_threshold: 1
            - name: prompt/one-multilingual-translation-request
              description: |-
                - Sends the supplied text in one immediate synchronous SDK request.
                - Requests both `fr` and `ja` through any supported equivalent overload or request model.
                - Omits the source language so the service detects it.
              weight: 1
              pass_threshold: 1
            - name: prompt/print-detected-language
              description: |-
                - Reads detected-language metadata from the service response.
                - Prints the returned source-language code rather than a configured or assumed value.
              weight: 1
              pass_threshold: 1
            - name: prompt/print-all-translations
              description: |-
                - Traverses every translation returned for the input.
                - Prints each returned target-language code and its translated text.
                - Does not substitute requested target codes for returned metadata.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
