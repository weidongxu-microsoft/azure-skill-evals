name: resource-manager-dotnet-resource-group-crud
description: Compare Azure tooling for a .NET resource group lifecycle task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: resource-manager-mp-dotnet-resource-group-crud
    prompt: |-
      Write a C# program that manages
      Azure Resource Groups using the management plane SDK:
      1. Authenticate using DefaultAzureCredential
      2. Create a new resource group in "eastus" region
      3. List all resource groups in the subscription
      4. Get details of the created resource group
      5. Add a tag to the resource group
      6. Delete the resource group
      
      Show required NuGet packages and proper error handling.
      Use the Azure.ResourceManager SDK (not the older Microsoft.Azure.Management packages).
    tags:
      service: resource-manager
      plane: management-plane
      language: dotnet
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 1
          overall_threshold: 1
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-resourcemanager-nuget-package
              description: |-
                `Azure.ResourceManager` NuGet package
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/armclient-creation-with-defaultazurecredential
              description: |-
                `ArmClient` creation with `DefaultAzureCredential`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/getdefaultsubscription-and-getresourcegroups-collection
              description: |-
                `GetDefaultSubscription()` and `GetResourceGroups()` collection
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/createorupdate-get-getall-operations
              description: |-
                `CreateOrUpdate()`, `Get()`, `GetAll()` operations
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/tag-management-with-settags-or-addtag
              description: |-
                Tag management with `SetTags()` or `AddTag()`
              weight: 1
              pass_threshold: 1
              required: true
            - name: prompt/delete-resource-group-and-wait-for-completion
              description: |-
                Deletes the resource group and waits for the long-running operation to complete, such as `DeleteAsync(WaitUntil.Completed)` or `DeleteAsync(WaitUntil.Started)` followed by `WaitForCompletionAsync()`.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
              required: true
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
              required: true
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
