name: resource-manager-typescript-resource-group-crud
description: Compare Azure tooling for a Resource Manager TypeScript resource group lifecycle task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: resource-manager-mp-typescript-resource-group-crud
    prompt: |-
      Write a TypeScript program
      that manages Azure Resource Groups using the management plane SDK:
      1. Authenticate using DefaultAzureCredential from @azure/identity
      2. Create a ResourceManagementClient with the credential and subscription ID
      3. Create a new resource group in "eastus" region
      4. List all resource groups in the subscription using iteration
      5. Get details of the created resource group
      6. Update the resource group by adding a tag
      7. Delete the resource group using beginDeleteAndWait
      
      Show required npm packages and proper async/await patterns.
      Use the @azure/arm-resources package.
    tags:
      service: resource-manager
      plane: management-plane
      language: typescript
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/azure-arm-resources-and-azure-identity-npm-packages
              description: |-
                `@azure/arm-resources` and `@azure/identity` npm packages
              weight: 1
              pass_threshold: 1
            - name: prompt/defaultazurecredential-for-authentication
              description: |-
                `DefaultAzureCredential` for authentication
              weight: 1
              pass_threshold: 1
            - name: prompt/resourcemanagementclient-constructor-with-credential-and
              description: |-
                `ResourceManagementClient` constructor with credential and subscriptionId
              weight: 1
              pass_threshold: 1
            - name: prompt/resourcegroups-createorupdate-with-resource-group-name-a
              description: |-
                `resourceGroups.createOrUpdate()` with resource group name and parameters
              weight: 1
              pass_threshold: 1
            - name: prompt/resourcegroups-list-with-async-iteration-for-await-of
              description: |-
                `resourceGroups.list()` with async iteration (`for await...of`)
              weight: 1
              pass_threshold: 1
            - name: prompt/resourcegroups-get-for-fetching-details
              description: |-
                `resourceGroups.get()` for fetching details
              weight: 1
              pass_threshold: 1
            - name: prompt/resourcegroups-begindeleteandwait-for-long-running-delet
              description: |-
                `resourceGroups.beginDeleteAndWait()` for long-running delete
              weight: 1
              pass_threshold: 1
            - name: prompt/tag-updates-via-resourcegroups-update-with-tags-paramete
              description: |-
                Tag updates via `resourceGroups.update()` with tags parameter
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/long-running-operation-completion
              description: |-
                - Use the selected SDK's poller, wait helper, or status-retrieval mechanism.
                - Continue until a successful or unsuccessful terminal state.
                - Distinguish successful completion from unsuccessful terminal states.
                - Bound explicit polling and avoid tight polling loops.
                - Do not replace an available SDK polling abstraction with ad hoc delays.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
