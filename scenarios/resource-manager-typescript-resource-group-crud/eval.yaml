name: resource-manager-typescript-resource-group-crud
description: Compare Azure tooling for a Resource Manager TypeScript resource group lifecycle task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: resource-manager-mp-typescript-resource-group-crud
    prompt: |-
      Write a TypeScript Node.js program that manages an Azure resource group through one complete lifecycle.

      Write the code to files. Do not reply with code blocks.

      1. Read the Azure subscription ID and resource group name from environment variables. Use "eastus" as the location.
      2. Authenticate with DefaultAzureCredential and create a ResourceManagementClient.
      3. Create the resource group and print the created resource.
      4. List resource groups by asynchronously iterating the SDK result, printing each resource group.
      5. Get the created resource group by name and print it.
      6. Update that same resource group with resourceGroups.update(), adding the tag environment=development, and print the updated resource.
      7. Delete the resource group, wait for the long-running deletion to complete, and only then print a deletion confirmation.

      Show the required npm packages. Handle Azure request/authentication failures meaningfully and preserve unknown failures.
    tags:
      service: resource-manager
      plane: management-plane
      language: typescript
      category: crud
    graders:
      - type: run-command
        name: prompt/packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/packages
      - type: run-command
        name: prompt/environment
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/environment
      - type: run-command
        name: prompt/authenticated-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/authenticated-client
      - type: run-command
        name: prompt/create-and-output
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/create-and-output
      - type: run-command
        name: prompt/list-and-output
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/list-and-output
      - type: run-command
        name: prompt/get-and-output
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/get-and-output
      - type: run-command
        name: prompt/update-and-output
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/update-and-output
      - type: run-command
        name: prompt/delete-wait-confirm
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/delete-wait-confirm
      - type: run-command
        name: prompt/error-handling
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
            - prompt/error-handling
    environment:
      files:
        - src: tools/check-resource-manager-typescript.mjs
          dest: .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/check-resource-manager-typescript.mjs
        - src: tools/resource-manager-typescript-rules.mjs
          dest: .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/resource-manager-typescript-rules.mjs
        - src: tools/source-manifest.mjs
          dest: .vally/scenarios/resource-manager-typescript-resource-group-crud/tools/source-manifest.mjs
        - src: ../../languages/typescript/checks.mjs
          dest: .vally/languages/typescript/checks.mjs
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
