name: document-translation-java-batch-container
description: "Can an application start a container translation, wait for completion, and enumerate every document status and failure?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: document-translation-dp-java-batch-container
    prompt: |-
      Create a complete, runnable Java console application using
      `com.azure:azure-ai-translation-document` 2.0.1. Accept exactly three
      command-line arguments: source-container URI, target-container URI, and
      target-language code. Read `AZURE_DOCUMENT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Start one batch document translation from the supplied source container to the
        supplied target container and language.
      - Use the SDK long-running operation and wait for it to finish.
      - Print the returned overall translation status.
      - Page through every document status in that operation and print each document
        ID and status.
      - For every document whose returned failure information is present, print its
        returned error code and message.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK client.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: batch
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/exact-batch-arguments
              description: |-
                - Accepts exactly three arguments: source-container URI, target-container URI, and target-language code.
                - Any other count -> usage guidance and no service request.
                - All three supplied values flow into their corresponding batch request roles.
              weight: 1
              pass_threshold: 1
            - name: prompt/batch-client-authentication
              description: |-
                - Declares `com.azure:azure-ai-translation-document` version 2.0.1.
                - `AZURE_DOCUMENT_TRANSLATION_ENDPOINT` flows into a synchronous batch client.
                - A supported token credential or non-hardcoded key credential flows into that client.
              weight: 1
              pass_threshold: 1
            - name: prompt/start-one-container-translation
              description: |-
                - Supplied source URI -> translation source.
                - Supplied target URI and language -> translation target.
                - Starts exactly one batch operation through the current document translation API.
              weight: 1
              pass_threshold: 1
            - name: prompt/wait-and-print-overall-status
              description: |-
                - The begin operation returns a real `SyncPoller`.
                - Waits for that poller to reach a terminal result.
                - Prints the returned overall translation status and retains its operation ID.
              weight: 1
              pass_threshold: 1
            - name: prompt/page-and-print-document-statuses
              description: |-
                - Operation ID -> document-status listing.
                - Traverses every returned page and prints each document ID and status.
                - Present failure details -> prints the returned error code and message.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
