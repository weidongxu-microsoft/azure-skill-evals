name: text-translation-typescript-transliteration
description: "Can an application transliterate supplied text between supplied scripts and report the returned script metadata?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: text-translation-dp-typescript-transliteration
    prompt: |-
      Create a complete, runnable TypeScript console application using
      `@azure-rest/ai-translation-text` 2.0.0. Target Node.js 22. Accept exactly four
      command-line arguments: language code, source-script code, target-script code,
      and text. Read `AZURE_TEXT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Invoke the SDK's transliteration operation with the supplied language,
        source-script, target-script, and text values in that order.
      - Print the transliterated text returned by the service.
      - Print the actual script metadata returned with that text.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: translation
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/calls-client-path-transliterate-post-with-the-supplied-t
              description: |-
                Uses the `@azure-rest/ai-translation-text` 2.0.0 v2 client and calls
                `client.path("/transliterate").post` with the supplied text in `body.inputs` and
                supplied `language`, `fromScript`, and `toScript` in `queryParameters`, without
                swapping the script codes.
              weight: 1
              pass_threshold: 1
            - name: prompt/checks-isunexpected-and-reads-an-item-from-response-body
              description: |-
                Checks `isUnexpected` and reads an item from `response.body.value`.
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-both-the-returned-item-s-text-and-script
              description: |-
                Prints both `text` and `script` read from the service-returned item rather than
                echoing the input text or target-script code.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
