name: storage-typescript-blob-storage-manager
description: Compare Azure tooling for a Blob Storage manager TypeScript task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-typescript-blob-storage-manager
    prompt: |-
      Create a TypeScript Node.js project that provides a reusable Azure Blob Storage management utility.
      
      The project needs:
      
      - A **service class** that wraps blob operations: upload (with optional metadata and blob index tags for later querying), download, list blobs in a container, and delete. The upload method should handle large files efficiently using streaming — uploading a multi-gigabyte file should not load the entire thing into memory. The service should also prevent concurrent writers from overwriting each other's changes when updating the same blob by acquiring a lease before writing.
      
      - A **configuration module** that connects to Azure securely using the storage account endpoint (from an environment variable). No connection strings or account keys should be used — the app will run in Azure with managed identity. The configuration should set up a custom retry policy (exponential backoff, configurable max retries and delay) and enable SDK logging at a configurable level for debugging.
      
      - A **main script** that wires everything together and demos each operation: uploads a sample file with some index tags, lists all blobs in the container, downloads the file back and prints its content, acquires a lease and overwrites the blob, then finally deletes it. Print status at each step.
      
      Include a complete `package.json` with the necessary Azure SDK dependencies and a `tsconfig.json`.
    tags:
      service: storage
      plane: data-plane
      language: typescript
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/configures-custom-retry-policy-via-storageretryoptions-e
              description: |-
                Configures custom retry policy via `StorageRetryOptions` (exponential backoff, max retries, retry delay)
              weight: 1
              pass_threshold: 1
            - name: prompt/enables-sdk-logging-via-azure-logger-setloglevel-or-azur
              description: |-
                Enables SDK logging via `@azure/logger` `setLogLevel()` or `AZURE_LOG_LEVEL`
              weight: 1
              pass_threshold: 1
            - name: prompt/implements-blob-lease-acquisition-before-overwrite-using
              description: |-
                Implements blob lease acquisition before overwrite using `BlobLeaseClient`
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-blockblobclient-uploadstream-for-large-file-streami
              description: |-
                Uses `BlockBlobClient.uploadStream()` for large file streaming upload (not `uploadData()` or `upload()` which buffer in memory)
              weight: 1
              pass_threshold: 1
            - name: prompt/sets-blob-index-tags-on-upload-via-tags-property-in-bloc
              description: |-
                Sets blob index tags on upload via `tags` property in `BlockBlobUploadStreamOptions`
              weight: 1
              pass_threshold: 1
            - name: prompt/downloads-blob-and-reads-response-via-readablestreambody
              description: |-
                Downloads blob and reads response via `readableStreamBody` (Node.js Readable stream)
              weight: 1
              pass_threshold: 1
            - name: prompt/lists-blobs-using-for-await-of-async-iteration-over-cont
              description: |-
                Lists blobs using `for await...of` async iteration over `ContainerClient.listBlobsFlat()` ### Scenario-Specific Error Handling
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-lease-conflict-errors-409-status-code-when-blob
              description: |-
                Handles lease conflict errors (409 status code) when blob is already leased
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-blob-not-found-errors-404-status-code-on-downloa
              description: |-
                Handles blob not found errors (404 status code) on download/delete ### Anti-Patterns (scenario-specific)
              weight: 1
              pass_threshold: 1
            - name: prompt/not-using-uploaddata-or-upload-with-full-buffer-for-larg
              description: |-
                NOT using `uploadData()` or `upload()` with full buffer for large files
              weight: 1
              pass_threshold: 1
            - name: prompt/not-using-connection-strings-or-account-keys-for-authent
              description: |-
                NOT using connection strings or account keys for authentication
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-error-handling
              description: |-
                - Use the selected SDK's documented error type or stable error discriminant.
                - Inspect status, code, retryability, or failure details required by the scenario.
                - Handle the required failure state differently from an unknown failure.
                - Generic `Error` handling alone does not satisfy error-specific behavior.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-diagnostic-logging
              description: |-
                - Enable Azure SDK diagnostics at the configured level.
                - Use `AZURE_LOG_LEVEL` or `@azure/logger` `setLogLevel()`.
                - Do not expose credentials, tokens, or secret-bearing request data.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
