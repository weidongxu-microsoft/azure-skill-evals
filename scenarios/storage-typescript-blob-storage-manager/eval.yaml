name: storage-typescript-blob-storage-manager
description: Compare Azure tooling for a Blob Storage manager TypeScript task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-typescript-blob-storage-manager
    prompt: |-
      Create a TypeScript Node.js project that provides a reusable Azure Blob Storage management utility.
      
      The project needs:
      
      - A **service class** that wraps blob operations: upload (with optional metadata and blob index tags for later querying), download, list blobs in a container, and delete. The upload method should handle large files efficiently using streaming — uploading a multi-gigabyte file should not load the entire thing into memory. The service should also prevent concurrent writers from overwriting each other's changes when updating the same blob by acquiring a lease before writing.
      
      - A **configuration module** that connects to Azure securely using the storage account endpoint (from an environment variable). No connection strings or account keys should be used — the app will run in Azure with managed identity. The configuration should set up a custom retry policy (exponential backoff, configurable max retries and delay) and enable SDK logging at a configurable level for debugging.
      
      - A **main script** that wires everything together and demos each operation: uploads a sample file with some index tags, lists all blobs in the container, downloads the file back and prints its content, acquires a lease and overwrites the blob, then finally deletes it. Print status at each step.
      
      Include a complete `package.json` with the necessary Azure SDK dependencies and a `tsconfig.json`.
    tags:
      service: storage
      plane: data-plane
      language: typescript
      category: crud
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/configures-custom-retry-policy-via-storageretryoptions-e
              description: |-
                Configures custom retry policy via `StorageRetryOptions` (exponential backoff, max retries, retry delay)
              weight: 1
              pass_threshold: 1
            - name: prompt/enables-sdk-logging-via-azure-logger-setloglevel-or-azur
              description: |-
                Enables SDK logging via `@azure/logger` `setLogLevel()` or `AZURE_LOG_LEVEL`
              weight: 1
              pass_threshold: 1
            - name: prompt/implements-blob-lease-acquisition-before-overwrite-using
              description: |-
                Implements blob lease acquisition before overwrite using `BlobLeaseClient`
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-blockblobclient-uploadstream-for-large-file-streami
              description: |-
                Uses `BlockBlobClient.uploadStream()` for large file streaming upload (not `uploadData()` or `upload()` which buffer in memory)
              weight: 1
              pass_threshold: 1
            - name: prompt/sets-blob-index-tags-on-upload-via-tags-property-in-bloc
              description: |-
                Sets blob index tags on upload via `tags` property in `BlockBlobUploadStreamOptions`
              weight: 1
              pass_threshold: 1
            - name: prompt/downloads-blob-and-reads-response-via-readablestreambody
              description: |-
                Downloads blob and reads response via `readableStreamBody` (Node.js Readable stream)
              weight: 1
              pass_threshold: 1
            - name: prompt/lists-blobs-using-for-await-of-async-iteration-over-cont
              description: |-
                Lists blobs using `for await...of` async iteration over `ContainerClient.listBlobsFlat()` ### Scenario-Specific Error Handling
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-lease-conflict-errors-409-status-code-when-blob
              description: |-
                Handles lease conflict errors (409 status code) when blob is already leased
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-blob-not-found-errors-404-status-code-on-downloa
              description: |-
                Handles blob not found errors (404 status code) on download/delete ### Anti-Patterns (scenario-specific)
              weight: 1
              pass_threshold: 1
            - name: prompt/not-using-uploaddata-or-upload-with-full-buffer-for-larg
              description: |-
                NOT using `uploadData()` or `upload()` with full buffer for large files
              weight: 1
              pass_threshold: 1
            - name: prompt/not-using-connection-strings-or-account-keys-for-authent
              description: |-
                NOT using connection strings or account keys for authentication
              weight: 1
              pass_threshold: 1
            - name: prompt/not-collecting-all-listed-blobs-into-an-array-before-pro
              description: |-
                NOT collecting all listed blobs into an array before processing
              weight: 1
              pass_threshold: 1
            - name: language/correct-azure-scoped-packages
              description: |-
                All Azure SDK dependencies use @azure/ scoped packages (e.g., @azure/storage-blob, @azure/keyvault-secrets, @azure/identity). No deprecated unscoped packages (azure-storage, azure-arm-*, ms-rest-azure, @azure/ms-rest-*).
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-for-authentication
              description: |-
                Includes @azure/identity as a dependency. For local development, DefaultAzureCredential is acceptable. For production code, uses a specific Entra token credential (e.g., ManagedIdentityCredential, ClientSecretCredential, WorkloadIdentityCredential) or configures DefaultAzureCredential with the AZURE_TOKEN_CREDENTIALS environment variable set to "prod" or a specific token credential. No hardcoded connection strings, account keys, SAS tokens, or secrets in code.
              weight: 1
              pass_threshold: 1
            - name: language/client-constructor-with-endpoint-and-credential
              description: |-
                SDK clients constructed with endpoint URL and credential object, e.g. new BlobServiceClient(url, credential) or new SecretClient(vaultUrl, credential). No legacy constructor patterns or connection string-based construction when identity-based auth is available.
              weight: 1
              pass_threshold: 1
            - name: language/async-await-pattern
              description: |-
                Uses async/await for all asynchronous operations. No raw .then()/.catch() chains when await is cleaner. No callback-based patterns. Top-level async function or IIFE for entry point.
              weight: 1
              pass_threshold: 1
            - name: language/pagination-with-for-await-of
              description: |-
                List/query operations use for-await-of iteration over the PagedAsyncIterableIterator returned by SDK methods. Does not collect all pages into an array in memory (e.g., no Array.from() or manual page accumulation). Uses byPage() when per-page control is needed.
              weight: 1
              pass_threshold: 1
            - name: language/lro-pattern-beginxxx-polluntildone
              description: |-
                Long-running operations use the begin* method prefix (e.g., beginDeleteSecret, beginCreateOrUpdate) and await poller.pollUntilDone(). No manual setTimeout/setInterval polling loops.
              weight: 1
              pass_threshold: 1
            - name: language/resterror-exception-handling
              description: |-
                Catches RestError (from @azure/core-rest-pipeline or the service package) with statusCode inspection for error-specific handling. Not just generic Error or try/catch without type checking.
              weight: 1
              pass_threshold: 1
            - name: language/no-deprecated-packages
              description: |-
                No deprecated or legacy Azure packages in package.json: azure-storage, azure-arm-*, ms-rest-azure, @azure/ms-rest-js, @azure/ms-rest-nodeauth, @azure/ms-rest-azure-js. All dependencies use the current @azure/* track.
              weight: 1
              pass_threshold: 1
            - name: language/logging-via-azure-logger
              description: |-
                Uses @azure/logger with setLogLevel() or the AZURE_LOG_LEVEL environment variable for SDK diagnostic logging. No custom logging wrappers around SDK internals.
              weight: 1
              pass_threshold: 1
            - name: language/package-json-with-correct-dependencies
              description: |-
                Includes a valid package.json with all required @azure/* dependencies listed. TypeScript projects include tsconfig.json and appropriate @types/* packages or use a recent TypeScript version with built-in types.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
