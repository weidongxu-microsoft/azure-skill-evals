name: storage-typescript-blob-storage-manager
description: Compare Azure tooling for a Blob Storage manager TypeScript task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-typescript-blob-storage-manager
    prompt: |-
      Create a TypeScript Node.js project that provides a reusable Azure Blob Storage management utility.

      The project needs:

      - A **service class** that wraps blob operations: upload (with optional metadata and blob index tags for later querying), download, list blobs in a container, and delete. The upload method should handle large files efficiently using streaming — uploading a multi-gigabyte file should not load the entire thing into memory. The service should also prevent concurrent writers from overwriting each other's changes when updating the same blob by acquiring a lease before writing.

      - A **configuration module** that connects to Azure securely using the storage account endpoint (from an environment variable). No connection strings or account keys should be used — the app will run in Azure with managed identity. The configuration should set up a custom retry policy (exponential backoff, configurable max retries and delay) and enable SDK logging at a configurable level for debugging.

      - A **main script** that wires everything together and demos each operation: uploads a sample file with some index tags, lists all blobs in the container, downloads the file back and prints its content, acquires a lease and overwrites the blob, then finally deletes it. Print status at each step.

      Include a complete `package.json` with the necessary Azure SDK dependencies and a `tsconfig.json`.

      Write the code to files. Do not reply with code blocks.
    tags:
      service: storage
      plane: data-plane
      language: typescript
      category: crud
    graders:
      - type: run-command
        name: prompt/packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/packages
      - type: run-command
        name: prompt/configuration
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/configuration
      - type: run-command
        name: prompt/retry-and-logging
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/retry-and-logging
      - type: run-command
        name: prompt/service-class
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/service-class
      - type: run-command
        name: prompt/upload-with-tags
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/upload-with-tags
      - type: run-command
        name: prompt/list-blobs
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/list-blobs
      - type: run-command
        name: prompt/download-stream
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/download-stream
      - type: run-command
        name: prompt/lease-overwrite
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/lease-overwrite
      - type: run-command
        name: prompt/error-handling
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/error-handling
      - type: run-command
        name: prompt/demo-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
            - prompt/demo-lifecycle
      - type: run-command
        name: language/package-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/package-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/async-await
      - type: run-command
        name: language/typescript-config
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/typescript/check.mjs
            - language/typescript-config
    environment:
      files:
        - src: tools/check-storage-typescript.mjs
          dest: .vally/scenarios/storage-typescript-blob-storage-manager/tools/check-storage-typescript.mjs
        - src: tools/source-manifest.mjs
          dest: .vally/scenarios/storage-typescript-blob-storage-manager/tools/source-manifest.mjs
        - src: tools/storage-typescript-rules.mjs
          dest: .vally/scenarios/storage-typescript-blob-storage-manager/tools/storage-typescript-rules.mjs
        - src: ../../languages/typescript/check.mjs
          dest: .vally/languages/typescript/check.mjs
        - src: ../../languages/typescript/checks.mjs
          dest: .vally/languages/typescript/checks.mjs
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/package.json"
    - "**/tsconfig.json"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
