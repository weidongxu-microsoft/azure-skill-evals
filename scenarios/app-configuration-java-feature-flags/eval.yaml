name: app-configuration-java-feature-flags
description: Compare Azure tooling for an App Configuration Java feature-flag task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-java-feature-flags
    prompt: |-
      Create a small Java 17 Maven project that implements a feature flag and configuration management system backed by Azure App Configuration.

      **Write the code to files (use file-write tools, do not reply with code blocks).**

      The project needs:

      - A **configuration service class** (both sync and async versions) that retrieves settings from App Configuration. It should support fetching a single setting by key, fetching a setting with a specific label (to distinguish between environments like "production" vs "staging"), and listing all settings that match a key prefix (returned as a map). It should also avoid re-downloading values that haven't changed since the last read — minimize unnecessary network traffic when polling for config changes.

      - A **feature flag evaluator class** that reads feature flags from App Configuration. Feature flags in App Configuration use a special key prefix and store their state as a JSON payload. The evaluator should be able to check if a flag is enabled, and also support percentage-based rollout — if a flag is configured for a percentage rollout (e.g., 30% of users), the evaluator should deterministically decide whether a given user ID falls within the rollout percentage using a consistent hash, so the same user always gets the same result.

      - A **configuration watcher class** that periodically polls for configuration changes. It should accept a list of "sentinel" keys to watch and a polling interval. When a sentinel key's value changes, the watcher should trigger a full refresh of all cached configuration. This is the recommended pattern for coordinating config updates in App Configuration.

      - A **Main class** that demos both implementations: connecting to App Configuration (endpoint from environment variable, authenticated with managed identity), reading some config values with labels, evaluating feature flags for a few sample user IDs with percentage rollout, and starting the config watcher to detect a change. Run the full demo with the sync implementation first, then repeat with the async implementation.

      Include a complete `pom.xml` with the necessary Azure SDK dependencies. Pin `com.azure:azure-data-appconfiguration` to `1.10.1` and `com.azure:azure-identity` to `1.18.5`.
    tags:
      service: app-configuration
      plane: data-plane
      language: java
      category: crud
    graders:
      - type: run-command
        name: prompt/source-manifest
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs, prompt/source-manifest]
      - type: run-command
        name: prompt/managed-identity-clients
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs, prompt/managed-identity-clients]
      - type: run-command
        name: prompt/configuration-reads
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs, prompt/configuration-reads]
      - type: run-command
        name: prompt/conditional-etag-reads
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs, prompt/conditional-etag-reads]
      - type: run-command
        name: prompt/feature-flag-json
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs, prompt/feature-flag-json]
      - type: run-command
        name: prompt/deterministic-rollout
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs, prompt/deterministic-rollout]
      - type: run-command
        name: prompt/sentinel-refresh
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs, prompt/sentinel-refresh]
      - type: run-command
        name: prompt/connected-sync-async-demo
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs, prompt/connected-sync-async-demo]
      - type: run-command
        name: language/build-manifest
        weight: 1
        config:
          command: node
          args: [.vally/languages/java/check.mjs, language/build-manifest]
      - type: run-command
        name: language/current-azure-dependencies
        weight: 1
        config:
          command: node
          args: [.vally/languages/java/check.mjs, language/current-azure-dependencies]
      - type: run-command
        name: language/current-imports
        weight: 1
        config:
          command: node
          args: [.vally/languages/java/check.mjs, language/current-imports]
      - type: run-command
        name: language/client-builder
        weight: 1
        config:
          command: node
          args: [.vally/languages/java/check.mjs, language/client-builder]
    environment:
      files:
        - src: tools/check-app-configuration-feature-flags-java.mjs
          dest: .vally/scenarios/app-configuration-java-feature-flags/tools/check-app-configuration-feature-flags-java.mjs
        - src: tools/app-configuration-feature-flags-java-rules.mjs
          dest: .vally/scenarios/app-configuration-java-feature-flags/tools/app-configuration-feature-flags-java-rules.mjs
        - src: ../../languages/java/check.mjs
          dest: .vally/languages/java/check.mjs
        - src: ../../languages/java/checks.mjs
          dest: .vally/languages/java/checks.mjs
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
