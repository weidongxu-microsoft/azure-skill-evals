name: app-configuration-java-feature-flags
description: Compare Azure tooling for an App Configuration Java feature-flag task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: app-configuration-dp-java-feature-flags
    prompt: |-
      Create a small Java 17 Maven project that implements a feature flag and configuration management system backed by Azure App Configuration.
      
      The project needs:
      
      - A **configuration service class** (both sync and async versions) that retrieves settings from App Configuration. It should support fetching a single setting by key, fetching a setting with a specific label (to distinguish between environments like "production" vs "staging"), and listing all settings that match a key prefix (returned as a map). It should also avoid re-downloading values that haven't changed since the last read — minimize unnecessary network traffic when polling for config changes.
      
      - A **feature flag evaluator class** that reads feature flags from App Configuration. Feature flags in App Configuration use a special key prefix and store their state as a JSON payload. The evaluator should be able to check if a flag is enabled, and also support percentage-based rollout — if a flag is configured for a percentage rollout (e.g., 30% of users), the evaluator should deterministically decide whether a given user ID falls within the rollout percentage using a consistent hash, so the same user always gets the same result.
      
      - A **configuration watcher class** that periodically polls for configuration changes. It should accept a list of "sentinel" keys to watch and a polling interval. When a sentinel key's value changes, the watcher should trigger a full refresh of all cached configuration. This is the recommended pattern for coordinating config updates in App Configuration.
      
      - A **Main class** that demos both implementations: connecting to App Configuration (endpoint from environment variable, authenticated with managed identity), reading some config values with labels, evaluating feature flags for a few sample user IDs with percentage rollout, and starting the config watcher to detect a change. Run the full demo with the sync implementation first, then repeat with the async implementation.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: app-configuration
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/supports-sync-and-async-setting-lookups
              description: |-
                - Sync and async services each fetch one setting by key.
                - Sync and async services each fetch one setting by key and label.
                - Direct key/label lookup, `SettingSelector`, or equivalent current SDK APIs are valid.
              weight: 1
              pass_threshold: 1
            - name: prompt/returns-prefix-matches-as-maps
              description: |-
                - Sync and async services list settings matching the requested key prefix.
                - Convert all matching returned settings into key/value maps.
                - Use the SDK key-filter syntax corresponding to the requested prefix.
              weight: 1
              pass_threshold: 1
            - name: prompt/implements-conditional-reads-with-matchconditions-setifn
              description: |-
                - Cache each setting value with its ETag or equivalent validator.
                - Revalidation sends that validator in a supported conditional read.
                - The service response determines whether cached state is retained or replaced.
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-304-not-modified-setting-unchanged-since-last-re
              description: |-
                - A not-modified response is treated as an unchanged setting.
                - Return the existing cached value for unchanged settings.
                - Keep the existing validator until a changed service value is returned.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-appconfig-featureflag-prefix-for-feature-flag-keys
              description: |-
                - Feature flag lookup targets `.appconfig.featureflag/<name>`.
                - Missing flag -> disabled result.
                - The flag payload, not an ordinary key alone, drives evaluation.
              weight: 1
              pass_threshold: 1
            - name: prompt/parses-the-json-payload-in-feature-flag-setting-values
              description: |-
                - Parse the feature-flag setting value as JSON.
                - Enabled flag without a restrictive filter -> true.
                - Disabled or malformed flag data -> safe false or reported configuration error.
              weight: 1
              pass_threshold: 1
            - name: prompt/evaluates-deterministic-percentage-rollout
              description: |-
                - Parse the configured percentage rollout from the enabled flag payload.
                - Derive a stable user bucket from the user ID; do not use random selection.
                - Compare the bucket with the configured percentage so repeated checks agree.
              weight: 1
              pass_threshold: 1
            - name: prompt/implements-sentinel-key-watching-with-configurable-polli
              description: |-
                - Accept sentinel key names from configuration.
                - Use a configurable polling interval for sentinel checks.
                - Poll sentinel values or validators through the App Configuration SDK.
              weight: 1
              pass_threshold: 1
            - name: prompt/detects-sentinel-value-change-via-etag-or-value-comparis
              description: |-
                - Compare each polled sentinel's ETag, validator, or value with cached state.
                - Changed sentinel -> refresh all cached configuration.
                - Unchanged sentinel -> retain the existing cache.
              weight: 1
              pass_threshold: 1
            - name: prompt/configures-managed-identity-sync-and-async-clients
              description: |-
                - Read the App Configuration endpoint from environment configuration.
                - Build both sync and async App Configuration clients for that endpoint.
                - Authenticate both clients with managed identity through a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: prompt/implements-a-real-asynchronous-flow
              description: |-
                - Async retrieval, listing, and watcher work originate from the async SDK client.
                - Preserve nonblocking composition with Reactor or a `Mono.toFuture()` adapter.
                - Do not implement async behavior by wrapping a synchronous client in an executor.
              weight: 1
              pass_threshold: 1
            - name: prompt/demonstrates-sync-then-async-behavior
              description: |-
                - Main demonstrates labeled values, feature flags for sample users, and watcher startup.
                - Run the complete synchronous demonstration first.
                - Repeat the complete demonstration with the asynchronous implementation.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
            - name: language/supported-terminal-state-polling
              description: |-
                - Poll configured sentinel keys at the configured interval.
                - Compare returned ETags, validators, or values with cached sentinel state.
                - Changed sentinel -> trigger a full cache refresh.
              weight: 1
              pass_threshold: 1
            - name: language/reactive-async-service-flow
              description: |-
                - Prompt-required async Azure operations originate from async SDK clients or documented async adapters.
                - Compose reusable async flows with Reactor `Mono`/`Flux` or equivalent nonblocking composition.
                - Do not wrap synchronous clients in an executor or block inside reusable async service methods.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
