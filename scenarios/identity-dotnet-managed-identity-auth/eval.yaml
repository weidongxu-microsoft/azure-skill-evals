name: identity-dotnet-managed-identity-auth
description: Compare Azure tooling for managed identity authentication in .NET
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-dotnet-managed-identity
    prompt: |-
      Show me how to use
      Managed Identity to authenticate Azure SDK clients in C#. Cover:
      1. System-assigned vs user-assigned managed identity differences
      2. How to create a ManagedIdentityCredential for each type
      3. Using it with an Azure SDK client (e.g., KeyVaultClient or BlobServiceClient)
      4. How to test locally when managed identity isn't available
      5. Common pitfalls and error handling
      
      Provide examples for both system-assigned and user-assigned identity.
    tags:
      service: identity
      plane: data-plane
      language: dotnet
      category: auth
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/managedidentitycredential-class-and-constructors
              description: |-
                `ManagedIdentityCredential` class and constructors
              weight: 1
              pass_threshold: 1
            - name: prompt/system-assigned-no-parameters-needed
              description: |-
                System-assigned: no parameters needed
              weight: 1
              pass_threshold: 1
            - name: prompt/user-assigned-passing-the-client-id
              description: |-
                User-assigned: passing the client ID
              weight: 1
              pass_threshold: 1
            - name: prompt/integration-with-defaultazurecredential-managed-identity
              description: |-
                Integration with `DefaultAzureCredential` (managed identity in the chain)
              weight: 1
              pass_threshold: 1
            - name: prompt/credentialunavailableexception-when-not-running-in-azure
              description: |-
                `CredentialUnavailableException` when not running in Azure
              weight: 1
              pass_threshold: 1
            - name: prompt/combining-with-chainedtokencredential-for-local-fallback
              description: |-
                Combining with `ChainedTokenCredential` for local fallback
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
    artifacts:
      include:
        - "**/*.cs"
        - "**/*.csproj"
      exclude:
        - "**/.vally/**"
        - "**/bin/**"
        - "**/obj/**"
