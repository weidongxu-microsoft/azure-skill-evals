name: cosmos-db-java-crud-items
description: Compare Azure tooling for a Cosmos DB Java CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-java-crud
    prompt: |-
      Write a Java program that performs
      CRUD operations on items in an Azure Cosmos DB NoSQL container:
      1. Create a CosmosClient using endpoint and key with CosmosClientBuilder
      2. Create a database "TestDB" and container "Items" with partition key "/category"
      3. Insert a POJO item with properties: id, category, name, quantity
      4. Read the item back by id and partition key value
      5. Query items where category equals "electronics" using parameterized SQL
      6. Replace the item with updated quantity
      7. Delete the item by id and partition key
      
      Show required Maven dependency and handle CosmosException appropriately.
    tags:
      service: cosmos-db
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/cosmos-dependency-and-key-authentication
              description: |-
                - Declares `com.azure:azure-cosmos` with a compatible direct version or BOM.
                - Endpoint and key come from runtime configuration.
                - Those exact values build a synchronous `CosmosClient`; token-only authentication does not satisfy this prompt.
              weight: 1
              pass_threshold: 1
            - name: prompt/test-database-items-container
              description: |-
                - Creates database `TestDB` if needed.
                - Creates container `Items` if needed.
                - Configures the partition-key path exactly as `/category`.
              weight: 1
              pass_threshold: 1
            - name: prompt/pojo-create-and-point-read
              description: |-
                - Creates a POJO containing `id`, `category`, `name`, and `quantity` values.
                - Inserts that POJO into `Items`.
                - The same ID and category value flow into a point read and the returned POJO is consumed.
              weight: 1
              pass_threshold: 1
            - name: prompt/electronics-parameterized-query
              description: |-
                - Uses SQL with a parameter placeholder for category.
                - Binds the value `electronics` through `SqlParameter` or an equivalent current parameter API.
                - Executes the query against `Items` and consumes returned items.
              weight: 1
              pass_threshold: 1
            - name: prompt/replace-and-delete-item
              description: |-
                - Changes the read item's quantity and replaces that item using its category partition key.
                - Deletes the same item using its ID and category partition key.
                - Both operations execute against the real `CosmosContainer`.
              weight: 1
              pass_threshold: 1
            - name: prompt/cosmos-operation-errors
              description: |-
                - Handles `CosmosException` around service operations.
                - Reports status code and actionable service diagnostics.
                - Closes the `CosmosClient` after work completes.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
