name: cosmos-db-java-crud-items
description: Compare Azure tooling for a Cosmos DB Java CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-java-crud
    prompt: |-
      Write a Java program that performs
      CRUD operations on items in an Azure Cosmos DB NoSQL container:
      1. Create a CosmosClient using endpoint and key with CosmosClientBuilder
      2. Create a database "TestDB" and container "Items" with partition key "/category"
      3. Insert a POJO item with properties: id, category, name, quantity
      4. Read the item back by id and partition key value
      5. Query items where category equals "electronics" using parameterized SQL
      6. Replace the item with updated quantity
      7. Delete the item by id and partition key
      
      Show required Maven dependency and handle CosmosException appropriately.
    tags:
      service: cosmos-db
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/azure-cosmos-maven-dependency-com-azure-azure-cosmos
              description: |-
                - Manifest declares `com.azure:azure-cosmos`.
                - Dependency versioning is compatible with direct or BOM-managed policy.
                - No legacy Cosmos DB SDK coordinate substitutes for the current artifact.
              weight: 1
              pass_threshold: 1
            - name: prompt/cosmosclientbuilder-and-cosmosclient
              description: |-
                - Runtime endpoint and key flow into Cosmos client construction.
                - Build a synchronous Cosmos DB client for container operations.
                - Token-only authentication does not satisfy this key-based prompt.
              weight: 1
              pass_threshold: 1
            - name: prompt/test-database-items-container
              description: |-
                - Creates database `TestDB` if needed.
                - Creates container `Items` if needed.
                - Configures the partition-key path exactly as `/category`.
              weight: 1
              pass_threshold: 1
            - name: prompt/cosmoscontainer-createitem-readitem-replaceitem-deleteit
              description: |-
                - Insert a POJO item into the `Items` container.
                - Read the same item by ID and category partition key.
                - Replace that item with an updated quantity.
                - Delete the same item by ID and partition key.
              weight: 1
              pass_threshold: 1
            - name: prompt/cosmosqueryrequestoptions-and-cosmospagediterable
              description: |-
                - Execute the category query against the `Items` container.
                - Consume returned query results from the SDK iterable or equivalent query result.
                - Use query options or an equivalent current API when needed for execution.
              weight: 1
              pass_threshold: 1
            - name: prompt/sqlqueryspec-with-parameters
              description: |-
                - Query text uses a parameter placeholder for category.
                - Bind category value `electronics` as a query parameter.
                - Do not build the category predicate by string concatenation.
              weight: 1
              pass_threshold: 1
            - name: prompt/cosmos-operation-errors
              description: |-
                - Handles `CosmosException` around service operations.
                - Reports status code and actionable service diagnostics.
                - Closes the `CosmosClient` after work completes.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - Close the synchronous `CosmosClient` after CRUD work completes.
                - Cleanup runs after service operations finish or fail.
                - Do not require database or container deletion for this prompt.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
