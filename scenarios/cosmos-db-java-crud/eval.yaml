name: cosmos-db-java-crud-items
description: Compare Azure tooling for a Cosmos DB Java CRUD task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: cosmos-db-dp-java-crud
    prompt: |-
      Write a Java program that performs CRUD operations on items in an Azure Cosmos DB NoSQL container.

      Write the code to files. Do not reply with code blocks.

      1. Create a CosmosClient using endpoint and key with CosmosClientBuilder.
      2. Create a database "TestDB" and container "Items" with partition key "/category".
      3. Insert a POJO item with properties: id, category, name, and quantity.
      4. Read the item back by id and partition key value.
      5. Query items where category equals "electronics" using parameterized SQL.
      6. Replace the item with an updated quantity.
      7. Delete the item by id and partition key.

      Show the required Maven dependency and handle CosmosException with status-code inspection.
    tags:
      service: cosmos-db
      plane: data-plane
      language: java
      category: crud
    graders:
      - type: run-command
        name: prompt/cosmos-package
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-java-crud/tools/check-cosmos-java.mjs
            - prompt/cosmos-package
      - type: run-command
        name: prompt/cosmos-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-java-crud/tools/check-cosmos-java.mjs
            - prompt/cosmos-client
      - type: run-command
        name: prompt/database-container
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-java-crud/tools/check-cosmos-java.mjs
            - prompt/database-container
      - type: run-command
        name: prompt/item-crud
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-java-crud/tools/check-cosmos-java.mjs
            - prompt/item-crud
      - type: run-command
        name: prompt/query-iteration
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-java-crud/tools/check-cosmos-java.mjs
            - prompt/query-iteration
      - type: run-command
        name: prompt/parameterized-query
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-java-crud/tools/check-cosmos-java.mjs
            - prompt/parameterized-query
      - type: run-command
        name: prompt/cosmos-exception
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/cosmos-db-java-crud/tools/check-cosmos-java.mjs
            - prompt/cosmos-exception
      - type: run-command
        name: language/build-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/build-manifest
      - type: run-command
        name: language/current-azure-dependencies
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/current-azure-dependencies
      - type: run-command
        name: language/current-imports
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/current-imports
      - type: run-command
        name: language/client-builder
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/java/check.mjs
            - language/client-builder
    environment:
      files:
        - src: tools/check-cosmos-java.mjs
          dest: .vally/scenarios/cosmos-db-java-crud/tools/check-cosmos-java.mjs
        - src: tools/cosmos-java-rules.mjs
          dest: .vally/scenarios/cosmos-db-java-crud/tools/cosmos-java-rules.mjs
        - src: ../../languages/java/check.mjs
          dest: .vally/languages/java/check.mjs
        - src: ../../languages/java/checks.mjs
          dest: .vally/languages/java/checks.mjs
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
