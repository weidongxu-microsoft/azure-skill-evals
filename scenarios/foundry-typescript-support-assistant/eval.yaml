name: foundry-typescript-support-assistant
description: "Can an agent design a complete grounded product-support assistant with Microsoft Foundry without prescribed SDK symbols?"
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: foundry-dp-typescript-support-assistant
    prompt: |-
      Contoso needs an internal product-support assistant built with Microsoft
      Foundry. Employees should be able to ask questions about product manuals
      and receive answers grounded in those manuals.

      Create a complete, runnable TypeScript application targeting Node.js 22.
      Select the appropriate Microsoft Foundry capabilities, Azure services,
      SDK packages, and application structure. Do not provide only an
      architecture proposal.

      **Write the application to files in the workspace. Do not reply with code blocks.**

      The application must:

      - Run as a hosted HTTP service suitable for multiple employees. A
        command-line-only application is not sufficient.
      - Include at least two supplied manual fixtures for a fictional Contoso
        Aero 300 product. The fixtures must document:
        - A reset procedure: disconnect external power, hold the recessed Reset
          button for 10 seconds, reconnect power, and expect the status light
          to turn solid green.
        - Operating limits of -10 C through 45 C and up to 12 hours of typical
          battery operation.
        - A two-year limited hardware warranty that covers manufacturing
          defects but excludes accidental damage.
        - A service process requiring a serial number, purchase date, and
          return authorization before shipment.
      - Ingest the manuals for grounded retrieval and verify that asynchronous
        ingestion has completed successfully before answering questions.
      - Support isolated multi-turn conversations so a follow-up question can
        use prior conversation context without mixing different employees.
        Conversation mappings must survive application restarts.
      - Return references identifying the source files that support an answer.
        References must come from the service response rather than being
        fabricated from known fixture names.
      - Avoid presenting unsupported claims as facts and durably record
        unsupported questions for human follow-up.
      - Durably record positive or negative feedback for a specific response
        and reject feedback that does not identify a known response.
      - Store application state in a durable shared service rather than only
        in process memory or local workspace files.
      - Include a small evaluation dataset with multiple cases and a runnable
        evaluation workflow that submits generated answers to Microsoft
        Foundry groundedness and relevance evaluators, waits for terminal
        status, traverses all returned output items, and reports every metric.
        Structure the evaluation code so more evaluators can be added later.
      - Use an authenticated employee identity to isolate user conversations
        and restrict ingestion, unresolved-question review, evaluation, and
        cleanup operations to administrators.
      - Read project endpoints, model deployment names, identity settings, and
        other environment-specific settings from configuration. Use Microsoft
        Entra authentication without embedded secrets.
      - Handle unsuccessful terminal states, bounded polling, service errors,
        actionable diagnostics, and cleanup of created cloud resources.
      - Include meaningful automated tests for application behavior and failure
        paths without requiring live Azure access.
      - Include dependency manifests and standard `lint`, `build`, and `test`
        package scripts, plus concise commands for installation, running, and
        cleanup.

      Assume the required Azure resources already exist. Do not provision Azure
      resources, create infrastructure-as-code files, or implement a deployment
      workflow.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: solution
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax. Trace
            concrete imports, client construction, SDK calls, returned service
            identifiers, persistence operations, and route-to-orchestration
            call paths. Examples of SDK methods in the criteria are
            nonexclusive evidence, not mandatory spellings. Fail interfaces,
            configuration objects, mocks, comments, or disconnected snippets
            that are not exercised by the runnable application.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - diff
          criteria:
            - name: prompt/implements-a-complete-runnable-support-application
              description: |-
                A production entry point starts a hosted HTTP server, its routes invoke the real
                support orchestration rather than placeholders, and the dependency manifest
                provides working lint, build, test, and start scripts. The application includes
                both required Aero 300 fixtures. Fail an architecture description,
                command-line-only tool, mock-only implementation, or disconnected SDK snippets.
              weight: 1
              pass_threshold: 1
            - name: prompt/selects-coherent-current-foundry-and-azure-sdks
              description: |-
                Concrete imports, client construction, and invoked methods use compatible,
                current packages and form one coherent implementation. Valid designs may use
                @azure/ai-projects, @azure/ai-agents, an OpenAI-compatible Foundry client,
                Azure AI Search, or another current combination when it implements the complete
                workflow. Evidence should include recognizable concrete operations such as an
                AIProjectClient plus agents and Responses clients, an AgentsClient plus agent and
                thread/run operations, or a model client plus SearchClient retrieval calls. Do
                not require the reference application's packages or reject a valid alternative
                architecture. Fail fictional APIs, incompatible API generations, packages that
                are declared but unused, or abstractions with no invoked service client.
              weight: 1
              pass_threshold: 1
            - name: prompt/ingests-manuals-and-waits-for-retrieval-readiness
              description: |-
                Trace a concrete executed path that reads both fixtures, uploads or indexes each
                one into the selected retrieval service, associates the resulting retrieval
                resource with the answering workflow, and waits for successful readiness before
                allowing questions. Polling must be bounded and must reject failed, canceled, and
                timed-out states. Concrete evidence can include file creation, vector-store
                creation, vector-store file attachment and status retrieval, or SearchClient
                document upload followed by readiness verification. Equivalent current
                mechanisms are valid, but merely constructing tool configuration does not pass.
              weight: 1
              pass_threshold: 1
            - name: prompt/returns-grounded-answers-with-service-citations
              description: |-
                Trace the HTTP request through a concrete agent, responses, search, or retrieval
                SDK call that uses the configured grounding resource. The returned answer must
                include references parsed from service annotations, citation metadata, or search
                results tied to that response. Evidence can include a Responses call referencing
                a configured agent and requesting file-search results, an Agents thread/run whose
                messages contain file citations, or an explicit search-then-model flow that passes
                returned documents to the model. Fail direct ungrounded model calls, fixture-text
                lookup presented as cloud retrieval, or citations manufactured from known
                filenames.
              weight: 1
              pass_threshold: 1
            - name: prompt/preserves-isolated-multi-turn-conversations
              description: |-
                Concrete create and follow-up paths retain the conversation, thread, or equivalent
                service identifier returned by the provider and reuse it on later turns. A durable
                mapping includes both authenticated employee identity and local conversation
                identity, survives process restarts, and prevents two employees using the same
                local ID from sharing context. In-memory-only maps do not pass.
              weight: 1
              pass_threshold: 1
            - name: prompt/records-unsupported-questions-for-follow-up
              description: |-
                The executed answering path constrains unsupported claims, detects when retrieved
                evidence cannot support an answer, and durably records the original question,
                employee-scoped conversation, response identity, and timestamp for administrator
                review. A prompt instruction without detection and persistence does not pass.
              weight: 1
              pass_threshold: 1
            - name: prompt/records-validated-response-specific-feedback
              description: |-
                The feedback route verifies that the supplied response identifier is a known
                response in the authenticated employee's identified conversation before durably
                recording a positive or negative rating. Trace both the successful write and an
                explicit rejection path for unknown, mismatched, or invalid response feedback.
              weight: 1
              pass_threshold: 1
            - name: prompt/runs-extensible-groundedness-and-relevance-evaluation
              description: |-
                Trace concrete evaluation SDK calls that generate answers through the same
                application path, submit multiple rows to real Microsoft Foundry groundedness and
                relevance evaluators, and supply retrieved evidence as groundedness context rather
                than copying fixture expectations. The code waits for a successful terminal run,
                rejects unsuccessful states, enumerates every returned output page and metric, and
                represents evaluators in an extensible collection. Evidence can include eval
                creation, run creation and retrieval, and paged output-item listing through the
                selected current SDK. A local scoring function labeled as a Foundry evaluation
                does not pass.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-entra-identity-and-external-configuration
              description: |-
                Trace Azure client construction to an Entra TokenCredential and external endpoint
                and deployment configuration. Trace HTTP authorization from a trusted
                hosting-platform or validated-token employee identity through conversation
                scoping, and verify ingestion, unresolved review, evaluation, and cleanup routes
                enforce an administrator boundary. Fail caller-selected identity values,
                embedded credentials, or administrative routes with no authorization check.
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-lifecycle-errors-and-bounded-waits
              description: |-
                Every asynchronous service lifecycle used by ingestion and evaluation either uses
                an SDK poller or a deadline-based loop with delay. Concrete branches handle all
                documented terminal failure states and preserve useful service status, code, and
                message details. Fail unbounded loops, success-only polling, broad catches that
                suppress failures, or successful-looking fallback results.
              weight: 1
              pass_threshold: 1
            - name: prompt/cleans-up-created-cloud-resources-safely
              description: |-
                Trace concrete delete calls that consume the exact service identifiers captured
                during creation. Cleanup removes conversation items and conversations, agent
                versions or equivalent answering resources, grounding resources, uploaded files,
                and temporary evaluation resources in a dependency-safe order. Partial failures
                remain retryable and are surfaced rather than silently clearing ownership state.
              weight: 1
              pass_threshold: 1
            - name: prompt/includes-meaningful-offline-automated-tests
              description: |-
                The standard test script runs offline tests with fakes or mocks at the Azure
                boundary while exercising real application orchestration. Tests cover hosted
                routing and authorization, conversation reuse and employee isolation,
                unsupported-question persistence, feedback ownership validation, durable-state
                failure handling, evaluation rows built from retrieved evidence, and cleanup.
                Compile-only tests or tests of standalone helpers are insufficient.
              weight: 1
              pass_threshold: 1
            - name: prompt/excludes-provisioning-and-deployment
              description: |-
                Does not add Azure resource provisioning, infrastructure-as-code artifacts, or a
                deployment workflow. It assumes required cloud resources already exist and
                documents how to configure and run the application against them.
              weight: 1
              pass_threshold: 1
            - name: language/correct-azure-scoped-packages
              description: |-
                All Azure SDK dependencies use @azure/ scoped packages (e.g., @azure/storage-blob, @azure/keyvault-secrets, @azure/identity). No deprecated unscoped packages (azure-storage, azure-arm-*, ms-rest-azure, @azure/ms-rest-*).
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-for-authentication
              description: |-
                Includes @azure/identity as a dependency. For local development, DefaultAzureCredential is acceptable. For production code, uses a specific Entra token credential (e.g., ManagedIdentityCredential, ClientSecretCredential, WorkloadIdentityCredential) or configures DefaultAzureCredential with the AZURE_TOKEN_CREDENTIALS environment variable set to "prod" or a specific token credential. No hardcoded connection strings, account keys, SAS tokens, or secrets in code.
              weight: 1
              pass_threshold: 1
            - name: language/client-constructor-with-endpoint-and-credential
              description: |-
                SDK clients constructed with endpoint URL and credential object, e.g. new BlobServiceClient(url, credential) or new SecretClient(vaultUrl, credential). No legacy constructor patterns or connection string-based construction when identity-based auth is available.
              weight: 1
              pass_threshold: 1
            - name: language/async-await-pattern
              description: |-
                Uses async/await for all asynchronous operations. No raw .then()/.catch() chains when await is cleaner. No callback-based patterns. Top-level async function or IIFE for entry point.
              weight: 1
              pass_threshold: 1
            - name: language/pagination-with-for-await-of
              description: |-
                List/query operations use for-await-of iteration over the PagedAsyncIterableIterator returned by SDK methods. Does not collect all pages into an array in memory (e.g., no Array.from() or manual page accumulation). Uses byPage() when per-page control is needed.
              weight: 1
              pass_threshold: 1
            - name: language/lro-pattern-beginxxx-polluntildone
              description: |-
                Uses the SDK's poller when the operation exposes one. For Foundry operations
                that expose create/retrieve status APIs instead, bounded asynchronous polling
                that handles every terminal state is valid. No unbounded or tight polling loops.
              weight: 1
              pass_threshold: 1
            - name: language/resterror-exception-handling
              description: |-
                Catches RestError (from @azure/core-rest-pipeline or the service package) with statusCode inspection for error-specific handling. Not just generic Error or try/catch without type checking.
              weight: 1
              pass_threshold: 1
            - name: language/no-deprecated-packages
              description: |-
                No deprecated or legacy Azure packages in package.json: azure-storage, azure-arm-*, ms-rest-azure, @azure/ms-rest-js, @azure/ms-rest-nodeauth, @azure/ms-rest-azure-js. All dependencies use the current @azure/* track.
              weight: 1
              pass_threshold: 1
            - name: language/logging-via-azure-logger
              description: |-
                Uses @azure/logger with setLogLevel() or the AZURE_LOG_LEVEL environment variable for SDK diagnostic logging. No custom logging wrappers around SDK internals.
              weight: 1
              pass_threshold: 1
            - name: language/package-json-with-correct-dependencies
              description: |-
                Includes a valid package.json with all required @azure/* dependencies listed. TypeScript projects include tsconfig.json and appropriate @types/* packages or use a recent TypeScript version with built-in types.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
artifacts:
  include:
    - "**/*.ts"
    - "**/*.js"
    - "**/*.json"
    - "**/*.jsonl"
    - "**/package.json"
    - "**/tsconfig.json"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/.data/**"
