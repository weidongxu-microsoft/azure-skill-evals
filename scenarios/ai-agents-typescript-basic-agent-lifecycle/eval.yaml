name: ai-agents-typescript-basic-agent-lifecycle
description: "Can an agent build a complete Azure AI Agents application that creates an agent conversation, runs it to completion, and reads the assistant response?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-agents-dp-typescript-basic-agent-lifecycle
    prompt: |-
      Create a complete, runnable TypeScript console application that uses the
      `@azure/ai-agents` package to run a basic Azure AI Agent conversation.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read the Azure AI project endpoint from `PROJECT_ENDPOINT` and the model deployment
        name from `MODEL_DEPLOYMENT_NAME`.
      - Create the Azure AI Agents client using the project endpoint and
        `DefaultAzureCredential`.
      - Create an agent named `hyoka-basic-agent` with the instructions
        `Answer the user's question clearly and concisely.`
      - Create a thread and add this exact user message:
        `What is the capital of France?`
      - Create a run for that thread and agent, then use the SDK to refresh the run until it
        reaches a terminal status.
      - After a successful run, list the thread messages in chronological order and print
        the text content of every assistant message.
      - Delete the thread and agent after the conversation finishes.
      - Include the project manifest and concise commands for restoring, building, and
        running the application.
      
      Use async/await throughout the agent workflow.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: agents
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/creates-agentsclient-from-azure-ai-agents-with-the-proje
              description: |-
                Uses `AgentsClient` from `@azure/ai-agents` with the project endpoint for the agent,
                thread, message, and run workflow; a non-agents chat client is not equivalent.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-client-createagent-with-the-deployment-from-model
              description: |-
                Calls `client.createAgent` with the deployment from `MODEL_DEPLOYMENT_NAME`, the
                required name, and the required instructions.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-a-thread-with-client-threads-create
              description: |-
                Creates a thread with `client.threads.create`.
              weight: 1
              pass_threshold: 1
            - name: prompt/adds-the-exact-user-message-with-client-messages-create
              description: |-
                Adds the exact user message with `client.messages.create`, role `user`, and the
                created thread ID.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-and-polls-the-run-with-the-created-thread-id-and
              description: |-
                Creates the run with the created thread ID and agent ID, then uses the SDK poller or
                repeated SDK retrieval until a terminal status is reached.
              weight: 1
              pass_threshold: 1
            - name: prompt/retrieves-messages-only-after-successful-completion-requ
              description: |-
                Retrieves messages only after successful completion, requests chronological order,
                and prints text read from returned assistant messages rather than serializing raw
                SDK objects or using a known or hardcoded answer.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-created-thread-with-client-threads-delete-an
              description: |-
                Deletes the created thread with `client.threads.delete` and the created agent with
                `client.deleteAgent`.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/long-running-operation-completion
              description: |-
                - Use the selected SDK's poller, wait helper, or status-retrieval mechanism.
                - Continue until a successful or unsuccessful terminal state.
                - Distinguish successful completion from unsuccessful terminal states.
                - Bound explicit polling and avoid tight polling loops.
                - Do not replace an available SDK polling abstraction with ad hoc delays.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
