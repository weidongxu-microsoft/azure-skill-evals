name: resource-manager-python-resource-group-crud
description: Compare Azure tooling for a Python resource group lifecycle
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: resource-manager-mp-python-rg-crud
    prompt: |-
      Write a complete, runnable Python script that performs one Azure Resource Group lifecycle.

      Write the code to files. Do not reply with code blocks.

      1. Show the required pip packages for Azure Identity and Resource Manager.
      2. Read the subscription ID, resource group name, and location from AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP_NAME, and AZURE_LOCATION. Use eastus as the location default.
      3. Authenticate one ResourceManagementClient with DefaultAzureCredential and that subscription ID.
      4. Create the resource group with ResourceGroup and create_or_update, completing the operation in eastus.
      5. List all resource groups, iterate the returned collection, and print data from each result.
      6. Get the created resource group and print data from the returned result.
      7. Update that resource group's tags to include environment=development and print the observed update result.
      8. Begin deleting the same resource group, wait for that exact poller's result, and print a deletion confirmation only after completion.
      9. Handle HttpResponseError meaningfully without swallowing unrelated failures.
    tags:
      service: resource-manager
      plane: management-plane
      language: python
      category: crud
    graders:
      - type: run-command
        name: prompt/sdk-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/sdk-packages
      - type: run-command
        name: prompt/configuration
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/configuration
      - type: run-command
        name: prompt/authenticated-management-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/authenticated-management-client
      - type: run-command
        name: prompt/create-resource-group
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/create-resource-group
      - type: run-command
        name: prompt/list-resource-groups
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/list-resource-groups
      - type: run-command
        name: prompt/get-resource-group
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/get-resource-group
      - type: run-command
        name: prompt/update-tags
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/update-tags
      - type: run-command
        name: prompt/delete-resource-group
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/delete-resource-group
      - type: run-command
        name: prompt/sdk-error-handling
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
            - prompt/sdk-error-handling
    environment:
      files:
        - src: tools/check-resource-group-python.mjs
          dest: .vally/scenarios/resource-manager-python-resource-group-crud/tools/check-resource-group-python.mjs
        - src: tools/resource-group-rules.mjs
          dest: .vally/scenarios/resource-manager-python-resource-group-crud/tools/resource-group-rules.mjs
        - src: tools/resource_group_analyzer.py
          dest: .vally/scenarios/resource-manager-python-resource-group-crud/tools/resource_group_analyzer.py
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
