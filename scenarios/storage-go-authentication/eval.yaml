name: storage-go-authentication
description: Compare Azure tooling for Blob Storage authentication in Go
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-go-auth
    prompt: |-
      How do I authenticate to Azure Blob Storage using `DefaultAzureCredential` in Go?
      Create a complete runnable project that constructs an `azblob` service client using managed identity in production while allowing Azure CLI credentials during local development through the documented default credential chain. Read the storage account endpoint from an environment variable, explain the required Go modules and RBAC/setup, and explicitly handle authentication and no-credential-available errors.

      Use the current first-party Azure SDK for Go, context-aware calls, secure configuration, typed SDK errors, and proper response-body cleanup. Include root `go.mod`, `go.sum`, and `README.md` files.
    tags:
      service: storage
      plane: data-plane
      language: go
      category: authentication
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/current-identity-and-blob-modules
              description: Uses current `azidentity` and `azblob` modules in a complete Go project.
              weight: 1
              pass_threshold: 1
            - name: prompt/default-credential-service-client
              description: Creates `DefaultAzureCredential` and passes it to an Blob service client whose endpoint comes from an environment variable.
              weight: 1
              pass_threshold: 1
            - name: prompt/managed-identity-cli-chain
              description: Documents managed identity for Azure production and Azure CLI authentication for local development through the default credential chain.
              weight: 1
              pass_threshold: 1
            - name: prompt/authentication-and-response-errors
              description: Explicitly handles typed `azidentity.AuthenticationFailedError`, `azidentity.AuthenticationRequiredError`, and `azcore.ResponseError` values.
              weight: 1
              pass_threshold: 1
            - name: prompt/readme-modules-rbac-and-setup
              description: README documents modules, environment configuration, credential setup, and required Blob Data RBAC role assignment.
              weight: 1
              pass_threshold: 1
            - name: prompt/context-secure-configuration-and-cleanup
              description: Uses context-aware calls, no hardcoded credentials, and closes response bodies where required.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/go-project-tests
        config:
          command: go
          args:
            - test
            - -mod=readonly
            - ./...
          timeout: 3m
    artifacts:
      include: ["**/*.go", "**/go.mod", "**/go.sum", "**/README.md"]
      exclude: ["**/.vally/**", "**/vendor/**", "**/*.test"]