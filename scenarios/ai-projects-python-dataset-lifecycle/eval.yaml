name: ai-projects-python-dataset-lifecycle
description: "Can an application upload, retrieve, download, verify, and delete one exact Azure AI project dataset version?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-python-dataset-lifecycle
    prompt: |-
      Create a complete, runnable Python console application using
      `azure-ai-projects` 2.5.0 and `azure-storage-blob` 12.30.0.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`, `DATASET_NAME`, `DATASET_VERSION`,
        `DATA_FILE_PATH`, and `DOWNLOAD_FILE_PATH`.
      - Upload the local file at `DATA_FILE_PATH` as the exact project dataset name and
        version supplied by the user, using the project's default Azure Storage
        connection.
      - Retrieve that exact dataset version and print its SDK-defined name, version, ID,
        type, and data URI.
      - Request the dataset's SDK credential and blob reference. Use them with the Azure
        Storage Blob SDK to download the referenced blob to `DOWNLOAD_FILE_PATH` without
        displaying the SAS URI.
      - Compare the downloaded bytes with the original file and fail if they differ.
        Print the verified byte count only after the comparison succeeds.
      - Delete the exact dataset name and version even when retrieval or download fails
        after upload.
      - Include the dependency manifest and concise install and run commands.
      
      Use the synchronous SDK client throughout.
    tags:
      service: foundry
      plane: data-plane
      language: python
      category: projects
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/creates-aiprojectclient-and-calls-project-client-dataset
              description: |-
                Creates `AIProjectClient` and calls `project_client.datasets.upload_file` with the
                supplied name, version, and file path, using the project dataset API rather than
                `requests` or another direct HTTP upload.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-project-client-datasets-get-with-the-same-name-and
              description: |-
                Calls `project_client.datasets.get` with the same name and version and prints
                typed dataset-version name, version, ID, `type`, and `data_uri`.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-project-client-datasets-get-credentials-for-that-e
              description: |-
                Calls `project_client.datasets.get_credentials` for that exact version, uses both
                `dataset_credential.blob_reference.blob_uri` and its `credential.sas_uri`, and
                downloads the correct blob through `BlobClient` from `azure.storage.blob`, not an
                invented dataset download API or direct HTTP call, without displaying the SAS URI.
              weight: 1
              pass_threshold: 1
            - name: prompt/persists-the-blob-at-download-file-path-compares-its-byt
              description: |-
                Persists the Blob SDK's downloaded bytes at `DOWNLOAD_FILE_PATH`, compares them
                with the original file, fails on a mismatch, and prints their byte count only after
                verification succeeds.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-project-client-datasets-delete-with-the-exact-name
              description: |-
                After any successful upload, calls `project_client.datasets.delete` with the exact
                name and version, including when later retrieval or download fails.
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
    artifacts:
      include:
        - "**/*.py"
        - "**/requirements*.txt"
        - "**/pyproject.toml"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/.venv/**"
        - "**/__pycache__/**"
