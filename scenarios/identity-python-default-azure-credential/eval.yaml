name: identity-python-default-azure-credential
description: Compare Azure tooling for a Python DefaultAzureCredential task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-python-default-azure-credential
    prompt: |-
      Write a complete, runnable Python application that uses DefaultAzureCredential to authenticate to Azure Key Vault and retrieve a secret.

      Write the code to files. Do not reply with code blocks.

      1. Show the required pip packages for Azure Identity and Key Vault secrets.
      2. Construct a DefaultAzureCredential and pass that credential to a SecretClient.
      3. Use the authenticated client to retrieve a secret and print its value.
      4. Handle ClientAuthenticationError separately from service request errors.
      5. Configure Python logging so Azure Identity diagnostic messages are emitted.

      Read the vault URL and secret name from environment variables. Do not hard-code credentials.
    tags:
      service: identity
      plane: data-plane
      language: python
      category: authentication
    graders:
      - type: run-command
        name: prompt/identity-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-default-azure-credential/tools/check-identity-python.mjs
            - prompt/identity-packages
      - type: run-command
        name: prompt/default-azure-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-default-azure-credential/tools/check-identity-python.mjs
            - prompt/default-azure-credential
      - type: run-command
        name: prompt/credential-client-association
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-default-azure-credential/tools/check-identity-python.mjs
            - prompt/credential-client-association
      - type: run-command
        name: prompt/authenticated-operation
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-default-azure-credential/tools/check-identity-python.mjs
            - prompt/authenticated-operation
      - type: run-command
        name: prompt/auth-errors
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-default-azure-credential/tools/check-identity-python.mjs
            - prompt/auth-errors
      - type: run-command
        name: prompt/identity-diagnostics
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/identity-python-default-azure-credential/tools/check-identity-python.mjs
            - prompt/identity-diagnostics
    environment:
      files:
        - src: tools/check-identity-python.mjs
          dest: .vally/scenarios/identity-python-default-azure-credential/tools/check-identity-python.mjs
        - src: tools/identity-python-rules.mjs
          dest: .vally/scenarios/identity-python-default-azure-credential/tools/identity-python-rules.mjs
        - src: ../../languages/python/check.mjs
          dest: .vally/languages/python/check.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
