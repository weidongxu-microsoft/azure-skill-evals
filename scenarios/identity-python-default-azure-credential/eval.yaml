name: identity-python-default-azure-credential
description: Compare Azure tooling for a Python DefaultAzureCredential task
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-python-default-azure-credential
    prompt: |-
      Show me how to authenticate
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      an Azure SDK client using DefaultAzureCredential. Explain:
      1. What pip packages are needed
      2. How to create and use a DefaultAzureCredential instance
      3. The credential chain order and which credentials are tried
      4. How it works in local development (VS Code, Azure CLI) vs Azure deployments
      5. How to troubleshoot authentication failures with logging
    tags:
      service: identity
      plane: data-plane
      language: python
      category: authentication
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-identity-pip-package-installation
              description: |-
                `azure-identity` pip package installation
              weight: 1
              pass_threshold: 1
            - name: prompt/defaultazurecredential-constructor-and-keyword-arguments
              description: |-
                `DefaultAzureCredential()` constructor and keyword arguments
              weight: 1
              pass_threshold: 1
            - name: prompt/credential-chain-environment-workload-identity-managed-i
              description: |-
                Credential chain: Environment → Workload Identity → Managed Identity → Azure CLI → etc.
              weight: 1
              pass_threshold: 1
            - name: prompt/passing-credential-to-azure-sdk-clients
              description: |-
                Passing credential to Azure SDK clients
              weight: 1
              pass_threshold: 1
            - name: prompt/clientauthenticationerror-handling-and-logging-module-co
              description: |-
                `ClientAuthenticationError` handling and `logging` module configuration
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - -m
            - compileall
            - -q
            - .
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
