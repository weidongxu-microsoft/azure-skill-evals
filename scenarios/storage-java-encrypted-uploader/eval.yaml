name: storage-java-encrypted-uploader
description: Compare Azure tooling for a Java client-side encrypted Blob uploader task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-java-encrypted-uploader
    prompt: |-
      Create a small Java 17 Maven project that uploads files to Azure Blob Storage with client-side encryption, where the encryption key material is managed in Azure Key Vault.
      
      The project needs:
      
      - A **key management class** (both sync and async versions) that interacts with Azure Key Vault's Keys service (not Secrets) to perform cryptographic operations. It should implement envelope encryption: generate a data encryption key locally, use Key Vault to protect (wrap) it, and store the protected key alongside the encrypted blob. For decryption, have Key Vault recover (unwrap) the data key, then decrypt locally. The raw data key should never be persisted anywhere, and the vault's key material should never leave Key Vault.
      
      - A **blob uploader/downloader class** (both sync and async versions) that handles the actual encryption and storage. For upload: generate a data key, encrypt the data locally, protect the data key via Key Vault, then upload the ciphertext to Blob Storage with the protected key and any necessary cryptographic parameters stored as blob metadata. For download: read the blob and its metadata, recover the data key via Key Vault, and decrypt. Should handle errors from both services (e.g., the vault key may have been disabled, or the blob may not exist).
      
      - A **configuration class** that builds the necessary Azure connections for both Blob Storage and Key Vault. It should read endpoints from environment variables and authenticate with managed identity. All connections should share a single credential instance.
      
      - A **Main class** that demos both implementations: runs the full encrypt-upload-download-decrypt round-trip using the sync implementation first, then repeats with the async implementation. Print the vault key ID used, the wrapped DEK (base64), and the decrypted output.
      
      Include a complete `pom.xml` with the necessary Azure SDK dependencies.
    tags:
      service: storage
      plane: data-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/uses-com-azure-azure-security-keyvault-keys-keys-not-sec
              description: |-
                - Manifest declares the Key Vault Keys SDK, not Key Vault Secrets for key protection.
                - Use Key Vault key or cryptography clients for wrapping operations.
                - Blob Storage and Identity dependencies are included as needed.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-javax-crypto-or-java-security-for-local-aes-gcm-enc
              description: |-
                - Generate local data-encryption keys with Java cryptography APIs.
                - Encrypt file bytes locally with authenticated encryption.
                - Service calls do not replace local content encryption.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-keyclient-cryptographyclient-builder-for-key-vault
              description: |-
                - Build a Key Vault key or cryptography client for the configured key.
                - Vault endpoint and managed identity credential flow into the client.
                - Do not use a secrets client for wrap/unwrap operations.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-cryptographyclient-for-wrapkey-and-unwrapkey-operat
              description: |-
                - Data-encryption key -> Key Vault wrap operation before upload.
                - Wrapped key metadata -> Key Vault unwrap operation before decrypt.
                - Wrap and unwrap use the configured Key Vault key.
              weight: 1
              pass_threshold: 1
            - name: prompt/specifies-rsa-key-wrap-algorithm-keywrapalgorithm-rsa-oa
              description: |-
                - Select an RSA key-wrap algorithm supported by the configured vault key.
                - The same algorithm metadata is stored for later unwrap.
                - `RSA_OAEP` or `RSA_OAEP_256` are valid evidence.
              weight: 1
              pass_threshold: 1
            - name: prompt/key-material-never-leaves-key-vault-wrap-unwrap-is-serve
              description: |-
                - Key-encryption key material remains inside Key Vault.
                - Application sends only the local DEK to wrap/unwrap service operations.
                - Do not export or persist the vault key material.
              weight: 1
              pass_threshold: 1
            - name: prompt/generates-a-random-aes-256-dek-locally-32-bytes
              description: |-
                - Generate a fresh random data-encryption key for each upload.
                - Use 32 bytes or another strength appropriate for the selected authenticated cipher.
                - Do not reuse a static DEK across uploads.
              weight: 1
              pass_threshold: 1
            - name: prompt/encrypts-data-with-aes-gcm-locally-using-the-dek
              description: |-
                - Plaintext file bytes are encrypted locally before upload.
                - Use AES-GCM or an equivalent authenticated-encryption construction.
                - Uploaded blob content is ciphertext, not plaintext.
              weight: 1
              pass_threshold: 1
            - name: prompt/wraps-the-dek-via-key-vault-wrapkey
              description: |-
                - Local plaintext DEK is wrapped through Key Vault before storage.
                - Store or transmit only the wrapped DEK outside local encryption code.
                - Wrapped DEK is linked to the blob for later decryption.
              weight: 1
              pass_threshold: 1
            - name: prompt/stores-wrapped-dek-as-blob-metadata
              description: |-
                - Blob metadata contains the wrapped DEK.
                - Binary wrapped-key data is encoded safely for metadata storage.
                - Metadata key names are stable enough for the decrypt path.
              weight: 1
              pass_threshold: 1
            - name: prompt/stores-iv-initialization-vector-in-blob-metadata
              description: |-
                - Generate fresh encryption parameters such as IV or nonce.
                - Store every parameter required for decryption in blob metadata.
                - Binary parameters are encoded safely for metadata storage.
              weight: 1
              pass_threshold: 1
            - name: prompt/stores-vault-key-identifier-in-blob-metadata
              description: |-
                - Store the Key Vault key identifier with the encrypted blob.
                - Decryption uses that identifier to select the unwrap key.
                - Metadata does not contain raw vault key material.
              weight: 1
              pass_threshold: 1
            - name: prompt/sync-encrypted-round-trip
              description: |-
                - Generate a DEK, encrypt locally, wrap it, and upload ciphertext plus metadata synchronously.
                - Download ciphertext and metadata, unwrap the DEK, and decrypt locally.
                - Return decrypted content matching the original input.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-aes-gcm-not-aes-cbc-aes-ecb-or-other-modes
              description: |-
                - Encryption uses authenticated encryption for file content.
                - AES-GCM is valid evidence for the required authenticated mode.
                - AES-CBC, AES-ECB, or unauthenticated encryption alone does not satisfy this criterion.
              weight: 1
              pass_threshold: 1
            - name: prompt/generates-random-iv-for-each-encryption-typically-12-byt
              description: |-
                - Generate a fresh IV/nonce for every encryption operation.
                - Use a length valid for the selected authenticated cipher.
                - Store the IV/nonce so decryption can reconstruct cipher parameters.
              weight: 1
              pass_threshold: 1
            - name: prompt/encryption-service-failures
              description: |-
                - Handle Key Vault failures such as a disabled or missing key.
                - Handle Blob Storage failures such as a missing blob.
                - Report actionable service details and do not expose plaintext keys.
              weight: 1
              pass_threshold: 1
            - name: prompt/async-encrypted-round-trip
              description: |-
                - Perform Blob Storage and Key Vault service calls with their async clients.
                - Compose the full encrypt-upload-download-decrypt flow with Reactor.
                - Keep blocking work off the reactive service chain or isolate it on an appropriate scheduler.
              weight: 1
              pass_threshold: 1
            - name: prompt/not-encrypting-data-directly-with-the-vault-key-should-b
              description: |-
                - File content is encrypted with a local DEK.
                - Key Vault key is used only to protect or recover the DEK.
                - Do not send full file content to Key Vault for encryption.
              weight: 1
              pass_threshold: 1
            - name: prompt/not-storing-raw-dek-in-plaintext
              description: |-
                - Plaintext DEK is never uploaded or persisted.
                - Blob metadata stores only wrapped or otherwise protected key material.
                - Logs and console output do not expose the plaintext DEK.
              weight: 1
              pass_threshold: 1
            - name: prompt/shared-managed-identity-configuration
              description: |-
                - Read the Blob Storage and Key Vault endpoints from environment variables.
                - Create one managed-identity credential instance.
                - Share that credential across all sync and async Azure clients.
              weight: 1
              pass_threshold: 1
            - name: prompt/encrypted-uploader-demo
              description: |-
                - Run the complete sync round trip before the complete async round trip.
                - Print the vault key ID and base64-encoded wrapped DEK for each flow.
                - Print the successfully decrypted output for each flow.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/reactive-async-service-flow
              description: |-
                - Prompt-required async Azure operations originate from async SDK clients or documented async adapters.
                - Compose reusable async flows with Reactor `Mono`/`Flux` or equivalent nonblocking composition.
                - Do not wrap synchronous clients in an executor or block inside reusable async service methods.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-error-diagnostics
              description: |-
                - Handle the selected Azure service or identity SDK exception type around service operations.
                - Preserve status code, failure reason, or service error details when available.
                - Report actionable diagnostics without exposing credential material.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
