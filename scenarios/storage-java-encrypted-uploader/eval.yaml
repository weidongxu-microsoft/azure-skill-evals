name: storage-java-encrypted-uploader
description: Compare Azure tooling for a Java client-side encrypted Blob uploader task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-java-encrypted-uploader
    prompt: |-
      Create a small Java 17 Maven project that uploads files to Azure Blob Storage with client-side encryption, where the encryption key material is managed in Azure Key Vault.

      Write the code to files. Do not reply with code blocks.

      Create sync and async Key Vault Keys key-management and Blob uploader/downloader implementations. Generate a local 32-byte DEK, encrypt locally with AES/GCM/NoPadding using a fresh IV, wrap and unwrap that DEK through a Key Vault CryptographyClient using RSA-OAEP, and never persist the raw DEK or extract vault key material. Preserve exact values across the envelope flow: pass the generated DEK unchanged to wrap, serialize only the wrapped DEK and IV as base64 metadata without adding or changing bytes, upload and decrypt the exact ciphertext bytes, use the exact unwrap result as the AES key, and return and print the decrypted plaintext unchanged. Upload ciphertext and metadata containing base64 wrapped DEK, IV, and vault key ID; download, unwrap, and decrypt the same blob.

      Read AZURE_STORAGE_ACCOUNT_URL and AZURE_KEY_VAULT_URL from the environment. Build Blob and Key Vault clients with one shared DefaultAzureCredential. Handle BlobStorageException and KeyVaultErrorException meaningfully without swallowing failures. Main must demonstrate a connected sync round trip followed by a blocked connected async round trip, printing the key ID, wrapped DEK, and plaintext.

      Include a complete Maven manifest with active runtime dependencies:
      com.azure:azure-identity:1.18.5,
      com.azure:azure-storage-blob:12.35.1, and
      com.azure:azure-security-keyvault-keys:4.11.2.
    tags:
      service: storage
      plane: data-plane
      language: java
      category: crud
    graders:
      - type: run-command
        name: prompt/sdk-dependencies
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/storage-java-encrypted-uploader/tools/check-storage-java.mjs, prompt/sdk-dependencies]
      - type: run-command
        name: prompt/client-configuration
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/storage-java-encrypted-uploader/tools/check-storage-java.mjs, prompt/client-configuration]
      - type: run-command
        name: prompt/sync-envelope-encryption
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/storage-java-encrypted-uploader/tools/check-storage-java.mjs, prompt/sync-envelope-encryption]
      - type: run-command
        name: prompt/async-envelope-encryption
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/storage-java-encrypted-uploader/tools/check-storage-java.mjs, prompt/async-envelope-encryption]
      - type: run-command
        name: prompt/encrypted-blob-metadata
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/storage-java-encrypted-uploader/tools/check-storage-java.mjs, prompt/encrypted-blob-metadata]
      - type: run-command
        name: prompt/error-handling
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/storage-java-encrypted-uploader/tools/check-storage-java.mjs, prompt/error-handling]
      - type: run-command
        name: prompt/connected-demo
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/storage-java-encrypted-uploader/tools/check-storage-java.mjs, prompt/connected-demo]
      - type: run-command
        name: language/build-manifest
        weight: 1
        config:
          command: node
          args: [.vally/languages/java/check.mjs, language/build-manifest]
      - type: run-command
        name: language/current-azure-dependencies
        weight: 1
        config:
          command: node
          args: [.vally/languages/java/check.mjs, language/current-azure-dependencies]
      - type: run-command
        name: language/current-imports
        weight: 1
        config:
          command: node
          args: [.vally/languages/java/check.mjs, language/current-imports]
      - type: run-command
        name: language/client-builder
        weight: 1
        config:
          command: node
          args: [.vally/languages/java/check.mjs, language/client-builder]
    environment:
      files:
        - src: tools/check-storage-java.mjs
          dest: .vally/scenarios/storage-java-encrypted-uploader/tools/check-storage-java.mjs
        - src: tools/storage-java-rules.mjs
          dest: .vally/scenarios/storage-java-encrypted-uploader/tools/storage-java-rules.mjs
        - src: ../../languages/java/check.mjs
          dest: .vally/languages/java/check.mjs
        - src: ../../languages/java/checks.mjs
          dest: .vally/languages/java/checks.mjs
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
