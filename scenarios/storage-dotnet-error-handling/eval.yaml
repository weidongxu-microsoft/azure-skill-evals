name: storage-dotnet-error-handling
description: Compare Azure tooling for a Blob Storage .NET error-handling task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-dotnet-error-handling
    prompt: |-
      Write a runnable C# console application that demonstrates production error handling with Azure.Storage.Blobs.

      Write the code to files. Do not reply with code blocks.

      1. Target net8.0 and pin Azure.Identity 1.21.0 and Azure.Storage.Blobs 12.29.2 exactly.
      2. Read an absolute Blob service endpoint from AZURE_STORAGE_BLOB_ENDPOINT, plus the container and blob names from AZURE_STORAGE_CONTAINER and AZURE_STORAGE_BLOB. Authenticate with DefaultAzureCredential.
      3. Configure BlobClientOptions.Retry with bounded exponential retries, and pass those options to BlobServiceClient.
      4. From that service client, derive the container and blob clients. Await GetPropertiesAsync, then use its ETag as IfMatch and the optional AZURE_STORAGE_LEASE_ID as LeaseId in BlobRequestConditions for an awaited SetMetadataAsync call on the same blob.
      5. Catch RequestFailedException around those connected operations. Log Status, ErrorCode, and Message, plus the client request ID read from the x-ms-client-request-id raw-response header and the service request ID from GetRawResponse().Headers.RequestId.
      6. Handle 404, 403, 409, 412, and 429 explicitly. Explain in the relevant paths: missing blob or container; authorization/RBAC permissions; lease or storage-state conflict; failed ETag/precondition or lease condition; and throttling after the configured SDK retry policy.

      Equivalent well-factored helper methods and SDK forms are acceptable. Do not hard-code credentials.
    tags:
      service: storage
      plane: data-plane
      language: dotnet
      category: error-handling
    graders:
      - type: run-command
        name: prompt/storage-error-manifest
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-error-handling/tools/check-storage-dotnet-error-handling.mjs, prompt/storage-error-manifest] }
      - type: run-command
        name: prompt/configured-blob-client
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-error-handling/tools/check-storage-dotnet-error-handling.mjs, prompt/configured-blob-client] }
      - type: run-command
        name: prompt/connected-storage-operations
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-error-handling/tools/check-storage-dotnet-error-handling.mjs, prompt/connected-storage-operations] }
      - type: run-command
        name: prompt/exception-details
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-error-handling/tools/check-storage-dotnet-error-handling.mjs, prompt/exception-details] }
      - type: run-command
        name: prompt/common-status-handling
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-error-handling/tools/check-storage-dotnet-error-handling.mjs, prompt/common-status-handling] }
      - type: run-command
        name: prompt/conditional-request
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-error-handling/tools/check-storage-dotnet-error-handling.mjs, prompt/conditional-request] }
      - type: run-command
        name: prompt/retry-policy
        weight: 1
        config: { command: node, args: [.vally/scenarios/storage-dotnet-error-handling/tools/check-storage-dotnet-error-handling.mjs, prompt/retry-policy] }
      - type: run-command
        name: language/project-manifest
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/project-manifest] }
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/current-azure-packages] }
      - type: run-command
        name: language/async-await
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/async-await] }
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config: { command: node, args: [.vally/languages/dotnet/check.mjs, language/client-lifecycle] }
    environment:
      files:
        - src: tools/check-storage-dotnet-error-handling.mjs
          dest: .vally/scenarios/storage-dotnet-error-handling/tools/check-storage-dotnet-error-handling.mjs
        - src: tools/storage-dotnet-error-handling-rules.mjs
          dest: .vally/scenarios/storage-dotnet-error-handling/tools/storage-dotnet-error-handling-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
