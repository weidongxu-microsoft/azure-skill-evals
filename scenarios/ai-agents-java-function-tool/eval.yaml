name: ai-agents-java-function-tool
description: "Can an agent implement the Azure AI Agents required-action workflow for a local function tool?"
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-agents-dp-java-function-tool
    prompt: |-
      Create a complete, runnable Java console application that uses
      `com.azure:azure-ai-agents-persistent` to answer a weather question through a local
      function tool.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `PROJECT_ENDPOINT` and `MODEL_DEPLOYMENT_NAME`.
      - Define a function tool named `get_weather` with required string parameters
        `location` and `unit`; `unit` must allow only `c` or `f`.
      - Implement the local function deterministically: for Seattle, return temperature
        `21` for `c` or `70` for `f`, including the location and unit in the JSON result.
      - Create an agent named `hyoka-weather-agent` whose instructions require using the
        function for weather questions.
      - Create a thread with the exact user message
        `What is the weather in Seattle in celsius?`, then create a run.
      - Poll the run. When it requires action, iterate its function tool calls, decode the
        JSON arguments, invoke `get_weather`, create an output correlated with each tool
        call ID, and submit all outputs through the SDK.
      - Continue polling until terminal status. After successful completion, list messages
        in chronological order and print assistant text.
      - Delete the thread and agent.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK clients throughout.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: agents
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/defines-functiondefinition-and-functiontooldefinition-fo
              description: |-
                Defines `FunctionDefinition` and `FunctionToolDefinition` for `get_weather` with
                the required JSON schema.
              weight: 1
              pass_threshold: 1
            - name: prompt/passes-the-tool-definition-in-createagentoptions
              description: |-
                Passes the tool definition in `CreateAgentOptions`.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-thread-exact-user-message-and-run-with-the-c
              description: |-
                Creates the thread, exact user message, and run with the created IDs.
              weight: 1
              pass_threshold: 1
            - name: prompt/detects-runstatus-requires-action-and-submittooloutputsa
              description: |-
                Detects `RunStatus.REQUIRES_ACTION` and `SubmitToolOutputsAction`.
              weight: 1
              pass_threshold: 1
            - name: prompt/processes-every-requiredfunctiontoolcall-checks-the-func
              description: |-
                Processes every `RequiredFunctionToolCall`, checks the function name, and parses
                `location` and `unit` from its arguments.
              weight: 1
              pass_threshold: 1
            - name: prompt/produces-deterministic-json-by-invoking-local-code-rathe
              description: |-
                Invokes local `get_weather` code only for required tool calls and returns JSON with:
                - The requested location and unit.
                - Temperature `21` for Seattle in `c`, or `70` for Seattle in `f`.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-tooloutput-values-with-each-originating-tool-cal
              description: |-
                Creates one `ToolOutput` for every required call with its originating tool-call ID
                and submits all outputs through `RunsClient.submitToolOutputsToRun`.
              weight: 1
              pass_threshold: 1
            - name: prompt/resumes-polling-after-submission-requires-completed-stat
              description: |-
                Resumes polling after submission, requires completed status, and retrieves
                ascending `MessageRole.AGENT` `MessageTextContent` to print as the final response
                rather than printing the local function result.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-created-thread-and-agent
              description: |-
                Deletes the created thread and agent.
              weight: 1
              pass_threshold: 1
            - name: language/correct-dependencies-com-azure-not-com-microsoft-azure
              description: |-
                Uses com.azure group ID for all Azure SDK packages. No com.microsoft.azure (legacy SDK) dependencies. Includes azure-identity for authentication.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-for-version-management
              description: |-
                Uses azure-sdk-bom in dependencyManagement to manage Azure SDK versions instead of hardcoding individual artifact versions. Dependencies should omit <version> tags when managed by the BOM.
              weight: 1
              pass_threshold: 1
            - name: language/correct-imports-no-legacy-no-internal-packages
              description: |-
                All imports use com.azure.* packages. No com.microsoft.azure.* (legacy) or com.azure.*.implementation.* (internal API) imports.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-authentication
              description: |-
                Uses DefaultAzureCredential or another com.azure.identity credential. No hardcoded connection strings, account keys, SAS tokens, or secrets.
              weight: 1
              pass_threshold: 1
            - name: language/client-builder-pattern
              description: |-
                SDK clients constructed using *ClientBuilder classes with .endpoint() or .vaultUrl() and .credential(). No legacy constructors (CloudStorageAccount, DocumentClient, KeyVaultClient).
              weight: 1
              pass_threshold: 1
            - name: language/no-deprecated-legacy-classes
              description: |-
                No deprecated classes from the old SDK (CloudStorageAccount, CloudBlobClient, DocumentClient, QueueClient, ApplicationTokenCredentials, MSICredentials, ConnectionStringBuilder).
              weight: 1
              pass_threshold: 1
            - name: language/pagination-pagediterable-pagedflux
              description: |-
                List/query operations return PagedIterable (sync) or PagedFlux (async). Does not flatten all pages into a raw List or Stream in memory.
              weight: 1
              pass_threshold: 1
            - name: language/lro-pattern-syncpoller-pollerflux
              description: |-
                Long-running operations use SyncPoller (sync) or PollerFlux (async) with begin* method prefix. No Thread.sleep() polling loops.
              weight: 1
              pass_threshold: 1
            - name: language/async-uses-project-reactor-mono-flux
              description: |-
                Async code uses Project Reactor types (Mono, Flux). Not CompletableFuture (wrong), not RxJava (wrong), not sync wrapped in ExecutorService. No .block() inside async service implementations.
              weight: 1
              pass_threshold: 1
            - name: language/service-specific-exception-handling
              description: |-
                Catches service-specific exceptions (BlobStorageException, CosmosException, ServiceBusException, HttpResponseException) with status code inspection. Not just generic Exception catches.
              weight: 1
              pass_threshold: 1
            - name: language/try-with-resources-for-clients
              description: |-
                All Azure SDK client instances that implement AutoCloseable are used within try-with-resources blocks or explicitly closed in a finally block.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
artifacts:
  include:
    - "**/*.java"
    - "**/pom.xml"
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/target/**"
