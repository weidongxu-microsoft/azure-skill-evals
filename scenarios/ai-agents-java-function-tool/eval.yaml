name: ai-agents-java-function-tool
description: "Can an agent implement the Azure AI Agents required-action workflow for a local function tool?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-agents-dp-java-function-tool
    prompt: |-
      Create a complete, runnable Java console application that uses
      `com.azure:azure-ai-agents-persistent` to answer a weather question through a local
      function tool.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `PROJECT_ENDPOINT` and `MODEL_DEPLOYMENT_NAME`.
      - Define a function tool named `get_weather` with required string parameters
        `location` and `unit`; `unit` must allow only `c` or `f`.
      - Implement the local function deterministically: for Seattle, return temperature
        `21` for `c` or `70` for `f`, including the location and unit in the JSON result.
      - Create an agent named `hyoka-weather-agent` whose instructions require using the
        function for weather questions.
      - Create a thread with the exact user message
        `What is the weather in Seattle in celsius?`, then create a run.
      - Poll the run. When it requires action, iterate its function tool calls, decode the
        JSON arguments, invoke `get_weather`, create an output correlated with each tool
        call ID, and submit all outputs through the SDK.
      - Continue polling until terminal status. After successful completion, list messages
        in chronological order and print assistant text.
      - Delete the thread and agent.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use the synchronous SDK clients throughout.
    tags:
      service: foundry
      plane: data-plane
      language: java
      category: agents
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/defines-the-weather-function-tool
              description: |-
                - Define a function tool named `get_weather`.
                - Require string parameters `location` and `unit`.
                - Restrict `unit` to `c` or `f`.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-named-tool-enabled-agent
              description: |-
                - Read `MODEL_DEPLOYMENT_NAME` and create `hyoka-weather-agent` with it.
                - Attach the `get_weather` tool definition.
                - Set instructions that require the tool for weather questions.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-weather-thread-and-run
              description: |-
                - Create a thread with the exact supplied Seattle question.
                - Create a run using the returned thread and agent IDs.
              weight: 1
              pass_threshold: 1
            - name: prompt/detects-runstatus-requires-action-and-submittooloutputsa
              description: |-
                - Polling recognizes the service state that requires tool output.
                - Extract the submitted-tool-output action from that state.
                - Continue normal run polling for non-tool terminal or in-progress states.
              weight: 1
              pass_threshold: 1
            - name: prompt/processes-every-requiredfunctiontoolcall-checks-the-func
              description: |-
                - Iterate every required function-tool call returned by the run.
                - Accept only the `get_weather` function for this task.
                - Decode `location` and `unit` arguments from each call.
              weight: 1
              pass_threshold: 1
            - name: prompt/produces-deterministic-json-by-invoking-local-code-rathe
              description: |-
                - Required `get_weather` call -> local deterministic weather function.
                - Seattle with unit `c` returns JSON temperature `21`.
                - Seattle with unit `f` returns JSON temperature `70`.
                - JSON includes the requested location and unit.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-tooloutput-values-with-each-originating-tool-cal
              description: |-
                - Create one tool-output payload for each required tool-call ID.
                - Preserve the call ID -> output correlation when submitting results.
                - Submit all collected outputs through the Agents run API.
              weight: 1
              pass_threshold: 1
            - name: prompt/polls-and-prints-the-assistant-response
              description: |-
                - Continue bounded run retrieval after output submission; sleeping between retrievals is valid.
                - Require successful completion and reject unsuccessful terminal states or timeout.
                - Traverse messages chronologically and print returned assistant text, not only local tool JSON.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-created-agent-resources
              description: |-
                - Delete the created thread through the Agents SDK.
                - Delete the created agent through the Agents SDK.
              weight: 1
              pass_threshold: 1
            - name: prompt/configures-the-synchronous-agents-client
              description: |-
                - Read `PROJECT_ENDPOINT` and use it to build a synchronous persistent Agents client.
                - Use current public Agents SDK operations for the complete workflow.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-dependencies
              description: |-
                - Declare Azure SDK artifacts required by the selected services and authentication flow.
                - Use current compatible coordinates under `com.azure` or `com.azure.resourcemanager`.
                - Include `azure-identity` only when the chosen authentication flow requires a `TokenCredential`.
              weight: 1
              pass_threshold: 1
            - name: language/azure-sdk-bom-first-version-management
              description: |-
                - Import `com.azure:azure-sdk-bom` through Maven dependency management or a Gradle platform.
                - Omit explicit versions for compatible BOM-covered GA Azure artifacts.
                - Use explicit versions only for preview, uncovered, incompatible, or prompt-pinned artifacts.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-imports
              description: |-
                - Azure SDK imports use current public `com.azure.*` or `com.azure.resourcemanager.*` packages.
                - Do not import legacy `com.microsoft.azure.*` packages.
                - Do not import Azure internal implementation packages.
                - Standard Java, Reactor, Jackson, OpenAI, and other required non-Azure imports are valid.
              weight: 1
              pass_threshold: 1
            - name: language/supported-runtime-authentication
              description: |-
                - Authentication values come from runtime configuration or the execution environment.
                - Use a current public authentication mode supported by the selected client or service.
                - Do not embed or log connection strings, account keys, SAS tokens, client secrets, or bearer tokens.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-client-construction
              description: |-
                - Construct Azure SDK clients or managers through current public builders, factories, or documented fluent entry points.
                - Runtime endpoint, vault URL, namespace, subscription, or profile values flow into the constructed client.
                - Do not use legacy constructors or removed client types.
              weight: 1
              pass_threshold: 1
            - name: language/current-public-azure-sdk-apis
              description: |-
                - Use current public Azure SDK clients, models, and operations.
                - Public preview SDK APIs are valid when the prompt pins or requires a preview package.
                - Do not depend on deprecated, removed, internal, or implementation-only Azure types.
                - Equivalent public APIs are valid when exact symbols are not prompt-contractual.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-traversal
              description: |-
                - For prompt-required list, query, or status collections, traverse every returned page or continuation.
                - Use `PagedIterable`, `PagedFlux`, an SDK auto-pager, or an equivalent current paging API.
                - Do not stop after the first page or flatten before required per-page behavior is observed.
              weight: 1
              pass_threshold: 1
            - name: language/supported-terminal-state-polling
              description: |-
                - Poll the run before and after tool-output submission.
                - Continue until completed, failed, canceled, or tool-output-required state.
                - Timeout or unsuccessful terminal state -> clear failure.
              weight: 1
              pass_threshold: 1
            - name: language/owned-resource-lifecycle-cleanup
              description: |-
                - Delete the service-created thread after the tool-call workflow.
                - Delete the service-created agent after thread cleanup.
                - Cleanup uses the returned thread and agent IDs.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
