name: identity-python-credential-chain
description: Compare Azure tooling for environment-specific Python credential chains
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-python-credential-chain
    prompt: |-
      Create a complete, runnable Python project that builds Azure credential chains for local development, CI, and production.

      Write the code to files. Do not reply with code blocks.

      1. Auto-detect CI from CI, TF_BUILD, BUILD_SOURCESDIRECTORY, or AZURE_PIPELINE_WORKSPACE; detect production from IDENTITY_ENDPOINT or MSI_ENDPOINT; otherwise select development.
      2. Use ChainedTokenCredential for every environment. The development chain must include AzureCliCredential. The CI chain must use EnvironmentCredential or AzurePipelinesCredential and must not use DefaultAzureCredential. The production chain must put ManagedIdentityCredential first and WorkloadIdentityCredential second, supporting both system-assigned identity and a user-assigned client ID from AZURE_CLIENT_ID.
      3. Provide equivalent synchronous and azure.identity.aio asynchronous credential factories.
      4. Test both credentials against https://management.azure.com/.default. Request CAE with enable_cae=True, print token expiry, and report ClientAuthenticationError details.
      5. A main program must print the detected environment and selected strategy, run the synchronous test, then run and await the asynchronous test.

      Include a requirements.txt with the required Azure SDK dependency. Do not hard-code credentials.
    tags:
      service: identity
      plane: data-plane
      language: python
      category: authentication
    graders:
      - type: run-command
        name: prompt/identity-package
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/identity-python-credential-chain/tools/check-credential-chain-python.mjs, prompt/identity-package]
      - type: run-command
        name: prompt/environment-detection
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/identity-python-credential-chain/tools/check-credential-chain-python.mjs, prompt/environment-detection]
      - type: run-command
        name: prompt/sync-credential-chains
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/identity-python-credential-chain/tools/check-credential-chain-python.mjs, prompt/sync-credential-chains]
      - type: run-command
        name: prompt/async-credential-chains
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/identity-python-credential-chain/tools/check-credential-chain-python.mjs, prompt/async-credential-chains]
      - type: run-command
        name: prompt/cae-token-tests
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/identity-python-credential-chain/tools/check-credential-chain-python.mjs, prompt/cae-token-tests]
      - type: run-command
        name: prompt/auth-failure-details
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/identity-python-credential-chain/tools/check-credential-chain-python.mjs, prompt/auth-failure-details]
      - type: run-command
        name: prompt/application-flow
        weight: 1
        config:
          command: node
          args: [.vally/scenarios/identity-python-credential-chain/tools/check-credential-chain-python.mjs, prompt/application-flow]
      - type: run-command
        name: language/correct-imports
        weight: 1
        config:
          command: node
          args: [.vally/languages/python/check.mjs, language/correct-imports]
      - type: run-command
        name: language/async-client
        weight: 1
        config:
          command: node
          args: [.vally/languages/python/check.mjs, language/async-client]
      - type: run-command
        name: language/exception-handling
        weight: 1
        config:
          command: node
          args: [.vally/languages/python/check.mjs, language/exception-handling]
    environment:
      files:
        - src: tools/check-credential-chain-python.mjs
          dest: .vally/scenarios/identity-python-credential-chain/tools/check-credential-chain-python.mjs
        - src: tools/credential-chain-python-rules.mjs
          dest: .vally/scenarios/identity-python-credential-chain/tools/credential-chain-python-rules.mjs
        - src: ../../languages/python/check.mjs
          dest: .vally/languages/python/check.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
