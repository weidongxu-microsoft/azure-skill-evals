name: identity-python-credential-chain
description: Compare Azure tooling for environment-specific Python credential chains
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: identity-dp-python-credential-chain
    prompt: |-
      Create a Python project that demonstrates how to correctly build Azure credential chains tailored to different deployment environments — local development, CI/CD pipelines, and production.
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      The project needs:
      
      - A **credential factory module** that builds the appropriate Azure credential for each environment. For local development, it should chain together credentials that work from developer tools (CLI, VS Code, etc.). For CI pipelines, it should support credentials sourced from pipeline environment variables or Azure Pipelines service connections. For production, it should prefer managed identity (supporting both system-assigned and user-assigned, where the user-assigned identity's client ID comes from an environment variable), with workload identity as a fallback for Kubernetes scenarios. The factory should also support enabling Continuous Access Evaluation (CAE) on token requests, which lets Azure revoke tokens mid-session for security events.
      
      - An **environment detector module** that auto-detects which environment the app is running in by probing for well-known environment variables (e.g., CI pipeline workspace variables, managed identity endpoint availability). It should classify the environment as dev, CI, or production.
      
      - A **connectivity tester module** (both sync and async versions) that verifies a credential works by requesting a token for a given Azure scope. It should print success/failure, the token's expiry time, and whether CAE was requested. It should handle and report the specific failure reason if authentication fails (expired cert, wrong tenant, no identity available, etc.) rather than just printing a generic error.
      
      - A **main script** that detects the current environment, builds the right credential, and runs the connectivity test against Azure Resource Manager using the sync tester first, then repeats with the async tester. Print the detected environment, the selected credential strategy, and the test results from both.
      
      Include a `requirements.txt` with the necessary Azure SDK dependencies.
    tags:
      service: identity
      plane: data-plane
      language: python
      category: authentication
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/uses-chainedtokencredential-to-compose-multiple-credenti
              description: |-
                Uses `ChainedTokenCredential` to compose multiple credentials
              weight: 1
              pass_threshold: 1
            - name: prompt/credentials-passed-in-order-to-the-constructor-order-mat
              description: |-
                Credentials passed in order to the constructor — order matters ### Environment-Specific Chains
              weight: 1
              pass_threshold: 1
            - name: prompt/dev-chain-includes-azureclicredential-may-include-visual
              description: |-
                **Dev chain**: includes `AzureCliCredential`; may include `VisualStudioCodeCredential`, `AzurePowerShellCredential`
              weight: 1
              pass_threshold: 1
            - name: prompt/ci-chain-uses-environmentcredential-or-azurepipelinescre
              description: |-
                **CI chain**: uses `EnvironmentCredential` or `AzurePipelinesCredential` (not just `DefaultAzureCredential`)
              weight: 1
              pass_threshold: 1
            - name: prompt/production-chain-managedidentitycredential-first-support
              description: |-
                **Production chain**: `ManagedIdentityCredential` first (supports user-assigned via `client_id` kwarg), `WorkloadIdentityCredential` as fallback ### CAE Support
              weight: 1
              pass_threshold: 1
            - name: prompt/enables-cae-via-enable-cae-true-in-get-token-call-or-tok
              description: |-
                Enables CAE via `enable_cae=True` in `get_token()` call or token request context ### Environment Detection
              weight: 1
              pass_threshold: 1
            - name: prompt/detects-ci-checks-ci-tf-build-build-sourcesdirectory-or
              description: |-
                Detects CI (checks `CI`, `TF_BUILD`, `BUILD_SOURCESDIRECTORY`, or similar env vars)
              weight: 1
              pass_threshold: 1
            - name: prompt/detects-production-managed-identity-checks-identity-endp
              description: |-
                Detects production/managed identity (checks `IDENTITY_ENDPOINT`, `MSI_ENDPOINT`, or similar)
              weight: 1
              pass_threshold: 1
            - name: prompt/falls-back-to-dev-if-neither-detected-token-request-test
              description: |-
                Falls back to dev if neither detected ### Token Request & Testing
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-get-token-with-correct-scope-https-management-azur
              description: |-
                Calls `get_token()` with correct scope (`https://management.azure.com/.default`)
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-token-expiry-from-accesstoken-expires-on
              description: |-
                Prints token expiry from `AccessToken.expires_on`
              weight: 1
              pass_threshold: 1
            - name: prompt/handles-failure-with-specific-exception-info-from-client
              description: |-
                Handles failure with specific exception info from `ClientAuthenticationError` ### Async Support
              weight: 1
              pass_threshold: 1
            - name: prompt/async-tester-uses-azure-identity-aio-async-credentials-a
              description: |-
                Async tester uses `azure.identity.aio` async credentials and `await get_token()` ### Anti-Patterns (scenario-specific)
              weight: 1
              pass_threshold: 1
            - name: prompt/not-using-defaultazurecredential-as-the-ci-credential-to
              description: |-
                NOT using `DefaultAzureCredential` as the CI credential (too broad)
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
