name: ai-projects-typescript-evaluation-run
description: "Can an application use the project OpenAI Evals client to run a built-in evaluator and traverse metric results?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-typescript-evaluation-run
    prompt: |-
      Create a complete, runnable TypeScript console application using
      `@azure/ai-projects` 2.5.0 to run an OpenAI-compatible evaluation in a Microsoft
      Foundry project. Target Node.js 22.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`.
      - Obtain the project OpenAI client from `AIProjectClient`.
      - Create an evaluation named `hyoka-f1-evaluation` with a custom item schema for
        string fields `query`, `response`, and `ground_truth`.
      - Configure the Azure built-in evaluator `builtin.f1_score`, mapping `response` and
        `ground_truth` to the corresponding item fields.
      - Create a run named `hyoka-f1-run` against an inline JSONL data source containing
        this exact item: query `What is the capital of France?`, response `Paris`, and
        ground truth `Paris`.
      - Retrieve the run repeatedly until it reaches `completed` or `failed`, and fail the
        application unless it completes successfully.
      - Traverse every page of output items. Print each output item ID and status, then
        print every returned metric's name, score, and passed value.
      - Delete the created evaluation after the run.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: projects
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/calls-project-getopenaiclient-rather-than-inventing-proj
              description: |-
                Calls `project.getOpenAIClient()` and uses its service Evals APIs rather than
                inventing `project.evaluations`, calling chat completions, or calculating F1
                locally.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-openaiclient-evals-create-with-a-custom-schema-and
              description: |-
                Calls `openAIClient.evals.create` for `hyoka-f1-evaluation` with:
                - A custom schema with string fields `query`, `response`, and `ground_truth`.
                - An `azure_ai_evaluator` for `builtin.f1_score`, mapped to the required item
                  fields. Any compatibility cast is limited to `testing_criteria`.
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-the-run-through-openaiclient-evals-runs-create-w
              description: |-
                Creates `hyoka-f1-run` through `openAIClient.evals.runs.create` with the created
                evaluation ID and an inline `jsonl`/`file_content` source containing the exact
                required item.
              weight: 1
              pass_threshold: 1
            - name: prompt/polls-through-openaiclient-evals-runs-retrieve-until-an
              description: |-
                Polls through `openAIClient.evals.runs.retrieve` until an explicit terminal
                status and rejects a failed run.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-openaiclient-evals-runs-outputitems-list-with-for-a
              description: |-
                Uses `openAIClient.evals.runs.outputItems.list` with `for await...of` and, for each
                output item:
                - Prints its returned ID and status.
                - Prints the name, score, and passed state read from every returned result object.
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-evaluation-with-its-exact-id
              description: |-
                Deletes the evaluation with its exact ID.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
            - name: language/long-running-operation-completion
              description: |-
                - Use the selected SDK's poller, wait helper, or status-retrieval mechanism.
                - Continue until a successful or unsuccessful terminal state.
                - Distinguish successful completion from unsuccessful terminal states.
                - Bound explicit polling and avoid tight polling loops.
                - Do not replace an available SDK polling abstraction with ad hoc delays.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
