name: resource-manager-java-resource-group-crud
description: Compare Azure tooling for an Azure Resource Manager Java resource group CRUD task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/java.mjs
      dest: .vally/program-checks/java.mjs
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: resource-manager-mp-java-resource-group-crud
    prompt: |-
      Write a Java application that manages
      Azure Resource Groups using the management plane SDK:
      1. Authenticate using DefaultAzureCredential
      2. Create a new resource group in "eastus" region
      3. List all resource groups in the subscription
      4. Get details of the created resource group
      5. Add a tag to the resource group
      6. Delete the resource group
      
      Show required Maven dependencies and include proper exception handling.
      Use the modern azure-resourcemanager SDK.
    tags:
      service: resource-manager
      plane: management-plane
      language: java
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/resource-manager-project
              description: |-
                - Declare compatible modern `azure-resourcemanager` and `azure-identity` dependencies.
                - Use public `com.azure.resourcemanager` APIs.
              weight: 1
              pass_threshold: 1
            - name: prompt/resource-manager-authentication
              description: |-
                - Create a `DefaultAzureCredential`.
                - Authenticate `AzureResourceManager` with that credential and an Azure profile.
                - Select the configured subscription.
              weight: 1
              pass_threshold: 1
            - name: prompt/create-resource-group
              description: |-
                - Define and create a new resource group.
                - Use exactly the `eastus` region.
                - Retain its name for later operations.
              weight: 1
              pass_threshold: 1
            - name: prompt/list-resource-groups
              description: |-
                - List resource groups in the selected subscription.
                - Iterate the returned management collection and expose each group.
              weight: 1
              pass_threshold: 1
            - name: prompt/get-resource-group
              description: |-
                - Retrieve the created resource group by name.
                - Read and expose its management details.
              weight: 1
              pass_threshold: 1
            - name: prompt/tag-resource-group
              description: |-
                - Add a tag to the created resource group.
                - Apply the update so the tag is persisted in Azure.
              weight: 1
              pass_threshold: 1
            - name: prompt/delete-resource-group
              description: |-
                - Delete the created resource group by name.
                - Accept the SDK's synchronous `void` result or asynchronous `Mono<Void>` result.
                - Do not require an Azure poller for this operation.
              weight: 1
              pass_threshold: 1
            - name: prompt/resource-manager-failures
              description: |-
                - Handle Azure management or HTTP failures around resource-group operations.
                - Report actionable status or service error details when available.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/java-project-compiles
        config:
          command: node
          args:
            - .vally/program-checks/java.mjs
          timeout: 3m
    artifacts:
      include:
        - "**/*.java"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
      exclude:
        - "**/.vally/**"
        - "**/target/**"
