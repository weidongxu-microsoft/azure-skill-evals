name: text-translation-python-multilingual-translation
description: "Can an application translate one supplied text into French and Japanese in one request and report the detected source language?"
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: text-translation-dp-python-multilingual-translation
    prompt: |-
      Create a complete, runnable Python console application using
      `azure-ai-translation-text` 2.0.0. Accept one command-line argument containing
      the text to translate and read `AZURE_TEXT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Send the supplied text in one SDK translation request whose targets are French
        (`fr`) and Japanese (`ja`).
      - Omit the source language so the service detects it.
      - Print the detected source language returned by the service.
      - Traverse the returned translations and print each returned target-language code
        and translated text.
      - Include the dependency manifest and concise install and run commands.
      
      Use the synchronous SDK client.
    tags:
      service: foundry
      plane: data-plane
      language: python
      category: translation
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/calls-texttranslationclient-translate-exactly-once-with
              description: |-
                Uses `TextTranslationClient` from `azure-ai-translation-text` 2.0.0 and calls
                `translate` exactly once with `body=[text]` and `to_language=["fr", "ja"]`,
                without passing `from_language`.
              weight: 1
              pass_threshold: 1
            - name: prompt/reads-the-first-returned-item-s-detected-language-langua
              description: |-
                Prints the first returned item's `detected_language.language`.
              weight: 1
              pass_threshold: 1
            - name: prompt/traverses-every-item-in-the-returned-translations-collec
              description: |-
                Traverses every item in the returned `translations` collection.
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-each-translation-s-returned-language-and-text-val
              description: |-
                Prints each translation's returned `language` and `text` values.
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
