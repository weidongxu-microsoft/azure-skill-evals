name: text-translation-dotnet-multilingual-translation
description: "Can an application translate one supplied text into French and Japanese in one request and report the detected source language?"
version: "1.0"
type: capability
environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: text-translation-dp-dotnet-multilingual-translation
    prompt: |-
      Create a complete, runnable .NET console application using
      `Azure.AI.Translation.Text` 2.0.0. Accept one command-line argument containing
      the text to translate and read `AZURE_TEXT_TRANSLATION_ENDPOINT`.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Send the supplied text in one SDK translation request whose targets are French
        (`fr`) and Japanese (`ja`).
      - Omit the source language so the service detects it.
      - Print the detected source language returned by the service.
      - Traverse the returned translations and print each returned target-language code
        and translated text.
      - Include the project manifest and concise restore, build, and run commands.
      
      Use asynchronous SDK operations.
    tags:
      service: foundry
      plane: data-plane
      language: dotnet
      category: translation
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/creates-one-translateinputitem-containing-the-supplied-t
              description: |-
                Creates one `TranslateInputItem` containing the supplied text and two
                `TranslationTarget` values for `fr` and `ja`, without setting its source
                language.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-texttranslationclient-translateasync-exactly-once
              description: |-
                Uses `TextTranslationClient` from `Azure.AI.Translation.Text` 2.0.0 and calls
                `TranslateAsync` exactly once for the input item through the current client API.
              weight: 1
              pass_threshold: 1
            - name: prompt/reads-translatedtextitem-detectedlanguage-language-and-t
              description: |-
                Prints `TranslatedTextItem.DetectedLanguage.Language` and traverses every
                `TranslationText` in `Translations`.
              weight: 1
              pass_threshold: 1
            - name: prompt/prints-each-translation-s-returned-language-and-text-val
              description: |-
                Prints each translation's returned `Language` and `Text` values.
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
