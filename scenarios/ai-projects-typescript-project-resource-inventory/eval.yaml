name: ai-projects-typescript-project-resource-inventory
description: "Can an application enumerate and retrieve typed Azure AI project connections and deployments?"
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: ai-projects-dp-typescript-project-resource-inventory
    prompt: |-
      Create a complete, runnable TypeScript console application that uses
      `@azure/ai-projects` to inspect connections and model deployments in a Microsoft
      Foundry project.
      
      **Write the application to files in the workspace. Do not reply with code blocks.**
      
      The application must:
      
      - Read `FOUNDRY_PROJECT_ENDPOINT`, `CONNECTION_NAME`, and `DEPLOYMENT_NAME`.
      - Enumerate every project connection through the SDK's pageable API and print each
        connection's name, type, target, and default status.
      - Retrieve `CONNECTION_NAME` without requesting credentials and print the same typed
        metadata.
      - Enumerate every project deployment through the SDK's pageable API. For each model
        deployment, print its name, model publisher, model name, and model version.
      - Retrieve `DEPLOYMENT_NAME`, require it to be a model deployment, and print the same
        typed model metadata.
      - Include the project manifest and concise install, build, and run commands.
      
      Use async/await throughout.
    tags:
      service: foundry
      plane: data-plane
      language: typescript
      category: projects
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/creates-aiprojectclient-for-foundry-project-endpoint
              description: |-
                Creates `AIProjectClient` for `FOUNDRY_PROJECT_ENDPOINT`.
              weight: 1
              pass_threshold: 1
            - name: prompt/iterates-client-connections-list-with-for-await-of-and-r
              description: |-
                Iterates every page and result from `client.connections.list()` with
                `for await...of` and prints each connection's typed name, type, target, and default
                status.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-client-connections-get-for-connection-name-not-get
              description: |-
                Calls `client.connections.get` for `CONNECTION_NAME`, not `getWithCredentials`,
                and prints the same typed metadata without credentials.
              weight: 1
              pass_threshold: 1
            - name: prompt/iterates-client-deployments-list-with-for-await-of
              description: |-
                Iterates every page and result from `client.deployments.list()` with
                `for await...of`.
              weight: 1
              pass_threshold: 1
            - name: prompt/uses-the-modeldeployment-discriminator-and-properties-be
              description: |-
                Uses the `ModelDeployment` discriminator and prints each model deployment's name,
                publisher, model name, and model version.
              weight: 1
              pass_threshold: 1
            - name: prompt/calls-client-deployments-get-for-deployment-name-and-rej
              description: |-
                Calls `client.deployments.get` for `DEPLOYMENT_NAME` and rejects a result whose
                type isn't `ModelDeployment`, then prints the same typed model metadata.
              weight: 1
              pass_threshold: 1
            - name: language/current-sdk-packages-and-public-apis
              description: |-
                - Use supported Azure SDK packages such as `@azure/*` or `@azure-rest/*`.
                - Declare every directly imported runtime package in `package.json`.
                - Use public package exports, not internal or implementation paths.
                - Do not use legacy Azure packages.
              weight: 1
              pass_threshold: 1
            - name: language/externalized-runtime-configuration
              description: |-
                - Read endpoints, identifiers, credentials, keys, and connection strings from runtime inputs or environment configuration.
                - Do not embed usable credentials, account keys, connection strings, SAS tokens, or client secrets in source.
                - Pass configuration values to the selected SDK without logging secret-bearing values.
              weight: 1
              pass_threshold: 1
            - name: language/typescript-asynchronous-control-flow
              description: |-
                - Await or return every asynchronous SDK operation required by the workflow.
                - Preserve required sequencing between dependent operations.
                - Propagate or handle rejected operations without leaving floating promises.
              weight: 1
              pass_threshold: 1
            - name: language/complete-pageable-iteration
              description: |-
                - Traverse all required results using the selected SDK's native pageable, iterator, or continuation mechanism.
                - Continue beyond the first page when additional results are available.
                - Process results incrementally when the result set may be large.
                - Accept equivalent SDK-supported patterns, including async iteration, page iteration, continuation tokens, and service-specific feed iterators.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/typescript-dependencies-install
        config:
          command: npm
          args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
          timeout: 3m
      - type: run-command
        name: program/typescript-type-checks
        config:
          command: npx
          args:
            - --no-install
            - tsc
            - --noEmit
          timeout: 2m
    artifacts:
      include:
        - "**/*.ts"
        - "**/*.js"
        - "**/package.json"
        - "**/tsconfig.json"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/node_modules/**"
        - "**/dist/**"
