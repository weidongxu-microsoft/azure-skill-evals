name: event-hubs-dotnet-send-receive-events
description: Compare Azure tooling for a .NET Event Hubs send and receive task
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: event-hubs-dp-dotnet-send-receive
    prompt: |-
      Write a C# program that demonstrates
      sending and receiving events with Azure Event Hubs:
      1. Create an EventHubProducerClient using a connection string
      2. Create a batch of events using CreateBatchAsync()
      3. Add 10 events with custom properties to the batch
      4. Send the batch to the event hub
      5. Create an EventProcessorClient with a BlobContainerClient for checkpointing
      6. Register ProcessEventAsync and ProcessErrorAsync handlers
      7. Start processing events and print received event bodies
      8. Implement proper checkpointing with ProcessEventArgs.UpdateCheckpointAsync()
      
      Show required NuGet packages (Azure.Messaging.EventHubs and
      Azure.Messaging.EventHubs.Processor) and proper disposal patterns.
    tags:
      service: event-hubs
      plane: data-plane
      language: dotnet
      category: send-receive
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - trajectory
            - repo
          criteria:
            - name: prompt/azure-messaging-eventhubs-and-azure-messaging-eventhubs
              description: |-
                `Azure.Messaging.EventHubs` and `Azure.Messaging.EventHubs.Processor` NuGet packages
              weight: 1
              pass_threshold: 1
            - name: prompt/eventhubproducerclient-and-eventhubconsumerclient
              description: |-
                `EventHubProducerClient` and `EventHubConsumerClient`
              weight: 1
              pass_threshold: 1
            - name: prompt/createbatchasync-and-eventdatabatch-tryadd
              description: |-
                `CreateBatchAsync()` and `EventDataBatch.TryAdd()`
              weight: 1
              pass_threshold: 1
            - name: prompt/sendasync-for-publishing-events
              description: |-
                `SendAsync()` for publishing events
              weight: 1
              pass_threshold: 1
            - name: prompt/eventprocessorclient-with-blobcontainerclient-for-checkp
              description: |-
                `EventProcessorClient` with `BlobContainerClient` for checkpointing
              weight: 1
              pass_threshold: 1
            - name: prompt/event-handler-delegates-and-processeventargs
              description: |-
                Event handler delegates and `ProcessEventArgs`
              weight: 1
              pass_threshold: 1
            - name: prompt/updatecheckpointasync-for-reliable-processing
              description: |-
                `UpdateCheckpointAsync()` for reliable processing
              weight: 1
              pass_threshold: 1
            - name: language/azure-identity-authentication
              description: |-
                Check that authentication follows the prompt and uses the appropriate modern .NET Azure SDK mechanism.
                When token-based authentication is requested, uses an appropriate credential from Azure.Identity and passes it to the SDK client. When the prompt explicitly requests a connection string, connection-string construction is valid. Credentials, connection strings, and secrets are not hardcoded.
              weight: 1
              pass_threshold: 1
            - name: language/sdk-specific-exception-handling
              description: |-
                Check that requested error handling uses the exception model of the selected .NET Azure SDK package.
                When error handling is requested, catches the appropriate SDK exception, such as RequestFailedException for many Azure.* and ARM clients, CosmosException for Microsoft.Azure.Cosmos, ServiceBusException for Service Bus, EventHubsException for Event Hubs, or AuthenticationFailedException and CredentialUnavailableException for Azure Identity. Inspects status codes, error codes, or retry details when relevant instead of relying only on a generic Exception catch.
              weight: 1
              pass_threshold: 1
            - name: language/asynchronous-sdk-usage
              description: |-
                Check that asynchronous .NET Azure SDK calls use normal asynchronous control flow.
                When asynchronous SDK APIs are used, awaits them with async and await rather than blocking through .Result, .Wait(), or GetAwaiter().GetResult().
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/dotnet-project-builds
        config:
          command: dotnet
          args:
            - build
            - --nologo
          timeout: 3m
    artifacts:
      include:
        - "**/*.cs"
        - "**/*.csproj"
        - "**/README.md"
      exclude:
        - "**/.vally/**"
        - "**/bin/**"
        - "**/obj/**"
