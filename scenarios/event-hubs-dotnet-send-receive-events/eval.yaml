name: event-hubs-dotnet-send-receive-events
description: Compare Azure tooling for a .NET Event Hubs send and receive task
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: event-hubs-dp-dotnet-send-receive
    prompt: |-
      Write a C# program that sends and receives events with Azure Event Hubs.

      Write the code to files. Do not reply with code blocks.

      1. Add the current Azure Event Hubs, Event Hubs processor, and Blob Storage NuGet packages.
      2. Create an EventHubProducerClient from a connection string and event hub name.
      3. Create an EventDataBatch and add exactly 10 events. Give each event a body and a custom application property, and handle TryAdd returning false.
      4. Send the batch.
      5. Create a BlobContainerClient checkpoint store and an EventProcessorClient for the default consumer group.
      6. Register event and error handlers. Print each received event body and processing errors.
      7. Update the checkpoint after processing each event.
      8. Start the processor, wait long enough to receive events, and always stop it. Remove named handlers and dispose the producer and batch.

      Read connection details from environment variables and explain how to run the application.
    tags:
      service: event-hubs
      plane: data-plane
      language: dotnet
      category: send-receive
    graders:
      - type: run-command
        name: prompt/event-hubs-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
            - prompt/event-hubs-packages
      - type: run-command
        name: prompt/producer-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
            - prompt/producer-client
      - type: run-command
        name: prompt/event-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
            - prompt/event-batch
      - type: run-command
        name: prompt/send-batch
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
            - prompt/send-batch
      - type: run-command
        name: prompt/checkpointed-consumer
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
            - prompt/checkpointed-consumer
      - type: run-command
        name: prompt/receive-handlers
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
            - prompt/receive-handlers
      - type: run-command
        name: prompt/update-checkpoint
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
            - prompt/update-checkpoint
      - type: run-command
        name: prompt/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
            - prompt/client-lifecycle
      - type: run-command
        name: language/project-manifest
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/project-manifest
      - type: run-command
        name: language/current-azure-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/current-azure-packages
      - type: run-command
        name: language/async-await
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/async-await
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/dotnet/check.mjs
            - language/client-lifecycle
    environment:
      files:
        - src: tools/check-event-hubs-dotnet.mjs
          dest: .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/check-event-hubs-dotnet.mjs
        - src: tools/event-hubs-dotnet-rules.mjs
          dest: .vally/scenarios/event-hubs-dotnet-send-receive-events/tools/event-hubs-dotnet-rules.mjs
        - src: ../../languages/dotnet/check.mjs
          dest: .vally/languages/dotnet/check.mjs
        - src: ../../languages/dotnet/checks.mjs
          dest: .vally/languages/dotnet/checks.mjs
artifacts:
  include:
    - "**/*.cs"
    - "**/*.csproj"
    - "**/README.md"
  exclude:
    - "**/.vally/**"
    - "**/bin/**"
    - "**/obj/**"
