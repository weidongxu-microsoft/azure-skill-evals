name: storage-python-crud-blobs
description: Compare Azure tooling for an Azure Blob Storage Python CRUD lifecycle
version: "1.0"
type: capability
agent_environment:
  files:
    - src: ../../eval-workspace.gitignore
      dest: .gitignore
    - src: ../../eval-workspace-AGENTS.md
      dest: AGENTS.md
    - src: ../../scripts/program-checks/python.py
      dest: .vally/program-checks/python.py
scoring:
  weights: {}
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-python-crud
    prompt: |-
      Write a Python script that performs
      CRUD operations on Azure Blob Storage:
      
      **Write the code to files (use file-write tools, do not reply with code blocks).**
      
      1. Create a BlobServiceClient using DefaultAzureCredential
      2. Create a container named "my-container" if it doesn't exist
      3. Upload a local file "report.csv" as a blob named "reports/report.csv"
      4. List all blobs in the container and print each blob's name and content length
      5. Download the blob and save it to "report-downloaded.csv"
      6. Delete the blob and then delete the container
      
      Include a `requirements.txt` with `azure-storage-blob` and `azure-identity`, and add proper error handling with `HttpResponseError` and `ResourceExistsError`.
    tags:
      service: storage
      plane: data-plane
      language: python
      category: crud
      scope: focused-task
    graders:
      - type: panel
        name: prompt/full-case-review
        weight: 1
        config:
          prompt: |-
            Review the generated implementation against every criterion.
            Score each criterion independently. Accept equivalent valid
            implementations and judge code behavior rather than syntax.
            Return every criterion name exactly as provided. The criterion
            value must start with "prompt/" or "language/". Never copy a rubric
            list number into the criterion value. For example, return
            "prompt/foo", never "1. prompt/foo".
          models:
            - gpt-5.6-sol
          aggregation: unanimous
          scoring: binary
          threshold: 0
          overall_threshold: 0
          evidence:
            - diff
          criteria:
            - name: prompt/includes-required-azure-storage-and-identity-sdk-package
              description: |-
                Includes required Azure Storage and Identity SDK packages (via requirements.txt or install instructions)
              weight: 1
              pass_threshold: 1
            - name: prompt/authenticates-the-blob-service-client-with-defaultazurec
              description: |-
                Authenticates the blob service client with DefaultAzureCredential
              weight: 1
              pass_threshold: 1
            - name: prompt/creates-a-container-handling-the-case-where-it-already-e
              description: |-
                Creates a container (handling the case where it already exists)
              weight: 1
              pass_threshold: 1
            - name: prompt/uploads-a-file-as-a-blob-with-overwrite-support
              description: |-
                Uploads a file as a blob with overwrite support
              weight: 1
              pass_threshold: 1
            - name: prompt/lists-blobs-in-the-container-with-their-properties
              description: |-
                Lists blobs in the container with their properties
              weight: 1
              pass_threshold: 1
            - name: prompt/downloads-a-blob-to-a-local-file
              description: |-
                Downloads a blob to a local file
              weight: 1
              pass_threshold: 1
            - name: prompt/deletes-the-blob-and-the-container
              description: |-
                Deletes the blob and the container
              weight: 1
              pass_threshold: 1
            - name: prompt/catches-azure-specific-errors-both-general-http-errors-a
              description: |-
                Catches Azure-specific errors (both general HTTP errors and resource-exists errors)
              weight: 1
              pass_threshold: 1
            - name: language/correct-package-imports
              description: |-
                Imports use the latest azure-sdk-for-python package structure (azure.*), not deprecated packages.
              weight: 1
              pass_threshold: 1
            - name: language/defaultazurecredential-usage
              description: |-
                Authentication matches what the prompt asks for. If the prompt explicitly requires a connection string (or other key-based auth), using `from_connection_string()` / connection-string-based clients is correct and should pass. Otherwise, authentication must use DefaultAzureCredential from azure-identity (or another `azure.identity` credential), not connection strings or hardcoded keys. Hardcoded secrets/keys/connection strings in source code always fail — required values should come from environment variables or a secret store.
              weight: 1
              pass_threshold: 1
            - name: language/context-manager-for-clients
              description: |-
                Azure SDK clients that support context managers are used with `with` statements or explicitly closed.
              weight: 1
              pass_threshold: 1
            - name: language/async-client-usage
              description: |-
                If async operations are requested, code uses the async client variant with proper await patterns.
              weight: 1
              pass_threshold: 1
            - name: language/proper-exception-handling
              description: |-
                Azure SDK exceptions (HttpResponseError and subclasses) are caught and handled appropriately.
              weight: 1
              pass_threshold: 1
      - type: run-command
        name: program/python-source-compiles
        config:
          command: python
          args:
            - .vally/program-checks/python.py
          timeout: 30s
    artifacts:
      include:
        - "**/*.py"
        - "**/requirements*.txt"
        - "**/pyproject.toml"
        - "**/setup.py"
      exclude:
        - "**/.vally/**"
        - "**/.venv/**"
        - "**/__pycache__/**"
