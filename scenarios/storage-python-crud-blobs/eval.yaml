name: storage-python-crud-blobs
description: Compare Azure tooling for an Azure Blob Storage Python CRUD lifecycle
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 1
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
stimuli:
  - name: storage-dp-python-crud
    prompt: |-
      Write a complete, runnable Python script that performs one Azure Blob Storage lifecycle.

      Write the code to files. Do not reply with code blocks.

      1. Show the required pip packages for Azure Storage Blobs and Azure Identity.
      2. Create a BlobServiceClient using DefaultAzureCredential.
      3. Create a container named "my-container" if it does not exist.
      4. Upload the local file "report.csv" as "reports/report.csv" with overwrite enabled.
      5. List all blobs in the container and print each blob's name and content length.
      6. Download that blob and save it as "report-downloaded.csv".
      7. Delete that blob, then delete the container.
      8. Handle ResourceExistsError for container creation and HttpResponseError for Azure request failures.

      Read the storage account URL from configuration rather than hard-coding credentials.
    tags:
      service: storage
      plane: data-plane
      language: python
      category: crud
    graders:
      - type: run-command
        name: prompt/sdk-packages
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
            - prompt/sdk-packages
      - type: run-command
        name: prompt/authenticated-blob-service-client
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
            - prompt/authenticated-blob-service-client
      - type: run-command
        name: prompt/create-container
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
            - prompt/create-container
      - type: run-command
        name: prompt/upload-blob
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
            - prompt/upload-blob
      - type: run-command
        name: prompt/list-blobs
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
            - prompt/list-blobs
      - type: run-command
        name: prompt/download-blob
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
            - prompt/download-blob
      - type: run-command
        name: prompt/delete-blob-and-container
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
            - prompt/delete-blob-and-container
      - type: run-command
        name: prompt/sdk-error-handling
        weight: 1
        config:
          command: node
          args:
            - .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
            - prompt/sdk-error-handling
      - type: run-command
        name: language/correct-imports
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/correct-imports
      - type: run-command
        name: language/default-azure-credential
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/default-azure-credential
      - type: run-command
        name: language/client-lifecycle
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/client-lifecycle
      - type: run-command
        name: language/async-client
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/async-client
      - type: run-command
        name: language/exception-handling
        weight: 1
        config:
          command: node
          args:
            - .vally/languages/python/check.mjs
            - language/exception-handling
    environment:
      files:
        - src: tools/check-storage-blobs-python.mjs
          dest: .vally/scenarios/storage-python-crud-blobs/tools/check-storage-blobs-python.mjs
        - src: tools/storage-blobs-rules.mjs
          dest: .vally/scenarios/storage-python-crud-blobs/tools/storage-blobs-rules.mjs
        - src: tools/storage_blobs_analyzer.py
          dest: .vally/scenarios/storage-python-crud-blobs/tools/storage_blobs_analyzer.py
        - src: ../../languages/python/check.mjs
          dest: .vally/languages/python/check.mjs
        - src: ../../languages/python/checks.mjs
          dest: .vally/languages/python/checks.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
  exclude:
    - "**/.vally/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
